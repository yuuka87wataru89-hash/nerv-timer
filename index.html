<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NERV :: MAGI OPERATION SYSTEM</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #040404;
  --orange:      #e86400;
  --orange-dim:  rgba(232,100,0,0.13);
  --orange-faint:rgba(232,100,0,0.055);
  --green:       #00bb3a;
  --amber:       #c8a000;
  --red:         #cc1111;
  --text:        #e86400;
  --text-dim:    rgba(232,100,0,0.5);
  --text-faint:  rgba(232,100,0,0.22);
  --border:      rgba(232,100,0,0.22);
  --border2:     rgba(232,100,0,0.5);
}

@keyframes flicker {
  0%,94%,100% { opacity:1; }
  95% { opacity:.97; }
  97% { opacity:.98; }
  99% { opacity:.96; }
}
@keyframes blink {
  0%,49%{ opacity:1; } 50%,100%{ opacity:0; }
}
@keyframes scan {
  0%   { background-position: 0 0; }
  100% { background-position: 0 100%; }
}

body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--orange-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--orange-faint) 1px, transparent 1px);
  background-size: 44px 44px;
  color: var(--text);
  font-family: 'Courier New', Consolas, 'Lucida Console', monospace;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: flicker 10s infinite;
  position: relative;
}

/* Scanlines */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 4px
  );
  pointer-events: none;
  z-index: 1000;
}

/* Moving scan beam */
body::after {
  content: '';
  position: fixed; left:0; right:0;
  height: 120px;
  background: linear-gradient(transparent, rgba(232,100,0,0.018), transparent);
  animation: scan 6s linear infinite;
  pointer-events: none;
  z-index: 999;
}

#app {
  width: 100%;
  max-width: 500px;
  padding: 1.5rem 1.75rem;
}

/* ── HEADER ── */
#header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border2);
  margin-bottom: 1.5rem;
  position: relative;
}
#header::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 0; right: 0;
  height: 1px;
  background: var(--border);
}

.nerv-cross {
  position: relative;
  width: 30px; height: 30px;
  flex-shrink: 0;
}
.nerv-cross::before {
  content: '';
  position: absolute;
  left: 50%; top: 0; transform: translateX(-50%);
  width: 9px; height: 100%;
  background: var(--orange);
}
.nerv-cross::after {
  content: '';
  position: absolute;
  top: 50%; left: 0; transform: translateY(-50%);
  height: 9px; width: 100%;
  background: var(--orange);
}

.header-title {
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 0.35em;
  line-height: 1;
  text-shadow: 0 0 12px rgba(232,100,0,0.6);
}
.header-sub {
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  margin-top: 5px;
}

.header-right {
  margin-left: auto;
  text-align: right;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  line-height: 1.7;
}
#sys-clock { color: var(--green); }

/* ── RING ── */
#ring-section {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#ring-wrap {
  position: relative;
  width: 270px; height: 270px;
}

#ring-svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
  overflow: visible;
}

#ring-track {
  fill: none;
  stroke: rgba(232,100,0,0.1);
  stroke-width: 2.5;
  stroke-dasharray: 5 5;
}

#ring-fill {
  fill: none;
  stroke: var(--orange);
  stroke-width: 3;
  stroke-linecap: butt;
  transition: stroke-dashoffset 0.9s linear, stroke 0.5s;
  filter: drop-shadow(0 0 5px var(--orange));
}

#ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px;
}

.ring-label {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text-faint);
  text-transform: uppercase;
}

#time-display {
  font-size: 62px;
  font-weight: bold;
  letter-spacing: 5px;
  color: var(--orange);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: color 0.4s;
  text-shadow: 0 0 24px rgba(232,100,0,0.45);
}

#status-label {
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--green);
  margin-top: 8px;
  text-align: center;
  min-height: 13px;
  transition: color 0.4s;
}

/* ── ALERT BAND ── */
#alert-band {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 14px 0 0;
  padding: 5px 12px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.5);
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--text-faint);
}
#alert-level { font-weight: bold; }

/* Warning stripe */
.hazard-stripe {
  height: 7px;
  background: repeating-linear-gradient(
    -45deg,
    var(--orange), var(--orange) 6px,
    #000 6px, #000 12px
  );
  opacity: 0;
  transition: opacity 0.3s;
  margin: 4px 0;
}
.hazard-stripe.show { opacity: 1; }

/* ── PRESETS ── */
.preset-row {
  display: flex; gap: 5px;
  justify-content: center;
  margin-top: 14px;
}

.preset-btn {
  font-size: 11px;
  padding: 5px 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.1em;
  transition: all 0.12s;
}
.preset-btn:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }
.preset-btn.active { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); font-weight: bold; }

.custom-row {
  display: flex; align-items: center; gap: 6px;
  justify-content: center;
  margin-top: 8px;
}

.time-input-wrap {
  display: flex; align-items: center; gap: 3px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.6);
  padding: 5px 12px;
}
.time-input-wrap input {
  width: 42px; text-align: center; font-size: 13px;
  border: none; background: transparent;
  color: var(--orange); outline: none;
  font-family: inherit; font-variant-numeric: tabular-nums;
}
.time-input-wrap span { font-size: 10px; color: var(--text-dim); }

.step-btn {
  width: 30px; height: 30px;
  border: 1px solid var(--border);
  background: transparent; color: var(--text-dim);
  cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit; transition: all 0.12s;
}
.step-btn:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }

/* ── CONTROLS ── */
.ctrl-row {
  display: flex; gap: 8px;
  margin-top: 16px;
  align-items: center; justify-content: center;
}

#main-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 42px;
  font-size: 12px;
  border: 1px solid var(--orange);
  background: var(--orange-dim);
  color: var(--orange);
  cursor: pointer; font-weight: bold;
  font-family: inherit; letter-spacing: 0.25em;
  text-transform: uppercase; transition: all 0.12s;
}
#main-btn:hover { background: rgba(232,100,0,0.25); }
#main-btn.running { border-color: var(--border); background: transparent; color: var(--text-dim); }

#reset-btn {
  width: 42px; height: 42px;
  border: 1px solid var(--border);
  background: transparent; color: var(--text-dim);
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.12s;
}
#reset-btn:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }

/* ── LOG ── */
#log-section {
  margin-top: 16px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}
.log-header {
  font-size: 9px; letter-spacing: 0.18em;
  color: var(--text-faint); margin-bottom: 7px;
}
.log-entry {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 10px; color: var(--text-dim);
  padding: 4px 0;
  border-bottom: 1px solid rgba(232,100,0,0.06);
  letter-spacing: 0.04em;
}
.log-pre { color: var(--green); flex-shrink: 0; }

/* ── OVERLAYS ── */
#flash-overlay {
  position: fixed; inset: 0;
  pointer-events: none; opacity: 0;
  z-index: 996;
}

#at-field {
  position: fixed; inset: 0;
  pointer-events: none; opacity: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 995;
  transition: opacity 0.08s;
}
#at-field svg { width: min(92vw,92vh); height: min(92vw,92vh); }

/* ── ALERT CONFIG ── */
#alert-config {
  margin-top: 10px;
}
.alert-config-label {
  font-size: 9px; letter-spacing: 0.18em;
  color: var(--text-faint); margin-bottom: 7px;
}
.alert-toggle-row {
  display: flex; gap: 5px;
}
.alert-toggle {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 7px 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-faint);
  cursor: pointer; font-family: inherit;
  letter-spacing: 0.06em;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
}
.alert-toggle::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--orange-dim);
  opacity: 0;
  transition: opacity 0.15s;
}
.alert-toggle.active { border-color: var(--border2); color: var(--text-dim); }
.alert-toggle.active::before { opacity: 1; }
.atg-indicator {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-faint);
  transition: background 0.15s, box-shadow 0.15s;
}
.alert-toggle.active .atg-indicator {
  background: var(--orange);
  box-shadow: 0 0 6px var(--orange);
}
.atg-time { font-size: 13px; font-weight: bold; font-variant-numeric: tabular-nums; }
.atg-level { font-size: 8px; letter-spacing: 0.1em; }
.alert-toggle[data-idx="0"] .atg-level { color: #c8a000; }
.alert-toggle[data-idx="1"] .atg-level { color: #e86400; }
.alert-toggle[data-idx="2"] .atg-level { color: #cc4400; }
.alert-toggle[data-idx="3"] .atg-level { color: #cc1111; }
.alert-toggle:not(.active) .atg-level { color: var(--text-faint) !important; }

svg.icon {
  width: 15px; height: 15px; stroke: currentColor;
  fill: none; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
}
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="nerv-cross"></div>
    <div>
      <div class="header-title">N E R V</div>
      <div class="header-sub">作戦行動時間管理システム&nbsp;&nbsp;//&nbsp;&nbsp;MAGI OPERATION CONTROL</div>
    </div>
    <div class="header-right">
      <div id="sys-clock">--:--:--</div>
      <div>CASPER-3 ACTIVE</div>
    </div>
  </div>

  <div id="ring-section">
    <div id="ring-wrap">
      <svg id="ring-svg" viewBox="0 0 270 270">
        <circle id="ring-track" cx="135" cy="135" r="118"/>
        <g id="ticks"></g>
        <circle id="ring-fill"  cx="135" cy="135" r="118"/>
        <g id="m-dots"></g>
      </svg>
      <div id="ring-center">
        <div class="ring-label">REMAINING TIME // 残り時間</div>
        <div id="time-display">20:00</div>
        <div class="ring-label" id="elapsed-label">ELAPSED — 00:00</div>
      </div>
    </div>
    <div id="status-label">[ STANDBY — 待機中 ]</div>
  </div>

  <div id="alert-band">
    <span>//</span>
    <span id="alert-level" style="color:var(--green)">ALERT LEVEL : GREEN</span>
    <span>//</span>
  </div>
  <div class="hazard-stripe" id="hazard"></div>

  <div id="alert-config">
    <div class="alert-config-label">// ALERT TRIGGER CONFIG ——————————————</div>
    <div class="alert-toggle-row">
      <button class="alert-toggle active" data-idx="0">
        <span class="atg-indicator"></span>
        <span class="atg-time">10:00</span>
        <span class="atg-level">CAUTION</span>
      </button>
      <button class="alert-toggle active" data-idx="1">
        <span class="atg-indicator"></span>
        <span class="atg-time">05:00</span>
        <span class="atg-level">WARNING</span>
      </button>
      <button class="alert-toggle active" data-idx="2">
        <span class="atg-indicator"></span>
        <span class="atg-time">03:00</span>
        <span class="atg-level">DANGER</span>
      </button>
      <button class="alert-toggle active" data-idx="3">
        <span class="atg-indicator"></span>
        <span class="atg-time">01:00</span>
        <span class="atg-level">CRITICAL</span>
      </button>
    </div>
  </div>

  <div class="preset-row">
    <button class="preset-btn" data-sec="300">05:00</button>
    <button class="preset-btn active" data-sec="1200">20:00</button>
    <button class="preset-btn" data-sec="1800">30:00</button>
    <button class="preset-btn" data-sec="3600">60:00</button>
  </div>

  <div class="custom-row">
    <button class="step-btn" id="dec-10s">−</button>
    <div class="time-input-wrap">
      <input type="number" id="min-input" min="0" max="179" value="20"/>
      <span>分</span>
      <input type="number" id="sec-input" min="0" max="50" step="10" value="0"/>
      <span>秒</span>
    </div>
    <button class="step-btn" id="inc-10s">＋</button>
    <button class="preset-btn" id="apply-btn">SET</button>
  </div>

  <div class="ctrl-row">
    <button id="reset-btn" title="RESET">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button id="main-btn">
      <svg class="icon" id="btn-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span id="btn-label">START</span>
    </button>
  </div>

  <div id="log-section">
    <div class="log-header">// MAGI EVENT LOG ————————————————————————————</div>
    <div id="milestone-log"></div>
  </div>

</div>

<!-- AT Field -->
<div id="at-field">
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <polygon id="hex1" points="200,18 362,109 362,291 200,382 38,291 38,109"
      fill="none" stroke="#e86400" stroke-width="2.5"/>
    <polygon points="200,50 338,125 338,275 200,350 62,275 62,125"
      fill="none" stroke="#e86400" stroke-width="1.2" opacity="0.5"/>
    <polygon points="200,82 314,141 314,259 200,318 86,259 86,141"
      fill="none" stroke="#e86400" stroke-width="0.6" opacity="0.3"/>
    <line x1="200" y1="18" x2="200" y2="382" stroke="#e86400" stroke-width="0.6" opacity="0.25"/>
    <line x1="38"  y1="109" x2="362" y2="291" stroke="#e86400" stroke-width="0.6" opacity="0.25"/>
    <line x1="362" y1="109" x2="38"  y2="291" stroke="#e86400" stroke-width="0.6" opacity="0.25"/>
    <circle cx="200" cy="200" r="20" fill="none" stroke="#e86400" stroke-width="1" opacity="0.4"/>
    <circle cx="200" cy="200" r="6"  fill="#e86400" opacity="0.6"/>
  </svg>
</div>

<div id="flash-overlay"></div>

<script>
(function () {
  const R = 118;
  const CX = 135, CY = 135;
  const CIRC = 2 * Math.PI * R;

  const ICON_PLAY  = '<polygon points="5 3 19 12 5 21 5 3"/>';
  const ICON_PAUSE = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

  const MILESTONES = [
    { sec:600, label:'10:00', jp:'残り10分', alertLabel:'CAUTION',  alertColor:'#c8a000', ringColor:'#c8a000', atColor:'#c8a000' },
    { sec:300, label:'05:00', jp:'残り5分',  alertLabel:'WARNING',  alertColor:'#e86400', ringColor:'#e86400', atColor:'#e86400' },
    { sec:180, label:'03:00', jp:'残り3分',  alertLabel:'DANGER',   alertColor:'#cc4400', ringColor:'#cc4400', atColor:'#cc4400' },
    { sec:60,  label:'01:00', jp:'残り1分',  alertLabel:'CRITICAL', alertColor:'#cc1111', ringColor:'#cc1111', atColor:'#cc1111' },
  ];

  let totalSec=20*60, remaining=totalSec, elapsed=0;
  let running=false, intervalId=null;
  let passedMilestones=new Set();
  let enabledMilestones=new Set([0,1,2,3]);

  const display      = document.getElementById('time-display');
  const elapsedLabel = document.getElementById('elapsed-label');
  const statusLabel  = document.getElementById('status-label');
  const alertLevelEl = document.getElementById('alert-level');
  const ringFill     = document.getElementById('ring-fill');
  const mDots        = document.getElementById('m-dots');
  const ticksG       = document.getElementById('ticks');
  const mainBtn      = document.getElementById('main-btn');
  const btnIcon      = document.getElementById('btn-icon');
  const btnLabel     = document.getElementById('btn-label');
  const resetBtn     = document.getElementById('reset-btn');
  const milestoneLog = document.getElementById('milestone-log');
  const flashOverlay = document.getElementById('flash-overlay');
  const atField      = document.getElementById('at-field');
  const hazard       = document.getElementById('hazard');
  const minInput     = document.getElementById('min-input');
  const secInput     = document.getElementById('sec-input');

  ringFill.style.strokeDasharray  = CIRC;
  ringFill.style.strokeDashoffset = 0;

  // Build 60 tick marks
  for (let i=0; i<60; i++) {
    const ang = (i/60)*2*Math.PI - Math.PI/2;
    const isMain = i%5===0;
    const r1 = isMain ? R-9 : R-5;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', (CX+r1*Math.cos(ang)).toFixed(2));
    line.setAttribute('y1', (CY+r1*Math.sin(ang)).toFixed(2));
    line.setAttribute('x2', (CX+R *Math.cos(ang)).toFixed(2));
    line.setAttribute('y2', (CY+R *Math.sin(ang)).toFixed(2));
    line.setAttribute('stroke','#e86400');
    line.setAttribute('stroke-width', isMain?'2':'0.8');
    line.setAttribute('opacity', isMain?'0.45':'0.18');
    ticksG.appendChild(line);
  }

  // Audio
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx=null;
  function getAudioCtx(){ if(!audioCtx) audioCtx=new AudioCtx(); return audioCtx; }

  function playBell(t){
    try{
      const ctx=getAudioCtx(), now=ctx.currentTime+t;
      [[1318,.5],[2637,.25],[3955,.12],[5274,.06]].forEach(([f,g])=>{
        const o=ctx.createOscillator(), gn=ctx.createGain();
        o.connect(gn); gn.connect(ctx.destination);
        o.type='sine'; o.frequency.setValueAtTime(f,now);
        gn.gain.setValueAtTime(0,now);
        gn.gain.linearRampToValueAtTime(g,now+.005);
        gn.gain.exponentialRampToValueAtTime(.0001,now+1.6);
        o.start(now); o.stop(now+1.7);
      });
      const o2=ctx.createOscillator(), g2=ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type='triangle'; o2.frequency.setValueAtTime(1864,now);
      g2.gain.setValueAtTime(.08,now); g2.gain.exponentialRampToValueAtTime(.0001,now+.08);
      o2.start(now); o2.stop(now+.1);
    }catch(e){}
  }
  function playMilestoneSound(){ for(let i=0;i<3;i++) playBell(i*.55); }
  function playEndSound(){
    try{
      const ctx=getAudioCtx(), now=ctx.currentTime;
      [1047,1319,1568,2093].forEach((f,i)=>{
        const t=now+i*.22, o=ctx.createOscillator(), g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type='sine'; o.frequency.setValueAtTime(f,t);
        g.gain.setValueAtTime(.4,t); g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
        o.start(t); o.stop(t+1.3);
      });
      for(let i=0;i<3;i++) playBell(1.1+i*.5);
    }catch(e){}
  }

  function flashFn(color,times,interval){
    let c=0;
    const step=()=>{
      if(c>=times*2){flashOverlay.style.opacity=0;return;}
      flashOverlay.style.background=color;
      flashOverlay.style.opacity=c%2===0?'0.13':'0';
      c++; setTimeout(step,interval);
    }; step();
  }

  function showAT(color){
    atField.querySelectorAll('polygon,line,circle').forEach(el=>{
      if(el.tagName!=='circle'||el.getAttribute('r')>'10')
        el.setAttribute('stroke',color||'#e86400');
      else
        el.setAttribute('fill',color||'#e86400');
    });
    atField.style.transition='opacity 0.05s';
    atField.style.opacity='1';
    setTimeout(()=>{ atField.style.transition='opacity 0.7s'; atField.style.opacity='0'; },350);
  }

  function flashEnd(){
    let c=0; const cols=['#cc1111','#e86400','#cc1111','#e86400','#cc1111','#e86400','#cc1111'];
    const step=()=>{
      if(c>=cols.length*2){flashOverlay.style.opacity=0;return;}
      flashOverlay.style.background=cols[Math.floor(c/2)];
      flashOverlay.style.opacity=c%2===0?'0.2':'0';
      c++; setTimeout(step,120);
    }; step();
    [0,200,400,600,800].forEach(d=>setTimeout(()=>showAT('#cc1111'),d));
  }

  function fmt(s){
    return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }
  function syncInputs(sec){ minInput.value=Math.floor(sec/60); secInput.value=sec%60; }
  function readInputs(){
    const m=Math.max(0,parseInt(minInput.value)||0);
    const s=Math.round((parseInt(secInput.value)||0)/10)*10;
    return Math.min(m*60+Math.min(s,50),179*60+50);
  }

  function buildDots(){
    mDots.innerHTML='';
    MILESTONES.forEach((m,i)=>{
      if(m.sec>totalSec) return;
      const pct=1-m.sec/totalSec;
      const ang=pct*2*Math.PI-Math.PI/2;
      const x=(CX+R*Math.cos(ang)).toFixed(2);
      const y=(CY+R*Math.sin(ang)).toFixed(2);
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',x); c.setAttribute('cy',y);
      c.setAttribute('r','5'); c.setAttribute('fill',m.ringColor);
      c.setAttribute('opacity','0.9'); c.id='mdot-'+i;
      mDots.appendChild(c);
    });
  }

  function getRingColor(){
    if(remaining>300) return '#e86400';
    if(remaining>180) return '#cc4400';
    if(remaining>60)  return '#cc2800';
    return '#cc1111';
  }

  function setAlertLevel(label,color){
    alertLevelEl.textContent='ALERT LEVEL : '+label;
    alertLevelEl.style.color=color;
  }

  function updateDisplay(){
    display.textContent=fmt(remaining);
    elapsedLabel.textContent='ELAPSED — '+fmt(elapsed);
    const pct=totalSec>0?remaining/totalSec:0;
    ringFill.style.strokeDashoffset=CIRC*(1-pct);
    const col=getRingColor();
    ringFill.style.stroke=col;
    ringFill.style.filter='drop-shadow(0 0 5px '+col+')';
    display.style.color=remaining<=300 ? col : '';
    display.style.textShadow='0 0 24px '+col+'80';
    hazard.classList.toggle('show', remaining<=60 && running);
  }

  function checkMilestones(){
    MILESTONES.forEach((m,i)=>{
      if(remaining===m.sec && !passedMilestones.has(i) && enabledMilestones.has(i)){
        passedMilestones.add(i);
        playMilestoneSound();
        flashFn(m.atColor,3,220);
        showAT(m.atColor);
        setAlertLevel(m.alertLabel, m.alertColor);
        statusLabel.textContent='[ '+m.alertLabel+' ] '+m.jp;
        statusLabel.style.color=m.alertColor;
        const entry=document.createElement('div'); entry.className='log-entry';
        const pre=document.createElement('span'); pre.className='log-pre'; pre.textContent='> ';
        entry.appendChild(pre);
        entry.appendChild(document.createTextNode('['+fmt(remaining)+'] '+m.alertLabel+' — '+m.jp));
        milestoneLog.prepend(entry);
        const dn=document.getElementById('mdot-'+i);
        if(dn){ dn.setAttribute('fill','rgba(232,100,0,0.18)'); dn.setAttribute('opacity','0.5'); }
      }
    });
  }

  function tick(){
    if(remaining<=0){
      clearInterval(intervalId); running=false; remaining=0;
      display.textContent='00:00';
      display.style.color='#cc1111';
      display.style.textShadow='0 0 30px #cc111180';
      statusLabel.textContent='[ OPERATION COMPLETE — 作戦終了 ]';
      statusLabel.style.color='#cc1111';
      ringFill.style.strokeDashoffset=CIRC;
      ringFill.style.stroke='#cc1111';
      hazard.classList.remove('show');
      setAlertLevel('TERMINATED','#cc1111');
      btnIcon.innerHTML=ICON_PLAY; btnLabel.textContent='START';
      mainBtn.classList.remove('running');
      playEndSound(); flashEnd(); return;
    }
    remaining--; elapsed++;
    updateDisplay(); checkMilestones();
    if(remaining>0 && remaining<=10){
      statusLabel.textContent='[ CRITICAL ] 残り '+remaining+' 秒';
      statusLabel.style.color='#cc1111';
    }
  }

  function setTotal(sec){
    clearInterval(intervalId); running=false;
    totalSec=sec; remaining=sec; elapsed=0;
    passedMilestones.clear(); milestoneLog.innerHTML='';
    btnIcon.innerHTML=ICON_PLAY; btnLabel.textContent='START';
    mainBtn.classList.remove('running');
    statusLabel.textContent='[ STANDBY — 待機中 ]';
    statusLabel.style.color='var(--green)';
    display.style.color=''; display.style.textShadow='0 0 24px rgba(232,100,0,0.45)';
    ringFill.style.stroke='#e86400'; ringFill.style.filter='drop-shadow(0 0 5px #e86400)';
    hazard.classList.remove('show');
    setAlertLevel('GREEN','var(--green)');
    syncInputs(sec); buildDots(); updateDisplay();
  }

  mainBtn.addEventListener('click',()=>{
    if(remaining<=0){ setTotal(totalSec); return; }
    if(running){
      clearInterval(intervalId); running=false;
      btnIcon.innerHTML=ICON_PLAY; btnLabel.textContent='START';
      mainBtn.classList.remove('running');
      statusLabel.textContent='[ SUSPENDED — 一時停止 ]';
    } else {
      getAudioCtx(); running=true;
      btnIcon.innerHTML=ICON_PAUSE; btnLabel.textContent='PAUSE';
      mainBtn.classList.add('running');
      statusLabel.textContent='[ OPERATION ACTIVE — 作戦継続中 ]';
      statusLabel.style.color='var(--green)';
      intervalId=setInterval(tick,1000);
    }
  });

  resetBtn.addEventListener('click',()=>setTotal(totalSec));

  document.querySelectorAll('.preset-btn[data-sec]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.preset-btn[data-sec]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      setTotal(parseInt(btn.dataset.sec));
    });
  });

  document.getElementById('apply-btn').addEventListener('click',()=>{
    document.querySelectorAll('.preset-btn[data-sec]').forEach(b=>b.classList.remove('active'));
    setTotal(readInputs());
  });

  document.getElementById('dec-10s').addEventListener('click',()=>{
    document.querySelectorAll('.preset-btn[data-sec]').forEach(b=>b.classList.remove('active'));
    setTotal(Math.max(10,readInputs()-10));
  });

  document.getElementById('inc-10s').addEventListener('click',()=>{
    document.querySelectorAll('.preset-btn[data-sec]').forEach(b=>b.classList.remove('active'));
    setTotal(Math.min(179*60+50,readInputs()+10));
  });

  secInput.addEventListener('change',()=>{
    let v=Math.round((parseInt(secInput.value)||0)/10)*10;
    if(v>=60){ minInput.value=(parseInt(minInput.value)||0)+1; v=0; }
    if(v<0) v=0; secInput.value=v;
  });

  function updateClock(){
    const n=new Date();
    const h=String(n.getHours()).padStart(2,'0');
    const m=String(n.getMinutes()).padStart(2,'0');
    const s=String(n.getSeconds()).padStart(2,'0');
    document.getElementById('sys-clock').textContent=h+':'+m+':'+s;
  }
  updateClock(); setInterval(updateClock,1000);

  document.querySelectorAll('.alert-toggle').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=parseInt(btn.dataset.idx);
      if(enabledMilestones.has(i)){
        enabledMilestones.delete(i);
        btn.classList.remove('active');
      } else {
        enabledMilestones.add(i);
        btn.classList.add('active');
      }
    });
  });

  setTotal(totalSec);
})();
</script>
</body>
</html>
