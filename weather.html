<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NERV :: WEATHER INTEL SYSTEM</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #f5f7fa;
  --surface:    #ffffff;
  --header-bg:  #1e3a5f;
  --header-txt: #ffffff;
  --primary:    #1e3a5f;
  --accent:     #2563eb;
  --text:       #1f2937;
  --text-dim:   #6b7280;
  --text-faint: #9ca3af;
  --border:     #e5e7eb;
  --border2:    #d1d5db;
  --src-bg:     #f8fafc;
  --today-hl:   #eff6ff;
  --today-bdr:  #2563eb;
  --rain-none:  #9ca3af;
  --rain-low:   #60a5fa;
  --rain-mid:   #2563eb;
  --rain-high:  #1d4ed8;
  --rain-max:   #7c3aed;
  --hi-color:   #dc2626;
  --lo-color:   #2563eb;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes spin  { to{transform:rotate(360deg)} }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ── HEADER ── */
.app-header {
  background: var(--header-bg);
  color: var(--header-txt);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.app-logo { font-size: 18px; font-weight: 700; letter-spacing: 2px; flex-shrink: 0; white-space: nowrap; }
.app-logo small { display: block; font-size: 10px; font-weight: 400; opacity: 0.7; letter-spacing: 1px; }
.location-bar { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }

input[type=text] {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  padding: 7px 10px;
  outline: none;
  flex: 1;
  min-width: 0;
}
input[type=text]::placeholder { color: rgba(255,255,255,0.5); }
input[type=text]:focus { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.6); }

button {
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 13px;
  padding: 7px 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}
button:hover { background: rgba(255,255,255,0.28); }
button.primary { background: #2563eb; border-color: #2563eb; font-weight: 600; }
button.primary:hover { background: #1d4ed8; }
button.icon-btn { padding: 7px 10px; font-size: 16px; }

/* ── STATUS BAR ── */
.status-bar {
  font-size: 12px;
  color: var(--text-dim);
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.status-bar .active { color: var(--accent); font-weight: 600; }
.status-bar .loading { animation: pulse 1s infinite; }

/* ── MAIN ── */
#app { padding: 12px; }

/* ── LEGEND ── */
.legend {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 12px; height: 12px; border-radius: 2px; }

/* ── TABLE ── */
.table-wrapper {
  overflow-x: auto;
  background: var(--surface);
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  border: 1px solid var(--border);
}

table { border-collapse: collapse; width: 100%; min-width: 700px; }
th, td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0; vertical-align: top; }
tr:last-child td { border-bottom: none; }

/* Source label column */
th.src-col, td.src-col {
  width: 110px; min-width: 95px;
  padding: 10px 10px;
  background: var(--src-bg);
  position: sticky; left: 0; z-index: 2;
  vertical-align: middle;
  border-right: 2px solid var(--border2);
}
td.src-col .src-name { color: var(--primary); display: block; font-size: 13px; font-weight: 700; }
td.src-col .src-sub  { font-size: 11px; color: var(--text-faint); }

/* Day header */
th.day-hdr {
  text-align: center;
  padding: 8px 6px 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--src-bg);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  min-width: 110px;
  transition: background 0.12s;
}
th.day-hdr:hover  { background: #eff6ff; color: var(--accent); }
th.day-hdr.today  { background: var(--today-hl); border-top: 3px solid var(--today-bdr); }
th.day-hdr.today .dlabel { color: var(--accent); font-weight: 700; }
th.day-hdr.expanded { background: #dbeafe; }
th.day-hdr .dlabel  { display: block; margin-bottom: 3px; font-size: 13px; color: var(--text); }
th.day-hdr .dtoggle { font-size: 10px; color: var(--accent); background: #eff6ff; border-radius: 4px; padding: 1px 5px; }
th.day-hdr.expanded .dtoggle { background: #bfdbfe; }

/* Data cells */
td.day-cell {
  text-align: center;
  padding: 8px 6px;
  min-width: 110px;
  vertical-align: middle;
  background: #fff;
}
tr:nth-child(even) td.day-cell { background: #fafbfc; }
td.day-cell.today-col { background: #f0f7ff; }

.cell-inner { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.cell-emoji { font-size: 30px; line-height: 1.1; }
.cell-temp  { font-size: 12px; font-weight: 600; }
.cell-temp .hi { color: var(--hi-color); }
.cell-temp .lo { color: var(--lo-color); }
.cell-desc { font-size: 10px; color: var(--text-dim); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rain-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  min-width: 52px;
  text-align: center;
}
.rain-mm { font-size: 11px; color: var(--accent); }

.c-loading { color: var(--text-faint); font-size: 11px; animation: pulse 1s infinite; }
.c-error   { color: #dc2626; font-size: 11px; cursor: help; }
.c-nodata  { color: var(--text-faint); font-size: 14px; }

/* ── HOURLY PANEL ── */
.hourly-section {
  background: #f0f7ff;
  border-top: 2px solid #bfdbfe;
  border-bottom: 2px solid #bfdbfe;
}
.hourly-section td { border: none; padding: 0; }
.hourly-label {
  padding: 6px 10px 4px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: #dbeafe;
}
.hourly-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.hourly-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.hourly-tbl th {
  background: #dbeafe;
  color: var(--primary);
  font-size: 11px;
  font-weight: 600;
  padding: 5px 8px;
  text-align: center;
  white-space: nowrap;
  border-right: 1px solid #bfdbfe;
  border-bottom: 1px solid #bfdbfe;
}
.hourly-tbl td {
  padding: 5px 6px;
  text-align: center;
  white-space: nowrap;
  border-right: 1px solid #e0eaff;
  border-bottom: 1px solid #e0eaff;
  background: #f8fbff;
}
.hourly-tbl tr:nth-child(even) td { background: #f0f7ff; }
.h-time {
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  text-align: left;
  padding-left: 12px !important;
  background: #dbeafe !important;
  border-right: 2px solid #bfdbfe !important;
  white-space: nowrap;
}
.h-rain {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 12px;
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  min-width: 40px;
}
.h-emoji { font-size: 22px; line-height: 1.2; }
.h-temp { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.h-mm   { font-size: 10px; color: var(--accent); }
.h-empty { color: var(--text-faint); font-size: 12px; }
.h-no-data { color: var(--text-faint); font-size: 11px; font-style: italic; padding: 10px; }

/* ── LOADING OVERLAY ── */
#loading-ov {
  display: none; position: fixed; inset: 0;
  background: rgba(30,58,95,0.75);
  z-index: 500; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
}
#loading-ov.show { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 4px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading-text { color: #fff; font-size: 14px; font-weight: 600; letter-spacing: 2px; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #f1f5f9; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ── MOBILE ── */
@media (max-width: 640px) {
  .app-header { padding: 10px 12px; gap: 8px; }
  .app-logo { font-size: 15px; }
  .app-logo small { display: none; }
  input[type=text] { font-size: 14px; padding: 8px 10px; }
  button { padding: 8px 10px; font-size: 13px; }
  #app { padding: 6px; }

  /* Source column: very narrow, initials only */
  th.src-col, td.src-col {
    width: 52px; min-width: 52px; padding: 4px 4px;
    font-size: 10px;
  }
  td.src-col .src-name { font-size: 10px; letter-spacing: 0; }
  td.src-col .src-sub  { display: none; }

  /* Day columns: compact */
  th.day-hdr { min-width: 72px; padding: 5px 2px 4px; font-size: 11px; }
  th.day-hdr .dlabel { font-size: 11px; }
  th.day-hdr .dtoggle { font-size: 9px; }
  td.day-cell { min-width: 72px; padding: 5px 2px; }
  .cell-emoji { font-size: 24px; }
  .cell-temp { font-size: 11px; }
  .rain-badge { font-size: 12px; padding: 2px 5px; min-width: 40px; }
  .rain-mm { display: none; }
  .cell-desc { display: none; }

  /* Hourly table: compact */
  .hourly-tbl { font-size: 11px; }
  .hourly-tbl th, .hourly-tbl td { padding: 4px 4px; }
  .h-time { padding-left: 6px !important; }
  .h-rain { font-size: 11px; padding: 1px 4px; min-width: 34px; }
  .h-temp { font-size: 10px; }
  .h-mm { display: none; }

  /* Legend: wrap */
  .legend { font-size: 10px; gap: 6px; }
  .legend span[style] { display: none; }
}
</style>
</head>
<header class="app-header">
  <div class="app-logo">
    🌦 天気予報
    <small>5ソース比較 · 雨の確率重視</small>
  </div>
  <div class="location-bar">
    <input type="text" id="city-input" placeholder="都市名を入力" value="北九州市八幡西区">
    <button class="icon-btn" id="geo-btn" title="現在地を取得">📍</button>
    <button class="primary" id="scan-btn">🔍 検索</button>
  </div>
</header>

<div class="status-bar" id="status">──</div>

<div id="app">
  <div class="legend">
    <strong>雨の確率：</strong>
    <span class="legend-item"><span class="legend-dot" style="background:var(--rain-none)"></span>〜29%</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--rain-low)"></span>30〜59%</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--rain-mid)"></span>60〜79%</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--rain-max)"></span>80%〜</span>
    <span style="margin-left:8px;color:var(--text-faint)">※今日・明日は時間別自動展開。日付クリックで切替</span>
  </div>

  <div class="table-wrapper">
    <table id="wtbl">
      <thead id="wtbl-head"></thead>
      <tbody id="wtbl-body"></tbody>
    </table>
  </div>
</div>

<div id="loading-ov">
  <div class="spinner"></div>
  <div class="loading-text">データ取得中...</div>
</div>

<script>
'use strict';

// ── CONSTANTS ──────────────────────────────────────────────────────────
const DOW = ['日','月','火','水','木','金','土'];

const SOURCES = [
  { id:'jma',   name:'気象庁',    sub:'公式API'       },
  { id:'ecmwf', name:'ECMWF',     sub:'Open-Meteo'    },
  { id:'gfs',   name:'GFS (NOAA)',sub:'Open-Meteo'    },
  { id:'wttr',  name:'wttr.in',   sub:'3日分'         },
];

const JMA_AREA_CODES = {
  '北海道': '016000',
  '青森県': '020000', '青森': '020000',
  '岩手県': '030000', '岩手': '030000',
  '宮城県': '040000', '宮城': '040000',
  '秋田県': '050000', '秋田': '050000',
  '山形県': '060000', '山形': '060000',
  '福島県': '070000', '福島': '070000',
  '茨城県': '080000', '茨城': '080000',
  '栃木県': '090000', '栃木': '090000',
  '群馬県': '100000', '群馬': '100000',
  '埼玉県': '110000', '埼玉': '110000',
  '千葉県': '120000', '千葉': '120000',
  '東京都': '130000', '東京': '130000',
  '神奈川県': '140000', '神奈川': '140000',
  '新潟県': '150000', '新潟': '150000',
  '富山県': '160000', '富山': '160000',
  '石川県': '170000', '石川': '170000',
  '福井県': '180000', '福井': '180000',
  '山梨県': '190000', '山梨': '190000',
  '長野県': '200000', '長野': '200000',
  '岐阜県': '210000', '岐阜': '210000',
  '静岡県': '220000', '静岡': '220000',
  '愛知県': '230000', '愛知': '230000',
  '三重県': '240000', '三重': '240000',
  '滋賀県': '250000', '滋賀': '250000',
  '京都府': '260000', '京都': '260000',
  '大阪府': '270000', '大阪': '270000',
  '兵庫県': '280000', '兵庫': '280000',
  '奈良県': '290000', '奈良': '290000',
  '和歌山県': '300000', '和歌山': '300000',
  '鳥取県': '310000', '鳥取': '310000',
  '島根県': '320000', '島根': '320000',
  '岡山県': '330000', '岡山': '330000',
  '広島県': '340000', '広島': '340000',
  '山口県': '350000', '山口': '350000',
  '徳島県': '360000', '徳島': '360000',
  '香川県': '370000', '香川': '370000',
  '愛媛県': '380000', '愛媛': '380000',
  '高知県': '390000', '高知': '390000',
  '福岡県': '400000', '福岡': '400000',
  '佐賀県': '410000', '佐賀': '410000',
  '長崎県': '420000', '長崎': '420000',
  '熊本県': '430000', '熊本': '430000',
  '大分県': '440000', '大分': '440000',
  '宮崎県': '450000', '宮崎': '450000',
  '鹿児島県': '460100', '鹿児島': '460100',
  '沖縄県': '471000', '沖縄': '471000',
};

// ── STATE ──────────────────────────────────────────────────────────────
const st = {
  lat: 33.7500, lon: 130.7500, city: '北九州市八幡西区',
  admin1: '福岡県',   // prefecture from geocoding
  days: [],           // [{date,label,isToday,isTomorrow}]
  data: {},           // {srcId:{daily,hourly}|{error}, ...}
  expanded: {},       // {date:bool}
};

// ── HELPERS ────────────────────────────────────────────────────────────
function rainColor(p) {
  if (p == null) return 'var(--rain-none)';
  if (p < 30)   return 'var(--rain-none)';
  if (p < 60)   return 'var(--rain-low)';
  if (p < 80)   return 'var(--rain-mid)';
  return 'var(--rain-max)';
}

function wmoEmoji(c) {
  c = +c;
  if (c === 0)                      return '☀️';
  if (c <= 2)                       return '🌤️';
  if (c === 3)                      return '☁️';
  if (c === 45 || c === 48)         return '🌫️';
  if (c >= 51 && c <= 57)           return '🌦️';  // drizzle + freezing drizzle
  if (c >= 61 && c <= 67)           return '🌧️';  // rain + freezing rain
  if (c >= 71 && c <= 77)           return '❄️';
  if (c >= 80 && c <= 82)           return '🌧️';
  if (c === 85 || c === 86)         return '❄️';
  if (c === 95 || c === 96 || c === 99) return '⛈️';
  return '⛅';
}

// WWO weather codes used by wttr.in (different from WMO)
function wttrEmoji(code) {
  code = +code;
  if (code === 113) return '☀️';
  if (code === 116) return '🌤️';
  if (code === 119 || code === 122) return '☁️';
  if (code === 143 || code === 248 || code === 260) return '🌫️';
  if ([200,386,389,392,395].includes(code)) return '⛈️';
  if ([227,230,323,326,329,332,335,338,350,368,371,374,377].includes(code)) return '❄️';
  if ([179,182,185,281,284,317,320,362,365].includes(code)) return '🌨️';
  if ([176,263,266,293,353].includes(code)) return '🌦️';
  if (code >= 281) return '🌧️';
  return '⛅';
}

function jmaEmoji(code) {
  const c = +code;
  if (c >= 400) return '❄️';
  if (c >= 300) return '🌧️';
  if (c >= 200) {
    if (c >= 260) return '🌨️';
    if (c >= 230) return '🌦️';
    return '⛅';
  }
  if (c >= 100) {
    if (c >= 160) return '🌦️';
    if (c >= 130) return '🌤️';
    return '☀️';
  }
  return '⛅';
}

function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function round1(n) { return Math.round(+n * 10) / 10; }

function buildDays() {
  const days = [];
  const now = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(now);
    d.setDate(now.getDate() + i);
    const date = localDateStr(d);
    const dow = DOW[d.getDay()];
    const label = i===0 ? `今日(${dow})` : i===1 ? `明日(${dow})` : `${d.getMonth()+1}/${d.getDate()}(${dow})`;
    days.push({ date, label, isToday: i===0, isTomorrow: i===1 });
  }
  return days;
}

// ── GEOCODING ──────────────────────────────────────────────────────────
async function geocode(city) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ja&format=json`);
  const j = await r.json();
  if (!j.results?.length) throw new Error('都市が見つかりません: ' + city);
  const { latitude: lat, longitude: lon, name, admin1 } = j.results[0];
  return { lat, lon, name, admin1: admin1 || '' };
}

// ── FETCHERS ───────────────────────────────────────────────────────────
async function fetchJMA(admin1) {
  const areaCode = JMA_AREA_CODES[admin1] || '130000';
  const url = `https://www.jma.go.jp/bosai/forecast/data/forecast/${areaCode}.json`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();

  const weekly = j[1];
  // Scan timeSeries for the correct arrays by field presence
  const ts0 = weekly.timeSeries.find(ts => ts.areas?.[0]?.weatherCodes) || weekly.timeSeries[0];
  const ts1 = weekly.timeSeries.find(ts => ts.areas?.[0]?.pops);
  const ts2 = weekly.timeSeries.find(ts => ts.areas?.[0]?.tempsMin || ts.areas?.[0]?.tempsMax);

  const area0 = ts0?.areas[0];
  const area1 = ts1?.areas[0];
  const area2 = ts2?.areas[0];

  // Build pop lookup by date (timeDefines may differ between series)
  const popByDate = {};
  if (ts1 && area1?.pops) {
    ts1.timeDefines.forEach((iso, i) => {
      const raw = area1.pops[i];
      if (raw != null && raw !== '' && raw !== '--') {
        popByDate[iso.slice(0, 10)] = +raw;
      }
    });
  }

  // Build temp lookup by date
  const tempByDate = {};
  if (ts2 && area2) {
    ts2.timeDefines.forEach((iso, i) => {
      const min = area2.tempsMin?.[i];
      const max = area2.tempsMax?.[i];
      tempByDate[iso.slice(0, 10)] = {
        min: (min != null && min !== '') ? +min : null,
        max: (max != null && max !== '') ? +max : null,
      };
    });
  }

  const daily = (ts0?.timeDefines || []).map((iso, i) => {
    const date = iso.slice(0, 10);
    const weatherCode = area0.weatherCodes?.[i] || '0';
    const weather     = area0.weathers?.[i] || '';
    const temps = tempByDate[date] || {};
    return {
      date,
      maxTemp:  temps.max != null ? Math.round(temps.max) : null,
      minTemp:  temps.min != null ? Math.round(temps.min) : null,
      rainProb: popByDate[date] ?? null,
      rainMM:   null,
      emoji:    jmaEmoji(weatherCode),
      desc:     weather.replace(/\s+/g, ' ').trim(),
    };
  });

  return { daily, hourly: {} };
}

async function fetchOpenMeteo(lat, lon, model) {
  const mp = model ? `&models=${model}` : '';
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&hourly=temperature_2m,precipitation,precipitation_probability,weather_code&timezone=Asia%2FTokyo&forecast_days=7${mp}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();

  const daily = j.daily.time.map((date, i) => ({
    date,
    maxTemp:  Math.round(j.daily.temperature_2m_max[i] ?? 0),
    minTemp:  Math.round(j.daily.temperature_2m_min[i] ?? 0),
    rainProb: j.daily.precipitation_probability_max[i] ?? null,
    rainMM:   round1(j.daily.precipitation_sum[i] ?? 0),
    emoji:    wmoEmoji(j.daily.weather_code[i]),
    desc:     '',
  }));

  const hourly = {};
  j.hourly.time.forEach((iso, i) => {
    const date = iso.slice(0,10);
    const hour = +iso.slice(11,13);
    (hourly[date] = hourly[date]||[]).push({
      hour,
      temp:     Math.round(j.hourly.temperature_2m[i] ?? 0),
      rainProb: j.hourly.precipitation_probability[i] ?? null,
      rainMM:   round1(j.hourly.precipitation[i] ?? 0),
      emoji:    wmoEmoji(j.hourly.weather_code[i]),
    });
  });

  return { daily, hourly };
}

async function fetchWttr(lat, lon) {
  const url = `https://wttr.in/${lat},${lon}?format=j1`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();

  const now = new Date();
  // wttr.in only returns 3 days
  const daily = j.weather.map((day, i) => {
    const d = new Date(now); d.setDate(now.getDate()+i);
    const date = localDateStr(d);
    const hrs = day.hourly||[];
    const rainProb = hrs.length ? Math.max(...hrs.map(h=>+h.chanceofrain||0)) : 0;
    const rainMM   = round1(hrs.reduce((s,h)=>s+(+h.precipMM||0),0));
    const midHour  = hrs[4]||hrs[0]||{};
    return {
      date,
      maxTemp:  Math.round(+day.maxtempC),
      minTemp:  Math.round(+day.mintempC),
      rainProb,
      rainMM,
      emoji:    wttrEmoji(+(midHour.weatherCode||0)),
      desc:     '',
    };
  });

  const hourly = {};
  j.weather.forEach((day, i) => {
    const d = new Date(now); d.setDate(now.getDate()+i);
    const date = localDateStr(d);
    hourly[date] = (day.hourly||[]).map(h => ({
      hour:     Math.floor((+h.time||0)/100),
      temp:     Math.round(+h.tempC||0),
      rainProb: +h.chanceofrain||0,
      rainMM:   round1(+h.precipMM||0),
      emoji:    wttrEmoji(+h.weatherCode||0),
    }));
  });

  return { daily, hourly };
}

// ── RENDER HELPERS ─────────────────────────────────────────────────────
function rainBadge(prob) {
  if (prob == null) return `<span class="rain-badge" style="background:var(--rain-none)">--%</span>`;
  return `<span class="rain-badge" style="background:${rainColor(prob)}">${prob}%</span>`;
}

function hRain(prob) {
  if (prob == null) return `<span class="h-rain" style="background:var(--rain-none)">--</span>`;
  return `<span class="h-rain" style="background:${rainColor(prob)}">${prob}%</span>`;
}

function renderDayCell(srcId, date, isToday) {
  const cls = `day-cell${isToday ? ' today-col' : ''}`;
  const sd = st.data[srcId];
  if (!sd) return `<td class="${cls}"><span class="c-loading">読込中...</span></td>`;
  if (sd.error) return `<td class="${cls}"><span class="c-error" title="${esc(sd.error)}">取得失敗</span></td>`;

  const day = sd.daily?.find(d => d.date === date);
  if (!day) return `<td class="day-cell"><span class="c-nodata">─</span></td>`;

  const tempStr = (day.maxTemp != null && day.minTemp != null)
    ? `<span class="hi">${day.maxTemp}°</span>/<span class="lo">${day.minTemp}°</span>`
    : (day.maxTemp != null ? `<span class="hi">${day.maxTemp}°</span>` : '<span style="color:var(--text-faint)">─</span>');

  const mmStr = srcId === 'jma' ? '' : `<span class="rain-mm">${day.rainMM}mm</span>`;
  const descStr = (srcId === 'jma' && day.desc)
    ? `<span class="cell-desc" title="${esc(day.desc)}">${esc(day.desc)}</span>`
    : '';

  return `<td class="${cls}"><div class="cell-inner">
    <span class="cell-emoji">${day.emoji}</span>
    <span class="cell-temp">${tempStr}</span>
    ${rainBadge(day.rainProb)}
    ${mmStr}
    ${descStr}
  </div></td>`;
}

function renderHourlyPanel(date, label) {
  const hourSources = SOURCES.filter(s => s.id !== 'jma');
  const hourSet = new Set();
  hourSources.forEach(src => {
    const sd = st.data[src.id];
    if (sd && !sd.error && sd.hourly?.[date]) {
      sd.hourly[date].forEach(h => hourSet.add(h.hour));
    }
  });

  const anyLoading = hourSources.some(s => !st.data[s.id]);
  if (!hourSet.size) {
    const msg = anyLoading
      ? '<div class="h-no-data">⏳ データ取得中...</div>'
      : '<div class="h-no-data">時間別データなし</div>';
    return `<div class="hourly-label">⏱ 時間別予報 — ${esc(label)}</div>${msg}`;
  }

  const hours = [...hourSet].sort((a,b)=>a-b);

  let html = `<div class="hourly-label">⏱ 時間別予報 — ${esc(label)}</div>`;
  html += `<div class="hourly-scroll"><table class="hourly-tbl"><thead><tr>
    <th style="text-align:left;padding-left:12px">時刻</th>
    ${hourSources.map(s=>`<th>${s.name}<br><span style="font-size:9px;font-weight:400;color:#5b7fa6">${s.sub}</span></th>`).join('')}
  </tr></thead><tbody>`;

  hours.forEach(hour => {
    html += `<tr><td class="h-time">${String(hour).padStart(2,'0')}:00</td>`;
    hourSources.forEach(src => {
      const sd = st.data[src.id];
      if (!sd)      { html += `<td><span class="h-empty">⏳</span></td>`; return; }
      if (sd.error) { html += `<td><span class="c-error" title="${esc(sd.error)}">ERR</span></td>`; return; }
      const hd = sd.hourly?.[date]?.find(h => h.hour === hour);
      if (!hd)      { html += `<td><span class="h-empty">─</span></td>`; return; }
      html += `<td>
        <div>${hRain(hd.rainProb)}</div>
        <div class="h-emoji">${hd.emoji}</div>
        <div class="h-temp">${hd.temp}°C</div>
        <div class="h-mm">${hd.rainMM}mm</div>
      </td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody></table></div>`;
  return html;
}

function renderTable() {
  const days = st.days;

  // HEAD
  document.getElementById('wtbl-head').innerHTML = `<tr>
    <th class="src-col" style="font-size:11px;color:var(--text-dim);font-weight:600">情報源</th>
    ${days.map(d => {
      const cls = ['day-hdr', d.isToday?'today':'', st.expanded[d.date]?'expanded':''].filter(Boolean).join(' ');
      const icon = st.expanded[d.date] ? '▾' : '▸';
      return `<th class="${cls}" onclick="toggleDay('${d.date}')">
        <span class="dlabel">${d.label}</span>
        <span class="dtoggle">${icon} 時間別</span>
      </th>`;
    }).join('')}
  </tr>`;

  // BODY
  let bodyHtml = '';

  SOURCES.forEach(src => {
    bodyHtml += `<tr>
      <td class="src-col">
        <span class="src-name">${src.name}</span>
        <span class="src-sub">${src.sub}</span>
      </td>
      ${days.map(d => renderDayCell(src.id, d.date, d.isToday)).join('')}
    </tr>`;
  });

  // Hourly panels
  days.forEach(d => {
    if (!st.expanded[d.date]) return;
    bodyHtml += `<tr class="hourly-section">
      <td colspan="${days.length + 1}">${renderHourlyPanel(d.date, d.label)}</td>
    </tr>`;
  });

  document.getElementById('wtbl-body').innerHTML = bodyHtml;
}

window.toggleDay = function(date) {
  st.expanded[date] = !st.expanded[date];
  renderTable();
};

function setStatus(msg, type) {
  const el = document.getElementById('status');
  const cls = type === 'active' ? 'active' : type === 'loading' ? 'loading' : '';
  el.innerHTML = cls ? `<span class="${cls}">${esc(msg)}</span>` : esc(msg);
}

// ── FETCH ALL ──────────────────────────────────────────────────────────
async function fetchAll() {
  const { lat, lon, admin1 } = st;
  document.getElementById('loading-ov').classList.add('show');
  setStatus(`${st.city} (${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E) — SCANNING...`, 'loading');

  st.data = {};
  st.expanded = {};
  st.days.forEach(d => { if (d.isToday || d.isTomorrow) st.expanded[d.date] = true; });
  renderTable();

  const tasks = {
    jma:   fetchJMA(admin1),
    ecmwf: fetchOpenMeteo(lat, lon, 'ecmwf_ifs025'),
    gfs:   fetchOpenMeteo(lat, lon, null),
    wttr:  fetchWttr(lat, lon),
  };

  const results = await Promise.allSettled(Object.values(tasks));
  Object.keys(tasks).forEach((id, i) => {
    const res = results[i];
    if (res.status === 'fulfilled') {
      st.data[id] = res.value;
    } else {
      st.data[id] = { error: res.reason?.message || 'Unknown error' };
    }
  });

  document.getElementById('loading-ov').classList.remove('show');
  setStatus(`${st.city} (${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E) — INTEL ACTIVE`, 'active');
  renderTable();
}

async function doScan() {
  const city = document.getElementById('city-input').value.trim();
  if (!city) return;
  setStatus(`Geocoding: ${city}...`, 'loading');
  document.getElementById('loading-ov').classList.add('show');
  try {
    const geo = await geocode(city);
    st.lat    = geo.lat;
    st.lon    = geo.lon;
    st.city   = geo.name || city;
    st.admin1 = geo.admin1 || '';
    st.days = buildDays();
    await fetchAll();
  } catch(e) {
    setStatus(`ジオコーディング失敗 (${e.message})。デフォルト座標(東京)で試みます...`, 'loading');
    st.city   = city;
    st.admin1 = '';
    st.days = buildDays();
    await fetchAll();
  }
}

async function doGeo() {
  if (!navigator.geolocation) { setStatus('Geolocation not supported'); return; }
  setStatus('Requesting geolocation...', 'loading');
  navigator.geolocation.getCurrentPosition(async pos => {
    st.lat    = pos.coords.latitude;
    st.lon    = pos.coords.longitude;
    st.city   = `${st.lat.toFixed(3)}°N,${st.lon.toFixed(3)}°E`;
    st.admin1 = '';
    document.getElementById('city-input').value = st.city;
    st.days = buildDays();
    await fetchAll();
  }, err => {
    setStatus(`Geolocation error: ${err.message}`);
  });
}

// ── INIT ───────────────────────────────────────────────────────────────
(function init() {
  document.getElementById('scan-btn').addEventListener('click', doScan);
  document.getElementById('city-input').addEventListener('keydown', e => { if(e.key==='Enter') doScan(); });
  document.getElementById('geo-btn').addEventListener('click', doGeo);

  st.days = buildDays();
  doScan();
})();
</script>
