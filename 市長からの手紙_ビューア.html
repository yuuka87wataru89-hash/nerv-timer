  {vol:128,date:"2026年03月09日(月)",title:"アンラーンのススメ",content:"「これまで学んできたことは、全て忘れてください。」この言葉を私が言われたのは40歳の頃。厚労省の官僚として20年近いキャリアを積み、仕事も捌けるようになり、それなりの自信を持っていた頃。密かに、一人前になれたかな、と思っていた頃のことです。当時、外資系企業に意気揚々と転じた私は、このきつい言葉をかけられました。「あなたは官僚として、充分経験を積んできた。しかしその時に得た知識や自信が、あなたの成長を邪魔している。これからビジネスの世界で社会に価値を生み出すためには、今までの考え方や行動の仕方、言葉の使い方を捨てなければならない。アンラーン（unlearn：学習棄却）してほしいのです」正直、ハンマーで頭を殴られた気持ちでした。自分の過去20年を全否定されたようにも感じました。え？ あの頑張ってきた日々を全部忘れろと？実際の仕事に入ってみると冷や汗の連続でした。商品の「価値」って？ 「顧客」の定義って？ 「マーケティング」って？ それは知識があるかないかではなく、物事の捉え方、感覚、優先順位のとり方、言葉の表現、全てに目を白黒させました。まさに、異なる文明の中に放り込まれた気分。おまけに、私が必死に話しても「抽象的だ」「美辞麗句が多い」「現場感がない」「顧客ファーストではない」とボロクソです。もう一週間でクビになるのではないかと、真剣に悩みました。プライドもズタボロです。正直悩みました。すぐ辞めようかとも考えました。でも、そこでようやく腹をくくりました。「全て忘れなさい」という言葉を信じて、再スタートを切ったのです。頭の中に「役所では……」という言葉が浮かんだら直ちに抑える。「理屈では……」と思ったらすぐに「お客さんは……」と言い換える。年齢が10個も下であっても、マネージャーとして私を指導してくれる人の目の付け所や思考回路を、徹底的に真似ることにしました。そうすると、いくら本を読んでも分からなかったことが、実務の中で少しずつ、腹落ちできるようになりました。今までと全く違う発想で発言してみると、周りの見る目も少しずつ変わっていきました。そこから一つ、また一つとプロジェクトに加わり、ゆっくりですが確実に成長を感じるようになりました。それまでのこだわりやプライドを捨て、また一から学び直す。それは次第に、ワクワクする体験に変わっていきました。気づかなかった自分の強みや弱みを知り、新しい友人や同僚との出会いにも恵まれ、充実した学びの時間に変わっていきました。この経験は、私に大きなきっかけをくれました。新しい困難や未知の領域にぶつかったとき、うろたえたり固執したりするのではなく、面白がって、それを「自分が成長するチャンス」だと思う。困難があるからこそ、自分を成長させてくれる。どんな分野にも、素晴らしい知恵や経験の蓄積がある。それを学びながら自分の引き出しを増やしていくこと"},
  {vol:129,date:"2026年03月16日(月)",title:"原稿を読まない",content:"今回は皆さんに、私たちの「言葉」のあり方について、一歩踏み込んだ提案をしたいと思います。庁内での打ち合わせや庁外との会議、あらゆる場面で皆さんの発言を耳にしますが、用意された原稿を読み上げる姿を頻繁に目にします。行政において正確を期すことは大前提です。誤解を招かないよう、一言一句を精査し、それを忠実に伝える。その責任感自体は否定されるべきものではありません。しかし、立ち止まって考えてみてください。その「原稿の読み上げ」に終始することで、本当に相手の心を動かし、市政を前に進めることができているでしょうか。私自身も、記者会見、式典の挨拶、議会では原稿を活用します。言うべき要素を網羅し、重要な事項を言い漏らさないためには必要なツールです。しかし、プレゼンテーションやインタビュー、企業のトップセールスに臨む時は違います。そこにあるのは、自分の言葉による「真剣勝負」です。原稿を離れ、相手の目を見て、その場の空気に合わせた言葉を選ぶ。そこにこそ、真の説得力が宿ります。そこで、今日から「原稿を読むこと」を思い切って減らしてみませんか。これには、単なる効率化を超えた多角的なメリットがあります。第一に、組織のリソースの最適化です。形式的な原稿を作成する作業、そしてそれを上司が細かく添削する時間は、組織全体で膨大なコストとなっています。特に若手職員にとって、一字一句の修正に追われる時間は負担も大きくなるでしょう。この「内向きの作業」を削減することで、より本質的な課題解決や、市民の皆さんの声に耳を傾ける時間を創出できます。第二に、信頼関係の構築とプレゼンスの向上です。手元の紙から目を離し、相手の目を見て話す。この単純な変化が、情報の「臨場感」を劇的に高めます。用意された言葉をなぞる「説明」は時に壁を作りますが、自分の熱量を乗せた言葉は、聞き手に「この人は本気で語っている」という安心感と信頼を与えます。第三に、高度な思考能力と対応力の育成です。原稿なしで話すためには、内容を深く理解し、構造化して自分の中に落とし込んでおく必要があります。このプロセス自体が、政策の論理的欠陥に気づき、自分の知識を血肉化させる「最高のトレーニング」になります。また、原稿に縛られないことで、相手の反応に合わせた柔軟な切り返しや、想定外の質問への対応力も養われます。第四に、意思決定のスピードアップです。「原稿がないと話せない」状態を脱すれば、会議の場で即座に自分の意見をまとめ、議論を深めることができます。準備された回答を読み上げるだけの形式的な場が、双方向の活発な「対話」へと進化し、結果として迅速な意思決定につながります。もちろん、いきなり全てを完璧にこなす必要はありません。まずは庁内の少人数の会議から、メモ程度に留めて話してみる。あるいは冒頭のコメントだけは顔を上げて話す。そんな小さな挑戦から始めてくださ"},
  {vol:130,date:"2026年03月23日(月)",title:"手順が８割？",content:"昨今のめまぐるしい国際情勢をニュースで目にしながら、私はふと、日本という国のカタチについて深く考え込んでしまうことがあります。 剛腕とも言えるトップダウンで突き進む諸外国のスピード感と力強さを前にしたとき、私たちはこのままで対峙できるのでしょうか。かつて官僚の世界に身を置いていた頃から、私の中に澱のように溜まっていた一つの疑問があります。それは「手順が8割」とも指摘される、行政という組織の不文律です。「自分は中味を考える時間よりも、ペーパーに落としたり、決裁の順番を守ったりに８割の時間を割いていないかなあ」とずっと思っていました。正しいプロセスを踏むことで行政は出来ている。特に定型的業務においては、安定と正確がとても大切です。他方で、プロセスを踏むことに全力を注ぎ、忙殺される日々でいいのか。誰からも「これが欠けている」「あの手順をやっていない」と指を差されないことを第一義とする。そんな、守りの姿勢だけで本当にいいのだろうかという葛藤でした。もちろん、民主主義の妙味は、その丁寧さと合意形成のプロセスにあります。でも、ルールがコンテンツ（中身）よりも優先される社会でいいのか。玉虫色の衝突回避に終始する組織でいいのか。そこには、優先順位を決めるための「哲学」や、自らのアイデンティティを懸けた「勇気」が欠けてはいないでしょうか。 その想いを持ちます。また、行政運営において、KPIを指標とした生産性の向上や財政効果の追求は、確かに重要です。しかし、数字で測れるものだけが世界のすべてではありません。スポーツや文化、そして福祉がもたらす心の震えや豊かさを、どうやって数式に落とし込めばよいのでしょう。行政の補助金の在り方にも限界を感じています。単年度という区切りや、多くの手続きと細かな介入。公平性という名の下での各地域への均等な（小粒な）配分。それでは、本当の意味で世界と伍するような大きな力は育ちません。今、私たちに求められているのは、もっと“信じて任せる”ような、おおらかな支援の形ではないでしょうか。私たち行政に関わる者にとって、人生の目的のひとつには、突き詰めれば「社会の価値観を支える役割」を担うことがあると私は思います。次世代に何を手渡せるか。その手触りの中に、生きる意味が､見いだせたとき、それは大きな喜びとなります。形式的な正しさに埋没し、疲弊するのではなく、もっと本質的な価値に向き合いたい。市民の皆さんの未来のために、一歩ハミだす勇気を持って、共にこの街を耕していきませんか。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。【ホンの気持ち】『令和日本をデザインする』（落合陽一・先崎彰容）今回の手紙の内容にも示唆をくれた、２人の刺激的な対論集。教養という“芯”がなければ、日本という国に“アイデンティティ（自画像）”がなければ、「漂流」するばかりの、「口が上手い」"},
  {vol:131,date:"2026年03月30日(月)",title:"レバレッジ感覚",content:"新年度を控え、私たちがこれからの行政経営において、常に研ぎ澄ませておくべき一つの「感覚」についてお話ししたいと思います。それは「レバレッジ（テコの原理）」という視点です。そもそも「レバレッジ」とは何か。直訳すれば「テコの作用」を意味します。重い岩を素手で持ち上げるのは困難ですが、長い棒と支点、つまり「テコ」を使えば、小さな力で巨大な岩を動かすことができます。これを行政に置き換えれば、「最小の入力（インプット）で、最大の効果（アウトプット）を引き出す仕組み」のことです。限られた予算や人員という資源の中で、いかにして市民の皆さんに届く価値を何倍にも増幅させるか。この感覚を持てるかどうかが、これからの北九州市の活力を左右する分かれ目になると確信しています。例えば「労働」におけるレバレッジです。一人でできることには限界がありますが、組織としてスタッフの能力を最大限に引き出し、適材適所で活用できれば、その力は数倍、数十倍になります。リーダーが昇進する喜びの本質は、単に権限を持つことではなく、より多くの仲間の才能をレバレッジして、社会に大きなインパクトを与えられるようになることにあるはずです。「カネ」の使い方も同様です。予算を単なる一過性の「消費」として終わらせるのではなく、補助金や交付金を通じていかに民間の投資を呼び込み、街全体のリターンを最大化するか。パークPFIによる公園整備や、市営住宅・市民センターの多目的利用も、公共施設という既存のストックを「支点」にして、いかに市民の幸福度をレバレッジするかという挑戦に他なりません。私が注力してきた「情報発信」は、まさに現代で最強のレバレッジの一つです。「すしの都」としての発信は、メディアで200回以上取り上げられ、広告換算で億単位とも言われる価値を生み出しました。市の一つのアクションが、メディアというテコを通じて全国に届き、北九州市を「選ばれる都市」へと変えていくのです。次年度からさらに強化する「コンテンツ産業」もこの延長線上にあります。本や映画、プログラミングコードといったプロダクトは、一度作れば複製コストがほぼゼロで無限に拡散します。そこにデジタル技術という強力な「ドライバー（推進力）」が加わることで、拡散力と影響力は桁違いのものとなります。そして、何より、個人にとって最も重く、かつ強力なレバレッジは「信頼」です。誠実な努力と倫理観によって築かれる信頼は、時間をかけて複利のように積み重なり、予期せぬ人脈やチャンスを招き寄せてくれます。その逆もまた然り。信頼は人生において最もレバレッジが効く要素の一つであることを、私たちは肝に銘じなければなりません。インプットの僅かな差がアウトプットにおいて、桁違いの成果の差となって現れる時代です。だからこそ、私たちは「大切な細部」を見極め、「肝心な判断」を的確に行う判断力を磨き続ける必"},
  {vol:132,date:"2026年04月06日(月)",title:"再定義の時代～新年度を迎えるに当たって～",content:"新年度が始まりました。私にとって4回目となる新年度です。この春、新しく市役所に加わった皆さん、そして新天地での活躍を期す皆さんに、心からのエールを送ります。今、私が皆さんに共有したいテーマは、「再定義（Redefinition）」です。物事にはすべて定義、すなわち「それは何であるか」という定義があります。しかし、その定義は固定されたものではありません。これまでの常識や思い込みを排し、光の当て方を変え、ものの見方を変えてみる。そうすることで、今まで隠れていた力が目覚め、街は強い光を放ち始めます。私が掲げてきた「稼げるまち」というコンセプトは、まさにその実践の始まりでした。北九州市には、類まれな産業、インフラ、交通網、そして何より情熱あふれる人材という発展の要素が満ちています。この街を「守るべき場所」から「成長し、富を生み出すプラットフォーム」へと再定義したことで、企業立地投資や物流、そして60年ぶりの人口転入超過など、市政の歴史を塗り替える成果が現実のものとなりました。再定義の力は、文化や公共のあり方にも及びます。かつて否定的に語られがちだった成人式のド派手衣装。私たちはそれを「街の恥」ではなく、若者の創造性とエネルギーの象徴へと再定義しました。その結果、世の中の視線は一変し、今やニューヨークやパリのコレクションに登場するほどの独自の文化価値として世界に認められています。公共施設のあり方も同様です。公園や道路を、単に「ルールに基づいて管理する場所」と捉えるのではなく、「価値を引き出し、市民の営みを豊かにする舞台」へと定義し直しました。民間企業を巻き込み、子どもたちの声を聞き、時には道路を封鎖してパルクールやアートの場とする。管理から活用への転換が、街に新しい風景を生んでいます。私は、今、行政そのものにも再定義が求められていると感じています。私たちは「規制し、管理する存在」ではありません。これからの行政は、挑戦する企業や個人をエンパワー（力づけ）し、エンカレッジ（励ます）するパートナーであるべきです。市民一人ひとりが活動しやすいように「補助線」を引き、デジタル技術を用いたダイレクトリスニングによって、市民の声と直接つながる。それが令和時代の民主主義の形です。世界に目を向ければ、まさに今、「定義」が揺れ動いているテーマもあります。例えば経済における「インフレ」の意味。「物価高」というネガな意味で捉えるのか、賃上げと物価上昇を伴う本来の経済成長のカタチと受け止めるのか。「民主主義」のあり方さえもこれまでの西欧型の民主主義の定義が、権威主義的な民主主義の台頭によって大きく揺れ動いています。これまでの「定義」が通用しない時代だからこそ、「これはこういうものだ」という決めつけを捨てることが不可欠です。職員の皆さん、日々の業務を「こなすべき作業」としてではなく、常に「再定義"},
  {vol:133,date:"2026年04月13日(月)",title:"土木のチカラ",content:"先日、市内の中小企業をはじめとする土木建築業界の皆さんとじっくり膝を突き合わせてお話しする機会がありました。そこで伺ったのは、統計データだけでは見えてこない、現場の切実な、震えるような声でした。いま、業界を取り巻く環境はかつてない荒波の中にあります。財源制約の中での大きなコスト増。緊迫するイラン情勢などの国際情勢がエネルギー価格や資材費を押し上げ、経営の先行きに不安の影を落としています。働き方改革による労働時間の制約は、現場のマネジメントを根底から揺さぶり、指導方法に悩む声も切実です。高齢化や人手不足で技術継承もままならない。「賃上げを進めたくても体力が限界に近い」という吐露には、胸が締め付けられる思いがしました。このまま悪循環に陥っていけば、私たちの街は守れません。大きな公共事業はもとより、老朽化対策、また、災害時に真っ先に重機を出して道を切り拓き、市民の命を守る。その当たり前の日常を支えているのは、他でもない地元の建設土木会社の皆さんでもあります。こうした縁の下の仕事は、同じく現場を支える職種と同様に、まさに「アンノウンヒーローズ（名もなき英雄たち）」と呼ぶべきものです。目立たなくても誰かの日常を死守するその姿は、日本人が古来大切にしてきた誠実で逞しい生き方、まさに「日本人的な仕事」の真髄でもあるような気がします。ただ、私たちは厳しい現実からも目を逸らしてはなりません。もちろん、経済の活性化とともに案件を増やしていくことは必要です。でも、今の時代、ただ守られるのを待つだけではパイは縮小していくばかりです。市内外の競合や大手事業者との厳しい戦いの中で、地元企業自らが技術力を磨き、生産性を高める「負けない努力」も不可欠です。私たち行政も、単なる発注者にとどまらず、技術力強化を後押しし、共に未来への投資を呼び込むパートナーでありたいと考えています。また、次世代の人材確保に向け、ゆめみらいワークや学校での授業など、次世代への種まきも含め、やれることはまだまだあります。現場の皆さんが自らの仕事に誇りを持ち、新しい技術に挑む意欲を燃やせるような、体温のある、政策を形にしていきましょう。「この人たちと一緒に、この街を守っていきたい」と思ってくれる若者たち、子ども達が増えるとともに、共により高みを目指そうという熱意を凝縮していくことこそが、困難を突破する力になると私は信じています。インフラ都市、技術都市、そして土木都市。我が北九州市内の随所にそのアセットがあり、街の輪郭を力強く構成しています。これまでの北九州市の歴史は、こうした先人たちの奮闘、幾多の困難を乗り越えた経験があって、今があります。諦めるのはまだまだ早い。思考を切り替え、大胆に、そしてスピーディーに動いていきましょう。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。【ホンの気持ち】『空、はてしない青/上"}
];

// =============================================
// トピックタグ：手紙が「扱っている具体的なテーマ」
//   → カテゴリをまたいで横断検索するためのもの
// =============================================
const TAG_RULES = [
  { tag: "若者・教育",   kw: ["若者","若い力","Ｚ世代","学力","子ども","教育"] },
  { tag: "女性",         kw: ["女性","Woman","ジェンダー"] },
  { tag: "人口",         kw: ["人口","少子","転入超過"] },
  { tag: "経済・産業",   kw: ["経済","産業","稼ぐ","稼げ","企業誘致","投資"] },
  { tag: "国際・海外",   kw: ["国際","海外","世界","インド","カンボジア","OECD","OECDデイズ","ボン"] },
  { tag: "イノベーション", kw: ["掛け算","新結合","イノベーション","新たな価値","越境"] },
  { tag: "行財政改革",   kw: ["行財政改革","改革","財政"] },
  { tag: "区役所・現場", kw: ["区役所","現場","最前線"] },
  { tag: "文化・芸術",   kw: ["文化芸術","エンタメ","祭り","芸術","アート"] },
  { tag: "読書",         kw: ["読書","ホンの気持ち"] },
  { tag: "スポーツ",     kw: ["スポーツ","オリンピア","パルクール","バレーボール"] },
  { tag: "防災・安全",   kw: ["防災","災害","消防","安全"] },
  { tag: "福祉・医療",   kw: ["福祉","医療","生活保護","介護","障がい"] },
  { tag: "情報発信",     kw: ["メディア","SNS","発信","アテンション","注目"] },
  { tag: "言葉・対話",   kw: ["言葉は","対話","コミュニケーション","伝える"] },
  { tag: "市民との関係", kw: ["市民","市長への手紙","答えは市民"] },
];

function classify(l) {
  const text = l.title + l.content;
  let cat = "その他";
  for (const r of CATEGORY_RULES) {
    if (r.kw.some(k => text.includes(k))) { cat = r.cat; break; }
  }
  const tags = TAG_RULES.filter(r => r.kw.some(k => text.includes(k))).map(r => r.tag);
  return { cat, tags };
}

const data = LETTERS.map(l => { const { cat, tags } = classify(l); return { ...l, cat, tags }; });
const allCats = [...new Set(data.map(d => d.cat))];
const allTags = [...new Set(data.flatMap(d => d.tags))].sort();

let activecat = null;
let activeTags = new Set();
let selectedVol = null;

function renderButtons() {
  document.getElementById('catBtns').innerHTML = allCats.map(c =>
    `<button class="btn${activecat===c?' active':''}" onclick="toggleCat('${c}')">${c}</button>`).join('');
  document.getElementById('tagBtns').innerHTML = allTags.map(t =>
    `<button class="btn tag-btn${activeTags.has(t)?' active':''}" onclick="toggleTag('${t}')">${t}</button>`).join('');
}

function toggleCat(c) { activecat = activecat===c ? null : c; renderAll(); }
function toggleTag(t) { activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); renderAll(); }

function getFiltered() {
  const q = document.getElementById('searchBox').value.trim();
  return data.filter(d => {
    if (activecat && d.cat !== activecat) return false;
    if (activeTags.size > 0 && ![...activeTags].every(t => d.tags.includes(t))) return false;
    if (q && !d.title.includes(q) && !d.content.includes(q)) return false;
    return true;
  });
}

function renderList(filtered) {
  if (filtered.length === 0) {
    document.getElementById('listPanel').innerHTML = '<div class="empty">条件に合うメッセージがありません</div>';
    return;
  }
  document.getElementById('listPanel').innerHTML = filtered.map(d => {
    const dateShort = d.date.replace(/\([月火水木金土日]\)/, '');
    const excerpt = d.content.replace(/\\n/g,'').substring(0, 65);
    return `<div class="msg-item${selectedVol===d.vol?' selected':''}" onclick="selectMsg(${d.vol})">
      <div class="msg-meta"><span class="msg-vol">VOL.${d.vol}</span><span class="msg-date">${dateShort}</span></div>
      <div class="msg-title">${d.title}</div>
      <div class="msg-excerpt">${excerpt}…</div>
      <div class="msg-chips">
        <span class="cat-chip">${d.cat}</span>
        ${d.tags.slice(0,3).map(t=>`<span class="tag-chip">${t}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q) {
  const safeText = escapeHtml(text);
  if (!q) return safeText;
  const safeQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safeText.replace(new RegExp(safeQ, 'g'), m => `<mark>${m}</mark>`);
}

function selectMsg(vol) {
  selectedVol = vol;
  const d = data.find(x => x.vol === vol);
  const q = document.getElementById('searchBox').value.trim();
  const body = d.content.replace(/\\n/g, '\n');
  const highlightedBody = highlight(body, q);
  const highlightedTitle = highlight(d.title, q);
  document.getElementById('detailPanel').innerHTML = `
    <div class="d-header">
      <span class="d-vol">VOL.${d.vol}</span>&nbsp;&nbsp;<span class="d-date">${d.date}</span>
      <div class="d-title">『${highlightedTitle}』</div>
      <div class="d-chips">
        <span class="cat-chip">${d.cat}</span>
        ${d.tags.map(t=>`<span class="tag-chip">${t}</span>`).join('')}
      </div>
    </div>
    <div class="d-content">${highlightedBody}</div>`;
  renderList(getFiltered());
  document.getElementById('detailPanel').scrollTop = 0;
  // 最初のハイライト箇所へスクロール
  const firstMark = document.querySelector('.detail-panel mark');
  if (firstMark) firstMark.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function renderAll() {
  renderButtons();
  const f = getFiltered();
  document.getElementById('resultCount').textContent = `${f.length} 件表示中（全${data.length}件）`;
  renderList(f);
}

function clearAll() {
  activecat = null; activeTags.clear();
  document.getElementById('searchBox').value = '';
  renderAll();
}

document.getElementById('searchBox').addEventListener('input', renderAll);
renderAll();
</script>
