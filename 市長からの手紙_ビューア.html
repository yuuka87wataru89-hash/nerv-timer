<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市長からの手紙 ── メッセージ一覧</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; background: #f0f2f5; color: #333; }
header { background: #1a3a5c; color: white; padding: 14px 24px; display:flex; align-items:center; gap:12px; }
header h1 { font-size: 18px; font-weight: bold; }
header span { font-size: 12px; opacity: 0.7; }
.controls { background: white; border-bottom: 1px solid #ddd; padding: 10px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.07); }
.search-row { display: flex; gap: 8px; margin-bottom: 9px; }
#searchBox { flex: 1; padding: 7px 11px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
#clearBtn { padding: 7px 14px; background: #666; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
#clearBtn:hover { background: #444; }

.filter-row { display:flex; gap:20px; align-items:flex-start; }
.filter-section { flex:1; }
.filter-label { font-size: 10px; color: #888; margin-bottom: 4px; font-weight: bold; letter-spacing: 0.6px; display:flex; align-items:center; gap:5px; }
.filter-label .badge { padding:1px 6px; border-radius:8px; font-size:10px; font-weight:bold; }
.cat-badge { background:#1a3a5c; color:white; }
.tag-badge { background:#d35400; color:white; }
.filter-desc { font-size:10px; color:#bbb; margin-bottom:4px; }
.btn-group { display: flex; flex-wrap: wrap; gap: 4px; }
.btn { padding: 4px 11px; border: 1px solid #ccc; border-radius: 16px; background: white; cursor: pointer; font-size: 12px; transition: all 0.12s; white-space:nowrap; }
.btn:hover { border-color: #1a3a5c; color: #1a3a5c; }
.btn.active { background: #1a3a5c; color: white; border-color: #1a3a5c; }
.btn.tag-btn { border-color: #e0a898; }
.btn.tag-btn:hover { border-color: #d35400; color: #d35400; }
.btn.tag-btn.active { background: #d35400; color: white; border-color: #d35400; }
.result-count { font-size: 11px; color: #aaa; margin-top: 5px; }

.main { display: flex; height: calc(100vh - 195px); }
.list-panel { width: 390px; min-width: 260px; overflow-y: auto; border-right: 1px solid #ddd; background: white; }
.detail-panel { flex: 1; overflow-y: auto; padding: 24px 30px; background: #fafafa; }

.msg-item { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
.msg-item:hover { background: #f5f8fd; }
.msg-item.selected { background: #e6eef8; border-left: 3px solid #1a3a5c; padding-left: 11px; }
.msg-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
.msg-vol { font-size: 11px; font-weight: bold; color: #1a3a5c; }
.msg-date { font-size: 10px; color: #ccc; }
.msg-title { font-size: 14px; font-weight: bold; color: #111; margin-bottom:3px; }
.msg-excerpt { font-size: 12px; color: #999; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom:5px; }
.msg-chips { display: flex; flex-wrap: wrap; gap: 3px; }
.cat-chip { font-size: 10px; padding: 1px 7px; border-radius: 8px; background: #deeaf8; color: #1a3a5c; font-weight:bold; }
.tag-chip { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #fdebd0; color: #d35400; }

.d-header { margin-bottom: 22px; border-bottom: 2px solid #1a3a5c; padding-bottom: 14px; }
.d-vol { font-size: 13px; color: #1a3a5c; font-weight: bold; }
.d-date { font-size: 13px; color: #aaa; }
.d-title { font-size: 22px; font-weight: bold; margin: 8px 0 10px; color: #1a3a5c; line-height:1.3; }
.d-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.d-content { font-size: 15px; line-height: 2.1; color: #333; margin-top:20px; white-space: pre-wrap; }
.empty { padding: 50px 20px; text-align: center; color: #ccc; font-size: 15px; line-height:2; }
.divider { width:1px; background:#eee; margin:0 4px; }
mark { background: #ffe066; color: #111; border-radius: 2px; padding: 0 1px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>📬 市長からの手紙</h1>
    <span>北九州市長 武内和久 ── メッセージアーカイブ</span>
  </div>
</header>
<div class="controls">
  <div class="search-row">
    <input id="searchBox" type="text" placeholder="タイトル・本文をキーワード検索...">
    <button id="clearBtn" onclick="clearAll()">リセット</button>
  </div>
  <div class="filter-row">
    <div class="filter-section">
      <div class="filter-label">
        <span class="badge cat-badge">カテゴリ</span>
        手紙の「切り口・性格」で絞り込む（1通に1つ）
      </div>
      <div class="btn-group" id="catBtns"></div>
    </div>
    <div class="divider"></div>
    <div class="filter-section">
      <div class="filter-label">
        <span class="badge tag-badge">トピック</span>
        扱っているテーマで絞り込む（複数選択可・AND条件）
      </div>
      <div class="btn-group" id="tagBtns"></div>
    </div>
  </div>
  <div class="result-count" id="resultCount"></div>
</div>
<div class="main">
  <div class="list-panel" id="listPanel"><div class="empty">読み込み中...</div></div>
  <div class="detail-panel" id="detailPanel">
    <div class="empty">← 左のリストから<br>メッセージを選んでください</div>
  </div>
</div>
<script>const LETTERS = [
  {vol:1,date:"2023年02月27日(月)",title:"ベクトルを合わせよう",content:"皆さん、おはようございます。２０日の市長就任から１週間が経ちました。予算編成、政策レク、福岡市とのトップ会談など、早速色んな動きに着手していますが、一生懸命に支えてくださる皆さんに心から感謝いたします。皆さんと一緒に市政を展開できることを誇らしく思います。今後、この場を通じ、私自身が考えていること、大事にしている視点、皆さんへのメッセージを定期的にお伝えしたいと思います。これから、心をひとつに、”ベクトル”を合わせて市政を進めていきましょう。（ぜひ、就任初日の「職員挨拶」の動画や内容も、ぜひお目通しくださいね。）今回は「ベクトルを合わせよう」ということをお伝えします。すべての仕事や事業には「意図」や「企み」があります。どういう”目的地”に向かおうとしているのか。そこが大切です。例えば、市長としての面会やアポイントのご依頼。先週だけでも沢山いただきました。もちろん、多くの方にお会いしたい。多くの場所を訪れたい。多くの声を聴きたい。でも、私もひとりの人間、有限の１日２４時間しかありません。そして、市民の皆さんに選んでいただいた私には、一秒たりとも足踏みをすることは許されません。皆さんとともに、常に、学び、ことを進め、市民の皆さんに還元しなければいけない立場なのです。だからこそ、漫然とご挨拶や顔合わせするのではなく、どんな「意図」があるのか、どう活かしていくのか。それを考え、ホンネで私に伝えて下さい。すべてにおいて、「方向感」と「優先順位」は大切です。各地への挨拶廻りにも、私なりの「意図」があります。ただ会うだけでなく、次のステップへの種まきであったり、具体的なアクションの約束だったり。皆さんも、「こんなことを話してほしい」「こんなアウトプット（成果）を出してほしい」ということを私に知恵だししてください。皆さんと私の大切な時間と労力が、”北九州市を前に進めること””真に市民の皆さんの笑顔につながること”のために使われるよう、力を合わせていきましょう。私たち北九州市役所は、”市民の皆さん”にとことん集中し続けます。目先の各方面からの反応や波風立てないことよりも、子や孫たちに自慢できる北九州市を創ることに照準を合わせて、政策判断を行い続けましょう。事業を運営しましょう。皆さんひとりひとりが、この北九州市役所という大きな船の乗組員です。ときには、激しい風も、嵐も、大波もあるでしょう。でも、波光きらめく日も、爽やかな風を味わえる日もきっとあります。元気で明るく、活気ある北九州市という”目的地”に向かって「ベクトル」を合わせていきましょう。北九州市なら、必ず、できる。皆さんの奮闘に心より感謝します。"},
  {vol:2,date:"2023年03月06日(月)",title:"掛け算でいこう",content:"皆さん、おはようございます。市長就任２週目は、北九州市・福岡市のトップ会談、北九州空港滑走路3000m化の前進など、前向きな動きのある週でした。就任後初の定例記者会見も。一生懸命に支えてくださる皆さんに心から感謝いたします。今回は「掛け算でいこう」ということをお伝えします。私は「全国で最も視察が集まるまち」というビジョンを掲げました。このためには、全国に先駆けて「新たな価値」を生み出し続ける市役所でありたいのです。行政に身を置くと、「自分の庭はキレイに」、つまり所掌範囲なら責任持つが、いったん外れた話だと関係なし、関わると調整が生じて面倒、という感覚がどうしても生まれます。皆さんの責任感の裏返しでもありますが、ともすれば内向きな発想につながります。私は、この発想を変えたい。異なる分野どうし、異なる業界どうし、異なる都市どうし、それぞれの違いを「掛け合わせる」ことによって、新しい発想が、イノベーションが、生まれるのです。イノベーションの父と言われる経済学者シュンペーターが「これまで組み合わせたことのない要素を組み合わせることによって新たな価値を創造すること」を「新結合」＝イノベーションと定義しました。まさにこれです。iPhoneは電話とパソコンを掛け合わせたことから生まれました。身近なところでは、「寿司×ベルトコンベア＝回転寿司」「イチゴ×大福＝苺大福」なんて例もありますよね。「掛け合わせる」ことによって新しい「価値」が生まれます。そこに、驚きや面白さが生まれます。悩ましい課題への新たな解決策が生まれます。人生を懸けて仕事するなら、自分なりのアイデアを新しいカタチにできれば嬉しいですよね。ぜひ、そんなチャレンジをしてください。別の部署の所掌が関わってきても、こちらから提案するくらいの気持ちで。うまく行かないなら、私のところに持ってきてください。福岡市とのトップ会談、そして連携も、その発想のひとつ。互いの強みや、特長をシェアして、「掛け算」をして、新しい事業や仕事の仕方を生み出していきましょう。政令市どうしがガッチリとタッグを組むことなんで、日本で初めてではないでしょうか。うまく、互いに活かしあって、面白い仕事を創り出しましょう。これだけ、市民おひとりおひとりの経済的・社会的課題が複雑化している時代、変化が激しい時代です。固定した組織の枠組みや所掌、官民の垣根があるままでは、こうした課題に柔軟かつ迅速に対応できません。すべては、「市民の方を向いて仕事をする」ためなのです。もう一度。足元は大事です。今進めている仕事も、もちろん大事です。それでも、「掛け算でいこう」を意識してください。北九州市なら、必ず、できる。皆さんの奮闘に心より感謝します。"},
  {vol:3,date:"2023年03月13日(月)",title:"ピンチがチャンス",content:"皆さん、おはようございます。先週も、色んな動き（仕込み）が始まり、行財政改革に向けた官民連携準備チームも立ち上がりました。議会への準備にも皆さんに骨を折っていただいています。確実に、「未来志向」の仕事が始まりつつあります。一生懸命に支えてくださる皆さんに心から感謝いたします。今回は「ピンチがチャンス」ということをお伝えします。最近は、若手職員とのランチ会はじめ、コミュニケーションが進んでいます。そんな中で少し気になることは、「こうしないとああしないと」「こういう難しさがある」と言う言葉が多く聞かれることです。課題認識を持つことは大切です。ボーっと生きてない証拠です(笑)。誠実な証拠です。解決策の９０％は課題の設定に左右される、とも言われます。おまけに、メディアなどでは、北九州市は課題の多いまちだ、と紋切型で言われることがあります。人口減少、高齢化、若者の流出、産業の衰退、財政難などなど。しかし、「ピンチ」こそ面白い、と考えてみてください。私自身は、いつも、課題があるからこそ歯ごたえがある、逆に面白いと思うようにしています。日本の歴史を見ても、明治維新、先の戦争、幾次の震災など、はっきりしたピンチがあるときに、日本人は、その復元力（レジリエンス）を発揮して、知恵を出して、乗り越え、新しい時代を創ってきました。北九州市だってそうです。公害の問題など、厳しい状況を市民の力で乗り越え、チャンスに変えてきたＤＮＡがあるのです。私がある企業で働いていたとき、その同僚たちは、口を揃えて、「難しい課題こそ大好物」「問題を解くのが楽しいよね」と言葉に出し合っていました。そんなマインドセット（気構え）が、組織を明るく、活力あるものにしていたことを覚えています。そこまでいかなくとも、業務の中で、政策課題の中で、難しいこと、うまくいかないこと＝「ピンチ」があれば、それが「チャンス」だと考えて立ち向かいましょう。「チャンス」ということには３つの意味があります。第一に、ピンチであればあるほど、必死に考え、これまでの延長線上の発想では出てこないアイデアが生まれる可能性が高まります。つまり、いい知恵が出る「チャンス」なのです。第二に、ピンチで仲間たちと苦労して汗かいて助け合っていくと、後で振り返ったときに、とてもいい仲間ができることになります。ピンチのときの苦労こそ、本当の仲間ができる「チャンス」なのです。第三に、ピンチのときほど、一所懸命、経験したことのない課題にチャレンジし、新しいものの見方や考え方、そして勘と度胸まで培われることになります。まさに、１人のプロとして成長できる「チャンス」なのです。『世の中には福も災いもない。ただ考え方でどうにでもなるものだ。』（シェイクスピア）『人生は近くで見ると悲劇だが、遠くから見れば喜劇である。』（チャップリン）この心意気でいきましょう。北九州市な"},
  {vol:4,date:"2023年03月20日(月)",title:"北九州市のポジションを探せ",content:"皆さん、おはようございます。２０日の市長就任からちょうど１か月。早く各部局とお話しする機会を一巡したいと思っていますが、本当に大きな市役所ですので、未だの部局はもう少しお待ちくださいね。また、各区役所もなるべく早く回りたいと考えています。先週は、市議会の議論も始まりました。多くの市民の方が傍聴やネット配信をご覧になっており、私のもとにも市民の皆さんから様々な感想が寄せられています。改めて、”新しい”北九州市づくりへのご期待をひしひしと感じております。皆さん、一緒に市民の皆さんの期待に応えていきましょう。報道によると、今、新型コロナの影響が弱まり、再び人口の東京圏への一極集中が強まっているようです。同時に、東京都そのものではなく、その周辺３県への転出超過が止まらないそうです。その動きの中心は、子育て世代。子育て環境、生活コスト、住宅費の高騰が続く東京都から周辺３県に昨年だけで24,800人の転出傾向が見られるそうです。他方、東京圏以外で、転入超過を実現している中には、長野県と茨城県があります。交通の利便性と割安な住宅費が魅力で、子育て世代とシニア層も流入しているとのこと。既存の住宅をうまく活用して、人口の受け皿となっているようです。さて、こういう状況やトレンドを見ながら、北九州市の「ポジショニング」をどう取るかをもう一度考えていくときです。北九州市には、北九州都市圏そのものがあると同時に、隣に大きな福岡都市圏もあります。下関との関係性もあります。こうした中で、北九州市のインフラの充実度、生活環境の良さ、災害の少なさなどを武器にして、どう人と企業を呼び込むか。その戦略をできるだけ早く一緒に検討し、形にしていきたいと思います。「ポジショニング」（英語：Positioning）とは、競合との差別化を図り、アピールできるような自らの”価値”を決めるプロセスのこと。つまり、「子育てなら〇〇市」「シニアがお金使うなら▲▲区」「女性が愉しめるのは◇◇町」というように、住民の方の心の中に明確なポジションを構築する施策を意味します。そこをエリアごとに考えていきましょう。北九州市には、色とりどりの７区があります。その多様性がかえって北九州市の色合いを見えにくくしている面もありますが、だからこそ、こんなに面白い街はないと思います。福岡市とどう差別化するのか。下関市や東九州軸とどう活かしていくのか。その総合体としての「北九州市」をどう位置付け、どう発信していくのか。そんな視点をあらゆる政策分野で意識してみてください。皆さんとの議論を重ねながら、また、これまでの歴史と特性を見ながら、北九州市の新たな「ポジション」を描き出していきたいと思います。間もなく、職員の皆さんからの提案箱もオープンします。どんどん、未来志向の提案があふれる、自由にアイデアを交わしていける、そういう北九州市を創って"},
  {vol:5,date:"2023年03月27日(月)",title:"「やっている",content:"と「やれている」』皆さん、おはようございます。私自身初めての議会が終わりました。補正・暫定予算案、給与カット、副市長人事など議案はすべて可決いただき、無事動き出したこと、各部局のサポートに感謝です。議会が終わると、早速、本予算に向けてのヒアリングもスタートました。各部局と早速、具体的な政策案の議論を開始しています。議会では、様々な質問を通じて、「まちの課題」「市民の願い」「見落としがちな論点」が提示される場だと改めて感じました。物価高騰で困っている事業者の方のこと、老朽化した医療施設のこと、エリアの今後の発展のことなど、色んな論点の所在を知ることができました。そうした問題意識に応えるには、財源確保が要ることも多く、即答で色良い答弁ができないことが少なくありません。それでも、とりあえず受け流す、いなす、弁明する、ということで終わらないよう、真っ当な論点提示には、正面から答えていく道を探すよう、各部局で検討いただきたいと思います。私の２２年間の官僚生活とその後のビジネス経験を比較したとき、誤解を恐れずに言えば、一般論として、行政には、「エクスキューズ（言い訳）事業」が多いと感じます。つまり、議会などで「やっている」と答弁できる事業があっても、本当に成果を出す、費用対効果を出すところまで出来ているのか、すなわち「やれている」と言えるかどうか。そこが問題です。「やっている」と「やれている」には距離があるのです。例えば、「若者の市内定着策」という政策ひとつとっても、色んなメニューが考えられます。イベントしたり、生活支援金出したり、企業とマッチングしたり、相談窓口つくったり、などなど。それらは、得てして、こういうことを「やっている」とは答弁する“よすが”にはなり得ますが、本当に成果が出るところまで「やり切る」ことが出来ているか、疑問も残ります。「やっている」と「やれている」の違い。この点についての感覚を研ぎ澄ませてください。ビジネスの世界では、「とりあえずやっているので大丈夫です」は通用しません。掛けたコストに応じて、どれだけの成果が出ているのか。PR広告や営業を掛けても、コストに見合う成果を生んでいるのかシビアに見られます。いま、まさに予算のヒアリングを行っていると、ひとまず「やっている」と言えそうな事業の提案も散見されます。これをやっておけば取り敢えずは批判されないだろう、やっていることにはなる、という罠に陥っていないか。しっかり見ていきたいと思います。掛けた費用や事業の構えにふさわしい成果を出せているか、費用対効果を検証すること、そして、予め立てた目標（できる限りストレッチ目標が望ましい）に到達しているか。そこを見てください。もちろん、目先の費用対効果だけでなく、長期スパンでの投資効果を見るべき事業もあります。そうした性格の違いはあっても、しっかりと掛けた財源と時"},
  {vol:6,date:"2023年04月03日(月)",title:"メガ・リージョン",content:"皆さん、おはようございます。新年度を迎え、今日から新たな場所でスタートを切られた方も多いでしょう。これからの１年で、どんな“足跡”を残し、どんな成果を生み出すのか、ぜひ強く心に描いていただきたいと思います。新たな人間関係や仕事の枠組みの中で、フレッシュなアイデアや政策が紡がれることを願っています。さて、日曜日に放映されたＮＨＫ「日曜討論」を見ました。『若手論客が考えるこれからの社会は』というテーマで２０代の若者を中心に議論が交わされていました。それを見て、正直、少々ショックを受けました。大づかみに言うと、「果たして経済成長がどこまで必要なのか」「人口減少や経済縮小を前提とした社会づくりが現実的」といった趣旨の発言が多かったように感じました。確かに、今の２０代は、産まれてこの方、日本の発展や成長を見ることなく歳を重ね、縮小していく社会を受け容れざるを得ないのが常識なのかもしれません。未来へ夢を描き、若き血潮をたぎらせるような可能性を実感できなくなっているとしたら、それは、他ならぬ私たち上の世代の責任です。「自分の国の将来についてどう思っていますか？」という１８歳意識調査の結果では、「良くなる」と答える者の割合はトップの中国（９６．２％）インド（７６．５％）に遠く及ばず、日本は最下位（９．６％）で、ワースト２位のドイツ（２１．１％）の半数もありません。これでは、まちにも、人にも、国にも、元気が出ません。そして尻すぼんでいくとすれば、未来はありません。若者たちが夢とガッツを持てるような、上の世代の姿勢とチャレンジと、未来像の提示が必要と強く思います。今年度は、北九州市にとっても、大きな「ベクトル合わせ」の年としましょう。新ビジョンとなる基本構想の策定や成長戦略の描出、そのエンジンとなる行財政改革など、新たな未来像の提示を行う大切な一年です。叡智を結集して、北九州市の未来を力強く描き、動き出す年としましょう。北九州市の成長を考える上で、重要な視点のひとつとして、私は、「メガ・リージョン」（大都市とその周辺都市で構成される経済社会圏域）の構築を挙げたいと思います。数多く分立している自治体（特に福岡県は多い！）が個別にインフラ整備し、人材育成し、閉じた世界観を持つのではなく、都市どうしが合従連衡し、「リージョン」として、経済社会活動を行うことこそ、いま必要なことです。その意味で、私が就任後早速動いた「北九州市と福岡市」「北九州市と下関市」の連携、そして北九州都市圏の枠組みこそ、この「メガ・リージョン」＝北部九州エリアを構築していく道筋だと考えています。都市間の連携により、スケールメリットや役割分担を利かせて、ウィンウィンの関係を創ることが期待できます。例えば、先週記者会見もした北九州空港の滑走路延長の動きが、福岡と北九州の空港間の相乗効果や棲み分けを進めることにもつなが"},
  {vol:7,date:"2023年04月10日(月)",title:"異質こそチカラ",content:"皆さん、おはようございます。新年度が始まり、新たな職務、新たな同僚、新たなタスクとの向き合っておられると思います。市長室にも、様々な企業団体などから着任ご挨拶にお見えいただいています。新顔の皆さんとどんな協働が出来るのか楽しみです。新たな人や仕事と組む際には、異なる価値観、異なる感覚、異なる視点に面食らうこともあるでしょう。慣れ親しんだ人間関係や仕事の仕方を変えるのはストレスかもしれません。しかし、そういう局面こそ、面白く、組織を成長させるチャンスです。「異質こそチカラ」と考えていきましょう。先週から、片山さん、大庭さんという２人の新任の副市長が誕生しました。稲原さんとともに、３人の副市長の顔ぶれを見ると年齢も、得意分野も、キャラも異なります。だから私は心強く、面白いと考えています。人生でも仕事でも会議でも、“予定調和”は退屈なものです。副市長３人とともに、新たな市政の方向付けを前向きに打ち出していきます。さて、私自身、４０歳のときに、官僚の世界から、外資系企業（マッキンゼー）に飛び込んだ経験があります。ビジネスも、稼ぐことも、営業も、すべて初めて。思考回路も使用言語も、そしてスピード感も、それまでとはまったく異なる世界でした。企業にとって私は完全に「異質」な存在。役所で２０年も培った自分の言葉や論理が全く通用しないことを入社１週間で痛感し、私は精神的に少々ダメージを受けました。この企業は自分の居場所ではないとも思いました。しかし。若いスタッフを中心に、色んな同僚が次々と私に話しかけて来てくれました。そして、私の語る行政の世界の思考回路、使用言語、振る舞い、を極めて面白そうに、興味深そうに、聞いてきたのです。「そんな風に考えるんですね」「その言い回し、どういう意味ですか」等々。その企業では、「多様であること」をとても重要視していることを体感しました。そして、社是のひとつであった”respect each other（互いにリスペクトする）”が具体化されていることに感銘を受けました。人それぞれ、みんな違います。それでも、だからこそ、年齢やポストの上下に捉われず、互いの違いをリスペクトし合う。それによって、新たな知見やアイデアが生まれるし、何より各人が成長できる、結果として組織が強くなる。その考えが組織内に浸透していました。どんな巨大組織であっても、人は機能を担う“部品”ではありません。１人の“人間”として深いレベルで価値観を認め合い、リスペクトし合うことを求めているし、それが職業を通じて全スタッフが幸福になる途だと痛感した経験でした。ぜひ皆さん、「異質こそチカラ」と心得て、異なることを楽しみ、面白がり、活用し、取り込んでいきましょう。それは、庁内の同僚でも、組織外の民間企業でも、土地ごとの違いでも、見知らぬ技術でも、そうです。“異質なもの”にオープンであり、フ"},
  {vol:8,date:"2023年04月17日(月)",title:"東京出張で考えたこと",content:"皆さん、おはようございます。新年度の事業執行と予算の検討など精力的に動いておられると思います。ありがとうございます。さて、先週木曜金曜と、東京へ出張し、霞が関や永田町、丸の内、そして企業誘致に向けたトップセールスなどを行ってきました。その中で印象に残ったことをシェアしたいと思います。国土交通省や総務省、厚生労働省の事務次官はじめ幹部の方と面会しました。その中では、「北九州市は動き始めてますね、いま注目されていますよ。」「応援の気持ちも込めてますから、ぜひ有効に使ってくださいね。」「全国に空港は数あれど、北九州空港のように、未来が拡がる空港は珍しいですよ。」「いい人材を送り込んでいるので、しっかり使ってくださいね。」等々。たいへん有難いエールをいただきました。いま、確実に、北九州市は、国からも注目されつつある“動きのある都市”への第一歩を踏み始めています。これまでの皆さんの努力がカタチになりつつあります。ぜひ、この追い風をしっかり捉えていかねばならないと思いを新たにしました。他方、経団連の幹部との面会では、昨今のＤＸをめぐる動き、九州経済をどう見ているか、北九州市との情報や人材の交流の可能性などについて意見交換しました。その中では、ぜひ、北九州市とも連携していきたいという言葉の一方で、「東京から見ると、北九州というのが都市なのかエリアなのかも知られていない。北九州市も福岡市も、こちらから見ると一体的に見えます。一緒に動くのも有効ですよ。」「まず、北九州市はコレが売りだ、尖りだ、という明確なものを打ち出してください。東京には、北九州市が何を目指している都市なのか伝わってきていません。それがないと全国数多くの都市の中で埋没してしまいます。」こうした課題は、十分分かっていたつもりですが、改めて指摘され、再認識しました。「北九州市とは、〇〇〇の都市だ」これこそ、私たちが今、明確に打ち出さなければならないことです。“井の中の蛙”になってはなりません。目先の事業やプロジェクトを回すことで安堵してはなりません。北九州市という９２万人もの規模の大都市が、どこへ向かうのか、何を“北極星”として進んでいくのか、令和５年度中には、明確化できるよう、ともに考えていきましょう。もちろん、市長である私自身が考える“都市像”もありますが、それをトップダウンで降ろすだけではなく、市役所全体で考えていきたいと思います。なぜなら、与えられた都市像では、自分ごととならず、皆さんのベクトルが本当の意味で同じくならないと考えるからです。まずは皆さんの部署や、担当する業務について、「北九州市は〇〇を目指しています」「この分野での北九州市ならではの尖りは〇〇です」と表現するとしたらどうなるか、考えてみてください。言語化してみてください。周りとディスカッションしてみてください。北九州市から全国にも伝わる“メ"},
  {vol:9,date:"2023年04月24日(月)",title:"改革が始まった",content:"皆さん、おはようございます。連日、多くの案件のレクチャーで新年度の事業展開を体感しています。また、先週は区役所訪問で第一線の皆さんのアンテナの高さと地域課題解決への思いに触れ、感動しました。ありがとうございます。さて、私は、市長就任に当たって「行財政改革」を掲げてきました。スピーディに官民合同チームも立ち上がり、具体的な改革への動きが加速しています。「改革」というと、「予算を削る」「事業を縮小する」はたまた「人員や給与のカット」などドライな印象を持たれがちです。私自身も、官僚時代、「改革」の名の下に、予算のシーリング（キャップ制）や事業仕分け（公開での事業カット議論）などの経験を何度もしてきました。基本的に予算カットを目的として、「この事業は要らない」「効果がない」とバッサリやられたことは一度や二度ではありません。行政というのは、その成果を売り上げや収益率のように数字で測れないものも多く、また様々な背景や事情もあります。トップである大臣が政治アピールの為にやっているのではないか、と思いたくなるケースもありました。行政が担う実際の関係者との調整や合意形成は、簡単でないことを身に沁みて理解しています。でも、だからこそ、「希望を配る改革」を行いたいと思っています。「削る」だけが目的ではありません。「ダイエット」ではなく「シェイプアップ」することが目的。行財政のあり方を“筋肉質”にしたいのです。その意味で、「財政の模様替え」という表現も用いています。今の時代性に合わせて、必要なところに必要な予算を回す、本当にやるべき政策にリソース（財源や人材等）を回していく、それが「改革」の本旨です。もちろん、北九州市の財政は厳しいです。市民１人当たり市税収入と市民1人当たり市債残高は政令市の平均以下。財政力指数と経常収支比率はほぼ最下位という状況。強い危機感を持っています。しかし、「削る」ことだけでそれを解決してはなりません。それは単なる“縮み志向”です。一部の方々からは喝采を受けるかもしれませんが、私は、将来への投資―将来の人材、産業、地域づくりへの投資―に財源を回すことで、“成長の種”を撒きたいのです。時には思い切った投資を先行させて「損して得取れ」の発想も必要でしょう。あくまで思考実験ですが、例えば、人口が減ったからバスの路線を減らすのではなく、むしろ思い切った料金引下げや路線充実によって、経済活性化を図る、といった発想が必要なこともあるでしょう。ですから、皆さんには、「萎縮しないで」「発想の転換を」お願いします。今、粛々と継続されている事業が本当に街の活力や成長性に繋がっているのか、その観点から見直してほしい。もっと尖った事業に、効果的な、インパクトある事業にするにはどうしたら良いか。“事業のための事業”になっていないか。その意味で、しっかりと費用対効果、つまり、事業実施"},
  {vol:10,date:"2023年05月01日(月)",title:"スイッチを切り換えよう",content:"皆さん、おはようございます。GWですから、休暇中の方も多いかもしれませんね。新年度の４月は新たな人間関係の中で気づかぬ疲れが出るものです。ご家族らと、美しい自然やモノに触れて、リチャージ・リフレッシュしてください。また、予算作業では、連日、精力的に検討を進めていただいています。今年度はイレギュラーな内容・時期となりますが、新しい市政の実現へ、力を合わせていきましょう。ありがとうございます。さて、今回は、「スイッチを切り換えよう」ということを伝えます。私が１６年ぶりに新市長に就任し、市民の皆様の“新たな市政”への期待と注目が集まっています。東京に出張して企業や官庁を廻っても、「北九州市は面白くなりそうですね」とご期待の声をいただきます。これまでの市政と何が変わるのか？私が選挙公約や就任後の議論を通じて示してきた考え方やビジョンも踏まえていただく必要がありますが、それぞれの担当分野でとことん考えてください。政策や事業の“スイッチ”をどう切り換えるのか。どう野心的なチャレンジができるのか。私はそこを重視します。勿論、行政には、継続性も過去からの蓄積も大切です。ガラガラポンで全部変えると混乱を招きます。私自身の経験でも、行政というのは、議会や団体との“板挟み”、色んな意見の中で“合意形成”のカベにぶつかります。いきおい、うまく立ち回って、意見をまとめて、スケジュールまでに仕上げる＝“着地させる”ことが評価されがちになります。でも、そのための一番いい方法は何だか分かりますか？それは「過去からの延長線上」で考えることです。前例があるから関係者も安心するし、説得しやすい。つまり、“波風が立たない”のです。例えば、予算案なら前年のものを継続・拡充、少しだけ少額の新味を付けて市民啓発とかＰＲ事業をしてみようか、という誘惑に駆られます。しかし！！私は、これを変えたい。皆さんの心の奥底に確かにある“想い”と“志”を呼び醒ましたい。皆さんの“心の奥に秘めていた違和感”“本当は実現したい価値観”を掘り起こして欲しいと強く願っています。「過去からの経緯があるしなあ」「誰それから言われているしなあ」「労力も時間もないしなあ」・・・そこで思考停止しないこと。それを強く求めます。これまでの発想や仕事の進め方の“スイッチ”を切り換えてください。私が就任後繰り返してきた言葉は、「挑戦する市政をしよう。」「できない理由ではなく、できる理由を語ろう。」「北九州市オリジナルの施策を創ろう。」ということです。決められた作業を、決まったプロセスで、締切までにとりまとめる、いわゆる「ロジ」は大切ですが、それで満足せず、ぜひ、思い切った大胆なアイデアや発想に挑戦してみてください。饅頭の皮でくるむことに満足せず、あんこをどれだけ美味しく、心動かすものにできるかに、心を尽くしてください。私の官僚時代にも、よく聞い"},
  {vol:11,date:"2023年05月15日(月)",title:"ファクト！ファクト！ファクト！",content:"皆さん、おはようございます。GW明けの１週間、ぐっと陽射しも強くなり、夏の訪れを感じますね。特に晴れた日は実に気持ち良い季節です。先週前半は、韓国出張（仁川）に行きました。北九州市との姉妹都市締結３５周年。今や国際ハブ空港として飛躍する仁川空港、ソンド（松島）地区の摩天楼とテクノロジーの活用など、大いに刺激を受けました。そのダイナミックでスピード感ある“変化”を体感することで、まだまだ日本が、北九州がやれることは大きいぞと、負けてはおられない、と強く思いました。職員の皆さんにも、極力、仁川を訪れていただく機会を作っていきます。“世界を意識する北九州市”へと、アンテナを高くしていきましょう。さて、今回は、「ファクト」を重視しよう、ということをお伝えします。「～～らしいよ」「だいたい～～でしょ」世の中のほとんどは、嘘を含め、噂話や先入観で出来ています。「虚実」という言葉がありますよね。「虚」が先に来ているように、世の中には「実」の方が少ないものです。自分の知識のアップデートを怠っていながら、「世の中こんなもんだ」「北九州市ってこういうところだ」と分かったような気持ちになったり、会話を一般論で片づけたりしていませんか？そこが危険です。例えば、「子育てしやすいまちNo.1の北九州市」と言いますよね。その評価は、それ自体、素晴らしいこと。でも本当ですか？どういう要素が評価されているのでしょう？まだ足りないところがないですか？「なんとなく」の会話で終わらせるのではなく、様々な指標やデータで、北九州市の立ち位置を明確に意識しなければ、本当の有効な施策は打てません。予算査定の場面で、私はよくこういう質問をしました。「他の政令市と比べて北九州市の状況は？」「過去からのトレンドではどう推移している？」「その原因は何？」残念ながら、適切な指標やデータをスパスパと答えられるケースは数少なかったと感じました。「おそらく、悪い方ではないと思いますが・・・」「だいたい、こういうことが理由ではないかと・・・」ザックリとした印象では、議論になりません。“ファクト”をしっかりつかんで、それに基づいて議論したいのです。そうでなければ、本当の市民の皆さんのニーズや困りごとに応えることはできません。もちろん、長年の経験や勘は大事です。でも、常に時代は変わり、環境は動いています。そんな中で、北九州市がどういう状況にあるのか、それを語ってくれるのは“ファクト”しかありません。“ファクト”があって初めて、私たちは現実と向き合うことができます。有効な打ち手を考えられます。説得力を持って市民に説明することができます。“当てずっぽう”ではいけないのです。「世の中の９割は思い込みでできている。」その位の気構えでいることが大切だと思います。一方、データなどの“ファクト”を見渡してみることで、「あっ、こんな傾向がある"},
  {vol:12,date:"2023年05月22日(月)",title:"評論家に負けるな",content:"皆さん、おはようございます。ちょうど良い気温の中で新緑を楽しむのは気持ちいいですね。ビアガーデンに行きたくなります。先週前半は、東京出張でした。IT企業誘致や物流企業との協議など、多くの動きがカタチになっていること、皆さんに感謝します。これからは、“北部九州圏”を塊ととらえ、そのハブとしての北九州市を国内や世界にアピールしていきます。また、予算編成作業では、財政局はじめ各局の皆さんの精力的な取組に感謝します。さて、今回は、「評論家に負けるな」ということをお伝えします。かつて、長年北九州市を熟知し、日本も世界もご存知のある“重鎮”の方からこう言われたことがあります。「ひとつだけアドバイスをしよう。北九州という街は、実に評論家の多いまちだ。それに負けるなよ。正しいと思うことを貫け。」この“評論家”が多いという助言は心に留めるようにしています。私も、若かりし頃、中央省庁で、必死に汗かき政策を進めていたとき、本当に色んな角度からの批判や指摘を受けてきた経験があります。なるほど、と思う指摘もあれば、「そんなに言うなら、代わりにやってよ」と思いたくなることもありました。皆さんも行政マンとして、責任ある立場で実務や現場を抱えている立場、だからこそいろんな“評論”に晒されていることと思います。もちろん、“評論”も大事です。新たな視点や気づきをくれます。それでも、冒頭の“重鎮”からの助言をもう一度、皆さんと噛みしめたいと思います。世の中の価値観は様々、好みもまちまち、人生いろいろです。ひとつのことを実行しようとなれば、四方八方から“評論”されます。意欲的な提案をすれば尚更のこと。でも、それに負けずに、挑戦していきましょう。「できない理由ではなく、できる理由を語ろう」と私がいつも言っているのもこのこと。新しいことや大胆な試みをするときには、多少知識があれば瞬時に「できない理由」を語れます。全方位から来る「できない理由」の矢を、信念と志の楯で跳ねのけて進んでいく、そんな市政をしたいと思います。そこには、私の原体験も関係しています。私がヨーロッパに赴任していていたときのこと。ある方に、こう言われました。「日本って国は、NATOだよね。」何のことか分かりますか？条約機構のことではありません。NATOとは、No Action Talk Only。つまり、ああだこうだと議論してるばかりで、動きが遅い、見えないということを揶揄されたのです。これには頭を金づちで殴られた気がしました。批判をおそれ、波風をおそれ、動きの遅い国、日本。この３０年来の経済成長の停滞、イノベーションの不足、ひいては国力の低下、の根源には、こうした風潮があるのかもしれません。突飛なアイデアやクレイジーな起業家がアメリカのように出てこない一因なのかもしれません。私は、北九州市という土地から、こうした日本の在り方、未来に一"},
  {vol:13,date:"2023年05月29日(月)",title:"予算案への思い①",content:"皆さん、おはようございます。暑くなってきましたね。各地の祭りの時期を迎え、コロナも明け、通常規模での開催に、多くの市民の方々が心躍らせている様子を見るのは嬉しいものです。先週は、八幡東区、西区の区役所にお邪魔しました。最前線だから分かる事情、悩み、やりがい。言葉の節々に感じました。これからは、“公平”という名の均質化ではなく、七区の特徴を活かし、強みを尖らす方向へ進めたいと思います。各区が能動的に企画し、むしろ本庁を動かす形へ。それこそ、自治体が国を動かす形を目指す第一歩となります。さて、今回は、６月議会に提案する予算案への“思い”をお伝えします。私は、予算案とは、市長はじめ、市役所全体による市政経営の価値観、世界観、時代認識すべてを凝縮したものだと考えています。「どんな風に時代を捉え、どういう街を目指そうとしているのか。」その表現と考えています。さて、行政、市役所の役割って何ですか？端的に言えば「市民を幸せにすること。」ですよね。では「幸せ」って何ですか？それは人によって答えが違うでしょう。なぜなら、ひとりひとりの人生観や価値観が異なるからです。でも、組織体として動いていく上では、バラバラの価値観ではいけません。様々な施策の目指すベクトルがバラバラでは効果が出ないし、ムダが発生するからです。多様な市民の考えや思いを包摂しながらも、「この街をこう創っていくんだ」という方向性で一致団結することが必要です。色んな仕事を進める上で、「どっちが正しいのだろう？」「どう判断すべきだろう？」と迷うことは多々あります。その際に、判断基準となり、進むべき方向性を示すものが必要です。つまり、夜道を照らし、方角を定める“北極星”が必要なのです。この“北極星”こそ、まちの理念やビジョンです。それを具体的なアクションに投影するものが戦略や計画です。それを明確化することは、今年度の大きな仕事です。要は、かつてここでも書いた「ベクトルを合わせよう」ということです。私が今回の予算案で示したベクトルは、「都市の成長」、そのためにまち全体を“再起動”しようということ。いま、北九州市が目指すべき優先順位の第一位は「都市の成長」です。この１０年間で、経済成長率も地価の上昇率も、政令市の最下位レベル。いきおい、人口も減り、企業も撤退し、財政も厳しい状況。いろんな政策を打ちたくても、“振れる袖がない”のが現実です。だから今、「都市の成長」にフォーカスして政策を総動員します。市民を真に豊かにする＝福祉や医療や文化などを通じて、「楽しさ」「ワクワク」「安らぎ」「豊かさ」を感じるまちとするには、その元手が必要なのです。だから、その元手を創るための「都市の成長」が必要です。しかも、それは官よりも、民のチカラで産み出すことが、持続可能な成長のために重要と考えています。そのために、今回の予算案では、「北極星プロ"},
  {vol:14,date:"2023年06月05日(月)",title:"無事こそ大事―消防とみどりの愛護と。",content:"皆さん、おはようございます。昨日は急ぎ足で、夜宮公園で花しょうぶを、高塔山で紫陽花を愉しんできました。梅雨の合間の緑滴る季節は素晴らしいですね。私も先週火曜日で、市長就任１００日となりました。何事も「最初の１００日が大切」と言われますが、職員の皆さんのお陰で、あっという間ながら濃密なスタートを切れたことに感謝いたします。さて、今回は、「無事こそ大事」。改めて感じたことをお伝えします。一つ目は、消防の皆さん。先月、私は、小倉北消防署を視察しました。規律の取れた組織、いつ何時火災出動があっても対応できるよう、緊張感を持ってスタンバイしている様子、そしてデモ出動の様子を見ると、僅かな時間で、機敏かつ的確に出動する姿に、北九州市民の安心安全を守るプロフェッショナルの凄みを感じました。火災も救急も予期できません。コロナのときにはどれだけの負荷がかかったことでしょうか。それを想うと、頭の下がる思いです。また、署内を視察すると、夜勤のための部屋が並び、畳のある食堂など、起居をともにしながら市民生活を守る署員の姿が目に浮かぶようでした。そして、署内が綺麗に整理整頓されていることにも感銘を受けました。時には命を危険に晒しながら、市民生活を守る皆さんの矜持と使命感に心動かされました。そして、G7広島サミットにおいては、消防特別警戒体制に従事するため、消防局４０人の方が派遣され、任務を完遂して帰北され、先日、報告を受けました。現地での警戒体制の下では、大きな緊張感と重圧がかかったことと思います。ご家族もご心配されたのではないかと思料します。何事も起こらなくて当然、と見られる任務をしっかりと全うし、この国の威信と安全を守って来られた皆さんを、心から誇りに思います。本当にお疲れ様でした。「無事が大事」という意味では、先週の金曜土曜に、秋篠宮皇嗣同妃両殿下を北九州市にお迎えして行われた第34回全国「みどりの愛護」のつどいが無事執り行われたことに、感謝します。狂いのない時間管理、行程の正確さ、そして失礼のない立ち居振る舞いとおもてなし。言葉で言うよりも遥かに事務的な準備作業は大変骨の折れることだったと思います。私も、英国の大使館在勤時代に半年以上の時間をかけて、入念に天皇皇后両陛下のご訪問を準備した経験がありますが、ひとつひとつに心を込め、１００％の準備をすることの重さと有難さを感じたことがあります。県庁や県警はもとより、建設局はじめ関連部局の皆さんのチームワークと努力で、見事なロジ回しを達成していただいことにも、感謝します。両殿下を好天のもとお迎えし、素晴らしい接遇ができたことは、北九州市の歴史のひとつに刻まれたと思います。「無事こそ大事」。決して目立たなくとも、殊更誉められなくとも、「無事」を守ってくださる皆さんこそ、私たち市民の誇りです。この経験が積み重なり、引き継がれていくことで"},
  {vol:15,date:"2023年06月12日(月)",title:"「逃げきれた夢",content:"と“人情大都市”』皆さん、おはようございます。梅雨の間の週末は好天でしたね。お伺いした、とばた菖蒲まつりも盛大に開催され、多くの賑わいでした。高貴な紫色の凛とした花菖蒲は、素敵です。この季節に改めて、北九州市全域の自然の豊かさ美しさを体感する日々です。さて、先週から本格的な予算案の審議も議会で始まりました。皆さんには、一所懸命準備していただき、感謝です。これから、未来志向の提案が議員の皆さんから出てくることを期待しています。新しい北九州市を市民総出で創って行きたいですね。さて、今回は、「逃げきれた夢」という映画から話を始めます。皆さんご存知の黒崎出身の光石研さんが主演、オール北九州市ロケのこの映画、第７６回カンヌ国際映画祭に正式出品されました。北九州フィルムコミッションが支援した映画が、遂に世界三大映画祭に羽ばたいたこと、本当に嬉しく、誇りに思います。これまでの多くの関係者の方々の努力と積み重ねの賜物です。“映画のまち・北九州”の歩みは素晴らしい結実を見せています。昨日、主演の光石研さん、二ノ宮監督とともに、舞台挨拶に登壇させていただきました。光石さんと懇談し、嬉しい話を伺いました。それは、「東京の映画関係者の中では、北九州で映画を撮ることが人気ですよ。本当に私も鼻が高いんです。」ということ。車が海に突っ込むシーンなど、なかなか普通では撮りづらいシーンも北九州市では支援してくれる。今回の映画でも、コロナ禍で撮影しづらい場所が多かったのですが、北九州市では多くの方が工夫して撮影協力してくれたそう。また、市民のエキストラへの参加も協力的だそうです。以前、やはりオール北九州ロケだった”Red shoes”の雑賀監督にも伺ったことがあります。「北九州市で映画を撮ると、日本のどこでも見ないような量の差し入れが届いて、俳優さんたちが大喜びなんです。」と。北九州市は、ロケ地ととしてだけでなく、映画に参加してくれる、サポートしてくれる温かな市民の皆さんのお陰で、映画関係者の方々の心を確実に捉えているようです。本当に嬉しく、有難いことです。皆さん、これこそ、北九州市の売りであり、全国にもっと知ってもらいたいことではないでしょうか。ひとことで言えば、「人情大都市」。人口９０万人以上の大都市でありながら、人のつながり、頼まれたら断れない気の良さ、そして来た人訪れた人を大事にする温かみ。これだけ人情が溢れている大都市は、世界を探してもなかなかないと思います。コロナ禍を経て、人の絆や体温が感じにくくなっている今、北九州市の「人情大都市」としての魅力、強みは、ますます光を放つ。私はそう確信しています。そういえば、建築家の隈研吾さんと小倉で食事をしているときにも言われました。「武内さん、北九州は、そのうち世界の最先端のまちになりますよ。この生っぽさ、いい意味でのボロさ。キラキラの大都市に"},
  {vol:16,date:"2023年06月19日(月)",title:"小さく生んで、大きくツタエル",content:"皆さん、おはようございます。梅雨に入ったとは言え、週末は好天の日が多く、初夏の空気を愉しまれましたか。今月は議会マンスですので、各部局の皆さんは気が抜けない日々、奮闘してくれていることに感謝します。色々な質疑がありますが、私たちは行政マンとしての矜持を持って、チカラを結集し、この街の未来への種まきをしていきましょう。さて、今回は、「小さく生んで、大きくツタエル」。情報発信のことをお伝えします。情報発信―民間企業で言うとPRやマーケティングと言ってもいい－は極めて大事です。私も行政に長年いたから思いますが、行政というのは、どうしても情報発信を軽視しがちなものです。饅頭の”あんこ”が大事なのであって、「見せ方」「伝え方」はその付属品、おまけみたいな捉え方が根強くある。中味（政策）を大切にするのは勿論のことです。でもそのプライド故に、発信を軽視してはなりません、苦手意識があるからと言って避けてはいけません。「伝えている」と「伝わっている」は別物。意識を徹底的に変えて行きましょう。先週、いいケーススタディがありました。詳細は省きますが、担当部局の予想を超えるメディアの報道ぶりに、少し当惑しているようでした。折角、素晴らしい仕事、素晴らしいアイデアで仕事を進めているのに、世の中へしっかり伝えないと、勿体ない！と改めて感じた事案でした。このほかにも、レクチャーを受ける過程で、「これはどんな風に発信する？」「これはメディアにどう取り上げてもらいたい？」と聞くと、そこまで考えてないケースもちらほら。皆さんの折角の労力と知恵で紡いだ施策ならば、少しでも世の中に発信し、関心を引き寄せ、ひいては、人や企業や金が集まる、北九州市のブランドが高まることに繋げていこうじゃありませんか。最初から１００点満点の施策、完全に成功が約束された施策など多くはありません。批判や疑問もあるでしょう。でも、行政の側からどんどん“渦”を創っていかなければなりません。世の中に出る際のアウトプットを強くイメージしてください。「小さく生んで、大きくツタエル」という位の姿勢が大切なのです。北九州市にはいいところがあるのにね、こんな素晴らしいものがあるのに知られてないんだよね、その話もよく聞きます。うまく伝わってないんだよ、情報発信が下手だから、そんな自虐的な声もよく聞きます。でも、評論している場合ではありません。隗より始めよ！北九州市役所から、どこの自治体にも負けないような情報発信を強力かつ戦略的に行っていきましょう。情報発信には3つの意味があると考えています。①透明性を高める、担保する、②前向きな動きを市民に伝えることで活気を生み出す、③人や企業や投資を引き寄せる。何より、やっている仕事が取り上げられれば、職員の皆さんのモチベーションアップにもなり得る。皆さん、担当する事業を効果的かつ強力に情報発信していきま"},
  {vol:17,date:"2023年06月26日(月)",title:"感性的価値をつくろう",content:"皆さん、おはようございます。早いもので、もう６月も終わりますね。今月は当初予算編成への議会対応に、各部局が本当に頑張ってくれたひと月。心から感謝申し上げます。福岡市ではリッツカールトンが開業し、大きな話題になっています。北九州市でも、できることから、明るい元気なニュースを発信して、暑い夏にしていきましょう。さて、今回は、「感性的価値をつくろう」がテーマです。「感性的価値」とは？感動や共感を得ることで生まれる付加価値のことです。平たく言えば、「心を動かす」「感性を刺激する」こと、今風に言えば「エモい」ことこそが、この時代の付加価値になると考えます。先のリッツカールトンの例でいえば、一つの宿泊施設としてだけではなく、「世界最高峰のホテルが我が街にできる！」という高揚感や誇らしさが経済活動を活発にします。そして、泊まってみたり食べてみたりして、「やはり素敵な空間だなあ」「いい思い出ができたなあ」といい気持ちになって消費する。街への愛着が高まる。単に宿泊施設が出来たという“機能”的な価値だけでなく、心に刺さる“感性”的な価値がそこにはあります。その価値を求めて予約が多く入っていますよね。ＪＲ九州の例を見ると、電車という“機能”だけでなく、車輛や駅のデザインなどを通じて“感性”に訴えることで、ブランド力を高め、収益力を高めています。”Good Design is Good Business”を経営戦略のひとつとしています。あの“ななつ星”などは最たるものですね。よく知られるとおり、iPhoneで米国アップル社が世界を席巻する過程でも、スティーブ・ジョブズ氏が切り札としたのはデザインでした。製品を入れる箱の材質やデザインにも繊細過ぎるまでこだわり、本体の角の丸みやロゴなど、徹底したこだわりが世界中のユーザーを魅了し続けています。「感性的価値」を生み出すデザインなど、単なる印象で表面的なこと、と決して考えてはなりません。その製品が訴求する機能や実用性と緊密に結びついているからこそ、クールで洗練されたデザインが生まれていくのです。つまり、そのモノを通じて世の中に何を伝えたいのか、どう利用者を満足させたいのか、いかに世界に貢献したいのか。そうしたストーリーが凝縮したものだと思います。まさに、深い思考とクリアな信念が見える化されたものであり、そこに利用者が共感し、感動する、というプロセスが生まれています。さて、ひるがえって、北九州市。素晴らしいモノづくりの技術と伝統があります。素敵な観光地、イベントや取組みが各地にあります。そこに、すばらしいデザイン、一貫性のあるストーリーが加わることで、大きくポテンシャル（底力）が花開くと思いませんか？機能として素晴らしいことはもちろん、そこに「感性的価値」をどう付け加えるのか。そこに気を配ってみてください。住まう人、訪れる人の「心を動かす」"},
  {vol:18,date:"2023年07月10日(月)",title:"熱い闘魂",content:"皆さん、おはようございます。大雨の時期を迎えています。防災、市民の命を守ることは、市政の大根本です。危機管理室の皆さんを中心に、毎週末のように、休みも取れない中、緊張感を保って職務に当たってくれていることに感謝します。また、６月の予算編成の議会に各部局が精一杯対応してくれ、無事予算案が成立し、新たな市政が船出しました。７月からいよいよ施策の展開に全力に移っていきましょう。最近は、全国初で『地球の歩き方・北九州市版』が刊行されること、教育現場でチャットGPTの活用が始まることなど、次々と明るいニュースを市から発信しています。「北九州市が変わり始めたね」というお声もよく耳にします。加えて、祭りの季節でもあります。この夏をもっと盛り上げていきましょう。さて、今回は、「熱い闘魂」がテーマです。新しいことを始めるとき、挑戦的な施策を進めるとき、私たちは色んな抵抗に遭います。障害にぶつかります。そんなとき、強い信念、意志、気概を持って突き進むこと。たとえ「波風を立てる」ことがあっても、正しいと思うなら、必要と信じるなら、折れずに事に当たること。そういうガッツを持つ仕事ぶり、人材を、私は買いたいと思います。スポーツをされていた方はより分かると思います。勝負どころでヒットを打つ、スマッシュを決める。球際で競り勝つ、ボールを奪う。そのとき、少しの気持ちの強さ、気持ちの違いが大きな差を生む。それは私たちの仕事でも、同じだと思います。色んな批判や非難（時には故なき誹謗中傷も）を受けることはあります。でも、正しいと信じて行うこと、進めている仕事ならば、自信を持って堂々と進めましょう。ひるんではなりません。そのために、私も市長として、皆さんとともに、伝え、闘う覚悟です。それは、市全体に言えることです。私たち市役所に、燃えるような「熱い闘魂」が満ちあふれれば、それが北九州市民に伝わり、街の元気が、街の活気が変わってきます。９１万人の市民の皆さんを“起動”させるのも、私たち行政の役割だと思います。振り返れば、北九州市は“熱量”が自慢の街だと思います。企業誘致活動でも、東京の企業たちからは、「北九州市の担当の方々は、引くほど熱いんです。」と、フィルムコミッションの奮闘で映画撮影に来る監督や俳優からは「北九州市ほど差し入れがあって、歓迎してくれる街はない」と。「頼まれたら断れない」「ひと肌脱ぐ」のがこの街の凄さなのです。私は、日本の経済、北九州市の経済を立て直すには、この「熱い闘魂」を持ち、困難にめげずに、努力と創意工夫を重ねることが必要と考えています。中小企業やスタートアップの経営者と話をすると、経営の好不調の波に翻弄されながらも、不屈の精神で、業態を変えたり、投資したりして乗り越え、大きく成長発展させている方が数多くいます。そうした方々は、人間的にも魅力があるし、こちらも元気をもらえます"},
  {vol:19,date:"2023年07月18日(火)",title:"街に出よう、人に会おう、そして感動しよう。",content:"皆さん、おはようございます。三連休はいかがお過ごしでしたか？北九州市も夏真っ盛り。各地で熱いお祭りが開催され、賑わいを見せました。ここから年後半に向け、多くのイベント・行事も目白押しです。準備に奔走してくれている職員の皆さんに感謝。明るく、熱い北九州市を皆の力で創っていきましょう。先週の国提案などの東京出張もお疲れさまでした。どんどん、北九州市の存在感を全国レベルで高めていきましょう。さて、今回お伝えしたいのは、「街に出よう、人に会おう、そして感動しよう。」ということです。皆さん、もっと“感動する”ために出掛けてください。そして出張にも出掛けてください。全国各地、世界の面白い取り組み、先進的な街づくりを見に出かけてください。私たち自身が、北九州市のために面白い、ワクワクするような施策を産み出すには、何より「インプット」が大事です。他人のネタを見てないお笑い芸人も、美味しいものを口にしていない料理人も成功しませんよね。世の中は面白いもので溢れています。市内は当然のこと、他の都市や他の国が行っているチャレンジ、先進的な企業のビジネスを見にいくことで、五感を使って、刺激を受けていただきたい。また、地元でも、知られていないが素晴らしい活動や人もたくさんあるはず。それらの現場を見ることで、感心したり、ビックリしたり、ワクワクしたり、そういう機会を増やすことが、北九州市の政策のアイデアになります。出張費が削られて…、日々の仕事が忙しくて…、そこも併せて改善していきましょう。市の職員の皆さんが、どんどん見聞を拡げ、学び、ワクワクしながら、我が街の未来を考える。そういう取組を私は奨励します。評価します。幹部の方は、若い方々にぜひそういう機会を創ってください。先日、東京で、とある、キー局のテレビ局幹部と会ったとき、似たような話を聞きました。「最近、テレビが面白くないと言われる。視聴率が良くないと言われる。それもそのはず、自宅と局の通勤往復ばかりで、飲みにも行かず、面白い場所や面白い人と会う時間が減っている。みんな、スマホやyoutubeで情報を集めている。それじゃ、ネットより面白い番組をテレビが創れるはずがないですよ。」と。むべなるかな。私たち行政マンは、「会いたい」と言えば、ほとんどの人が会ってくれる、とても幸運なポジションにいます。私自身も、行政から民間企業に転じた際、「一民間企業だと、こんなにも、誰かのアポイントを取ること自体が大変になるのか。」とショックを受けました。皆さん、折角、色んな人と会えるのですから、“熱狂的な好奇心”を持って、ぜひ街に出て、人に会って、そして感動してください。そして、「感動する」ことが大切です。面白がって、愉しんで、少しでも何かヒントを盗めないかという姿勢を持ってください。ところで、先週の国提案の東京出張。皆さんの入念な準備で無事終えることが"},
  {vol:20,date:"2023年07月24日(月)",title:"若い力に期待する",content:"皆さん、おはようございます。猛暑の毎日、私は市内各地の祇園山笠への参加が立て続き、北九州市の「祭り」の多さと凄さを体感しています。「祭り観光」はこの街のコンテンツになります。もっと市内外、インバウンドで北九州市の祭りを見に来る人が増えていい。１０日ほど滞在すれば、４つ５つの祭りは見られます。もっと力を入れていくべき分野と感じます。一昨日の世界遺産の戸畑祇園大山笠は、勇壮さと優雅さを兼ね備え、子ども若者まで、実に美しい祭りでした。このほか、どの地の祭りも個性的で素晴らしく、北九州市の感動的な夏を味わわせてもらっています。そこにある地域社会の歴史、誇り、繋がり、活気、美意識。祭りが表象する「街の奥深さ」は北九州市の財産。世界への訴求力としましょう。さて、今回は、ズバリ「若い力に期待する。」です。昨日のミライ・トークin小倉南区で、若手職員の皆さんが見せた企画力・実行力には目を見張るものがありました。参加された市民を愉しませ、巻き込み、盛り上げる仕掛けとセンスが出ていて、嬉しくなりました。エンタメパフォーマンスもメッセージ性がありましたし、いいねボード、MCの掛け合い、プレゼン、ギネス挑戦企画など。多少、冷や冷やするところもありましたが、思い切って企画し、実行してくれたことに感謝。チーム力を感じました。この企画では、他の区の若手の方々も良くやってくれています。改めて、北九州市役所ファミリーの「若い力」の可能性を感じています。ミライ・トークでの「若い力」の躍動は、自由裁量が大きかったことにも起因しているでしょう。各区長が、それぞれの個性を活かし、時間ない中で、若手の職員の力を引き出すこと。その大きな機会にしてください。普段の仕事では、なかなか若手に裁量や決定権がなく、「上が言う方針に従うだけ」「上司が求める正解を求めてしまう」「従来通りが安心と考えがち」になりがちでしょう。変化を拒む幹部や上役がいることもブレーキになっているかもしれません。しかし、私の市政では、「挑戦する市政」「恐れない市政」を掲げています。今の停滞状態にある北九州市が飛躍するには、思い切ったアイデアや発想、行動が必要です。従来の方法論に染まっていない「若い力」を発揮してください。そして、それを引き出し、邪魔しないよう、幹部の皆さんも努めてください。市役所のスタッフはみな、縁あって、同じ志を持って同じ場で務める「パートナー」でもあります。経験や知識の差をもって、指導することは大切ですが、「知らないから分かる」「経験がないからできる」こともあります。職位を超えて、日々、「あなたを頼りにしていますよ」という姿勢で接し合うことで、組織内の人間関係は強固になります。現実には色々な状況があるでしょうが、私自身は、職員相互が、互いにリスペクトしながら、成長できる、そういう市役所にしたいという考え方を持っています"},
  {vol:21,date:"2023年07月31日(月)",title:"火花を散らせ",content:"皆さん、おはようございます。本当に暑い。「地球温暖化」から「地球沸騰化」の時代に移ったと国連事務総長が言っていましたが、熱中症や水の事故をどう防ぐかは、これからの大きな行政のテーマになります。私の最近の週末は、祭りとミライ・トークとスポーツイベント等で猫の手も借りたいほどですが、サポートしてくれる職員に感謝します。特に、ミライ・トークでの区役所若手職員の奮闘に感謝します。さて、今回は、「火花を散らせ」です。先日、高田工業所の小林さんが、溶接技術の全国大会で一位となり、ご報告に来られました。「溶接」する瞬間に、鉄板が接合されるという“価値”が生まれます。新たなモノが生まれます。その瞬間、“火花”が散ります。この“火花”こそが、瞬間なのです。この“火花”を北九州市役所においても、ぜひ散らしてください。進めている仕事について、「自分はこう思う」「こうあるべきだ」「本質はここだ」と遠慮なく言葉を発すること、それを受け止めてより発展させること。これこそ、私が求めているものです。庁内の議論で、議員や業界とのやりとりで、どんどん“火花”を散らして欲しい。異なる意見や視点は歓迎。正しいと思うなら、「上が言うから」「あの人が譲らないから」で妥協せず、自分らしく意見を表明してください。そうでなければ、私も政策判断ができない。皆さんの本音を聞きたいのです。私たちの担う市政に簡単な、楽な課題など一つもない。だから、オブラートに包んだ無難な説明では、決断も判断もできません。ただ、“火花”と言っても、明るい“火花”に限ります。すなわち「アイデアを前向きに発展させる」ための火花に価値があります。他方、暗い“火花”、すなわち「仕事を前に進めさせない、現状を固守する」ための火花はダメです。「上司や声の大きい人」の方ではなく、「市民や北九州という街」の方を向いて仕事をするための火花です。前回の議会中、一部議員の意見を受けて、ある契約ルールを変えたいという案が私に上がってきました。私は時間を掛けて、本当にそれが政策として正しいのか、本心からそう思っているかと担当に聞きました。そうすると、担当者は、政策の筋目としては納得してないものの、「言われたから」「もめたくないから」という理由で、妥協案を作ってきたことを知りました。私は厳しい口調で、ノーだと言いました。責任ある担当として、心の底から得心して変更しようというならいいが、目の前の「波風を立てない」ために、言い換えれば「楽になるため」に、政策を曲げるようなことは、決して認められません。トラブルメイカーになっていいのです。違うと思ったらとことん戦っていいのです。自らの良心を大事にしてほしい。無論、議会や業界の意見は傾聴すべきですが、徒に阿ってはなりません。市民のために何が正しいのか、それをするのが公務員、行政なのです。私は、そこを見て判断します。私も"},
  {vol:22,date:"2023年08月21日(月)",title:"市長就任半年を経て",content:"２月２０日の市長就任から半年が経過しました。短くも長く、本当に怒涛の半年間。24時間、身も心も北九州市に捧げる思いで、北九州市の魅力と可能性に没入する半年間でもありました。表舞台に出れば色んなことを言われるし、役所の内部に入れば色んなジレンマにも直面します。それでも、前向きに支えてくれる職員のお陰でやってこられたことに感謝します。１６年ぶりの新市政は船出したばかり、北九州市の市益、暮らしの質の向上、経済活性化、人と企業や近隣自治体の引き込み、若者や子どもの幸福度向上、そして職員の満足感や達成感を高めたい。そのため、まだまだ手掛けるべきことは膨大にある、と痛感する毎日です。緊張感ある議会運営を求められる中でも、私はひるむことなく、何としても北九州市に元気と活力を取り戻したいという一念で、皆さんと議案や予算案を編み、一歩でも前進させようと進んできました。市民の皆さんのガンバレの声、職員の皆さんの支え、そして議会のご理解もいただき、新たな市政が船出しました。北九州市を前に進めたいという大きな方向性はみな同じです。今後「成果」を出していくための“種まき”の半年間でもありました。でも、少しずつ、北九州市が動き始めた、という感覚はあります。「街の空気が明るくなった」「市役所の方々の動きが速くなった」という声を聴けば私も嬉しく思います。まだまだ、これから先、取り組まねばならない市政変革、成長の実現など、険しい道、困難な障害に立ち向かわなければなりません。しかし、“小さな小舟”で荒波を越えてきた想いと志を胸に、想いを同じくしてくださる方の輪を拡げ、北九州市の舵取りをしっかりとやっていきたいと考えています。市政の中に入ってみて初めて、北九州市の底力、ポテンシャルは途轍もないことを最認識しました。確固たるものづくりの基盤、グリーンエネルギーの先進性と集積性、災害に対する強靭性、全方位への地理的優位性、都会も自然も歴史も食もある観光力、祭りを熱く盛り上げる人情と熱情。これだけ揃った街はありません。先日、隈研吾さんも「北九州市には、バルセロナやミラノに匹敵する魅力がある」と言いました。この魅力と底力をカタチにし、点から線にし、見える化することで、この街をワンステージ引き上げていきましょう。人と企業と投資が集まり、先陣を切って社会課題を解決し、そのライフスタイルが国内外から憧れられるまち。そういう可能性がある街でもあります。だから目指したいし、目指さなければなりません。それが、北九州市の使命です。この歴史の転換・進化に皆さんとともに立ち向かえることを嬉しく思います。他方で、この半年で痛感し、今、組織として進めたいことがあります。ひとつ目は「供給者目線からのシフト」です。行政にいると、どうしても、業界や事業者との接点が多く、その話を聞くことが多くなります。無論、彼らは極めて重要な存在で"},
  {vol:23,date:"2023年08月21日(月)",title:"エンタメの力～SKY-HIさんとの対話から",content:"先日の「わっしょい百万夏祭り」は４年ぶりのフルスケール開催で、大いに盛り上がりましたが、その焦眉はSKI-HIさんによる勝山公園ライブでした。「これまでに見たことがない」と評される程の若者が集まり、まちに大きなインパクトを与えました。そのライブ前に、SKI-HIさんと懇談する時間を持つ機会に恵まれました。ラッパー、シンガーソングライター、音楽プロデューサー等の多方面で活躍し、「日本のエンタメを変える人間」とも評される人物との邂逅。１２０万人近い人が彼の挑戦を応援しているとも言われています。SKY-HIと記した名刺を差し出しながら「日高です」と丁重に挨拶をしてきた彼は、とても自然体で、丁寧に相手の話を聴き、適度な距離感で会話を展開する、好感を持てる３６歳のビジネスマンという印象。対話の中で、私が「北九州市はブロンクスかブルックリンみたいな空気感がありますよね」と言えば、「北九州市はとても面白い街だと思います」と深く関心を寄せてくれました。彼は、「本気で世界を取るグループをつくる」と公言し、多額の私財もなげうって取り組んでいます。話す中で、その覚悟、それも虚勢や自己顕示の混じりっけのない、純度の高い“覚悟”を感じさせてくれました。久しぶりに、もっとゆっくり話してみたいと感じさせてくれる人物でした。彼の著書『マネジメントのはなし。』の中では、「今まで日本は、どれだけの才能を損失してきたんだろうと思います」「（オーディション審査に際して）「評価を下す」のではなく、「好意的に見る」「好意的に向き合う」ことが、長期的に彼らの成長につながると考えています」「権限があるから葛藤だらけです」「雑念や邪念、自分から生まれるプレッシャーに対抗できるのは、自分自身にアーティストとしての指針があるかどうかなんです」「様々な人の夢を受け取って自分の力で実現させていく覚悟と責任があります」といった旨の言葉を紡ぎ、私自身の胸を衝くものも多くありました。今回のSKI-HIさんとの対話と反響を通じ、エンタメの力、その波及力とグローバル性、そして人の心を揺り動かす力に、私自身、衝撃を受けました。この力を北九州市という街にも、しっかりと組み込んでいきたい。彼がTVインタビューで答えた言葉のとおり、「元気である、潤っている、盛り上がっている街に人は集まる」。それを北九州市で起こすのは、市政の大きな眼目でもあります。「エンタメ」が北九州市により重要となってくる理由。第一に、経済・産業としても大きなレバレッジ（梃子）が働く分野であること。BTSやXGなどが世界を席巻し、若者を中心に、巨大産業となっていることは衆知の事実です。今、米国では、歌手テイラー・スウィフトの全米ツアーが、開催地で爆発的な消費を生み（およそ6,700億円に上る見通し）でインフレを生み、「スウィフトフレーション」とも呼ばれています。北"},
  {vol:24,date:"2023年09月04日(月)",title:"バックアップ首都構想",content:"9月1日は1923年の関東大震災から百年。TV特番も、歴史の検証とともに、いつ何時来るか知れぬ大地震のリスクと防災体制について数多く取り扱っていた。改めて、起きたときに甚大な被害と日本という国の行く末に懸念が募る。個人的には、私自身、東日本大震災の際、霞が関で被災地への医療や物資の提供、計画停電への対応、原発事故でまちごと避難指示が出た飯舘村での介護体制の保持など、多くの対応に追われた経験がある。国家中枢での混乱した指揮系統、泥縄式の対応、不足するトップの決断・・・その困難な状況を身にもって体験した。職員は昼夜問わず、何日も泊まり込んで対応に当たった。だが、その教訓は、今の日本に十分活かされていると言えるか。今の復興が、真に必要なものとなっているか。起こりうる次の大災害に対処する構えは出来ているか。目を凝らして見ていく必要がある。そして、私たちも、行政の当事者として、「日本の為に何ができるか」という視座を持ちたい。ちょうど、先週末、地震学に詳しい有識者の方とじっくり話す機会があった。「南海トラフ巨大地震が３０年以内に起こる確率は70-80%と言われているが、正直、明日起きてもおかしくない。富士山の噴火や津波が連動する可能性も十分あるのが歴史上も明らか。日本国全体での対応は到底間に合っているように見えない」と。「実際に巨大地震が首都圏で起きれば、救助に入ってくるルートやマンパワーが断ち切られ、社会と経済はマヒ状態に陥る。人類史上最大の被害となり、日本が一気に後進国に転落する可能性が大きい」とも。勿論、様々な見立てがあり得る。されど、国は、南海トラフ巨大地震が起きた際の最悪の場合の死者を３２万３０００人と想定しているが、さらに「震災関連死」については、関西大学の奥村与志弘教授によると、最悪の場合、７万６０００人に上る可能性があり、東日本大震災のおよそ２０倍に上るという。果たして、この危機と隣り合わせの状況を、私たち北九州市として、どのように捉え、いかに備えるか。いや、どれだけ、“日本を支える”ために力を発揮できるのか。無論、北九州市も、巨大地震の際には、少なからず影響を受ける。例えば、大規模な盛土造成地は、福岡県は神奈川県に続いて２番目に多い。山合いの地や、新興開発地に、リスクが存在するだろう。そして、「火災旋風」と呼ばれるように、火災が竜巻を生んで広く地域を焼き焦がす（マウイ島の火災で起きたとも言われる）とき、木造密集地域は大きな被害を受けるおそれがある。その上で、北九州市が、“日本を支える”ために、何ができるか。過去１００年間で震度４以上の地震が３回しか起きておらず、水を潤沢に持ち、電気も豊富で比較的安価、空港を有し、インフラも整うこの街が、どのように日本を救うことができるのか。そうした視座で、考えていきたい。上記の有識者が言うに、「武内市長の掲げる人口１０"},
  {vol:25,date:"2023年09月11日(月)",title:"稼げる街",content:"「担当業務で、どう“稼げる街”に貢献できますか？」先日の来年度予算に向けた各局とのブレストで繰り返し聞いた。「稼げる街」―福祉でも文化でも教育でも、どの分野であってもそれを意識して施策を企画立案して欲しいとの思いから、敢えてこのフレーズを繰り返した。では、なぜ“稼げる街”にフォーカスしたいのか。理性的な理由はいくつもある。経済成長率はこの１０年間、政令市最下位レベルであり、１人当たり市債残高はワースト１位という厳しい状況だから。少子高齢化や施設の老朽化の課題と対峙するには巨額の財源が必要だから。ものづくり、空港、半導体、グリーン産業などポテンシャルがあるから。地震災害の少なさやアジアへの近さを考えれば、伸びしろ十分だから。何より、“稼げる街”でなければ、人も企業も投資も集まらないから。しかし、強調したいのは、この街のカタチを変えていくには、“稼げる”ということが今、最も必要だと考えるからだ。私自身、長く厚生労働省などで社会保障政策に携わり、制度設計や財源確保に奔走してきた。総額で１４０兆円もの財源を賄うには、日本国の経済成長が必要ということを痛いほど感じてきた。福祉も医療もすべてはカネの裏付けがなければ絵空事。やりたいこともできない、困っている人を助けられない、人を元気づけることもできない。何かを他人に為にするためには、元手が必要だという当然の摂理。まさに「強くなければ、優しくなれない」のだ。それに、「貧すれば鈍する」。これから経済のパイが小さくなると思えば、人は、今の自分の持ち分だけを必死に守ろうとするようになる。他人のことを考える余裕はない、ひたすらに小さなパイの取り分をめぐって、自己利益の極大化に血道を挙げるようになる。新しい挑戦や外部からの参入を拒むようになる。よく言われる“既得権”の死守の構造だ。そうなると、社会と経済は硬直化し、イノベーションは生まれず、格差は拡がり、パイは小さくなる。そのループに入ると、ますます、病は深まる。近年の日本の状況はこれに近いと言えないだろうか。北九州市だけの問題ではない。日本全体の構造がそのように流れて行っていないか、強い危機感を持っている。私は、北九州市から、このループを抜け出して、少子高齢化でも、都市が老朽化しても、再度、プラスのループを生み出す姿を日本中に示したいと本気で考えている。それが少子高齢化や都市老朽化の最先進地の北九州市の使命だと考えている。少々大げさに言えば、これは歴史的な挑戦である。では、「稼げる」とは何なのか。単に市内総生産や税収を挙げればいいのか。そうではない。言い換えれば、「稼げる」とは、そのまちが志す「価値」の代名詞だ。その街でつくられるモノ、働くヒト、体験されるコト、訪れられるバショ等々の「価値」の総和が高まること。その「価値」を創り出すのが企業活動であり、その活動を後押ししたり、環境整"},
  {vol:26,date:"2023年09月26日(火)",title:"注目（アテンション）を集める",content:"先週は、北九州市から、堀江貴文氏との記者会見のニュースが日本中に伝わった。また、ＮＨＫ「ブラタモリ」の放映決定で、北九州市から全国に大きなインパクトを与えることになるだろう。「君のアイデアが偉大なだけでは、もはや人も世界も動かない。」米国の著名投資家ベン・ハー氏の著作にあるフレーズだ。私は、就任以来、市役所内でも「発信」についてかなりの時間と議論をしてきた。当初、とりわけ「発信力」を売りにしようなんて意図したことはなかったが、結果的に、その点に“注目”いただいていることはポジティブに捉えたい。いつも言うことだが、私は、北九州市にはとてつもないポテンシャルがあると確信している。日本や世界を変える力があると本気で思っている。もっともっと「稼げる街」になれると思っている。そして、市政において、優れた事業や施策も多いと感じている。だから、街の力、街の人、市政の動きを“強く”知ってもらうのは、今の北九州市にはとても大事なことだと考えている。だから、情報発信の仕方、市民やメディアへの伝え方には細心の注意を払うようにしている。「いいものさえ作れば客は来る」？そう無邪気に信じている人が多すぎる。懸命に努力して、いい事業をして、正確かつ網羅的に情報発信をしていれば、いずれ世の中の人が気づいてくれて、移住したり、企業が進出したり、投資したりしてくれる？そんな訳はない。市長室で議論をしていると、こういう言葉を聞くことも少なくない。「あ、見せ方の問題ですね。」「まあ、見せ方は後で考えておきます。」自分たちが努力して考えた企画や事業を世の中に売り込むことは、最後に体裁を整える程度のこと、そんなことに時間と労力を割くのは、不要どころかみっともないという含みすら感じる。発想を変えてほしい。「中身」は大切だ。言うまでもないことだ。「見せ方」だけに手をかけて「中身」が薄くなるのは本末転倒である。必要なのは、「中身」と「見せ方」の両方なのだ。今の時代、私たちには、ネット、SNS、メディア、会話等から膨大な情報が絶え間なくなく入ってくる。人間の２４時間（1440分）の労力と注意力では、すべての情報を吟味し、えり分ける余裕はない。自分の考えやアイデアに注目してほしければ、同じく注目してもらおうと欲する無数の人や企業や自治体と競い合わなければならない時代なのである。「北九州市は面白そうだから、関わってみよう/行ってみよう/住んでみよう/投資してみよう」と考える人や企業を増やすには、入念に「注目」を集める工夫をしなければならない。それは“種まき”であり、プロセスの一部である。楽しそう、盛り上がっている、面白いことが起きている。そう思われる街でなければ生き残れない。そういう強い危機感を持っている。「注目」されることに力を入れると、お決まりのパターンとして、「パフォーマンス」「話題ばかり」などと揶揄される"},
  {vol:27,date:"2023年10月18日(水)",title:"ハイクオリティな街",content:"現在、新ビジョンの検討過程だが、目指す都市像のひとつの柱として、「ハイクオリティな街」というキーワードがある。これはあくまで暫定的なワードである。有識者含め、これから肉付けし、解像度を上げ、心動かすワードとして磨いていく必要がある。この点への私の思いをラフスケッチしてみたい。北九州市をより「ハイクオリティな街」にするとは、端的に言えば、都市としての「格」を引き上げよう、一段高いステージに高めよう、という意図を含む。「ハイクオリティ」というと、表面的には、便利な店があって、美味しいレストランがあって、綺麗な服を着て、文化イベントが満載で、大きな家に住んで、と即物的な印象を持たれるかもしれない。もちろん、北九州市に関わるすべての人を「物心両面」で豊かにすることは大切な要素でもある。だが、ここで引き上げようと目指すのは、“生活”水準そのものとともに、市民の皆さんの“人生”水準そのものでもある。それぞれの暮らしの中で、この街に住むことが誇らしく、自分らしく生きる為の選択肢が備わり、より幸福感を実感できる街、である。同時に、それは都市の静的な状況だけを見るのではなく、常に、社会が善くなり、人が善く生きられるために、つながりの中で挑戦が行われ続ける-ing形の街のイメージでもある。こう書くだけでも、街のイメージを漏れなく言語化するのは極めて難しいと感じる。私なりに目指したいひとつの切り口とは、「一歩先の価値観を体現する街」と表現することもできる。変わりゆく世界と時代環境の中で、次の時代にふさわしい共同体の在り方とその役割を新たに紡ぎ出す都市。都市とは、単に経済的装置ではなく、社会的装置である。そこに住む人や企業が「何かを為す舞台」「人生を営む場」である。であればこそ、「一歩先」の価値観を先取りし、カタチにして、体感し、享受できる都市でありたいと思う。市民の皆さんが「人生をもっと好きになる」都市でありたいと思う。では、その「一歩先の価値観」とは何であるか。色んな議論はあろうが、例示として、私は次の３つを掲げてみたい。それは、「エンパワメント（力を与える）」「利他」「サステイナブル（持続可能性）」だ。「エンパワメント」とは、人や企業や地域の本来持っている力（ポテンシャル）を引き出し、カタチにできるということ。たとえば、高齢・障害者や子ども、あるいは女性や若者の一部など“社会経済的にハンディがある”とされる方々をはじめ、様々な挑戦をする人や企業、今厳しい状況に置かれている人、後継者難や時代環境の波に格闘している企業など、サポートや後押しが必要な人や企業にパワー（社会経済的資源）が回る仕組みを持つ都市。肝腎なことは、単に「配る」「助ける」ではなく、「支える」「背中を押す」へのシフトだ。本来持っている力を呼び醒ますというのがエンパワメントの核心だ。次に「利他」とは、読んで字のごと"},
  {vol:28,date:"2023年11月27日(月)",title:"新ビジョンへの想い",content:"先週金曜日の定例記者会見の質問に答える形で、新ビジョンー新しい北九州市基本構想・基本計画ーの“素案”についての私の思いをお伝えしました。新ビジョンへの想いは、会見の数分間では到底語りつくせませんが、SNSでも発信しましたので、会見でお話しした内容と主旨を以下にご紹介します。目指す都市像として掲げた、「つながりと情熱と技術で、 「一歩先の価値観」を実現するグローバル挑戦都市・北九州市」について。これには北九州市の強みや誇りを大切にしながら、 可能性や潜在力を発揮させるという思いを込めています。具体的には、これまでの市民の皆様との対話を通じて、 北九州市のDNAや強み、大事にしてきたことを「人のつながり」 「熱い情熱」 「技術力」の3つに凝縮しています。 「一歩先の価値観」については、これまでも、 北九州市は近代化や環境分野で日本を引っ張ってきた歴史があります。 加えて、 このまちが持つ人肌感や体温はデジタル時代の先の“一歩先の価値観”を提示できると信じています。 こういった歴史や強みを更に強化・発展させ、日本に、世界に先駆けた価値観を体現するまちにしていきたい、という思いを込めました。 そして、「グローバル挑戦都市」について。これは八幡製鐵所はじめ、世界と闘うビッグビジネスや企業を生んできた街、それを支える中小企業や人材を輩出してきた輝かしい歴史、環境分野で世界を牽引してきた街。つまり「グローバルに挑戦してきた」北九州市のDNAそのものです。そのスタンスはこれからも守り、引き継いできたいという思いです。次に、都市像の実現に向けた3つの重点戦略として掲げた 「稼げるまち」 「彩りあるまち」 「安らぐまち」 について。自治体の従来の戦略や他都市の戦略では、色んな項目が並列に、総花的に並べられることが多かったのですが、今回は、「稼げるまち」づくりを起点として、「安らぐまち」、そして「彩りあるまち」にしていく、という循環を動的に作っていくということにこだわっています。つまり、項目の羅列ではなく、 各要素が有機的につながり、前向きな動きのある戦略にしたいというのも大事にしたポイントです。 また、今回の新ビジョンの策定過程も、これまでにはない、こだわってきたポイントです。 まずスピード。 前回（前政権）では、ビジョンづくりに22カ月かかっていたものを、今回は8カ月でやっています。 次に、市民参加のプロセス。 全での区でミライ・トークという市民対話をすでに9回開催。前回は中高大学生で430人の方の懸賞論文を募りましたが、今回はアンケートですでに4万 3,000人という大変多くの方が回答してくださっています。そして成果指標。 前回は数値目標の設定すらありませんでしたが、今回は、高い目標（ストレッチゴール）を掲げることでよりコミットメントを強くして取り組もう、 官民一体となって"},
  {vol:29,date:"2024年01月09日(火)",title:"新年に当たって",content:"令和６年が幕を明けました。年頭から、能登半島地震、羽田空港の事故、そして北九州市の鳥町食道街の火災と、胸を締め付けられる事案が続いております。被災された方には心からお見舞い申し上げます。特に、火災については、被害に遭われた方々に、寄り添った支援に努めます。また、危機管理室、消防局など、年頭から対応に当たってくれた方々に、心から感謝申し上げます。さて、今回は、まず、１月４日の仕事始め式でお話しした内容をご紹介します。「物語を創ろう」というスローガンについては、また深堀りしたお話ししたいと思いますが、今の北九州市が市内外の多くの共感や認知を得るため、そして、市政に携わる全員が学び、成長し、そして甲斐のある職業人生を送るためにも、「物語」を創ることに意識を向けていってもらいたいと思います。あわせて、１月７日の「二十歳の記念式典」で、式辞の中で私が若者の皆さんにお伝えしようとしたメッセージの全編（予定稿）をお送りします。『否定から応援へ』。この街が多くの若者を惹きつける街へと飛躍していくための想いを込めています。今年も、エキサイティングな１年になると思いますが、皆さん、よろしくお願いします。【令和６年新年職員訓辞】新年明けましておめでとうございます。本年もよろしくお願い致します。まず最初に、年明け早々、能登地方の大地震、羽田空港の事故、そして１月３日には、鳥町食道街が火災に見舞われ、辛いことが重なりました。被害に遭われた方、未だ不安な状況に置かれている方に、一日も早い復旧復興を願うとともに、心からお見舞いを申し上げます。併せて、正月返上で、情報収集等に当たってくれた危機管理室、懸命の消火活動に当たってくれた消防部局、区役所など関係の職員各位の尽力に感謝申し上げます。これらの災害や事件事故を目の当たりにするとき、改めて、人の命と「いつもどおり」の暮らしの尊さ、それを支える人の想いと繋がりの大切さを感じます。そして、いついかなるときでも、市民の皆さんとともにあろうとする、私たち公務に携わる者の責務と使命を痛感します。災害や事件事故は、常に“他人事”であってはなりません。改めて、市民の皆さんの暮らし、不安、そして喜びに想像力を働かせ、常に寄り添い、時に背中を押すことのできる「行政」の姿を共に追究していきたいと強く思います。思うに、私たちのまちを築き、支え、回してくださっている市民の方々の多くは、「もの言わぬ大多数の方々」、つまりサイレント・マジョリティの方々であることを忘れないで欲しいと思います。毎日を一所懸命、堅実に働き、生活と家族を守り、多少の不満や不平があっても口に出さず、役所や政治家と繋がる機会も少なく、それでも、毎日を力強く生きておられる多くの市民の皆さん。そんな市民の皆さんの想いや声なき声に応える、明日への希望が湧き立つような市政、行政を今年も展開していきたい"},
  {vol:30,date:"2024年01月15日(月)",title:"物語を創ろう",content:"新年の職員訓辞で、今年のスローガンとして、『物語を創ろう』と掲げました。市長室の前にも掲げてあります。さて、その真意は？色んな解釈の仕方、日々の業務への落とし込み方があるでしょうし、そうあって欲しいのですが、今日はあるひとつの切り口から、その思いをお伝えします。まず出発点として、行政とは”共感ビジネス”です。強制的に集められた税金や保険料を使って、法的に認められた権限に基づいて、保障された立場から、社会の中の資源（カネ、ヒト、モノ）を動かしたり、関係者を巻き込んだり、市民の生業（なりわい）の方向付けを促したりする仕事です。そのためには、最大限の市民の皆さんの”共感”を得る努力が必要です（もちろん、最初から共感したくないというポジションを採られている場合には限界があります。）。その”共感”を創るには、予算事業の内容しかり、新たなビジョンしかり、市民の皆さんが、自然に興味を惹かれ、うなずき、腕組みを解いて、できれば笑い声まで挙げてワクワクしてくれるようなストーリーを提示したい。何も、作り話で面白おかしくプレゼンしようという表面的なことを言っているのではありません。例えば、「この事業を創った背景にはこんな思いがあるんです」「この予算は、あるお話を市民の方から聴いたことがきっかけとなったんです」ということでもいい。私たち行政官が語る『物語』が、その話を受け取る方にとって、ポジティブな体験となるように工夫することです。「だったら、オレも人肌脱ごうか」「じゃあ、私も応援する」という気持ちを市民の皆さんに持っていただくこと。それは、いただいた税金で行政を司る私たちがするべき当然の努力だと思います。例えば、先日の「二十歳の式典」での”ド派手衣装”のこと。長年批判されてきて、北九州市のマイナスイメージの代表格として全国的に知られてきました。それが、「実は、批判されても諦めずに、若者の想いに応え続けようと努力してきた」とか「親の力を借りずにバイト代を貯めてこのハレの日に自分を表現したいと頑張ってきた」とか、その裏側にある『物語』が添えられることで、事象の持つ意味合いや”共感”の度合いは大きく異なってきます。私たち公務員というのは、公平中立、無色透明、匿名で活動することを求められるが余り、そこに込めた思いやそこに至る『物語』を語ることが憚られる側面があります。しかし、私たちだって人間、色んな市民の方の想いや苦労に報いたいという感情がある。そんな方々から生まれてくる『物語』こそ、これからの時代に必要であり、北九州市民みんなの心を前向きにワクワクさせるためには、『物語』の力がとても大事だと考えています。これは市民の方に限りません。北九州市に観光に来てもらう、移住してもらう、投資してもらう、などなど、の局面で、私たちが、「他の都市とは違う魅力」を語り、共感してもらうためにも『物語』が重"},
  {vol:31,date:"2024年01月22日(月)",title:"日本一若者を応援する街へ",content:"昨日、教育委員会が企画した「スー１☆グランプリ」が開催されました。受験用とは異なる、本質的な数学的思考力を試す問題で、中学生３人１組の４７チームが競う大会。政令市では初めての企画でした。数学を応用して活用する企業や大学等のブース展示もあり、充実の内容。難問に唸りながらも、色んな視点を仲間と交わし合い、考え、楽しみながら（折り紙を使った問題もあり。）取り組む姿は、見ている大人たちもワクワクする素晴らしい企画となりました。学校の授業とはまた異なる達成感、社会との接続を見える化したこと、グランプリというエンタメ性、チラシなどのデザインのクオリティの高さなど、見ていて私もワクワクしました。「若者の流出を食い止めよう！」「若者が集まる街に！」そう言われて久しい北九州市の状況を、私は何とか変えたいと思っています。雇用の問題だよね、綺麗なオフィスが必要だね、商業施設がないから…など、諦めに似た評論の声もよく耳にしますが、必ず糸口はあります。若者が振り向く北九州市にしていくチャンスは豊富に眠っています。そこを掘り当て、試行錯誤しながら、政策を打っていきましょう。２０２４年は、その大きな挑戦の年にしたいと思います。そのためには、「今ある街の力をめいっぱい伝えること」と「挑戦を応援する風土をめいっぱい創ること」が肝ではないかと考えています。若者達は、世の中を見ています。風を感じています。本質を見抜いています。表面的な要素だけではなく、本気で若者たちに向き合い、彼らに語り掛け、彼らを応援する街に変わること。そこが勝負だと考えています。まず雇用。北九州市には、”玄人好み”のBtoBの企業がたくさんある。確かな技術、職人的な魂、オンリーワンの技も。中堅や中小零細含め、そんな企業の魅力を、本気で伝える、届けていく。マーケティングを本格的に進める。TOTOや安川電機はじめ、世界とつながる大企業があり、それを支える企業や人材がいる。そんな都市の魅力と特性をもっとインパクトのある形で伝えること。それも通り一遍の「説明会しました」「動画にしました」程度ではなく、思い切り心に突き刺さるようなコンテンツを創らなければならない。インターンや職場の開放もアリかもしれない。ある日を、「どのモノづくりの現場にも出入り自由」にして、見ることのできる日があってもいいかもしれません。そして「挑戦を応援する」こと。二十歳の式典で私が述べたように、「誰かの価値観を否定するのではなく、みんなで応援し合う」スタンスで臨みたいと思います。ド派手衣装を、個性からファッション、北九州市発の世界に誇る文化にまで押し上げてくれた若者の力を、彼らと直接触れ合うことで確信しました。例えば、若者の提案を施策に反映していくこと。特にSDGs教育を受けた世代が徐々に上がって来るのだから、彼らのエコに関する感度の高さに基づくアイデアを官民一"},
  {vol:32,date:"2024年01月29日(月)",title:"市政変革への思い",content:"令和6年度の予算編成に向けた作業が大詰めを迎えています。各部局の皆さんには新たなビジョン、市政変革の流れを踏まえながらの精力的な予算編成作業に心から感謝いたします。議論する中で、市政変革を踏まえた予算編成作業において、私の市政変革への思いや方向性を組織全体に浸透させていく必要性を痛感しています。今後、様々な形で市役所の皆さんすべてに変革の考え方と方向性が明瞭に伝わるように工夫していきたいと思います。なぜ「変革」が必要なのか。それは「北九州市が生き残るために必要なことだから」です。これまでの人口が減少し、企業が撤退し、扶助費が増大し、建物が老朽化し、そうした縮小の流れを続けていけば、街は生き残ることができません。滅びていく道をたどることになるかもしれません。私は、何としてもこの流れを変えたい。反転させたい。「人口100万人への挑戦」も、「稼げる街」への転換も、そのためにやらなければならないことです。できるできないの論争をしている場合ではなく、その方向に向かって実行を積み重ねるのです。思い出してください。行政の役割とは何か。それは、この街を、子どもや孫たちに、堂々と胸を張って引き継ぐ仕掛けと流れを作ることです。できるできないを論じるのではなく、やらなければいけないこと、すなわち北九州市が今後も未来永劫生き残り、繁栄していくために必要なことを今、実行しなければなりません。私の市政において、行政の役割とは、「今ある仕組みや事業を淡々と安全に回すこと」である、とは定義しません。激しい社会経済の環境変化の中で「時代を生き抜いていく力を北九州市に創ること」である、と定義します。北九州市を、もっと人と企業とお金が集まる街にすること。そのために他の自治体と差別化し、競争に勝って、それらを引き寄せること。すなわち、「富を増やすこと」と「他の都市に勝つこと」。そうして生まれた果実を医療や福祉や文化や教育に回し、人々の暮らしの彩りと安心に回していくこと。「稼げる街」を起点として、「彩りある街」「安らぐ街」につないでいくこと。そして、生活の楽しさや安心が新たな経済活動に繋がっていくこと。これらの循環づくりこそが私が目指す方向性です。もっと行政の役割に引きつけて考えてみましょう。行政とは、工場もなく、部品を作る場でもありません。行政の役割の大部分は「資源配分を適切に行うこと」です。強制的に徴収された税金を用いて配分し、あるいは市民・企業の方々に声をかけて人や企業の力を引き出し、協働していくことです。ドライに言えば、金の使い方、人の使い方（時に土地やモノの使い方）を正しくすることです。都市の力を強めるか弱めるかは、この金、人などの資源配分（使い方振り分け方）をちゃんとすることができるかどうかにかかっています。だから、これまでの金の使い方で良いのか。人の活かし方で良いのか。場所をうまく使え"},
  {vol:33,date:"2024年02月05日(月)",title:"北九州愛",content:"先週、「北九州愛」のすごさを強く感じる2つのイベントがありました。1つは２月３日土曜日の「地球の歩き方・北九州市版」の刊行を記念したイベント。多くの方が集まりました。そして出版社の方が驚くほどの売れ行き。発売日翌日には増刷が決まるなど、大きな話題を呼んでいます。特に、地元の方の購入がとても快調。子供や孫たち、ご友人たちと、この街の素晴らしさを共に分かち合いたいと言う地元の方々の熱い思い。東京でも、多く売れているそうです。北九州に所縁のある方々の熱い情熱が、売り上げに現れています。そしてもう一つは、2月2日金曜日に東京目黒・八芳園で行われた「６０周年だヨ！全員集合「北九州市ファン感謝祭」」。東京事務所が頑張って開催してくれました。300人以上の方が、7000円の会費を払ってまで集まってくれて、本当に大盛況でした。北九州出身の各高校同窓会の皆様、関係する企業の皆様、かつて赴任しておられた方々など、大使館の方まで、本当に多くの方が参加してくださり、すごい熱気。私も2時間、名刺交換だけで終わってしまうと言う盛況ぶりでした。感謝祭の中で、著名なある方に、こうも言われました。「無料でいいから、これからも北九州市のことを手伝わせてください。いつでも声かけてくださいね。」と。有難い、北九州市への思いです。これこそ、北九州市の力です。「北九州愛」の底力です。市民の方はもとより、北九州市出身、北九州市に住んだことがある、北九州市の人たちと一緒に仕事をしたことがある、そうした方々が北九州への「愛」を持って盛り上げてくださる、集まってくださる。みんなが家族のように、北九州市のことを嬉しそうに、楽しそうに、語り合っている。これは北九州市にとって大変な「宝」です。であればこそ、このファンベースを、どうやって北九州市の力に変えて行くのか。また北九州市という街の価値（バリュー）につなげていくのか。そこを私たち行政マンは、突き詰めて考え、実践しなければなりません。それを考えるに当たり、なぜ、こんなにも北九州市は、関わった方々に強く愛されるのでしょうか？私が考えるに、 まず1つには、住みやすさ、食事のおいしさ、自然の豊かさなどスペック面での魅力があるでしょう。一度住んだら、訪れたらかなりの確率で気にいっていただける、街の力です。2つ目には、人のつながり、優しさと熱さ、人肌感あふれる街の空気感。率直で裏表のない人柄。そこに大きな魅力があると思います。企業誘致などで東京の企業の方と話していても、「こんなに熱意のある自治体はないですよ」「引くくらい、皆さん熱い」とも仰ってくださいます。そして3つ目には、価値観があると思います。日本の産業を引っ張り、公害を経験しながらも環境先進都市となった都市としての物語。五市合併の歴史によって、多様な文化を受け入れる包容力や多様性。そうした、まさに「一歩先の世界観」"},
  {vol:34,date:"2024年02月13日(火)",title:"災害に強い都市として",content:"元旦の能登半島地震による被災状況に関する報道には胸を締め付けられる毎日です。家族を喪った方、大切な我が家を失った方。そして今も、避難所で不安に震え、心身の疲労と不調に悩まされる方。被災から１か月余りを過ぎて、疲労困憊の状況かと思います。心からお見舞いとお悔やみを申し上げます。私たちにできることは何でしょうか。北九州市としても、既に人的・物的・経済的支援を全方位から行っています。危機管理室をはじめ、関係部署には、元旦から情報収集と支援策の検討に力を注いでもらい、感謝します。その後も、応急給水業務への派遣を皮切りに、下水道や家屋被害認定調査、保健師や教員等の専門職や事務職の派遣など、１００名以上の職員の皆さんが派遣されています。現地でしっかりと任務を果たされ、リーダーシップを取って活動してくれている職員の皆さんを誇りに思います。現地では、余震への恐怖のうえ、被災地へのアクセスルートが断たれ、厳しい寒さが支援活動を厳しいものとし、支援する皆さんの宿泊地の確保も容易でない状況であると報告を受けています。これまでの地震とも様相を異にする、厳しい状況の中で、被災された皆さん、支援する皆さんの力になれるよう、これからも知恵を絞って、気持ちに寄り添って、支援を進めていきたいと思います。北九州市は、比較的、地震災害に強い都市です。それは有難いことです。であればこそ、同じ国内で、地震の被害に遭われた地域へ、人々へ、しっかりと心を寄せて、我がごととして、できる限りの支援をしていきましょう。私自身も、厚労省時代、東日本大震災に当たって、医療や薬剤の提供や、計画停電への対応などに当たった経験があります。昼夜問わず、現地からの情報を収集・分析し、混乱させないよう思慮しながら、時に臨時の規制緩和や指示を出して、対応しました。その後、現地に入り、目を覆いたくなるような状況を目の当たりにし、避難したくてもできない高齢者の方々と施設職員の方々の支援体制や人材確保に奔走しました。「災害は忘れた頃にやってくる」と寺田寅彦氏は言いましたが、今の日本では、忘れもしないうちに災害が繰り返される時代に入った気がします。日本列島、いついかなるときでも、備えを怠らず、被災された地には、手を取り合って支え合う、それがこの時代を生きる私たちの宿命です。防災や災害支援のときにつくづく思うことは、「コミュニティ」の大切さです。いざという時に、初めまして、どんな方ですか？どう動きましょうか？では間に合いません。避難、支え合い、あるいは、支援といった局面で、”顔の見える関係””想定しておいた動き方”が重要です。北九州市内でも、各地の自治会やまち協などで、防災に関するイベントや啓発を実施していただています。またその前提となる「つながり」づくりの活動が行われています。これらの価値は、平時はもとより、災害のような急時に大きな意"},
  {vol:35,date:"2024年02月19日(月)",title:"就任１年を迎えて",content:"火曜日、2月20日で私の市長就任から1年が経過します。この1年は、16年ぶりの市政の転換、と言う大変革期であり、通常の年にない、新ビジョンの策定、市政変革、産業戦略の策定など、大きな作業が積み重なり、動乱の1年だったと思います。しっかりとこの中で支えてくれた皆さんに心から感謝したいと思います。就任以来、何がどうあろうと、この街の空気を明るく、この街を強くしていこうと走り続け、動き続けてきました。まさに「転換と前進の1年」でした。その過程では、北九州市の持っているポテンシャルのとてつもない大きさに目を開かれました。北九州市のポテンシャルに良い意味で大きなショックを受けた1年でもありました。私の北九州市への確信は、さらなる確信に変わりました。北九州市は、もう一度元気に、強く、そして優しくなれます。多くの皆さんの努力の積み重ねや力の結集によって、就任後1年で大きな「成果」がいくつも出てきました。具体的には以下に示すように、企業誘致の件数と投資額は過去最高(記録の残る昭和58年以降で)、物流の北九州行きフェリー貨物量は過去最高、ふるさと納税の寄付額は過去最高、観光で言えば小倉城の入場者数は戦後創建された昭和34年、35年を除いて過去最高、人口の社会増減については、地方創生の取り組みが開始されて以来、コロナ明けの極端な数字が出た令和4年を除いて最も改善、月別で見ても過去最長となる8ヶ月連続の社会増を記録しました。記者会見の報道だけに限って見ても、北九州市のメディアに掲載件数は前年比の30%増。まさに、北九州市に新しい動きが、新しいうねりが始まった1年でした。〇企業立地就任後(R5.2.20～)の企業立地状況は、件数88件、新規雇用1,253 名、投資 額2,565 億円。件数と投資額はともに、記録の残るS58 年以降過去最高。〇物流令和5年の北九州港フェリー貨物量は5,040 万トンで過去最高を更新。〇ふるさと納税令和5年度の実績は、R6. 1末時点で寄附件数11万超、寄附額21億円超と、過去最高であった令和4年度の寄附件数・寄附額を超え、過去最高を更新。〇観光小倉城の令和5年度入場者が23万人を超え、戦後創建された昭和34年、翌35年を除いて過去最高となる見込み。〇発信メディア掲載件数対前年比3 0%増(会見分)〇人口R5年の社会動態は、地方創生の取組を開始したH27年以降、特別な理由(新型コロナによる入国制限の緩和等)があるR4年を除いて最も改善し、 月別でみても最長となる8か月連続プラスを記録。私自身も、中央省庁での多くの人脈や、政権中枢とのパイプを駆使し、またビジネスの世界でのネットワークも最大限活用して取り組んできました。北九州市にとっての長年の悲願であった空港滑走路の3000メートル化の決定・着工をスピードをもって実現、期待を上回る2027年8月末には供用"},
  {vol:36,date:"2024年02月26日(月)",title:"答えは市民の中にある",content:"私が官僚を辞めて民間企業でセールスとマーケティングの仕事をしていた頃のこと。ある商品をどう売るかと言うプロジェクトのミーティングの時、私はデータ分析を行い、仮説を述べて打ち手の提案をしました。その時、プロジェクトリーダーにこう言われました。「机の上での分析ばかりで本当の答えが見えてくる？実際に利用者さんの声を聞いた？利用者の声を聞かずに机の上で、頭の中で考えていても何も答えは出ない。今すぐ利用者の皆さんのところに意見を聞きに行ってください。」私は、こう言われて、頭を金槌で殴られたような気がしました。利用者のニーズ。求めるものとは？それを頭でっかちに考えても何も生まれない。「大体こんなもんだろう」と常識と勘を働かせて仮説を立てても、解像度の高い、納得感のあるアイディアにはつながらないことを学びました。言われてみれば当然のことでした。私自身も、幅広い種類の意思決定をするとき、確信が持てないこと、判断に悩むことは当然あります。皆さんも、日々の政策づくりや事業の執行で迷うことがあるでしょう。そうしたとき、「答えは市民の中にある」と思い出してください。最近、市長室での議論で、提案がハラ落ちしないとき、私は「すぐに市民の皆さんの意見を聞きに行ってください」とよく言います。例えば、「子供に優しい公園づくり」について。何が必要なのか、何ができるのか、一生懸命アイディアを出してくれ、穏当な案だし、一定は理解できるのですが、納得までいかない。私は、直ちにまず10人でも20人でもいいから子連れのファミリーの意見を聞きに街に出て行ってほしいと指示しました。もちろん、アンケートや意見交換などをこれから行う予定は盛り込まれていました。それでも私は、まず初動として、市民の皆さんの声を聞いて欲しいと指示しました。色んな事案で、こういうことがあると思います。「偉い人が言ったから」「声の大きい人が言ったから」、だからやる、では無く、市民の皆さんの本当のニーズを聞いてほしいのです。もちろん、リソースの制約や政策判断もあるので、すべて応えることは無理なこともあるけれど、考えやアイディアの解像度を上げるために重視して欲しいと思います。今は、市民の皆さんのニーズも多様化している時代、アンケートをとればすぐにわかるものではありません。ときには１対1でじっくり話を聞く、あるいは実験をしてみることも必要です。絶えず市民のもとに行き、ニーズを知る。目と耳と肌でしっかりつかむ。それをこれからの政策づくりに際して大切にしていきましょう。市民の皆さんからは、なるほどと思うようなアイディアとか、見落としていた視点とか、あるいは少しストレッチした要望とか、いろいろな発見があって、面白いですよ。それから、”まだ見ぬもの”を想像し要望されることは難しいので、言われたことがそのまま正解、というだけでなく、隠れたニーズや課題を"},
  {vol:37,date:"2024年03月04日(月)",title:"Ｚ世代課に込めた思い",content:"Ｚ世代課。思いがけず全国ニュースに取り上げられ、注目を集めています。北九州市からアグレッシブなニュースが発信できる事は嬉しいことです。テレビのインタビューでもなぜＺ世代課を作ったのか？と問われました。一般的な答え。若者の流出を止めるための若者政策を強化するため。若者政策を専門に扱う部署を作るため。各部局の若者政策を縦割りでなく横串しで見ていくため。この通りです。「若い人の流出を止めてほしい」「若者の地元定着が問題だ」と言いながら、本当に全力を尽くして私たちは手を打ってきたのか？そこに明確にチャレンジすると言う強い意志を、この課の設置で表現したかった。それは当然のことです。さらに、今回は、私の意図する、より深い意味での真意をお伝えします。それは「私たちはＺ世代から学ばなければならない」と言うことです。「声を聞く」ではありません。「学ぶ」のです。Ｚ世代は、時代の風に、高いアンテナを立てています。彼らの感覚やニーズ、はとても鋭敏で、次の時代の姿を暗示してくれています。その世代の発想や感覚から学ばなくして、どうして次の時代に持続可能な都市を作ることができるでしょう？実際、去年私が結成した市役所職員による「Ｚプロジェクト」のメンバーとも何度かミーティングをさせてもらいました。彼らは、まだ自分たちの価値観や感覚や発想を十分に言語化できないところはあるし、個別のアイディアや切り口を一般化することもできないところもあります。でも明らかに次の時代を指し示すようなヒントをくれるのです。私たちはそこから学ばなければならない。そこから学べるかどうかがこの街が次の時代で生き抜いていけるのか、差別化できるのかの大きなポイントになる、と考えているのです。それはどんなものでしょうか、まだ私は学んでいる途中ですから、確たる答えを持っていませんが、現時点で、次のような3つの要素があるのではないかと思っています。①「マッチョなモデル」が少し違うと感じていること。Ｚ世代の方と話していると、かつての日本が経験した高度成長モデルや大企業に街全体を引っ張ってもらう、寄らば大樹の陰、と言うモデルを余り信用していないように感じます。「効率性」や「生産性」と言う概念さえも、彼らからすると、古臭い尺度なのかもしれません。むしろ彼らが大切にしているのは、ユニークなこと、創造性があること、そして時にオンリーワンのミクロな魅力であること。大企業を引っ張ってくる誘致するだけでなく(もちろん、それは今の北九州市にとっては大事なことですが、)マイクロ起業や、北九州市にしかない面白い企業を発掘すること、ユニークなビジネスアイディアを持っている企業を応援すること。そして、経済の分野でも環境の分野でも福祉の分野でも「面白い人」を見つけ出し、それをしっかりとプレイアップして伝えていくこと。「あの街は面白い」とならなければＺ世代は振"},
  {vol:38,date:"2024年03月11日(月)",title:"楽観と悲観",content:"今は議会の真っ最中。皆さんには大変頑張って対応いただき、感謝します。議会の議論は、行政の案に対して、多面的に、どこに課題があるのか、論点を懸命に探してチェックするという役目を果たすことになっています。制度上、「行政」と言う権力機構が暴走しないように、それをチェックするのが彼ら彼女らの役割なので、行政の案に\"BUT\"ということが多くなり、\"Let's\"というチャンスは限られてしまいます。(国の場合は議員内閣制なので、Let'sも多くなりがちですが。)したがってその対応はタフなものになりますが、それらの意見を考慮しながら行政を進める。まさに健全な緊張関係が必要な事は言うまでもありませんそうした中、今回は「楽観と悲観」についてお話しします。あなたは、楽観的？悲観的？どちらのタイプですか。もちろん、両方とも大事です。ちなみに私は「楽観」であります。より正確に言うと「短期悲観、長期楽観」を心がけています。スポーツの試合でも、大事な試験でも、しっかり悲観的に準備して、大胆に楽観的に本番に挑む。それが大事だと思っています。世の中についても、目の前には課題や難しいことが多いけれど、きっと世の中は良くなる、良い方向に私たちは向かっていると考えています。どちらが正解ということもありません。世の自己啓発本には、個人のレベルでは「ポジティブ思考」を勧めることが溢れています。元気と勇気、はたまた運が良くなるには楽観が必要だと。ところが、世の中のことになると「ネガティブ思考」が溢れています。メディアや有識者やSNSは、徹底的に世の中の動きについて悲観的。政府や首相など、とりわけ権力機構に対してはやってることが間違ってる、うまく行かない、はたまた陰謀だ、などと悲観論が多くなりますよね。個人には楽観を勧める一方で、社会には悲観を拡げる。なんとも皮肉な構造です。悲観的な方が、知的で鋭いように思えるからかもしれません。世の中に楽観するのはお人好しでダサイと思われるからかもしれません。悲観の中には、嫉妬や自己顕示欲が入っていることも少なくありません。さて、改めて悲観論とは賢いことなんでしょうか？今朝の日経新聞の記事によると、実際はその逆のようです。英国で2017年に28カ国であった調査によると、人類の進歩について「最も知識が少ない人」が「最も将来を悲観している」と言うデータがあるそうです。各種調査で、悲観的になる人の方が死亡率が高いことも明らかにされています。よく知らない、よく考えないことが、悲観論につながることも証明されているようです。確かに正しい悲観論や危機感を煽る事は人を怒りに駆り立て、怒りが行動を促すこともあります。しかし、悲観論は本当の意味で「人」の「心」を動かすでしょうか？ダメだダメだと言っている人は、周りの人を諦めさせるし、ストレスを溜めさせるし、ゲンナリさせるし、人が持っている本"},
  {vol:39,date:"2024年04月01日(月)",title:"人口論について",content:"土曜日に髪を切りに行きました。いつもカットしてくれる方が、お客さんたちの会話や噂話を私にこっそり教えてくれます(笑)嬉しい事は、私が市長になって以来、「明るい話題が多くなったね」「新しい方向性が打ち出されてきたね」と言う話をよく聞くそうです。そして何より嬉しいのは、「最近は市役所の動きが良くなった。速くなったね」とか「区役所の応対が前より親切になった。職員のやる気を感じます」とのお褒めの言葉を聞くとのこと。とても嬉しく思います。そうした前向きな対応をしてくれている職員のみなさんを誇りに思います。私は、北九州市という街に、「北九州市に住んでいる」「北九州市で働いている」と言う誇りや自尊心をもっと強めていきたいと考えています。いろんな新しい取り組みをして「北九州市はすごいね」と言われるような街にしていきたい。それを「誇らしい」と市民の皆さんが思い、他の都市や他の方々から褒められるようになると、様々な政策に反対していた人も、意識が高くなり、前向きに検討するようになります。この街への誇りや自尊心が明確なものとなれば、市民の皆さん自らが自分で立とう、と言う気持ちになっていきます。そして地域の雰囲気が変わり、良い方向に全てが回りだす。そうした流れや雰囲気を作っていく、引っ張っていくのが市長である私を始め、市の職員の役割だと思います。市民の皆さんに自立心や自尊心、自己肯定感をもっと持っていただく。「この街は凄い力を持っているんだ」「自分はその中で欠かせない役割を果たしているんだ」と言う気持ちを持てば、人は苦しい局面でも頑張れる。そういう街にしていきたいと思います。好循環が回り始めるまでは、「どうせ無理」とか「そうはいっても難しいよ」という（自信の無さに起因する）批評や批判を浴びるでしょう。でも、その先にある好循環を創り出す。まずはそこまで進んでいきましょう。その典型的な話題が、人口論です。私が掲げている「人口１００万人を目指そう！」というスローガンについての必ずしも生産的でない議論が時折見られますね（実際、スローガンと個別政策を混同していますが。）。人口減少を食い止めようというのは合意事項のはず。ならば、その合意事項にわかりやすい錦の御旗を立てることが大切です。わかりやすい目標設定がなければ、何十年も続いた状況への反転攻勢などできません。今まで足りなかったところは、ゲームチェンジするほどのビジョンも抱かず、産業用地すら十分に整備できていなかったところです。私がお伝えしているのは、「１００万人」という旗印で、市民みんなで、もう一度立ち向かおうよ、ということ。たとえ難しいハードルであっても挑戦しようということです。それを「無理だ」「いつ達成するのか」と不毛な論評を繰り返しても何も生まず、市民の力も湧きません。大切なことは、「１００万人」を旗印に、各政策分野で、できる限りの努力"},
  {vol:40,date:"2024年04月01日(月)",title:"新年度に",content:"さあ、いよいよ、新年度を迎えました。人事異動した人、しなかった人、みな新たな気持ちでスタートしたことと思います。私が市長に就任してからの初年度は、たいへんな動きのある一年、北九州市における「時代の大転換期」を迎えました。多くの貢献してくれた皆さんに感謝したいと思います。それを経て、いよいよ、具体的な動きや展開を見込む、大切な年度が始まりました。引き続き、皆さんの力を信じ、最大限引き出せるよう、私自身も努力していきたいと思います。いま、時代は「平時」ではありません。大きな時代の変化に向き合っている「急時」だという認識を持ってもらいたいと思います。私は、我が国の三大課題は、少子化・国際情勢・地方活性化、の３つであると考えています。北九州市から、これらの課題にアプローチできることは数多くあります。時代を創る思いで、大きな夢と理想を描きつつ、新たな北九州市づくりを進めていきましょう。16年ぶりの市政転換。まさに北九州市の大きな転換期であり、これまでの発想や行動様式を変えるタイミングに来ています。大きなチャレンジではありますが、皆さんの職業人生においても意義深い時となるよう、みなで、共に、力を合わせて、進んでいきましょう。心を合わせ、変化と進化を楽しむ気持ちで進みましょう。今回は、４月１日に、私から、新入職員の方々にお伝えするメッセージ（挨拶）文を以下にご紹介します。既にお伝えしたことのある内容でもありますが、改めて、ご紹介します。【新入職員への訓辞】新規採用職員の皆さん、入職おめでとうございます。ようこそ北九州市役所へ。共に北九州市の未来を築く仲間として加わってくれたことに感謝します。これから始まる行政マンとしての仕事にドキドキもワクワクもあると思います。これからの職業人生では、楽しいこと、やりがいを感じることがある一方で、迷うこと、悩むことも少なからずあると思います。その際、皆さんに1つだけ心に留め置いていただきたい言葉があります。それは、「答えは市民の中にある」と言うことです。これから様々な悩みにぶつかった時、答えがわからなくなった時、毎日を懸命に生きている市民の皆さんにとって何が良いのか、ということを軸に考えてみてください。身近の大きな声や上からの声に揺らぎそうになったとき、「答えは市民の中にある」ということを思い出してください。そのために大切なことは「歩く」「話す」「学ぶ」ということ。悩んだときこそ、地域に出て歩き、市民と話し、その思いや現実を学んでください。そうすれば見えてくるものがあります。答えは市民の中にあるんです。私が昨年2月に北九州市長に就任するまで、私は地を這いなめずる思いで、２万人ほどの市民の皆さんと会って直接語らってきました。最後の半年だけでも、400回のお話し会を行い、700回の辻立ち演説を行いました。それでも十分ではなく、まだまだ学ばなけ"},
  {vol:41,date:"2024年04月08日(月)",title:"新年度に達成すること",content:"新年度始まりの1週間いかがお過ごしだったでしょうか。はじめての環境で緊張と疲れも出た方もいたのではないかと思います。桜が咲き誇る中、新年度を迎えた清々しさを胸に、これからの1年間、力合わせて頑張っていきましょう。新年度に何をするか。令和6年度は、深い意味のある年です。約15年ぶりに、新たな市の「ビジョン」ができました。これに基づき、新しい市政へと、さらにギアを上げていく一年となります。各部局、各担当ライン、そして各人において、新たなビジョンをどのように自分の仕事に落とし込んでいくのか、考え、実行して欲しいと思います。その際、私から今年度に達成したいことを、事業の各論としてではなく、柱として3点にまとめて、お伝えします。① 1人でも多くの人や企業に北九州に来てもらう、知ってもらうこと。「稼げる街」へ、とにかく多くの人が北九州市を訪れ、楽しみ、お金を使ってもらう。この観点からそれぞれの事業を精査・創造してください。バージョンアップさせてください。あらゆる局面で「需要」を創造すると言ってもいいです。例えば、人の流れをどう作るか。市内各地の観光地を廻る定番ルートを作ること。最寄りの駅からイベントの場所まで新たなモビリティーの実証をやってみること。ミクスタや市立美術館に集客するイベントを創ること。(先日、都市ブランド創造局の職員が、「美術館で眺望を活かして飲食ができるイベントができないか」、ということを話していました。そういうことも一案です。）市内の種地やオープンスペースを新たな施設や企業誘致にどう使うか考えること。商店街に新しい魅力やイベントを作り出す工夫をすること。北九州市の政策や事業活動を全国に魅力的に発信すること。国際的なネットワークを強化すること。これらは一例ですが、色々と隠れたポテンシャルやニーズがあるはずです。多くの人が企業に対して、北九州市を印象づける。そして新しい北九州市のイメージを広げていく。産業やイベント関連部局だけでなく、保健福祉や子育ての分野でもチャレンジをしてもらいたいと思います。②街に「目に見える変化」を起こすこと。次に、「変化の可視化」「見える化」です。①のように、多くの人や企業から北九州市にアテンション（注目）を集めるには、そして市民の皆さんが街に出て、楽しみ、お金を使ってみようと思うには、「変化を見える化する」ことです。目に見える変化とは何か？最近の例を言えば、「地球の歩き方・北九州市版」の発行や、先日の「おいしい学校給食応援団」の設置などは実にうまい仕掛けでした。先々週の鎌田實さんによる健康づくり講演会には、700人の座席が満員になっていました。変化が「目に見える」企画だったと思います。今後、若者による「シン・ジダイ創造事業」でどのようなイベントや仕掛けを街全体に広げることができるのか。あるいはナイトタイムエコノミーの魅力をどう商"},
  {vol:42,date:"2024年04月17日(水)",title:"新ビジョンとは自己紹介である",content:"「それが市民の日々の生活や暮らしにどんなメリットや変化をもたらしますか？」私は、先週のヤマト運輸の定期貨物便の就航に際して、それを担当職員や市長公室の職員に問いました。「市民の暮らしに路線の就航はどのような変化をもたらすのか？」「生鮮品が早く届くようになる？」「多くの地域から多様な食材や製品が入手できるようになる？」など、新たな事業や政策が「市民の暮らし」にいかなる変化を及ぼすのか、それをこれからも明確に言語化してほしいと思います。北九州市における企業の立地や連携協定等は、基本的にBtoB (ビジネスとビジネス)が多いですね。したがって、一般の市民の皆様にはあまりなじみのない企業や、ややもすると技術的専門的な連携や立地も多くなってきます。それが市民生活にどのような影響があるのか？もちろん「雇用が増える」ということはあるでしょう。しかし、市民の生活にどんな変化がもたらされるのか、それを明確に言語化するよう努めてほしいと思います。どのような政策も事業も、「市民の暮らし」に変換されて、初めて意味を持ちます。共感を得られます。市民の皆さんが”目に見える変化”を期待できること、予想できること、あるいは五感で感じられること、そのような「変換」をする努力をしてほしいと思います。そうした意味で言うと、変換されて初めて意味を持つものに、「新ビジョン」があります。今年の4月から皆さんは、新ビジョンを具現化すべく、仕事を進めていただいていると思います。新ビジョンとは、都市を「人」になぞらえた場合の「自己紹介」です。お題目として高く掲げているだけのものではなく、それが目に見える、五感で感じられる、そういう形で表現することが大切です。新ビジョンが策定されたことによって、それぞれの政策や事業がどのように変化をするのか、それぞれのセクションで議論をしてもらいたいと思います。新ビジョンが「自己紹介」だとするならば、2つのことを意識しておく必要があります。①新ビジョンとは、その街に対する「期待値」を表現するものであるということ。新ビジョンは、市民の皆様、市外の企業や人々に対して、北九州市という街に対する「期待値」を高めるためのものです。したがって、お題目ではなく、実践し、証明し続けることが必要になります。「北九州市ではこんなことが起きそうだ」「北九州市はこんな方向性を持っているから共感できる」といったことを感じさせる必要があります。「新ビジョンとは街の『期待値』を高めるためのもの」と強く認識をしてください。その期待値こそがこの街、北九州市への人の流入、企業や投資家の投資の原動力となるのです。②「期待値」は、人口や企業や投資の総量と等しくなるということ。どのような場合にその街に人がやってくるか？どのような時に企業が進出をしてくるのか？どういう理由で投資家が北九州市に投資をするのか？端的に言えば"},
  {vol:43,date:"2024年04月22日(月)",title:"拍手を送ろう",content:"突然ですが、皆さん「拍手」をしてますか？誰かがミーティングで良い発言をした時、イベントで誰かが登壇する時、仕事で良い成果を出した時、誰かのプレゼンを聞いた時。「大きな拍手」を送り合う文化を作りましょう。以前、市民文化スポーツ局の若手職員の提案コンテストに出席した時、みんながものすごい勢いで拍手しあっているのが印象に残りました。活気に満ちて、気持ちが高揚する空間がありました。また、海外の方々、特に中国や韓国、台湾の団体が北九州市を訪れられた時、ものすごい拍手をされること、まさに「拍手喝采」であることに驚きました。表敬訪問の時、一人ひとりの発言にも拍手をする、北九州市側のプレゼンに対してもものすごい勢いで拍手をする。拍手をすることが、その国や地域、組織のエネルギーのバロメーターのように感じられてならないのです。拍手をすれば自然と元気が出る。元気が出れば自然と拍手をするのです。私は、讃え合う文化、褒め合う文化を北九州市役所や北九州市全体に根付かせたいのです。褒められれば自信がつく、自信がつけば動機付けされる。動機付けされれば行動が起きる。行動が起きれば街が前進する。他方、なぜ私たちは拍手をためらう、あるいは褒めることが少ないのでしょうか？それは「やって当たり前」「できて当たり前」で、「できなかったらNG」、という減点主義が巣食っているからだと思います。減点主義の下で新しいアイディアは出ません。減点主義でチャレンジする意欲は湧きません。ここは”加点主義”に変えていきましょう。そのために、良い仕事をした際には、印象的なコメントをした時には、激励したい時には「大きな拍手」をする。それを各職場で励行してみてください。きっと空気が変わります。より本質的に「拍手をする」ということは、「相手に関心を持つ」ということでもあります。関心を持ち、褒めることによって、人と人のつながりや化学反応が生まれます。一人ひとりの同僚を大切にすることになります。その際のポイントは、具体的に、目に見える形で、大げさに褒めてみることです。特に若いスタッフに対しては「いい仕事をすれば、認められる、褒めてもらえる」という経験を数多く持っていただくことが大切です。私がかつて、官僚の世界から外資系企業に移った時、驚いたことがありました。やはり官僚時代は、同僚や後輩の仕事を褒め合うことが少なかったのですが、企業に移ると、ほんの小さな成功でも、「これはすばらしい成果だ、この提案は大きくクライアントの業績を変えるに違いない」「こんな『目からウロコ』のコメントをくれるのはすばらしい」といった言葉がメールやチャットで頻繁に交わされていることに驚きました。人は誰でも褒められて悪い気がしません。元気が出ないわけがありません。ある研究によれば、「人は褒められている時、意思決定の質が40%上がる」というデータもあるそうです。拍"},
  {vol:44,date:"2024年04月30日(火)",title:"私たちの、４つの話法",content:"『私たちの、４つの話法』先週、あるミーティングで、どうしたら政策が上手く伝わるのか、議論していました。その時「言葉が難しくて心に届かないのではないか」という意見が出ました。行政が発する言葉、私たちが発する言葉をどう相手の”心”に届く「言葉」にするのか。実に大事な視点です。民主主義とは、コミュニケーションです。何度もここで書いているように、多くの市民の皆様の共感と納得を得て初めて、私たちは市政を進めることができます。「言葉」の重要性をもう一度思い起こしましょう。いま、SNSはじめ、言葉が雑に、無責任に使われることが多くなった気がします。一度発された言葉というものは、相手の心を震わせ、勇気づけ、モチベーションを与えることもある一方で、使いようによっては、相手を追い詰め、ときには殺める（あやめる）ことさえあります。「言葉」の使い方に私たちはもっと敏感で注力していく必要があります。そこに繊細さと優しさを持たなければなりません。常々私は、私たちが行う「話法」には、「４種類のものがある」と伝えています。もう一度紹介したいと思います。それらを意識して使い分けていただくことが肝要です。１つ目は、「BtoGの話法」です。「G」とはすなわち「議会」などです。陳情や要望に対する役所らしい答え方もこの部類です。BtoGの話法では、できる限り主観や情緒的な側面を抑え、正確で論理的な言葉や表現を使う必要があります。聞く相手も一定の行政知識や専門用語に理解がある前提です。聞かれていること以上に話すことも期待されていません。順を追って丁寧に、背景から考え方まで、説明していく。したがって、使う言葉も行政用語をパズルのように組み合わせて論理構成していく。理性的に、論理的に。だから、文語調に、長めになることもあります。”お役所答弁”とも言われる、きっちりとしたコミュニケーションが必要な場面です。２つ目は、「BtoBの話法」です。「B」とはすなわち「ビジネス」です。一般ビジネスの世界でのコミュニケーション。企業誘致の際など、企業の方々と話すときの話法です。この時には、簡潔で、ズバリとポイントを突いた言葉、冷静な論理が大事になってきます。そして、大事な事は「聞き手にとってのメリットを示す」ということです。お互いにwin winとなるにはどうしたらいいのか。それを示さなければ、ビジネスシーンでは説得力を持ちません。そして、ビジネスの場合は、数字やデータを入れることが大事になります。ビジネスパーソンにとって金額やマーケットの規模など、数字を織り交ぜて話せなければ、説得力を持って相手に伝えることができません。相手が、自分の会社に戻って社内で報告をするときに説得しやすいような数字を提供する感覚です。BtoBは比較的ドライな世界ですし、スピーディさと、ある種の”ホンネ”が大切な世界ですので、皆さんの普段の理性"},
  {vol:45,date:"2024年05月07日(火)",title:"成長の思想",content:"ゴールデンウィーク前、２つの室（市政変革推進室・市長公室）といろいろな議論をする機会がありました。その時に私が参加者からの質問に何でも答える時間を作りました。そして、共通して出た質問に「市長はどのような時に『最も成長した』と感じましたか？」というものがありました。私の答えは「恥をかいた時。修羅場を経験した時。失敗と言う言葉は使いたくないが物事がうまくいかなかった時。」若い頃、スピードも知識も足りず、上司や同僚の期待に応えられずに深く落ち込んだ時。官僚の世界から外資系企業に移って1週間で「役に立たない」とクビを実質宣告された時。県知事選挙に出て大敗を喫し、すべてを失った時。そのほかにも、数多くのうまくいかなかったことがありました。そんな大恥をかいた、うまくいかなかった時にこそ、「成長」を感じました。自分にうぬぼれはなかったか？環境を甘く見てなかったのか？相手の立場に立てていたか？そのときどきに、自問自答し、成長しなければいけないと痛感しました。また、成長には痛みが伴います。まさに「成長痛」ですね。「向かい風の方が凧は高く上がる」という言葉もあります。逆境や厳しい環境に置かれ、うまくいかなかった時こそ「成長のチャンス」だと心の底から思います。(だから私には、「逆境を楽しもう」という酔狂なところもあります。）田坂広志さんの言葉に「成長の思想」という言葉があります。人間の成功には、①競争の勝者となること、②目標を達成すること、③人間として成長し続けていくこと、の３つがある。①と②は果てしない競争や目標達成への欲望に駆られるという問題に直面し、欠乏感はいつまでも満たされない。③の「成長の思想」を抱いて歩むと、困難に遭遇してもそれを「可能性を拓く機会」と見ることができる、毎日何らかの成長しようという心持ちから「1日を生き切る」という心構えが生まれる、と指摘されています。まさに、人間としての幸せ、人生としての幸せは「成長」にあるという考え方です。命尽きるまで、歩み続けていく、そして成長していく。それが人生の充実につながるという考え方です。私も、20代の時、稲盛和夫さんの著書を読んで「人生の目的とは、自分自身の魂を磨き、美しい心、美しい魂を作り上げていくことにあるのではないか」という言葉に出会い、衝撃を受けました。何も私は深い宗教的な関心や哲学的な考察に励んでいる人間ではありませんでしたが、自分に降りかかるすべてのことが自分の成長を促してくれていると思えると、あらゆる艱難辛苦が肥やしとなると感じる強さを纏うことができたような気がしました。（まだまだ道は遠く、日々精進の身ではありますが。）「明日死ぬかのように生きよ。永遠に生きるかのように学べ。」というのは、マハトマ・ガンジーの言葉です。誰か他人の評価尺度ではなく、自分なりに成長したと思える日、今日1日を生きた日と思えることが"},
  {vol:46,date:"2024年05月13日(月)",title:"見えないものを見る",content:"「大切なものは目に見えないんだよ」(サン＝テグジュペリ作「星の王子さま」）という言葉があります。既に目の前にあるモノやコトだけでものを考えると、本当に見るべきものが見えなくなる、そんな意味合いだったかと思います。私たち行政にあてはめれば、見えないニーズ、声にならない声を見つけ出すこと。それを教えられているような気がします。さて、「プロダクトアウト」と「マーケットイン」という概念をご存知かと思います。「プロダクトアウト」とは、良い技術や大量に安いものを作れる方法で製品（プロダクト）を市場に売り出そう（アウト）と言う発想です。まず製品（プロダクト)があって、それが市場に売られていくという順番で考えます。別の見方をすれば、「良いものを作っていればマーケットの方が買いに来てくれる」という発想にもつながる考え方です。「マーケットイン」とは、市場のニーズをすくい取ってそれに応えるようにプロダクト(製品)を作るという発想です。不安・不満・不便といった「三つの不」を解決することによって新しい製品が生まれるとも言われます。アンケート調査やマーケティングリサーチによって、帰納法的に製品開発が行われるという順序です。北九州市は、ものづくりの街、技術の街という歴史もあってか、「プロダクトアウト」の発想が強いと指摘されることもあります。立派な技術で、良い製品があれば、自然と売れる、マーケットに届く、という発想が強いという見方です。ここで、私たち行政も、「プロダクトアウト」に陥る危険性をはらんでいることを思い起こす必要があります。事業や制度が用意されていれば、必要な人はそれを使いに来てくれる、予算をつけて事業化していれば誰かがそれを活用させてほしいと手を挙げてくる。そういうプロダクトアウトの発想になりがちではないか。そこを注意することが大切です。そこで大切なのは「マーケットイン」の行政です。市民の皆さんが、企業の方々が必要とされている問題や課題をベースに考え、それを解決する形で事業や制度を組み立てるという順序です。時には、他の都市でどういうことをやっているかを参考にしながら、時代の流れを捉えたり、国の方向性を踏まえて事業化していくのも「マーケットイン」の形の一つでしょう。それは「様々な声を聞いて、それに応える」という意味では「プロダクトアウト」より一歩進んだものです。業界や市場の要望に応えるという行政の形です。しかし、今回、私はさらにもう一歩先を行ってほしいと提案します。それは「シチズンイン」若しくは「ユーザーイン」と言っても良いでしょう。まだ市民や企業の皆さんが見えていない潜在的なニーズや、あるいは想定していないサービスを行政の側から作り出す。新しい行政需要をこちらから喚起していく。それによって企業や人が北九州市という街に魅力を感じ、そして他の自治体が北九州市に追随してくる。オンリー"},
  {vol:47,date:"2024年05月28日(火)",title:"WHYから始めよう",content:"『WHYから始めよう』この表題と同名の書籍もかつてヒットしましたが、ぜひ、このことを意識してほしいと思います。「この事業の目的は何ですか？」「このイベントはなぜ開催されるのですか？」「なぜこの方と面会するのですか？」「この作業をする目的は何ですか？」それらの問いに対して、明確にクリアに答えることができるか。深く考え尽くしているか。それはとても大事なことです。「WHY（なぜ）」を突き詰めることが、とても大切なこと。「WHY-WHAT-HOW」。これらを意識して政策を進めることが大切です。特に「WHY」を私たちはどこまで突き詰めているでしょうか？一致させているでしょうか？手元にある事業に照らしてみてください。ありとあらゆる仕事や業務や事業の「WHY」を突き詰めて考えてみてください。例えば、あるイベントをする場合。そのイベントの「WHY」は何か？街が稼ぐため？若い人を集めるため？市民の連帯を深めるため？市のブランドを全国に発信するため？どれも正解になり得ます。だから「そのすべてです」という説明を受けることがあります。バランスを取る行政官らしい説明でもあります。でも、「WHY」がたくさんあって、いろんなことを同時に狙っていると、結局どれも中途半端な達成しかできず、「WHY」がぼやけてしまい、意識から遠のき、共感を得ることが難しくならないでしょうか。一点だけに絞るのが難しいとしても、「今年はこれだ」「優先順位はこれだ」と決めていく勇気が必要となります。そして。「HOWに走るな！」ということも大事です。行政では、正確で間違いのないことが第一のミッションになりがちです（私も行政にいたので、その気持ちはよくわかります）。ロジ、段取りをきちんと設計して、事業やイベントをやること自体が目的化してしまう。危険な罠です。ＷＨＹそっちのけでＨＯＷだけ作り込んでしまう。危険な癖です。「そもそも何のためにやるんだっけ？」「そもそも出したい成果って何だっけ？」そこから離れて、細かいロジや段取りばかりを設計していないか、注意が必要です。それでは関わる方の心にも響きません。「WHY」をクリアにすることによって、3つのメリットが生まれます。1つ目は、「無駄がなくなる」こと。「WHY」を明確にすることで、ＷＨＹと関係ない部分をそぎ落とすことができます。「ＨＯＷ」に走ってしまうと、いくらでもＨＯＷは作り込むことができます。２つ目は、「求心力が高まる」こと。人は「ＨＯＷ」に共感するのではありません。「ＷＨＹ」に共感するのです。その目的なら「一緒にやろう」「力を貸そう」という人が出てくる。多くの人の心を一つにすることができます。３つ目は、「成果を図ることができる」こと。1つのクリアな「ＷＨＹ」があるからこそ、それがどの程度達成したのか、次回に向けてどう改善すれば良いのかがより明確に見えてきます。事業やイ"},
  {vol:48,date:"2024年06月03日(月)",title:"最前線は生命線・区役所論",content:"ここ数週間で、区役所の方々、特に若手職員と懇談する機会が何度かありました。区長からの「若手職員に講演してほしい」との依頼や「移動市長室」など。昨年の「ミライ・トーク」をはじめ、若手職員を中心に、区役所の職員の皆さんが懸命に各区の魅力を発掘し、発信しようと、いろいろなスポットやその地域の自然や歴史、企業の素晴らしさを教えてくれて、私自身も学ばせていただいています。まだまだ面白いところ、知ってもらいたいところがたくさんある。彼ら彼女らの活き活きとしたプレゼンテーションや魅力を語るときの眼差しは、とてもまぶしいものがありました。SNS用の撮影スポットづくりや写真撮影ボランティアの募集、キッチンカーによるにぎわいづくりなどなど、オリジナルな取組みもいいですね。言うまでもなく、区役所は「最前線」です。そして市政の「生命線」です。なぜか。以前からここで書いているように、私は「『サイレント・マジョリティ』の市民の皆さんを大切にする市政をしたい」と強く思っています。「サイレント・マジョリティ」とは、必ずしもいろいろな団体や組織に入ることもなく、議員や市役所職員と日頃から話をしているわけでもなく、それでも毎日の暮らしを懸命に堅実に生きている市民の皆さん。子育てや介護、仕事で忙しく、市政のこともちらっとテレビで見るくらいで、慌ただしい毎日の中で、家族や暮らしを切り盛りしている市民の皆さん。そうした方々の思いに応える市政を私たちはしていきたいと思います。そうした市民の皆さんが、きちんと税金を納めてくださり、地域のルールを守り、次の世代を育み、人生の先輩方を大切にケアしてくれている。そんな方々に思いを致す、そして「声なき声」に応えていく市政こそ、私の目指したい姿でもあります。（もちろん、時間と労力を割いて、しっかりと声を挙げて伝えてくださる皆さんも大切であることは言を俟ちません。）「最前線」である区役所には、市民の皆さんから様々な相談や困り事が寄せられると思います。時には、何がリクエストのポイントなのか分かりづらいことや、不満や不便を訴えられるのは分かるがどう解決していいのかわからないことも多いでしょう。何とかして差し上げたいけれど、制度や予算の制約もあり、ご希望に沿うことのできないもどかしさを感じることもあるでしょう。国の制度や事業内容が頻繁に変わるので、それに追いつくための勉強のし直しや知識のアップデートだけでたいへん、ということもあると思います。市民の皆さんの人生や暮らしに関わるご相談には、白黒つけられるクリアなことの方がむしろ少なく、創意工夫して一緒に解決しなければならないことも沢山あるのではないか、と思います。しかし、そこにこそ市政の大切なポイント、「生命線」があると思います。市民の皆さんの人生や暮らしにおいて、どのような隠れたニーズがあるのか、思いがあるのか、具体的にど"},
  {vol:49,date:"2024年06月10日(月)",title:"マスメディアについて",content:"皆さん、「メディア対応」は好きですか？それとも苦手ですか？こんなにも日常の仕事が記事やニュースになる可能性が高いのは、北九州市内でも市役所くらいではないでしょうか。同時に、こんなに記事やニュースで翻弄される仕事が多いのも市役所くらいでしょう。思いのほか大きく取り上げられたり、思いを込めた取材対応だったのに全く取り上げられなかったり、思いもよらない角度から報道されたり。そんなことがたくさんありますよね。メディアの仕事に少しだけ関わったことがある身として、ぜひメディア対応を苦手に思わないでほしい、受け身にならないでほしいと思います。市政の情報を伝える貴重なシステムとして、マスメディアの役割は大きいのです。市政を宣伝してくれるのも、時に私たちの気づかない誤解の余地や不足点を教えてくれるのもマスメディアです。私は、基本的に週１回記者会見をしています。おおよそ１時間前後、時には90分をオーバーすることもあった気がしますが、なるべく質問が尽きるまでやっています。また、毎回の記者会見の準備にはトータルで２時間くらいかけており、関係する職員の皆さんにも、事前のレクや資料作成などでご協力いただいています。つまり、相当の時間を記者会見のために割いているということです。私は記者会見で、根掘り葉掘り聞かれるのがとても大切な仕事であり、大切な時間だと思っています。その理由として、まず1つ目は、「論点がわかる」からです。私たちが誠心誠意仕事をしていても、「なるほどそういう見方があるのか」「そういう観点から見たらもう少し工夫しないといけないな」といった論点を記者の皆さんが教えてくれます。質疑応答の中で、思いもよらぬ角度からの質問も来ます。「そんな見方しなくてもいいのに」と思うこともあります。でも、それが「貴重な学び」になるのです。市政で行っているものがどういうふうに市民の皆さんに受け取られるのか、市民の目から(ときには悪意を持った、あるいはひねった見方で)どんなふうに見えるのか、そこを教えてくれる大切な”壁打ち相手”でもあるのがマスメディアです。「よくも悪くも、いろんなものの見方が世の中にはあるんだな」ということを教えてくれるのが、記者たちとのやりとりでもあるんです。２つ目は、市民の皆さんに「届く言葉を考える」良い機会になるからです。行政の内部に入ると、行政用語や、法律用語、あるいは組織内で使う用語でコトが済みますよね。まさに共通言語を持っているからこその効率性と気楽さがあります。しかし、市民の皆さんにはそうはいきません。どのような言葉で記者に伝えれば市民の皆さんにうまく伝わるのか。独善的にならないよう、噛み砕いて言うとどういうことなのか。そうしたことを突き詰めていくうちに、仕事の本質が見えてくる、その事業の意味や位置付けが見えてくることだってあります。昨今、マスメディアに対しては、「マ"},
  {vol:50,date:"2024年06月17日(月)",title:"国際スポーツで「稼ぐ",content:"』バレーボールのネーションズリーグは、最後まで大変な盛り上がりと興奮に包まれ、昨日、北九州市開催を終えました。前半は男子で歴史的な熱狂を目の当たりにし、後半は女子でオリンピック出場が決定するなど、「北九州市からパリへ」というフレーズのとおり、多くのことが叶った大会でした。前半の男子の成果だけを見ても、観客は「44,302人」という大きなインパクトを残しました。日本男子は「3勝1敗」という結果、 FIVB 世界ランキングも4位から「3位」にランクアップ。これは、日本男子バレーボール代表にとっての歴代最高順位を見ました。日本の活躍だけでなく、ドイツ対トルコ戦の第２セットも世界から注目を集めました。非常に長いラリーが続き、1 セット中に世界記録となる延べ112本のラリーが続き、1点を取るために30回以上のラリーが繰り返された場面もありました。「北九州市」という街の存在感、認知度アップに貢献してくれた大会となりました。そして、大会関係者の皆さま、市民の皆さま、そして連日会場で運営に携わってくれた職員の皆さんの協力のおかげで、その運営の素晴らしさが国内外で高い評価を受けました。皆さまに改めて御礼申し上げます。https://search.app/brFPK7P8nVPSW8R56私自身も、改めて、国際スポーツの魅力とチカラを体感しました。私は常々、「人間社会の中で、老若男女が垣根なくピュアに楽しめるものは『スポーツ』と『アート』だ」と言っています。この2つは、ゲームや作品の中では、人間社会の利害特質や不透明なしがらみを極小化して、偉大さと楽しさと美しさをもって、見る者を感動させてくれます。まさに、人間生活の営みの中で欠かすことのできない要素であり、人間が本来持っている「真・善・美」を体現してくれるものだと思います。（もちろん、その裏側では様々な格闘はあると思いますが。）さて、今年の北九州市は、「国際スポーツ大会」の年です。今回のバレーボールだけでなく、秋冬にかけては、「ツール・ド・九州」「卓球WTTファイナルズ」、そして「パルクールの世界選手権」まで、目白押しです。これらの機会をどのように目いっぱい活かして、この街の元気と明るさと存在感につなげていくのか。そこが勝負です。国際スポーツ大会を「こなす」だけに止めないよう、チャレンジしていくことが大切です。「国際スポーツ大会」にいろんなものを掛け合わせて、新しい風景を北九州市からつくっていきたいですね。まず1つ目は、スポーツ大会と「観光」の掛け合わせです。今回、大会関係者にミールチケットを配布したことで、多くの関係者が街中に繰り出し、食事をする、街を見る、という機会づくりが実現しました。スポーツ大会など大規模イベントの関係者が、地域と接点を持たない、地域に潤いをもたらさない、というのでは、もったいなさすぎます。大会関係者の"},
  {vol:51,date:"2024年06月24日(月)",title:"投資したくなる街へ",content:"私たちの目指す「稼げるまち」の一丁目一番地は、アテンション（注目を集める）とともに、「投資したくなる街」、「投資を呼び込む街」になること。それが本丸です。「投資」とは企業進出、再開発、ホテルや商業施設の開業、スタートアップ投資、学校の新設など、様々な側面からの「投資」です。まちづくりを進めたくても、民間投資がなければ進みません。「商業施設が欲しい」といっても住宅投資や商業施設への投資がないと進みません。北九州市は近年まで、大型民間投資が比較的低調な時期を過ごしてきました。民間ベースの再開発の大型案件があまりなく、目立った商業施設の進出もあまりなかった。大手ゼネコンのプロジェクトリストにも入っていない、と聞いたことがあります。いま、この流れを変える時です。私たちには大きなチャンスが来ています。昨年の企業誘致による投資額の実績を見れば、「2,580億円」と過去最高を記録しました。まさに民間投資が、北九州市に確実に目を向け始めています。インフラの充実、技術を持った企業の集積、クリーンエネルギー、リサイクル、立地の有利さ、人材育成の力、地震や災害の少なさ、そして生活環境と住みやすさ。安全安心も整ってきました。力は十分あります。それを発揮する大きな転換の時期を迎えているのです。さて、なぜ「投資」が大切なのでしょうか。「稼げるまち」の本丸なのでしょうか。「投資」が大切な理由は、「循環」の回転の向きを変えるために重要だからです投資減少(撤退含め)→雇用減少→人口減少→税収減少→公共投資減少→民間投資減少、というサイクルをたどっていきます。このダウンスパイラル、”悪循環”を変えるために「投資」が必要なのです。投資増加→雇用増加→人口引き込み→税収増加→公共投資増加→民間投資増加、というサイクルへ回転させることが目標です。それらを動かす大きなテコとなるのが「投資」なのです。特に「民間投資」です。企業も、ホテルも、店も学校も、このサイクル、アップスパイラル（好循環）が生まれてこそ可能になってくるのです。税収増で財政力が生まれることで、福祉や地域づくり、文化や教育といった政策により力を注ぐことができます。そして、より市民の皆さんが働きやすいまちづくりにつながります。それがさらに、「人と企業を呼び込む」という好循環を生むのです。シンプルな構造でもあります。かつてより、北九州市という自治体は「国の予算を取るのが上手」と言われてきました。それは素晴らしいことで、職員の皆さんの先輩方の努力の賜物でもあります。しかし、今は国の財政も厳しく、どれだけ民間投資を取ってくるかが勝負になっています。1500以上の自治体があり、20の政令指定都市があり、近くには強力な福岡市が存在し、そのような環境の中で、どう投資を引き込む街へと変わっていくのか。ここで、皆さんが企業や人やスタートアップ企業に投資する"},
  {vol:52,date:"2024年07月01日(月)",title:"ストーリーは創れていますか？",content:"『ストーリーは創れていますか？』今年の仕事始めの日、市職員の皆さんに今年のテーマは「ストーリーを創ろう」と伝えました。市長室の前にも、私が揮毫したその言葉の色紙が置いてあります（色紙はストーリーではなく「物語」ですが）。今年も半年が経ちました。皆さん、ストーリーを創れていますか？ストーリーを考える際、まずはこの動画を観てください。https://youtu.be/VyzqHFdzBKg?si=4FgjoxLyUBkSxVZ0\"connecting the dots\"。iPhoneを作り出したスティーブ・ジョブズ自身の「ストーリー」です。これを見た多くの人が心揺さぶられたことと思います。これがストーリーの力です。バラバラだった点が1つになった瞬間です。同時に、このストーリーを聞くたびに、何故か私は勇気をもらえます。どんな困難や理不尽なことがあっても、いつか\"connecting the dots\"。きっと何かにつながっていくのだ、と思えます。私は今年、機会あるごとに「ストーリーを創ろう」と、職員の皆さんにお伝えしています。早速皆さん、いろいろとトライをしてくれています。なぜ、ストーリーが必要なのか？それは何と言っても「共感」を得るため、創り出すためです。市政は、行政だけでは仕事ができません。様々な価値観や好き嫌いがある世の中で、できるだけ多くの人の心を動かし、ワクワクを生み出し、人や企業に共感をしていただくことが必要です。そうすることで、経済が回り、人が助け合い、この街が前向きに進んでいくのです。iPhoneのマーケティングにも現れています。もしiPhoneが次のように売られていたら、どちらを買いたいと思いますか？（ア）素晴らしい携帯電話をつくりました。とても高性能で便利な製品です。皆さん買ってください。（イ）これまでと違う考え方(Think Different)によって世界は変わります。その思いを形にしたいと言う志から1つの携帯電話が生まれました。ぜひ手に取ってみてください。後者だから、熱狂的なファンが生まれます。便利で使い勝手の良いものというだけでなく、そのストーリーや志にみんなは共感し、そのストーリーを共有したい、あるいは、そのストーリーに登場する人物のひとりにさえなりたい、そういう思いで人はiPhoneを購買するのです。さて、北九州市を振り返ってみます。北九州市こそ、日本で比類なきストーリー豊かな都市です。幸運なことです。その代表例は、高度経済成長の負の側面として生まれた公害を、女性を中心とした市民の皆さんの声をもとに克服し、そして環境先進都市に生まれ変わったというストーリー。これは、世界でも冠たる素晴らしいストーリーです。だからエコタウンに、国内だけでなく、海外の政府要人や大企業の幹部社員がわざわざ視察に来て、投資したい、各国に伝えたいと言ってくれて"},
  {vol:53,date:"2024年07月09日(火)",title:"市長への手紙",content:"本当に炎暑が続いています。夏本番に向け、熱中症、体調に気をつけて過ごしていきましょう。街を歩けば、小倉祇園太鼓の音も聞こえるようになりました。土曜日の夕方に太鼓の練習に参加させていただいた路地裏で、世代を超えて、地域の伝統を引き継ぐ有難さや尊さを体感しました。この祭りの時期を、インバウンドをはじめ、もっと市外の方が観光に来たり、参加できたりするといいと思います。実に素晴らしい祭りが市内各地で引き継がれていることは、北九州市の大きな喜びであり、力であると感じます。さて、市長「からの」手紙ではなく、私のところには市長「への」手紙も、「市長への提案箱」という形でたくさんいただきます。私にとっても、組織にとっても、学びや気づきになる提案が多くあります。昨年春から始めましたが、1年半近く経ってより鮮明に理解できることや、ハッと気づかされる内容があります。送ってくださる職員の皆さんに感謝します。職務環境に関すること、予算や市政変革の実情に関することなど、できるところから、提案は活用させていただいています。切実な訴えもありますし、市長の立場からは見えにくいことも教わります。中には、7ページもの分量で考えや思いをペーパーに綴ったものや、「組織に全体知が必要」との鋭い指摘などもありました。全ては直ちに実現できませんが、いいと思うものは検討・実行するように関連部署に指示しています。私は「学び合う」組織にすることが大切と考えています。職位が上だから、下だから、というヒエラルキーによる考え方ではなく、タテ・ヨコ・ナナメに意見を交わし、よりいいものを見出す作業が欠かせません。もちろん、先輩方の経験や英知も大事。他方で若い方々の感性やアイディアも大事。両方がサンドイッチとなってこの組織は進化し、より市政の在り方が成熟すると信じています。現場の不満や改善事項に関する提案も多い一方で、「この方はとても素晴らしい」「こういう仕事にもっと光を当てて欲しい」といった提案もあります。私淑する先輩や同僚の、目立たないが意味ある仕事などを、そっと私に教えてくれるような提案です。同じ職場にいて、リスペクトの気持ちを持ち合うことは尊いものです。見えていなくても、そんな仕事があることや職員がいることに、私自身も心動かされるものです。今後も、具体的な業務や政策テーマについての提案はもちろん、目立たないけれど素晴らしい仕事をされている方、秘かに地元で地域のために汗をかいている職員の方についての提案もいただければうれしいです。また、職員がどうしたら成長できるのか、毎日ワクワクして仕事できるのか、無用なストレスを減らして健やかな毎日を暮らすことができるのか、そういった提案も、ぜひどしどしお寄せください。必ず私が目を通します。ラクになること、仕事が減ること、スピーディーになることは、基本的には大事なことです。しかし、"},
  {vol:57,date:"2024年08月06日(火)",title:"キタキュウオリンピアンの熱闘(オリンピック応援で考えたこと)",content:"連日熱戦が続いているパリオリンピック。先週の土曜日にはパブリックビューイングを小倉昭和館で開催し、卓球の早田ひな選手、バドミントンの松山奈未選手の２人のメダリストがキタキュウオリンピアン（北九州ゆかりのオリンピック選手）から生まれました。小倉昭和館で市民の皆さんと喜びを分かち合った瞬間は最高でした。様々なアレンジや舞台設定をしていただいた皆さん、ありがとうございます。私も歳を経るごとに、試合の結果そのものよりも、選手一人ひとりのこれまでの道のりや裏側での努力のほうにばかり目がいってしまい、涙腺が緩んでしまいます。早田ひな選手が負傷を抱えて必死の３位決定戦を勝ち抜いた姿は、多くの感動を呼びました。それぞれの選手のストーリーに心が揺さぶられる。それがオリンピックの魅力です。メダルの有無にかかわらず、すべてのキタキュウオリンピアンの皆さんから北九州市に「感動」と「夢」を与えていただいたことに、心から感謝したいと思います。スポーツは、フェアに点数が付き、勝負がクリアにつく。だから人は熱狂できるのだと思います。また、選手の喜びや苦しみ、葛藤や格闘に、見る者が多かれ少なかれ、自分の人生と何か重ね合わせながら見てしまう。だから共感が生まれると思います。必ずしも順風満帆ではない、でも必死にもがきながら、困難を乗り越えて前に進もうとする姿に私たちは心震えるのだと思います。他方で、頑張っても必ずしも形として報われるわけでないこともあるし、不運にも突然の怪我に見舞われることもあります。それも含めて、私たちの人生や世の中を思い起こすこともあるかもしれません。そういう予測できない、努力しても越えられない壁が生じたとき、それを社会保障制度をはじめ、どのように政策として、行政として支えるべきか、そんなことにも思いを馳せます。私の小学生の子どもはそうですが、北九州市の子どもたちもオリンピックに夢中ではないでしょうか。子どもたちが「日本」という国を感じながら、”本気の大人たち”を見る。大人たちが本気で喜んだり泣いたりしている姿を見る。その時に人間の感情をも学ぶことができます。また、いろんな国の名前を耳にして、世界の広さを知ります。私の子どもは、地球儀を指差しながらいろんな国との出会いをオリンピックを通じて行っているようです。そして何より、北九州市出身のオリンピアンたちの活躍に、子どもながらにシビックプライドを感じているようです。まさに「北九州市からパリへ！全力応援プロジェクト」の意味がそこにもあります。オリンピックの開催前には、何人かのキタキュウオリンピアンが市役所を訪問してくださいました。私が印象に残ったのは、どの選手にもオーラがあり、人に感じさせるものがあったことです。その佇まい、目の輝きに心を揺さぶるものがありました。心身とも真っすぐに研ぎ澄まされた選手たちから発されるエネルギーには、"},
  {vol:58,date:"2024年08月15日(木)",title:"父の遺書ほか",content:"１５年前に突如、脳梗塞で逝った父親の遺書に「３つのことをしなさい」と書いてありました。「周りの方々に感謝をしなさい」「生涯、ずっと努力を続けなさい」「世界の平和に力を尽くしなさい」なんだ父さん、３つ目が、えらく急にスケール大きくなるな～、なんて思ったりもしましたが、戦前に生まれて、満州から引き揚げて、貧困を生き延びて、名もなき市民として、普通に、当たり前の生活を送れることを、「幸せ、幸せ」と言って老後を過ごした父の切実な思いだったのでしょう。人の命は何よりも大事。その大事な人の命を最も大量に、理不尽に奪うのが戦争。だから、戦争を考え、伝えるのが大事。それが８月１５日。父の時代に、若き命を捧げた人たちがいます。鹿児島・知覧の特攻平和会館。展示される特攻隊員たちの”最後の手紙”や写真の数々を見ると、出撃前夜の”笑顔”に、言葉にならない感情がこみ上げるばかりです。敵機に体当たりする、という特攻が成功したのは全体の１割。多くは不時着、撃墜などで志を遂げずに亡くなりました。二十歳前の男子約400名。彼らは、”最後の手紙”に託した様々な思いを抱えたまま、時に笑みを湛えて発っていきました。もちろん、特攻に強い反発があり、遺された方々にとっては、あまりに非業であったとも言えます。それでも、現実に、国を守るため、自ら犠牲となって、命を捧げた若者たちが数多くいたことは事実です。そこにあった、国を守る意気。親を思い、子を思い、国を思ったであろう心。手紙を読むだに、二十歳前後とは思えぬ、達観した感覚と青年の青い感性が交錯していることに心が震えます。遺した子どもや妻への思い。婚約者への思い。そして、見送る親の気持ち。家族の結びつきもまた、手紙の中に色濃く書かれていました。「孝行」という言葉も随処に現れます。妻や子を守りたい、という責任感も滲んでいます。日本人の原点のひとつとして捉える人も多い中、彼らの命をかけた姿に、自分の生き方をも顧みます。今の日本がこれでいいのか。彼らの尊い思いや命を思うと、引き継いできた”日本”という国は、彼らに見せて、胸を張れるのか。しっかり立て直し、守り、引き継がなければ、まず彼らに申し訳ない。そんな思いを抱きます。自由さと豊かさを謳歌する中で、置き忘れたものは大きくないか。劣化しつつはないか。そんな問いを胸に突きつけられます。そして、私には、学びをくれた人がいます。先川祐次さん（故人）。満州で育ち、終戦時は２５歳、その後、西日本新聞の米国特派員など活躍されて来られました。先川さん曰く、「本当に日本は戦争が骨身に沁みているのでしょうか。本土決戦はなかった。全体で見れば、死者３２０万人のうち、空襲で亡くなった方は一部でもある。全国民が戦争で死ぬような経験をしたのでしょうか。」経験と認識の違いが、日本の戦争をめぐる言説を曖昧にしている、と見られていました。「それ"},
  {vol:59,date:"2024年08月19日(月)",title:"なりたい自分を演じること",content:"皆さん、お盆休みはどのように過ごしましたか？　普段、公務で見せる表情と違い、家族の中のパパやママだったり、ご両親の息子や娘であったり、地元の友人と軽口を叩き合う仲間のひとりであったり、公務で見せる顔と違う自分に戻れる時間があったならば、嬉しく思います。もしかすると、この4月から、新任の係長や課長、部長、局長になって、そのプレッシャーからほっと一息、心の武装解除をされた職員もおられるかも。新規採用され、無我夢中で4ヶ月を走ってきたけど、ふっと素の自分に戻ってリラックスされた職員もおられることと思います。あるいは、この数ヶ月の仕事を振り返って、自分のイメージどおりにいかなかったことなどを少々振り返られた職員もいるかもしれません。そこで今回、私は、「演じる」ことの重要さをお話ししてみたいと思います。 言うまでもなく、人はいろんな「自分」を演じ続けています。行政マン、パパやママ、地域の仲間、好きなことに没頭する趣味人、恋人やパートナーと一緒にいる自分など。それぞれの役割や場面で、自分を使い分けている。それは現実ですよね。もちろん公務では、北九州市職員としてその役を果たしている。行政マンとして求められる振る舞いや言動をベースとしつつ、仕事の中に少しでも個人としての自分の価値観や感情や思いを注入していく。それが職業人生だと思います。さて、新規採用や若い職員の方々は、どんな自分になりたいでしょうか？　新しく管理職になったり、ポストが上がった職員の方々はどんなリーダーになりたいでしょうか？　そこに近づいている実感は持てているでしょうか。そんな時に、「なりたい自分を演じること」で自分の成長を促す、ということを意識してみてください。リーダーの方々、どんな局長や部長や課長だって、求められる役割に沿って自分を演じているものです。私だって、やはり「市長」という自分を演じている部分が多分にあります。誰だって始めからリーダーの器を持っているわけではないし、私の場合は、「市長」という、一種の人間像を毎日「演じること」で、自分自身が成長したいと考えているのです。演じ続けることで、その演技は板についてくる、やがて自分の体や心に染み込み、本物になっていく。人間の「成長」というのは、きっとそんなものだろうと思います。スポーツでも同じですよね。型やフォームを意識してしっかり覚え、何度も何度も繰り返し練習するうちに板についてくるものです。自然にできるようになるのです。そして大事なことは、そうした繰り返しで、自分の心と体がワンステージ向上していく。だからぜひ、皆さん、なりたい自分や、なりたいリーダー像を明確に心に描いて、なぞってみてください。そのように演じてみてください。そうすることで、新しい自分に出会い、自分の器が大きくなり、成長を感じられるはずですから。特にリーダーとしての役割を担う皆さんは、「リー"},
  {vol:60,date:"2024年08月28日(水)",title:"失敗を直視する、学ぶ",content:"以前の手紙でも書きましたが、「武内市長はこれまでの人生で、どういう時に一番成長しましたか？」という質問をよく受けます。私はこう答えます。「一番成長するのは、いつも恥をかいた時です」私たちにとって大事なことは”失敗”から学ぶこと。私は”失敗”すること自体、特に、”挑戦してうまくいかなかった”こと自体は歓迎したいと思います。大事なのは、「失敗から学ぶ」こと、「うまくいかなかった」ことをどう直視し、振り返り、学ぶか、です。今、職員の皆さんが抱えている事業や、日々の業務の中で、「思ったよりうまくいってないなぁ」「こんな結果になるはずじゃなかった」と思うような案件があれば、それはとても大切な機会です。次の成功へのチャンス、成長への糧と捉えるべきです。ただし、それは、しっかりそのことを振り返り、直視し、学びを得る場合に限ってですが…。いろんな”失敗”が世の中にはあります。仕事、家庭、受験、スポーツでの試合、人間関係など。未熟なことも、準備不足なことも、運悪くなったことも、誰かの罠にかかることも、いろんな”失敗”が世の中にあります。大事なことは、その”失敗”を直視し、何がうまくいかなかった原因なのかを問いかけ、明らかにし、そして学びを得て、「知」として蓄積していくことです。私も、多くの失敗を積み重ねて、今があります。過去の自分を思えば、顔から火が出るほど恥ずかしいこともいくらでもあります。しかし、大事なのは、”失敗すること、うまくいかないことを直視すること”。立て付けが悪かったのか、準備不足だったのか、コミュニケーションの仕方が悪かったのか、いろんな原因を問いかけることです。公務員という職業は、誤解を恐れずに言えば「正当化」が求められがちです。税金を使い、ベストではなくてもベターな判断をし、反対者の意見と日々対峙する中で、「間違っていました」とは言いにくいこともあるかもしれません。もちろん物事には「100%失敗」などということもありませんし、「１００点満点」ということもありません。個人の価値観によって、不合理に”失敗”のレッテルや謗りを受けることもあるでしょう。行政というのは、「与えられた現実の中でベターな判断をしていく作業」の積み重ねでもあります。評論家や批評家ではなく、実行者であるからこその宿命でもあります。でも、だからこそ、私たちは肝に銘じるべきです。思うような価値を生みだせなかった事業、途中で混乱した政策、様々な誤解を招いてしまった説明。これらを「仕方ない」「間違ってない」と片付けるのではなく、「それがどうして引き起こされたのか」、そのことを勇気を持ってしっかりと直視する、振り返る、そして学びを得る。そのプロセスを大切にする謙虚さと勇気を常に持っていきたいと思います。うまくいかなかった部分やちょっとした間違いを針小棒大に言い募り、叩き落としていたら、責任ある仕事を"},
  {vol:61,date:"2024年09月02日(月)",title:"小倉総合特別支援学校を視察して",content:"先週、小倉総合特別支援学校を訪問しました。肢体不自由や病弱の子どもたち約150名が学んでいます。「ゆっくりと成長する」子どもたち。その子どもたちと向き合う先生方。心配りが行き届いた給食。そして明るい給食室の調理士さんたち。学校の日常の中にも、様々な心配りや安全確保への思いを感じました。給食ひとつとっても、子どもたちが食べやすいように５段階の柔らかさの給食が準備され、慎重に丁寧に子どもたちを支えるスタッフの皆さんの思いや努力を感じました。北九州市の公共施設「共通」の悩みである老朽化の問題、スタッフの専門性の向上・確保の課題、保護者さんたちからの要望や思いにどう答えるのか、災害の時にどのように子どもたちの命と安全を守るのか。それらの課題にも、一つひとつ石を積み上げるように、保護者さんたちと共に課題を解決されるスタッフの皆さん。職員室の100名を超える先生方の並んだ机を見ると、いかにこの学校が多くの専門スタッフの皆さんの思いと努力、チームワークで成り立っているかを感じました。ところで、私の母も障害があります。母が40歳の頃からリウマチを患い、動かなくなる手足、増していく全身の痛みに苦しんでいる姿を間近で見てきました。徐々に外出できなくなった母の趣味は、ハンカチ集めでした。タンスの1番上の引き出しには色とりどりのハンカチがきれいにアイロンされてしまってありました。「こんなにたくさんハンカチ集めてどうするの？」と尋ねると母は「このハンカチを持って、いつか出かけるときのことを想像してると楽しいんよ。」と答えました。不自由になっていく苦しさを抱えながら、いつか笑顔で自由に外出できる、そんな日を思い願っている母の姿がありました。現在、日本人の約17人に1人に障害があり、発達障害や難病を含めると10人に1人、障害の当事者やそのご家族を含めると5人に1人は、何らかの形で障害がある方に関わっていると言われています。この世の中には、力の強い人も弱い人も、体が柔らかい人も硬い人も、何かが得意な人もいれば、反対にそれが苦手な人もいます。人はみんな、少しずつの差（個性）＝”グラデーション”を持ってこの社会の中にいます。そうした様々な個性や凹凸のある人間どうしが、ブロックのように組み合わさってでき上がっているのが、この世の中だとも言えます。だからこそ、「ノーマライゼーション」「地域共生社会」が大事になってきます。「与える人」「与えない人」という二分法ではなく、互いに必要な時には「支え、支え合う」。だって、どんな人も、形は違えど、支えられずに生涯を過ごすことはできませんから。私が厚生労働省に勤めていた時代も、様々な障害者政策や障害者雇用等の現場を見てきました。四国にある障害者の方がスタッフとして働いているカフェレストランに行った時のこと。目を見張るような洗練されたインテリア、素晴らしいクオリ"},
  {vol:62,date:"2024年09月09日(月)",title:"解きたい課題は何ですか？―先進自治体・北九州市へ",content:"この週末は、とある地で、全国の改革を志向する首長の皆さんとの勉強会に出席しました。しばしば「北九州市の職員は馬力ありますね、スピード感ありますね、熱量すごいですね」という声を耳にします。そんな時は素直に嬉しく、職員の皆さんの奮闘に感謝したいと思います。「〇〇をやっている北九州市」「北九州方式」「北九州モデル」といった表現。北九州市は、公害問題を始め、他の地域に先駆けて課題解決を行ってきた歴史があります。それを行うだけの地力がこの街にはあります。これからもそうできる潜在能力が十分にあります。それを支える行政力もあります。確信しています。ぜひ、「先進自治体」との呼び声をさらに強くすべく、日本の将来や、世界の未来に貢献できるような課題やイシューを見つけ、チャレンジしましょう。国の動きが遅いところ、目が届かないところに、先駆的に取り組んでいきましょう。壮大なことを言っているようですが、現実にそれを先んじてやってきたのが北九州市の行政の歴史です。この街のアイデンティティです。皆さんも探してみてください。それぞれの行政分野で、どんな課題がまだ手をつけられずにいるか。また、十分に対策が講じられずにいるか。私は時々、レクなどで「イシュー（issue）」という言葉を使います。単なる課題や論点という辞書が示す意味ではなく、私が言う「イシュー」は「真に解くべき課題」「解く意味のある課題」という意味です。例えば「不登校」「学びの多様化」について。一部のデータによれば、既に中学生の約２割（６０万人弱）に影響している課題。それについて、緩徐な国の方針に沿うだけでいいのか。どのように先生方のサポートをするのか、子どものケアの仕方を考えるのか。例えば「医療的ケア児」について。医学の進展に伴って増えている医療的ケアが必要な子どもや家族にとって、如何なるケアやサービスが必要なのか。例えば「望まない妊娠」について。熊本県の赤ちゃんポストは、１６年間で１７０件ほどの利用があったとのこと。様々な事情があって望まない妊娠をした女性たちをどう支えるか。例えば「外国人との共生」について。まだ外国人の人口比率が低い北九州市ですが、これから外国人の働き手や住民の皆さんに、どうやって言語や教育や医療、地域社会への順応を促していくのか。例えば「食糧危機」について。2050年には食用魚がなくなる、また、2035年には55%の食材がなくなるとも言われています。そうした中で、どのように食糧や農地、担い手確保を進めるのか。例えば「人口減少地域の交通」について。AIオンデマンドバスや自治体をまたがった交通をどうするか、運転手をどう確保していくのか、などなど。こうした「気になるが、国の動きも遅い」と感じられる課題は、自治体として、先鞭を付けていく意義があります。国レベルで進まない理由は、応援する政治力がない（あるいは政治的関"},
