  {vol:64,date:"2024年09月24日(火)",title:"読書は心を磨く",content:"皆さん、連休はどのようにお過ごしだったでしょうか？日頃取れない読書の時間を持った方もおられるかもしれません。先日、「１か月に読む本が『ゼロ冊』という人が6割を超えた」という衝撃的なニュースが報じられました。SNSや動画やいろんな忙しさもあるのか、我が国では読書をする人がどんどん減っているようです。一方で『なぜ働いていると本が読めなくなるのか』という新書が売れ行き好調のようです。「読みたいけど読めてない」「どうしたら読めるんだろう？」という問題意識は根強いようです。結論から言うと、皆さんには少しでも本を読んでほしいと願います。何も肩肘張って読書の時間を取らなくても、寝る前にベッドで10分だけ、朝起きて5分だけ、昼休みに10分だけでも、あるいは業務に必要な情報収集のためなら業務時間でもいいのです。それがあなたの人生を、心を、磨いてくれる、安らかにしてくれると確信するからです。「読書をする」ということは知識を得ること、いわゆる「お勉強」のように思われがちです。しかし、私は、読書こそは「心を磨く」ものだと思っています。アタマ・ムネ・ハラがあるとすれば、大人になってからの読書は、アタマよりもむしろムネやハラに効く。そう思います。なぜなら、人生の大先輩、人類の大先輩の人たちから直接教えを受けるのが読書なのですから。私自身も、プレッシャーに囲まれる公務の中でも、少しでも本を読むよう心がけていますし、読書の効用を改めて感じています。「読書をする」ことがどのように「心を磨く」ことにつながるのか。個人的な視点から、３つ挙げます。1つ目には「忍耐力」が磨かれます。読書をすること自体、動画を見るのと違って、読み続ける我慢とわからないことを必死に理解しようというストレスがかかります。その中で自制心を持ったり、必死に読み解こうとする中で格闘したり、といった忍耐力が身に付きます。そして、自分が物事を知らないことに気づき、自分の知性や品性の足りなさに思いを致し、人としての礼節と謙虚さを持とうと自分を戒める。そういう効果があります。2つ目に「俯瞰力」が磨かれます。目の前の小さな出来事に一喜一憂したり、感情的になったりせず、物事の全体状況を長期的に見渡し、構造的に見る力。日々のよしなしごとから離れ、世界や日本や人間のことを考える時間。世の中を俯瞰的に見ることができるようになります。また、世の中の潮流や現代人が陥りやすい罠などを知ることで、冷静に物事に対処できるようになるのです。3つ目は「寛容力」です。世の中にはいろんな立場の人が、いろんなものの見方の人がいるんだなと学ぶことができます。これはSNSの逆です。SNSでは、自分の考えに似た人や自分の好きな情報ばかりが集まっていませんか。それと違って、読書によって、「へえ、そんなものの見方があるのか」ということを学び、いろんな人の言動や発想を受け容れ"},
  {vol:65,date:"2024年10月01日(火)",title:"文化芸術政策のフィロソフィー（１）",content:"先日、文化芸術推進プランの策定に当たり、担当部局の方々に私の想いの一端をお話しする機会がありましたので、その一部を紹介します。少し長いので、今回と次回で２回に分けてご紹介しますね。今、私たちは「文化芸術政策をアップデートするべき時に来ている」と思っています。「文化」という言葉の範囲はどんどん拡張して、明確な定義ができないほど広がり、社会や企業における文化芸術政策の位置づけもどんどん変わってきています。世界を見渡しても、文化の本質的価値とともに、社会的・経済的価値に着目する動きが大きくなっています。それをしっかり捉えたものにアップデートしなければなりません。言うまでもなく、文化芸術そのものの本質的な価値、つまり審美的価値そのものが非常に素晴らしいものだということを、まず根本に据える必要があります。ただ同時に、文化の持つ社会的価値や経済的価値というところまで、視野を広げていくことが、より一層重要になってくると私は考えています。文化は文化のためだけにあるものではなく、今や、文化が社会や経済のためにもあるという捉え方をすべきということです。そもそも、文化を意味する「カルチャー」は、もともと「カルティベート」、つまり「耕す」から来ているわけですが、何を耕すかというと、人の心なのです。あるいは、人の可能性を耕して、それを発揮させていく力を持っているのが「カルチャー」だと考えます。それでは、文化の社会的な価値とは何か。ベタな言い方をすれば「都市の潤い」ですが、私自身の思いでいえば、文化は、心を耕し豊かにしてくれる、濁りのないピュアさを持っているからこそ、私たちを魅了します。だから、老若男女、どんな境遇をも超えて、みんなが共感できる、楽しむことができるという希有な存在の一つであり、「社会の紐帯」として、社会の繋がりの一つの形として、文化の果たす社会的役割というものがあるのだと思います。少子高齢社会の中で、人間がどんどん孤立したり孤独になったり、地域社会のコミュニティが崩壊しつつある中で、アートが持つ力というのが、人々を繋いだり、地域を元気にする力があるということ。毎回１００万人前後が離島などの会場を訪れる「瀬戸内国際芸術祭」などは、その最たるものだと思います。また、どんな境遇にある方であっても、垣根を超えて楽しみ、分かち合えるからこそ、障害の有無に関わらずクリエイティブな作品を生み出すアールブリュットみたいな世界が今、アートの新たな時流になりつつあり、メトロポリタンやオルセーなど世界の名だたる美術館でもその作品が収集され始めています。それから、文化の経済的価値をどう考えるか。これは私の持論になりますが、まず文化の持つ創造性というものは、私たちの仕事の中でも、新しいものを生み出すクリエイティビティに影響を与え、発揮されているということです。日々私たちが仕事する中で、文化芸術は"},
  {vol:66,date:"2024年10月07日(月)",title:"文化芸術政策のフィロソフィー（２）",content:"（今回も前回に続き、私が文化芸術推進プランの策定に当たり、担当部局の方々にお話しした内容をもとに進めていきます。）文化芸術の力は、組織経営に通じるものがあると考えています。組織経営では、スタッフそれぞれの力を信頼し、その力を最大限引き出すことがリーダーの務めです。一人一人の力を如何に見い出すかという視点は、アートを通じて人間の営みに気づく時と共通項があるように思えます。「この演者にこんな素晴らしい歌声や才能があるんだ」とか、「こんな楽器を巧みに奏でるんだ」とか、その振る舞いや表情に人生の一端や人間力が見える気がします。例えば、チェロを情感たっぷりと奏でる姿に、その演者の感性や情緒を見る気がしますし、書道の作品の線の太さや勢いに、その作者のエネルギーや人生観までも見る気がします。そのように、文化芸術を通じて、一人一人の多様な魅力や特性、そして人間的な深みともいうべきものを見い出せます。同じ曲でも、ヘルベルト・フォン・カラヤンさんと小澤征爾さんとでは、技巧、情念の深さに違いがあるような気がしますよね。このように、その人に「目を凝らす」ことは、組織経営でも重要な要素です。また、組織経営は、オーケストラのようなもの。個々の楽器が鳴らされても、リズムやテンポが一致しなければ不協和音になってしまいます。演者個々の魅力や味わいを組み合わせることが要諦のようです。見い出した力を組み合わせれば、政策や課題解決にも、クリエイティビティが生まれるのではないでしょうか。経済界や経営陣の方々にも、文化芸術を愛する方は多いと感じます。コンサートや会合で、音楽やパフォーマンスについて感想を交換するのもまた楽しいもの。文化芸術について語り合うサロン的な活動があるとまた、素敵なことだろうと思います。文化芸術が、いわゆる「文化人の文化人による文化人のためのもの」に止まらず、様々な観点や立場から語り合う、そういうプラットフォームのような場、「開かれた文化芸術」を体現するような場が北九州市に創られていくと嬉しいですね。私が英国に駐在していた時のことですが、文化芸術に浸り、歴史を愛する環境に恵まれました。例えば、誰かのホームパーティでは、ゲストの誰かがピアノを弾き始め、みんなでグラス片手に耳を傾けたり、夕食の後にドローイングルームに移ると、壁一面に飾ってある数十枚の絵画を見ながら、みんなで「あれがいいね」「これが好きだ」などと会話したり。（とは言っても、話に付いていくだけで精いっぱいの私には、冷や汗ものでしたが・・・）。市民の皆さんが、踊りや楽器演奏、絵画や書などを嗜まれ、その作品を披露したり、その感想を交換したり、ということが、気軽な愉しみとして、また生きがいとして、人生を充実させてくれるといいなあと思います。皮肉なもので、仕事の第一線から退いてからなど、時間的余裕がないとなかなか・・・、というこ"},
  {vol:67,date:"2024年10月15日(火)",title:"行政とは最大の共感ビジネスである",content:"この言葉、若手職員向けの研修でよく口にしています。限られた財源や資源をどう使うかには、市民の共感が必要です。優先順位をつけて事業を展開するには、市民の共感が必要です。行政だけではできない、民間やアカデミアと協働するには、市民の共感が必要です。『人間が授かった大いなる才能、それは共感する力です』(メリル・ストリープ）『本当にそうだなあと共感する時、人は心が開き、笑い、新しく生きる力を得る』（山田洋次）私たちが行政を進めていく力の源泉は「いかに共感を作り出せるか」にあります。今、物質的に満たされた世の中で、多くの方は共感できるものを探しています。多様な価値観が存在するが故に、共感できる価値観や考え方を求めています。共感するからそのモノを買います、その土地へ動きます、その場所に投資をします。さて、北九州市は「共感」を生み出せているでしょうか？「あの街はこの方向でがんばっているみたいだね。」「あの街の目指す方向性は素敵だね。」「あの街に関わってみたいね」「あの街に投資してみようか」。そんな思いを抱かせているでしょうか。私たちは、それを常に頭に置きたいと思います。では、いかに「共感」を生み出せばいいのか。いくつかの鍵があります。１つ目の鍵は「ビジョン」です。どんな街を目指しているのか、どんな価値を生み出そうとしているのか。それを新ビジョンで表現しました。「一歩先の価値観を体現するまち」であろうと宣言しました。「グローバル挑戦を続けるまち」であろうと宣言しました。その前提として北九州市の誇る人の「つながり」や、人の「情熱」や積み重ねてきた「技術」という原点を大切にすると宣言しました。これに対して「いいね！」をどれだけ獲得できるかが問われるのです。新ビジョンの重点戦略である「稼げるまち」。ここでは、経済力や財政は「燃料」となります。燃料なくしては街は動くことができないから、十分に作り出す必要があります。ただ、それを元手に何を目指すのか、何を大事にしていくのか、に「共感」を得ることが必要です。例えば、再生可能エネルギーやサーキュラーエコノミーで、持続可能な社会を作る先導役になるという戦略があります。例えば、「未来の介護大作戦」のように、高齢化大都市の世界におけるフロントランナーになるという戦略があります。また、空港を最大限活かして、「アジアの物流ハブ」になるという戦略があります。創った元手を活かし、北九州らしさのある”志と思い”を落とし込んでいく。それが共感を生み出す1つの鍵です。市役所全体が、市政全体が、1つのベクトルを持って進むための大根本が「新ビジョン」です。２つ目の鍵は「言葉」です。受け手の心に響くようなコンセプトやワードを作ることが大事です。役所的な、正しいけれど無機質な言葉では人の心は動かせません。新ビジョンに掲げている言葉だけを唱和しても仕方ありません。いわば"},
  {vol:68,date:"2024年10月21日(月)",title:"レバレッジ能力を高めよう",content:"私は、「レバレッジ能力」を北九州市役所で重視したいと思います。「レバレッジ」という言葉の意味をご存知ですか？「レバレッジ」とは、「てこの原理」に由来しており、小さな力で大きな物を動かすことを言います。私が外資系企業にいたとき、人事評価の項目に「レバレッジ能力」というものがあり、最初は不思議な感じがしました。要は「組織内で事情に詳しい人の話を聞いて活用できるか」「組織内で関連するドキュメントやノウハウを探して活用できるか」「組織外でも知見ある人にインタビューをして上手に情報を集められるか」ということ。まさに、「小さな力で、速く、大きな成果を出せるか」に評価軸がありました。「レバレッジ能力」があれば、仕事時間も減るし、成果も大きい。仕事に取り掛かるときには、すぐ詳しい人のところに飛んでいき、30分のワンオンワン・インタビューで知識を吸い取り、仮説を立てる。あるいは、事情に詳しい社外の有識者や企業にアポをとり、ヒアリングして、アタリをつける。それが常態でした。だから速い。世界中から詳しそうな人を見つけ出し、職階が上でも下でも気にせず話を聞きに行く。私も、例えば日本のヘルスケアについて「今日中に調べたいから今晩30分電話会議させて」などと、ドバイやシンガポールから連絡が入ることもしばしば。でも、忙しくてもそれに積極的に応じることが空気のような文化でした。互いに助け合うのが当たり前。ノウハウはスピーディにシェアするのが当たり前。市役所でもこういう文化をもっと取り入れていきたいと思います。往々にして、役所では「所掌や担当ではない人が口出しすべきでない」「詳しい人がいてもまずは自分で調べてから」「経験豊かな人がいても職階が上なので聞きに行くのが憚られる」「民間の人に教えてくださいとは言いづらい」みたいな空気感があるかもしれません。もったいないことです。さっと知見のある方の時間をもらって聞きに行く。そして、世の中の経験や知恵を活用させていただく。役所内には、副市長も局長も、その道のプロもいます。電話で10分でもいいし、クイックに過去の経緯や要諦、進めるときの勘所を聞き出す、そんな動きが素早くできる、敷居の低い、助け合う職場を創っていきましょう。また、「上手に頼る」「気持ちよく助ける」ことを「レバレッジする能力」として評価する組織風土を創っていきましょう。ぜひ、皆さんに、「レバレッジ能力」を高めて欲しいと思います。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:69,date:"2024年10月28日(月)",title:"リバーフロントには無限の夢がある",content:"10月25日から12月25日までの62日間にわたって開催される「コクラBEAT」。レーザービームを使ったナイトスペクタクル、リバーサイドバー、クリスマスマーケット、イルミネーション、国際映画祭にパルクール世界大会…、などなど様々な仕掛けがいっぱいの「エモ」で「チル」な空間づくり。思いはただ1つ。北九州の都心、小倉のポテンシャルを最大限発揮させること。汚れた川からハゼの釣れる川へと生まれ変わったという物語を持つ紫川。そのリバーフロントの可能性を最大化したい。小倉のナイトエコノミーの楽しさや幅広さを形にしたい。夜は「博多」に泊まりますではなく、「小倉」に泊まる人を増やしたい。それぞれのイベントが散発的にバラバラに行われるのはなく、点と点を、線から面にして、”エリア”全体をワクワクする空間に変えていきたい。BIZIA小倉のオープンやIT企業の進出、旦過市場での北九大新学部創設などで勢いづく小倉都心の可能性を市民の皆様に感じてもらいたい、市外の人たちにも見てもらいたい。そして、若い人たちに都市部に帰ってきてもらいたい。こんな様々な\"ストーリー\"を詰め込んだのが今回の「コクラBEAT」です。北九州市の街のにきわいづくり、人の流れづくり、エンタメづくりという、ひとつの実験の始まりでもあります。初めての開催なので、試行錯誤もあるし、磨きをかけなければいけないところもあるでしょう。でも、「エリア」全体として川を活かして都心部を盛り上げていく、そのプロトタイプを創りたいと強く思います。ただ綺麗なだけでない、イベントがあるだけでない、深い意味のあるドラマとストーリーをこの街の中心に創りましょう。「紫川エリアは活用されるのを待っていた」と私は思います。隈研吾さんは「これはセーヌ川に匹敵する」と形容しました。そこに一歩でも近づけたい、そのために職員の皆さんのチャレンジとアイデアを期待します。都市のど真ん中に、こんなに美しい川と開放空間と繁華街と人情が一体的にある街なんて、日本でもなかなかありません。さあ、若者たちをはじめ、多くの方が、商店街や市場を闊歩し、インテリジェントビルなどのオフィスで働き、川のほとりのレストランやバーで食事を楽しみ、公園の芝生でくつろぎ、、そして小倉城や松本清張記念館などで文化に親しむ姿を思い描きましょう。それを目指して、第一歩が始まりました。形だけでない、枠組みだけでない、一つ一つの取組に魂を込めて、小倉・北九州市の底力をカタチにしていきましょう。それがやがて、市内の各区・地域へ波及し、北九州市全体の活性化につながると確信しています。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:70,date:"2024年11月05日(火)",title:"「楽しい",content:"を出発点にしてみる』先日、東急グループの野本弘文会長とお会いする機会がありました。行橋市出身の大物経済人。紳士的な風格の中に前向きなエネルギーを湛えていらっしゃる方。オーラがありました。野本会長からは、何度も「物語」という言葉が出ました。北九州の街づくりには、観光には、「物語」が大切、と。「物語」を繋げればもっと人が来ますよ、と。私は、「物語ってどうしたら創れるのでしょうか？」と尋ねてみました。野本会長のお答えは端的でした。「「楽しい」と思うことから考え始めるといいですよ。自分が「楽しい」と思うことを繋ぐと、みんなが共感できる「物語」になるんです。」なるほど。渋谷など幾多の街づくりを手掛けられた方の言葉は本質的。小難しく考えずとも、自分にとっての「楽しい」を出発点にしてみる。事業や予算、イベントやプレゼン、どれも「楽しい」あるいは「面白い」と思うことを出発点にしてみる。役所にいると、「失敗しないようにしないと」「好事例を真似しないと」「今のトレンドに遅れないようにしないと」と、「しないと」マインドになってしまいがち。批判されないように企画し、執行すれば、それなりに60点か70点が取れる”無難”なことはできても、世の中の評価も、自分の満足度も、「そこそこ」になりがちですよね。さあ、改めて、私たち北九州市役所でも、自分が「楽しい」と思えること、「面白い」と思えることを出発点にしてみましょう。実際、おそらく企画された方が「これ、楽しいんじゃない？」と考えて生み出したものには、多くの人を巻き込む力があります。例えば、最近の例でみると、●オリンピアン松山奈未選手の表敬訪問を応接室ではなく1階で行い、実際に松山選手の強烈スマッシュを受けてみた企画●Ｚ世代はみだしコンテストの審査員にドラァグクイーンや石丸伸二さんような刺激的な方を呼んでみた企画●市営バスの乗車促進のために「助けてください！」という直接的なメッセージのチラシを配ってみた企画●ミシュランシェフが考案した学校給食のメニューを実際に提供してみた企画などなど。これらは、どれも印象的だったし、やっている担当の方々が活き活きしていました。きっとその原点には、「こうしたら楽しそう」「やってみたら面白そう」があったと思います。そして「楽しさ」や「面白さ」を大切にすることで、その事業に「新しい価値」が付加されると感じました。もちろん福祉や医療など、単純に「楽しい」というよりも「やりがいを感じる」というように少しアレンジして考えたほうがいい分野もあるし、「楽しさ」「面白さ」の意味合いは分野によって区々でしょう。それでも、せっかくの職業人生、アイデア出しや企画の際には、自分の「楽しい」を出発点にしてみる。それによって多くの人の心が動くし、協力者も出てくるし、世の中でも評価される。そんな仕事を一緒に作っていきましょう。北九州市なら"},
  {vol:71,date:"2024年11月11日(月)",title:"トランプ氏の勝利は何をもたらすか",content:"予想以上の大差でトランプ氏が大統領に返り咲きしました。「もしトラ」と言われていたことが現実に。この結果が北九州市に、市民生活にどう影響するのでしょうか。報道などからは、トランプ氏は強い理念や国家像を実現する政治家というより、個々の取引(ディール)を重視する政治家のように思えます。そうであるなら、何が起きるのか”不透明”な状況が続く可能性があります。他方、4年間しかない任期を考えるとロケットスタートで政策を打つ可能性もあります。”福岡市型”のローカル経済が循環している大都市と異なり、”北九州市型”は、世界的企業が林立し、世界経済や政治のフレームが少なからず影響を及ぼします。自動車、半導体、エネルギー、鉄鋼など、トランプ氏の政策次第では、業界や関連企業、その雇用や市民生活への影響も私たちは注視する必要があります。いま、一般的には、トランプ氏の政策の影響は、次のように予測されています。関税を引き上げる(中国製品はじめ、輸入品への関税引き上げ) →インフレ傾向強まる→金利高止まりする→ドル高・円安が進む→国内の物価高が続く(原材料費や燃料費など)。さらに、関税引き上げによる輸出型企業の業績が悪化すれば、日本国内での賃上げにも水を差す。現在の賃上げとそれに基づく健全なインフレを目指す流れが逆回転しないよう、政府はもとより、各都市レベルでも踏ん張る必要があります。産業毎に見れば、自動車関連産業では、メキシコで中国系企業が生産した自動車に100%の関税をかける方針などが表明されており、対米輸出への影響が懸念されます。EVに対しても消極的な姿勢。自動車産業が大きな基幹産業である北部九州にとって、各メーカーの動向を見つつ、しっかりと協働していく必要がありそうです。再生エネルギー分野では、トランプ氏は「石油を掘りまくれ」と言っており、化石燃料への依存を強め、パリ協定からの脱退をちらつかせ、再生エネルギー業界の成長を遅らせるという懸念もあります。洋上風力など有望な産業を育てている北九州市にとって、世界的な趨勢はウォッチしておく必要があります。鉄鋼産業は、日本製鉄によるＵＳスチールの買収案件が注目されていますが、米国外からの輸入に高い関税をかけることにより、自国の鉄鋼産業の保護に走るのか。資材コストが上がって帰って、かえって産業全体にマイナス成長を与える可能性もあり、見極めが必要です。半導体産業では、製造拠点を米国内に戻すことを加速させ、巨額の補助金を動かす可能性もあります。日本では、国内に国際的な半導体の生産能力を築く方向性が見られますが、台湾も含めた国際的な役割をどう採っていくのか、国の動きも含め、新生シリコンアイランド・九州としてのスタンスを強化することが求められます。私自身は、オープンな国際経済体制を志向しますが、トランプ氏の登場で、どのような影響を受けるのか、あるいは、い"},
  {vol:72,date:"2024年11月18日(月)",title:"運営する、だけじゃもったいない",content:"週末の紫川周辺は、パルクール世界選手権、エコライフステージ、小倉城プロレス、コクラBEATと、大変なにぎわいでした。リバーフロントエリアのポテンシャルを活かすチャレンジの始まりとなりました。関係部局の皆さんに心から感謝します。お疲れ様でした。今回の焦点のひとつが「小文字通りを封鎖・開放」し、「街全体をアーバンスポーツの舞台に」することでした。道路封鎖・開放に向けて小倉北署と協議を重ね、ブレイキン、BMX、スケボー、チアリーディング、そしてお絵描きなど、エコなキッチンカーも含めて新たな取組みがなされました。市民の皆さんをはじめ、会場に訪れた方々、世界の関係者の方々に強い印象を与えたと思います。これこそ、「付加価値」です。国際スポーツ大会を開催する、確実に運営することにとどまらず、周辺エリアを巻き込み、工夫を重ねて、さらなる「付加価値」を乗せたことによって、大会そのものと共に、何倍もの価値ある体験を創り出し、都市ブランドの創出にも寄与したと思います。予算の付いた行政サービスやイベントを「運営する」だけではなく、それを基点にしながら何倍もの価値を生み出す。これこそ、私たちが目指したい、これからの北九州市政のカタチです。多くの市民の皆さんが「こんなことできるんだ！」「すごく楽しい！」とおっしゃってくれていたことは嬉しいことです。ひとつひとつのイベントが「点」にならず、それらが「線」や「面」となっていく、人の流れを創っていく。運営だけでも手いっぱいなところに、頑張って「付加価値」を加えてくれたことを誇らしく思います。さらに、これを「情報発信」までしっかり繋げられると、この上ないと思います。せっかくすばらしいことをしているのに知られていない、というのは残念なので、そこはメディアの方とのコラボを含め、「北九州市でこんな面白いことしているんだ！」ということをしっかり発信していく。また、部局を横断して、各種イベントの「見どころ」の時間を一元化して、SNSなどで発信していく。そこをさらに目指しましょう。まさに、行政サービスの①「運営」→②「付加価値」→③「情報発信」。この「３点セット」を常に意識して、市民の皆さんの“想像を超えていく”。そしてそのために、職員一人ひとりの価値観や好きなものを落とし込んでいく、創造性を注入していく。そんなチャレンジをしていきましょう。これは、都市ブランド創造局のようなイベントが多い部局に限ったことではありません。公園づくり、街路の整備、教育、空港、そして福祉の分野まで、堅実な「運営」をベースにしながら、「付加価値」「情報発信」まで含めた「３点セット」の実現を試みていく。それが税金を財源としてサービスを提供する行政の仕事が、市民の皆さんの共感を得ていくための「大切な視点」であると思います。人とカネの制約がある中で試みることは、それこそ「チャレンジ」で"},
  {vol:73,date:"2024年12月02日(月)",title:"食糧・農業・漁業を守る",content:"最近、小倉南区の東谷などに行事で赴くと、テントや軽トラ市で、丸々とした白菜やほうれん草など、地域で収穫された野菜の数々を目にします。しかもお値頃。「農」の有難さ、「食」の尊さを感じます。ある専門家に聞いた話では、日本の肥料の自給率は0.5%しかなく、2035年までに55%の食材がなくなり、レシピは60%減少する予測もある。したがって冷凍技術の探求が進んでいる、とのこと。また、アメリカの『サイエンス』誌は、2048年には海から食用魚がなくなるとした「2048年問題」も発表しています。気候変動や乱獲、今後の世界的人口増加は、食糧・農業・漁業に大きな影響を与える可能性があります。まさに、食糧・農業・漁業は「持続可能性」の本丸のひとつです。今、「食」の愉しみを謳歌できる私たちはピークを迎えているのかもしれません。今年の米の高騰や品薄はその警告と捉えるべきかもしれません。冷凍や保存技術の進展は期待されるも、工場で野菜を作る、人工肉などのフードテックの進捗はまだ不透明です。北九州市にはブランド野菜があり、美味しい海産物に恵まれていますが、決して”農業”都市ではありません。子や孫の代に、いかにして「食」を引き継いでいくのか。飢えないようにするのか。そこに真剣に向き合うことが必要です。突き詰めれば、本来、行政、「公」の最大で最重要な使命は、「市民を飢えさせないこと」「市民を守ること」です。農業、漁業、そして「食」を支える環境と人材、仕組みをどう守り、引き継ぐのか。その視点から、できることを積み重ねていきましょう。「すしの都」についても、「すしが美味しい」という次元だけでなく、食の持続可能性や食糧の確保、という文脈に繋げていくことが重要です。私たち行政は、今日明日の仕事、来年の仕事だけに没頭しているわけにはいきません。３０年後、５０年後も、この街が滅びることなく、栄える街であり続けるには、いま、何が必要なのか。その時間軸を持って、できるところから、手を打っていきましょう。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:74,date:"2024年12月16日(月)",title:"若者の力",content:"一昨日14日の土曜日、小倉南区でたいへん痛ましい事件が発生しました。中学生の尊い命が失われました。負傷した中学生もいます。ご本人とご家族に心からのお悔やみとお見舞いを申し上げます。捜査の行方を注視しなければなりませんが、許されざる凶行です。私たちは、市民の皆さんとともに、被害に遭われた方やご家族に心を寄せたいと思います。若者や子どもたちを何としても守るまちづくりをしっかり進めていかねばなりません。亡くなった方が描いていた未来、抱いていた夢を思うと、やるせない思いになります。若者や子どもたちが、それぞれの大きさや形でいいので、未来への夢や希望を大切に育み、守り、後押しできる、そんな北九州市を創らねばなりません。先週も、若者の発案と行動で素晴らしい企画が次々と形になりました。1つ目はネジチョコと宇宙の小型衛星を掛け合わせた新商品の開発。九州工業大学で宇宙を学ぶ若者が、北九州市の宇宙産業を、そして九工大の宇宙研究をもっと知ってもらいたいと、ネジチョコを販売する企業に直談判し、多くの大人を巻き込んで、素晴らしい商品が生まれました。そして2つ目は、土曜日に行われた到津の森公園での「サンタウォーク」です。「Z世代はみ出しコンテスト」で惜しくも入賞は逃しましたが、九州栄養福祉大学の学生の思いとアイディアが、多くの地元企業を動かし、スポンサーを得て、素晴らしい企画となり、1055人のサンタが集まりました。 その他にも、同じ九州栄養福祉大学の学生が監修した「トマトのおんがえしカレー」が学校給食として提供されたり、少し前の「ぼーっとする大会」の北九州市への誘致、こどもまちなかスペースをデザインしてくれた若者たちなど、2024年は実に多くの若者や子どもたちのアイディアが次々と形となり、その力に助けられました。夏の勝山公園で開催された昭和夏祭りや、Ｚ世代パートナーズの個性豊かな面々からの助言なども、北九州市を盛り上げてくれました。若者や子どもの感覚やチャレンジマインドがどんどん発揮され、それを上の世代が見守り、後押ししていくという流れづくりが着実に進んだ一年だったと手ごたえを感じています。 当然、若者や子どもだから、ディテールがうまくいかない、スムーズに進まないことも多々あります。不調法なこともあります。でもそれを温かく見守り、そこに宿っているチャレンジ精神や新しい発想をみんなで応援していくことによって、彼らはもっともっと力を発揮してくれます。もっともっと私たちに教えてくれます。そして、北九州市には、それを応援してくれる大人や地元企業がたくさんあります。それも北九州市ならではの温かさだと、私は感じています。これは、市役所という組織内でも同じことです。若者のチャレンジを応援し、後押しし、成長を手助けしていく、そんな北九州市を創っていきましょう。まさに、「日本一若者応援する街」の元年と"},
  {vol:75,date:"2024年12月23日(月)",title:"正しい問いは何か",content:"先の中学生死傷事件、被害に遭われた２人の生徒さんとご家族に、改めてお悔やみとお見舞いを申し上げます。先週、容疑者が逮捕され、不安な日々を過ごしていた市民の皆さんも心配や恐怖が和らいだことと思います。懸命な捜査と、市民の安全確保に尽力いただいた県警の皆さんに感謝申し上げます。また、不安を払拭しようと、地域で子どもたちを見守り続けた方々、保護者や学校関係者の方々にも御礼申し上げます。そして、市職員による登下校の見守り活動に参加してくれた皆さんにも、心から感謝します。多くの市民の皆さんから「頼もしかった」というお声もいただきました。事件の真相はまだ明らかになっていませんが、卑劣極まりない犯行であり、不条理な事件です。将来ある若者の命が奪われた事実とご家族の悲しみ、悔しさを思うと、胸が張り裂けそうです。私たち行政にできることは、ひたすらに、若者や子どもたちを何としても守るまちづくりをしていくことです。今回の事件を契機に、私たちは何を考えるべきでしょうか。例えば、「動機は何か」を起点に、「背景は何か」「どうしたら防げたのか」、そして関係機関が「できることは何か」など。ひとつの事象からも、私たちは常に問い続けなければなりません。それが「公」を担う行政の役割でもあります。私は、常々、レクの際に「論点は何ですか？」とお話しします。言い換えれば「考えねばならないことは何か？」「何が一番大切な要素なのか？」「何が判断決断を左右するのか？」ということ。問いには、「正しい問い」とそうでない問いがあります。私たちの仕事は、「正しい問い」は何か、を考え続けることだと思います。例えば、市政変革を議論するX会議。公共施設の在り方を考えるときの「正しい問い」は何でしょうか？「どうしたら持続可能となるか」「どうしたら利用者の満足度を高められるか」「どうしたらより多くの方にご利用いただけるか」など、が考えられます。それらの問いを解こうとすれば、「そもそも、その施設はなぜあるのか」「市民の皆さんから、今の時代、何を求められているのか」「時代の変化にどう対応するか」といった問いを立てる必要があるのです。私たちは、今、世の中に解答があふれた時代に生きています。検索すれば瞬時に、答えらしきものが見つかり、定番の答えらしきものを強いられます。メディアの論調やＳＮＳでの言説は、往々にしてステレオタイプなものとなりがちです。だから、その答えらしきものを探す、という癖が身についているようです。はたまた、立場上、「どうしたら批判されないか」「どうしたら波風立たないで済むか」といったことを問いとして立ててしまうことも少なくありません。だから、ありきたりな問い、よく言われそうな問いを立てて、口当たりの良い抽象的な言葉で「改善する」「検討する」「推進する」という無難な言葉を様式や個票に埋めて、進捗管理して、仕事をした気"},
  {vol:76,date:"2025年01月06日(月)",title:"心を動かす",content:"明けましておめでとうございます。本年もよろしくお願い致します。昨年末から今年にかけては、少し長い休みになった方も多いのではないでしょうか。皆さん、ご家族やご友人らとリラックスした時間を持たれましたか。令和７年が、皆さんにとって、北九州市民の皆さまにとって、穏やかで健やかな一年となることを祈ります。今年の私たちのテーマは、「心を動かす」。新年の職員訓辞では、その趣旨をお話ししました。まずは、皆さん自身の「心を動かす」ことから始めてみてください。それが誰かの「心を動かす」ことにつながります。予定調和やルーチンとして仕事を処理するのではなく、ぜひ「心を動かす」ことに焦点を当ててみてください。（もちろん予算や人材の制約もあり、すべてが思いのままにいかないのは当然ですが、それでも、あなたの「心を動かす」こと、それを目指してみてください。）でも、「最近、心が動いてないよなあ」と戸惑う方もおられるかもしれません。毎日忙しく、感動するものを観たり聞いたりできない、あるいは、人生経験が増えて、「心を動かす」ような場面が減ってきたなあ、と思われる方もおられるかもしれません。行政の仕事をしていると、徒に心を動かしていると、色んな意見や利害があるから身が持たないよ、ということも、（私の行政経験上）分かる気もします。それでも、努力してみてください。もし少し心が硬くなっているな、と思うときは心のストレッチが必要なこともあるでしょう。好きな映画、本、絵画、風景、食べ物などに触れてみることも「心を動かす」ための柔軟体操になるかもしれません。意識的に「感動してみる」「面白がる」ことも大事かもしれません。その一つのヒントとして、ここでも【ホンの気持ち】【タケウチ・ガガ】で紹介していますので、役立ててみてください。それから、大事なことは、ここ（令和6.4.22号）でも書いたように、「拍手を送ろう」ということです。日本人には拍手が少なすぎる、特に行政にいると拍手することに躊躇があり過ぎる、と常に私は感じています。（政治家のように？）「拍手」の有無や大きさ自体に何か思惑を込めたり、無言の意図を読み取ったりする、そういう湿った感覚も時々見られます。韓国や台湾の方と市内でミーティングをすることがありますが、彼らは屈託なく、元気に拍手をする。そして場を温めてくれるような気がします。少しだけ多めに世界で色んな経験をしてきた立場からすると、もっと私たちは、晴れやかに、気持ちよく、拍手をしていいと思います。拍手をされて気持ちが乗らない、やる気が出ない人はいないと思います。そんな清々しい街、気持ちの良い街にしていきたいと、私は思います。それも簡単にできる「心を動かす」ための行動の第一歩だと思います。そんな行為ひとつひとつを小さく変えることで、相手の「心を動かす」。礼儀にも適っています。そもそも日本人は、惻隠の情、"},
  {vol:77,date:"2025年01月14日(火)",title:"女性にコンフォートな都市をつくる",content:"昨日、北九州婦人教育研究会（北婦研）の新春のつどいに伺いました。北九州市婦人団体協議会のどの団体にも感じますが、皆さんの温かな熱気と良心と知性、この街を支えてくださっている力を体感し、とても素敵な時間でした。去年から話しているように、今年、より本格的に北九州市を「女性をエンパワーする都市」にすることに取り組みます。私は、本気で、女性にとって居心地がよく（コンフォート）、思いに反してキャリアを諦め、中断する必要がなく、男女問わず心からリスペクトされ、壁にぶつかったときには街全体で応援できる、そういう街への歩みを強めたいと思います。それこそ、北九州市が真の意味で次のステージへ進むための中心テーマです。正直、北九州市は、九州は、いや日本という国はまだ”男社会”です。主だった会合でも見渡せばスーツ姿の男性が目立ち、政治も経済リーダーたちも同じ感じ。発想面もヒエラルキーとメンツが支配しがちです。勿論、「男性だ」「女性だ」と性別を分けること自体が「ジェンダーフリー」の観点からは「時代遅れだ」と言われるかもしれませんが、まだその段階まで私たちは到達していない。女性の力と想いと可能性が支えられ、発揮できる環境になっていないこと、「エンパワー」できていないことは、北九州市どころか、日本国にとって、真に死活的な問題だと考えています。でも、このテーマに関しては、語るのが難しい、神経質にならざるを得ない面があります。「女性」という概念を持ち出していいのか、言葉は「活躍」なのか「平等」なのか「地位向上」なのか。どれも何だか当たっているようでピタっとも来ない。敢えて「エンパワー」「フェアな関係」という言葉を使っておきます。女性どうしの状況の違いも大いにある。また、ありきたりの経済政策的な”担い手確保論”としての”女性活躍論”だけに閉じ込めたくもありません。また、男性だから、女性の体や心を真に理解できないのだ、という委縮もしたくはありません。他者への想像力を働かすことはできるのです。ジェンダーフリーは大切です。しかし、性差には一定の配慮と考慮も必要です。私は、今こそ、自覚的に、もっと北九州市という街を”女性”にとって、居心地のよい（コンフォートな）街にしたい、しなければならないと強く思います。ある女性にかつて、「女性はどの選択をしても必ず心無い言葉を浴びせられる」と言われてハッとしました。結婚しなければ「なぜその歳で結婚しないの？相手いないの？」結婚すれば「まだ仕事続けるの？」子どもを生まなければ「まだ子どもできないの？早く産んだ方がいいよ。」しまいには、子どもが一人だと「２人目も頑張りなさい」。そして、その方は、言いました。「だったら、結婚して、仕事をして、子どもを２人３人と産んだ人しか認められないのですか？世の中は育児して仕事する女性は支援して褒め称えるけれど、私たちの人生にはそれし"},
  {vol:78,date:"2025年02月10日(月)",title:"母の死にて",content:"私事となりますが、ここ数週間、母の病状が思わしくなくバタバタしていたのですが、先週末に他界し、その後葬儀などを終えたところです。予定変更などご協力くださった皆さん、お悔やみの言葉をいただいた皆さん、ありがとうございます。長年の難病との闘病、障がい者として生き続けた姿、苦悩の中でも力強く淡々と生き抜いた母の生き様、生き方は、私自身の大きな心棒にもなりました。厚生労働省で福祉や医療を志し、そして人がどんな境遇においても孤立せず、プライドを持って生きる世の中を創りたいと志したのも、母の影響は大きかったかもしれません。どの方もそうでしょうが、親から得た環境や考え方は、やはり自分の心身の血潮に受け継がれているものです。さて、今回、母の最期を見守り、看取り、そして送り出すという一連の営みの中で、改めて「死」を間近に意識し、体感する時間ともなりました。昔の人にとって、死は現代よりも身近なもので、戦争や天災、疫病など今よりも命を脅かす危険も多く、生活の中に自然と「死」が位置づけられていました。現代の日本人は、物質中心の価値観の中で、「死」が想起させる人生観や死生観が育みにくいという指摘もあります。「生ある者、必ず死あり」。ともすれば、この真理を私たちは忘れつつありますね。大自然の中で生かされている。その過程では、色んな人に支えられ、自分なりの人生の物語を紡がせていただいている。決して自分一人の力ではなく、大きな力、たくさんの力に支えられて生きている。そのひとつひとつに感謝をしながら、少しでも学び、成長し続ける、そういう生き方をしたいものです。私は、いつも、自分というのは、長い永い、宇宙や地球の歴史の中で、ほんの一瞬の瞬きにさえもならない小さな存在だ、と思っています。ずっとずっと前のご先祖様から引き継いだ壮大な世代のリレーのバトンを受け取っている存在だ、と考えています。であればこそ、逆説的ですが、この「生」を必死に懸命に全力で生きることが自分の務めであり、役割であり、気持ちよく、次の世代にバトンを渡すために人生を遣いたい、やりきって最期を迎えたい、と思っています。この世で地位や財産、名声を得たとしても、ひとつもあの世には持って行けません。だから、現時点の目先の毀誉褒貶に惑わされず、（私がもう居ないであろう）3050年先の次の世代にとって何がベストなのか、という軸で物事を進めたいと考えています。私たち個々人は小さな力であっても、力を合わせれば、次の世代にしっかりバトンを渡すことができる。人口構造や社会・国際情勢が変化しても動じない経済の強さ、互いに支え見守ることができる医療や福祉、人生の豊かさと味わいを堪能できる文化や芸術、毎日楽しく気持ちよく過ごせる街づくり、次の世代が希望をもってしなやかに生き抜く力を得られる教育や子育てなどなど。政策万般にわたって、やるべきこと、行うべきこ"},
  {vol:79,date:"2025年02月17日(月)",title:"悩むより考える——ともに課題を乗り越えるために",content:"Think, think, think!これは、私が15年ほど前、ある企業に勤めていたときに、プロのメンターからかけられた言葉です。アメリカでは、経営者を中心にプロフェッショナルなメンター（助言者）が広く活用されています。私もその一人のアドバイスを受ける機会がありました。当時の私は、「今の状況がこうなったらどうしよう……」「自分の能力が足りていないのではないか……」「どう評価されているのか心配だ……」といった悩みを率直にメンターに話しました。心の内を10分近く吐露した後、メンターは穏やかな表情で、こう語りかけました。「あなたの気持ちはよく分かります。キャリアの中で、特にミドルマネジメント層にいると、自分の能力への評価、将来のキャリア、解決困難な課題など、多くの悩みに直面するものです。しかし、あなたの話を聞いていると、すべてが『悩み』の段階で止まっています。悩みのループの中で立ち止まり、堂々巡りをしているのです。それでは何も生まれないばかりか、自分自身を追い詰めてしまうのです。」「悩むより、考えなさい。」この言葉を聞いた瞬間、まるで頭をハンマーで叩かれたような衝撃を受けました。私は、あれこれと心配ばかりし、頭を悩ませているだけで、何も生み出せていなかったのです。しかし、その時間とエネルギーがあるならば、少しでも課題の解決に向けて動いた方が、自分にとっても、周囲にとってもはるかに有意義なのではないか。そもそも、仕事とは常に難題に直面し、予測不能な困難に囲まれるものです。そして、それらを一つひとつ解決していくことこそが、仕事の本質なのです。この気づき以来、私は「課題を解くことを楽しむ」ことを意識するようになりました時には、まるでロールプレイングゲームのように、考えることがあってもいい。時には、まるで難解なトランプゲームや将棋の対局のように、愉しみながら課題を眺めてもいい。そう思います。論理的・戦略的な思考だけでなく、「こうしたい」という自分の志、「世の中をこう変えたい」という理想も織り交ぜながら、課題に向き合うようになりました。仲間とともに困難な課題に挑む。状況の変化に力を合わせて立ち向かう。そして、それを共に乗り越えていく。これこそが、仕事の醍醐味ではないでしょうか？特に、市役所のような大きな組織では、一つの課題を乗り越えたときに、仲間と肩を叩き合いながら苦労を分かち合う瞬間があります。そのときの経験は、振り返れば何にも代えがたい財産となります。もし、今、かつての私のように悩んでいる方がいたら——あるいは、ミドルマネジメント層でさまざまな板挟みに苦しんでいる方がいたら—どうか、ほんの少しだけ視点を変えてみてください。もちろん、考えすぎてしまうと、迷うし、慎重になるし、弱気になって、それ自体が「悩み」になってしまうこともあります。そのため、論理的思考だけでなく、感"},
  {vol:80,date:"2025年02月25日(火)",title:"地方創生の新たな潮流—経済人が主導する街づくりの実例",content:"この週末、全国各地で「経済人が主導する」地方創生の実例を聞く機会があり、その先見性と実行力に深く感銘を受けました。今回取り上げるのは、長崎、水戸、前橋の3つのケース。それぞれの地域で、地元ゆかりの企業家たちが自らのビジョンを掲げ、行政や補助金に頼るのではなく、自らの資金と民間の力を活用して街の未来を切り開いています。長崎：ジャパネットが創る「スタジアムシティ」——スポーツ×エンターテインメントで街を再生  https://www.nagasakistadiumcity.com/長崎では、髙田旭人社長率いるジャパネットホールディングスが「長崎スタジアムシティ」プロジェクトを推進中。その特徴は、スポーツ、商業、エンターテインメント、医療・福祉を一体化させた「複合型まちづくり」。ジャパネットはこのプロジェクトに総額1000億円を投じ、新たな都市空間を創出しました。スタジアムシティの中心には、プロサッカーチーム「V・ファーレン長崎」の新本拠地となるスタジアムがあります。これに加え、商業施設、ホテル、オフィス、健康増進施設などを併設し、試合がない日でも賑わいが生まれる仕組みを構築。この取り組みにより、長崎市の人口減少のペースは鈍化し、地元経済の活性化にも寄与し、市民の間では「長崎にこんな未来があるとは思わなかった！」「街に誇りを持てるようになった」といったポジティブな声が多く聞かれるそうです。水戸：グロービス堀義人氏が推進する「水戸ど真ん中再生プロジェクト」https://mitoproject.jp/次に水戸では、グロービス経営大学院の堀義人社長が主導する「水戸ど真ん中再生プロジェクト」が進行中。堀氏は、30年以上ぶりに故郷・水戸を訪れた際、かつての活気を失い、寂れた街の姿に衝撃を受けたそうです。プロジェクトの特徴は、歴史とテクノロジーを融合した街づくり。具体的には、旧水戸城跡を活用した観光振興（歴史資源の再活用）、スタートアップ支援拠点の設置（起業家の誘致と育成）、地方発メディカンパニー（FMラジオなど複合メディアで魅力発信）、Bリーグ「茨城ロボッツ」のアリーナ整備など。前橋：JINS田中仁社長が推進する1000億円規模の都市再生計画https://www.tanakahitoshifoundation.org/mahinakalab前橋では、眼鏡ブランドJINS（ジンズ）を展開する田中仁社長が、2016年から官民連携で本格的なまちづくりに着手。このプロジェクトは、すでに1000億円規模にまで拡大しています。主な取り組みとしては、アーツ前橋（文化施設）の強化、新しい商業施設・オフィスの開発、「まちなか研究室」設立による産学連携など。これにより前橋市は、文化・産業のハブへと変貌を遂げつつあります。田中社長は「本社機能の半分を前橋に移転する」と表明し、企業としての本気"},
  {vol:81,date:"2025年03月17日(月)",title:"市長就任から2年を迎えて：「稼げるまち",content:"の本質とは』2月20日で市長就任から2年が経過しました。この2年間、市政を支えてくださった全ての職員の皆さんに心から感謝申し上げます。これから3回に分けて、皆さんに伝えたいことをお話ししたいと思います。今回のテーマは「なぜ『稼げるまち』を目指すのか」 です。先日、毎日新聞の特集記事でも一部触れられていましたが、私には2つの思いがあります。1. 強くなければ優しくなれない第一の理由は、「強くなければ優しくなれない」からです。どんな立派な政策や事業も、財源がなければ実現できません。医療・福祉・介護・教育・文化・芸術など、市民サービスを充実させるには資金が必要です。特に高齢化が進む中で、一つの政策を実施するだけでも巨額の財源が求められます。そのために「稼ぐ」必要があるのです。私は福祉や医療の充実を志して30年以上前に厚生省（現・厚生労働省）に入りました。「どれだけ医療や福祉を充実させれば人は幸せになれるのか」と素朴に考えていました。しかし、現実は厳しく、財源がなければ何もできないという壁にぶつかりました。財源確保のために財務省に通い、保険料引き上げのために奔走し、制度改正を進めてきました。時には、サービスの給付削減が避けられない場面もありました。そこで痛感したのは、「稼がなければ財源は生まれず、財源がなければ福祉や医療も実現できない」という現実です。私が入省した1994年頃の高齢化率は14％でしたが、現在は29％と倍増。社会保障給付費は約６０兆円から140兆円へと２倍以上になりました。しかし、日本のGDPは480兆円から600兆円へとわずか25％の成長にとどまっています。経済が伸びないために、社会保障に十分な資金を回せない状況に陥っているのです。特に子育て施策分野は国家的な財源手段を持ち合わせていません。私は「経済があっての社会保障」ではなく、「社会保障があっての経済」もまた重要だと考えています。安心できる医療・介護・福祉と、それを支える分厚い中間層があるからこそ、消費が促され、購買力が生まれ、治安が守られ、経済が回るのです。しかし、経済成長が停滞する中では、必要な社会保障の給付すら抑制せざるを得ません。だからこそ、私は経済成長の必要性を強く感じています。「人に優しくするには、まず強くならなければならない」——これこそが、「強い経済」そしてその結果としての「優しい行政」を目指す理由です。財源論なく「あれもしたい、これもしたい」と言い募るのは、無責任だと学んできました。2. 稼ぐとは価値を創造すること第二の理由は、「稼ぐとは価値を創造すること」だからです。稼ぐことは、単なる企業の利益追求や個人の金儲けではありません。価値を創造するということは、「他者と自分を同時に幸せにすること」です。新しいサービスや製品が生まれ、それによって誰かが幸せになり、便利さや豊かさを享受す"},
  {vol:82,date:"2025年03月24日(月)",title:"市長就任から2年を迎えて：区役所は「新たな市政のカタチ",content:"を創る』これからの市政において、住民・NPO・企業・学校など多様な主体との協働が不可欠です。その「地域内連携」のハブとなるのが「区役所」です。情報の共有、人のつながり、信頼の蓄積は、すべて地域の”現場”から始まります。「顔の見える行政」を体現するのが、まさに区役所です。区役所は、これからの市政を支える「まちの最前線」なのです。区役所を単なる「出先機関」と捉えてはなりません。市政の意思決定における情報拠点・実行拠点・連携拠点であり、住民の安心と信頼を支える土台です。これからの自治体運営において、区役所の機能強化・権限付与は、市政の質とスピードを向上させる最も有効な投資の一つと考えています。ですから私は、就任以来、「移動市長室」を各区で開催したほか、地元の住民の方との対話の機会も増やしました。また、副市長の所管も区役所業務を１人が見るのではなく３人で分担するようにし、「市長が出たことがない」と言われていた「区長会議」には、今や毎月、市長である私をはじめ、３人の副市長が全員出席するようになりました。毎月区長にプレゼンしていただき、とても活気ある時間になっています。若手職員をはじめとする各区の情報発信も活発になってきました。人事や予算を一気に増やしたり、ガラッと変えることは簡単ではありませんが、今年度から区役所提案の予算要求も仕組み化し、着実に変革を進めています。まだまだ「過渡期」ですが、一歩一歩進めて行きます。少子高齢化、地域コミュニティの希薄化、生活困窮、災害対応など、私たちが向き合う課題は年々複雑になっています。そうしたなかで、市民の皆さんにとって最も身近な行政窓口が、区役所です。市政の最前線で、直接顔を合わせ、声を聴き、困りごとに向き合っているのは、まさに区役所の職員一人ひとりです。窓口での何気ない会話から始まる相談、地域の高齢者の見守り、子育て家庭へのちょっとした声かけ――そうした日々の積み重ねが、市民の安心と信頼につながっています。「あなたがいてくれてよかった」と言われること、それが区役所職員の誇りであり、区役所の本当の力だと思います。つまりはそれが市政の力でもあると思うのです。また、区役所には、地域をよく知る強みがあります。どこにどんな人が住み、どんな思いで暮らしているか。地域の商店街、学校、自治会、NPO、企業などとの日頃のつながりがあるからこそ、柔軟で、きめ細かな対応ができます。例えば、子育てと介護を抱える「ダブルケア」のご家庭に、保健師と福祉担当の職員が連携して寄り添ったり、高齢者の孤立を防ぐため、地域のサロン活動を後押ししたり。そうした動きが自然にできるのは、区役所だからこそです。これからの時代、区役所は「住民と行政の接点」から、「地域づくりのパートナー」へと進化していきます。課題を一人で抱えず、地域全体で解決していくために、区役所が“つなぎ役"},
  {vol:83,date:"2025年03月31日(月)",title:"市長就任から2年を迎えて：北九州市の「遠心力",content:"と「求心力」』北九州市という街には、不思議な二つの力が流れています。ひとつは、「遠心力」。かつて五つの市が合併し、七つの区ができたこの街では、地域ごとの誇りや想いが強く、それぞれが「わが街をもっと良くしたい」と願っています。それはとても尊い感情であり、地域の原動力です。しかし、その思いが強いからこそ、ときに「あちらにあるのなら、うちにも」「なぜうちだけが…」という声が上がります。その声に丁寧に応え、バランスよく行政サービスを届けてきた結果、「北九州市」としての輪郭が、やや霞んでしまったことも否めません。かつては、経済も人口も右肩上がりの時代。予算も潤沢で、「あちらも立てて、こちらも立てる」ことができました。でも、いまは違います。いま私たちは、ある意味、市政史上初めて“経営”が問われる時代に生きています。限られた財源の中で、すべてを叶えることはできません。だからこそ、私たちには「選択と集中」、時には「勇気ある縮小（グレート・シュリンク）」という決断が必要になる。その判断には、強い覚悟が要ります。そしてもうひとつの力、それが「求心力」です。実はこの街ほど、市役所に対して大きな期待が寄せられている都市は、そう多くはないと感じます。なぜなら、各区がそれぞれ魅力と文化を持ち、それを愛する市民がいるからです。「この北九州市をもっと誇れる場所にしたい」「北九州らしさを、もっと全国に伝えてほしい」そう願う市民の声こそが、私たち行政のエネルギー源です。この「遠心力」と「求心力」をどう調和させるか。その鍵は、「視点を上げる」、そして「時代を進める」という勇気ではないでしょうか。各区が自立し、それぞれの魅力を発揮しながら、市全体が一つのビジョンに向かって進んでいく。まるで、七つの色が一つの光となるプリズムのように――。前回の手紙でも触れましたが、私は、かねてから「区役所の現場力をもっと高めたい」と言ってきました。現場でこそ、市民の声に耳を傾け、地域のリアルが見えるからです。その一方で、本庁における市全体を見渡す視野と戦略、そして未来を描くリーダーシップも必要です。職員の皆さん一人ひとりが、自分の仕事を「市民の笑顔」とつなげながら、また「北九州市の未来」と重ねながら、視点を「遠心力」と「求心力」の往復運動に合わせつつ、新年度からも業務に取り組んでくれることを願っています。北九州市の未来は、他の誰かがつくるものではありません。人任せと評論家では、未来は動きません。私たち自身の手で、一緒につくるものです。この街の持つ「誇り」と「多様性」を信じて。そして、変化を恐れず、責任と覚悟をもって。ともに、「北九州らしさ」が光る未来へ、歩んでいきましょう。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:84,date:"2025年04月07日(月)",title:"「答えは市民の中にある",content:"――新年度のはじまりにあたって』新しい年度が始まりました。人事異動で新しい職場に移られた皆さん、そしてこの春、新たに北九州市職員として歩み始めた新規採用職員の皆さん、本当におめでとうございます。心から歓迎するとともに、この一年を一緒に市政を進められることを嬉しく思っています。さて、新年度のはじめに、私はどうしても皆さんにもう一度伝えたい言葉があります。「答えは市民の中にある」――。これは私がいつも繰り返し口にしている言葉ですが、これは単なるスローガンではなく、市政を担う私たち一人ひとりの原点であるべき信念です。世の中には、実にさまざまな価値観や考え方があります。善悪の基準も、人によっては違って見えることがあります。しかし、私たちが向き合う「市民の声」「世間の声」は、最終的には本質的に正しいものだと、私はつくづく感じます。私は、長年、厚生労働省や、信頼がすべてのビジネスの世界でも生きてきました。国を揺るがす不祥事や一気に得意先を失うリスクなども経験してきました。小さなゴマカシやズルは、たとえ小さくても、結局は、その事実は市民に知られることとなり、信頼を失います。一度失われた信頼を取り戻すことの難しさを、私自身、人生の中で何度も目にしてきました。だからこそ、私がもっとも恐れるのは「市民の声」です。そして何よりも大切にしたいのも「市民の声」です。政策や事業を進めていく中で、「どう見えるか」や「その場の説明の巧さ」で乗り切ろうとする誘惑に駆られる場面があるかもしれません。でも、それでは本質的な信頼は得られません。最大のリスク回避策とは、小手先の対応ではなく、正直に、誠実に、政策を遂行すること。市民の声に耳を傾け、そこにある思いに応えることです。逆に、困ったとき、判断に迷ったときには、「市民の声」に立ち返ればいいのです。私欲に走って眼が濁らない限り、判断の軸がぶれることはありません。無論、財源や人手の制約もあり、全ての「市民の声」に即座に応えられないこともあるでしょう（また「市民の声」という恰好で既得権に固守されることもあり得ます）。現状から変化や痛みを伴う場合には、短期的には理解されず、反発を受けることもあるでしょう。でも、それでも誠意を尽くして説明し、決してブレず市民のために取り組みを続ければ、やがていつかは温かく受け入れてもらえる。私は北九州市民を信じています。その際、忘れてはならないのが「サイレントマジョリティー（静かな多数派）」の存在です。「市民の声」とは、声高に主張される一部の声だけではありません。目立つ声、よく聞こえる声――いわゆる「ノイジーマイノリティー」は、私たちの耳に届きやすいものです。でも、その一方で、毎日必死に働き、家族を支え、声を上げる余裕すらない多くの市民がいます。その方々の声なき声にどう耳を澄ますか。そこにこそ、本当に必要とされている政策"},
  {vol:85,date:"2025年04月21日(月)",title:"北九州市と世界——不確実な時代にこそ、つながりと挑戦を。",content:"つくづく思います。北九州市は、世界と深くつながる都市です。ある意味、福岡市や熊本市とは異なる特性を持ち、世界情勢とダイレクトに響き合う力を秘めたまち。それは誇りであり、同時に責任でもあります。たとえば、トランプ関税。相互関税は90日の猶予があり、日米交渉は始まったとはいえ、国際経済は揺れ、緊張が走っています。この動きは、決して「遠い世界の話」ではありません。製造業のまち・北九州市にとって、極めて切実なテーマです。TOTO、安川電機、日本製鉄といった、世界とつながる企業がこの地にあります。そうした企業と連なる地域の中小企業、サプライチェーンもまた、世界経済の風にさらされているのです。私が特に危機感を抱いているのは3点です。第一に、関税により輸出コストが上がり、日本企業が不利な立場に置かれる可能性。第二に、価格に転嫁しにくい中で、下請け企業や中小事業者が圧力を受け、生産縮小や雇用調整を迫られるかもしれないこと。そして第三に、その影響が波紋のように広がり、物流、建設、サービス業など、地域経済全体に負荷が及ぶリスクです。今のところ、表面的な混乱は見えません。しかし、「様子を見る」だけでは遅い。だからこそ、北九州市は現場の声に耳を傾け、スピード感をもって対応していきます。短期的には資金繰りや雇用の支援を、中長期的には米国以外の市場開拓や、地域産業のデジタル化・高付加価値化を後押ししていきます。他方、こうした経済の不確実性の一方で、北九州市は確かな手応えも得ています。先週、私はパリで開催されたOECD主催の「Urban Days」に招かれ、北九州市の高齢社会への先進的な取り組みを発表してきました。市営住宅の高齢者対応リフォームや、デジタル技術を活用した福祉政策、民間との協働による住宅確保など、北九州市の事例は多くの関心を集めました。イタリア・トリノ市やスロバキア・ブラチスラバ市、世界銀行、OECDの関係者たちからも強い興味と評価をいただきました。都市が抱える社会課題に真正面から取り組む北九州市の知見は、まさに“世界に必要とされる経験”なのだと確信しました。そして日曜日には、インドのIT大都市ハイデラバードを擁するテランガナ州のレディ首相が、東京・大阪に続いて北九州市を訪問されました。北九州市のエコタウンをインドに展開するという大きな構想を共有し、デジタル人材の交流、大学連携、直行便開設の可能性、さらには姉妹都市提携など、多岐にわたる意欲的な議論が交わされました。世界の要人が北九州市に関心を寄せ、足を運ぶ。それはこのまちが、世界と未来を語る土俵に立っている証です。私たちは、挑戦する都市・北九州として、困難な時代であっても前を向き、世界とともに進んでいきます。危機をただ嘆くのではなく、そこにチャンスを見出す。そして、その挑戦を支えるのは、まさにこのまちに根を張って働く人たち"},
  {vol:86,date:"2025年04月28日(月)",title:"「越境力",content:"を磨こう』今日は、皆さんにぜひ伝えたいことがあります。それは――「越境力」を磨こう！ ということです。先週、小倉織の縞縞さんと溝上酒造さんのコラボ商品「介」の表敬訪問を受けました。小倉織という伝統織物と、北九州市が誇る銘酒・天心。この異なる分野の出会いが、まさに奇跡の融合を生み出しました。しなやかさと力強さを兼ね備えた日本酒に、小倉織をまとわせた、美しくも堂々たる逸品。発表後、あっという間に注文が殺到したと聞いています。皆さん、これが「越境力」です！異なるもの同士を掛け合わせ、新たな価値を生み出す。それが、人々の「Wow！」、つまり驚きと感動を呼び起こすのです。イノベーションとは、決してゼロから何かをつくることではありません。「新結合」――これこそが、イノベーションの本質です。異なる世界をつなぎ、新たなエネルギーを生み出す。それが「越境力」です。しかし、率直に言いましょう。行政組織、官僚型組織には、どうしても縦割りの壁があります。自分の部署、自分の仕事だけを見つめがちです。隣の部署や、異なる業種と手を組む発想が生まれにくい。これでは、もったいない！今、私たちには、「組織の壁を超える勇気」が必要です。街の至るところに、新しい価値の種を蒔いていくために。思い出してください。TSUTAYAは「本を売る場所」ではありません。「ライフスタイルをデザインする場所」として、書店とカフェ、雑貨、アートを掛け合わせたことで、武雄図書館などは全国から人が訪れる空間になりました。私たち北九州市も、挑戦してきました。昨年の国際スポーツ大会（バレーボールネーションズリーグ）では、スポーツにエコを掛け合わせました。パルクール世界選手権では、道路というインフラに、子どもたちの遊びとアーバンスポーツを掛け合わせました。食と観光を組み合わせた「すしの都」構想。小倉城に最新テクノロジーを掛け合わせたプロジェクションマッピング。竹あかりイベントでは、アートとエコと歴史が融合されています。掛け合わせることで、価値は何倍にも膨らむ！ただの施設、ただのイベントでは、人の心は動きません。五感を刺激する、体験を生む、物語を紡ぐ。これが、これからのまちづくりに不可欠な視点です。だからこそ、今、皆さんにお願いしたい。「越境力」を強く意識してください。隣の課と手を組む。違う分野の専門家と議論する。民間企業と自由な発想でコラボレーションする。調整が面倒だ？そんな声もあるでしょう。でも、面倒くささの向こうにこそ、「新しい価値」が待っている！のです。今、世界はオープン化の時代です。「越境力」こそが、北九州を次のステージへ引き上げるエンジンになります。何かが生まれる、何かが動き出す。そんな予感のする街へ、一緒に育てていきましょう！さあ、チャレンジを楽しもう。そして、次の「Wow！」を、あなたの手で生み出してください。越"},
  {vol:87,date:"2025年05月07日(水)",title:"実践者たれ、評論家となる勿れ",content:"先週、抱樸の奥田理事長の呼びかけで、作家・町田そのこさんと3人で鼎談をしました。心の深いところに触れるような時間でした。私は、町田さんの作品を本当に素晴らしいと思います。彼女は人間の哀しみと温もり、光と影を、無理に声を張り上げずに、そっと描いてみせる作家です。人生は必ずしも希望に満ちているとは限りません。痛みがあり、理不尽があり、孤独があります。しかし、彼女の作品にはいつも、そんな（時に刺さるような）現実を受け容れ、乗り越えて生きる人間の「光」があります。そしてその光は、強くはないけれど、確かに行く先の道を照らしてくれる気がするのです。町田さんは決して「こうあるべき」と私たちに押しつけません。静かに、でも鋭く、人生の問いをテーブルの上にそっと置いていく。批評ではなく、共有。押し付けではなく、対話。人間の深部にある尊厳と、それへの畏れが、行間に滲んでいるように思えるのです。さて、行政の仕事というのは、常に「べき論」と隣り合わせです。「〇〇すべき」「〇〇が足りない」。公共の世界に生きる者として、社会の善や理想を語らねばならず、それを形にしていかねばならないのです。それは時に、尊い特権でもあります。しかしその「べき論」が、いつの間にかただの「評論」になってしまってはいないか。あたかも分かっているかのように、他人の努力を評価し、欠点を指摘し、「だからこうすべきだった」と語る――そんな「わかった顔」が、世の中に溢れていないかと、私は強く思うのです。かつて私が官僚から民間に転じたとき、「公務員というのは口は達者だが、動きが鈍い」と言われたことがあります。実際に行動し、汗をかくことの尊さを、そのとき強く学びました。評論家でいることは、自分に責任を負わずに済む安全地帯にいることと同義です。しかし我々行政マンは違います。現場で悩み、決断し、結果を受け止め、時には非難も浴びながら、それでも進む「実践者」でありたい。Doerでありたい。厚労省時代、やっている仕事に、日々数えきれぬほどの意見や評論が寄せられました。中には鋭い提言もありましたが、私は常に「では、あなたはどう実現しますか？」という問いを心の中で投げかけていました。行動が伴わなければ、どんな正論も空虚です。今、SNSやメディアを通じて、誰もが「評論家」になれる時代です。しかし、私たちはその流れに呑まれず、「知る」と「行う」を一体とする「知行合一」の精神を貫きたい。吉田松陰は「思想は行動で示せ」と弟子に教え、西郷隆盛は命を懸けて自らの信念を貫きました。行動することでしか、生きた思想にはならないのです。行動すれば、当然批判もあります。カメラアングルによっては、善意も悪意に映るかもしれない。それでも前に進む。その覚悟を持つ者こそが、社会を少しでも良い方向に導けるのではないでしょうか。市長就任時、末吉元市長が私にこう言いました。"},
  {vol:88,date:"2025年05月12日(月)",title:"危機を成長の礎へ――次なるチャンスへの決意",content:"先日、私たちが期待を寄せていた日産自動車によるEV蓄電池工場の進出が、業績悪化と国際経済の不透明感の中、断念されるという知らせが届きました。市民の皆さんと共に未来への期待を重ねてきた立場として、誠に残念でなりません。しかし、ここで立ち止まるわけにはいきません。むしろ、これこそが「真の勝負の始まり」であると、私は確信しています。私たち北九州市は、これまで特定の企業誘致に依存することなく、未来産業全体を見据えた長期戦略を一歩ずつ積み上げてきました。次世代モビリティや半導体、デジタル産業――これらは世界が今まさに求める成長領域であり、その潮流は揺らぐことはありません。私たちが描くビジョンは、一企業の判断によって左右されるようなものではありません。今回の出来事は、地域の強みをもう一度見つめ直し、より多様で持続可能な産業基盤を築く絶好の機会と捉えるべきです。北九州市には、空港・高速道路・港湾という陸海空の結節点に加え、広大な産業用地や、技術者を育成する教育機関、そして何より「まちを良くしたい」と願う熱意ある市民がいます。実際、すでに国内外の複数の企業から「これほど立地条件が整った場所は他にない」と高い評価の声も届いています。世界はアメリカだけではありません。インド、ASEAN、ヨーロッパ――多極化する世界経済の中で、次なる成長の担い手を見据え、私たちは視野を大きく広げていかなければなりません。先週末には、担当部門と意識を一つにし、これからの戦略展開を確認しました。北九州市の強みである「グリーン」を旗印に、インド市場へのエコタウン技術の展開、クリーンエネルギーの環境も活かした半導体関連企業の誘致、さらにはITやデータセンターといった景気変動に強い産業の集積を加速させていく決意を新たにしたところです。一方で、トランプ大統領による関税政策や、金融市場の不安定化など、世界経済は引き続き不確実性に満ちています。保護主義の拡大がもたらす国際サプライチェーンへの影響は、自動車や素材産業を支える北九州経済にも少なからず波及する可能性があります。アンテナを高くし、危機感を持って、中小企業の経営や雇用、市民生活への影響を見据え、関係部局が連携し、先手先手で対策を打っていくことが求められています。しかし、私たちは危機に怯むのではなく、これを「産業構造強靭化のチャンス」と捉えるべきです。不確実な時代だからこそ、どのような規制緩和や支援策を国に求めていくべきか、明確に打ち出していく必要があります。そして、地域一丸となって次なる成長産業を呼び込み、育て、世界市場に挑戦していく戦略を磨き続けましょう。挑戦の先には、必ず可能性が待っています。国際経済が激動する今だからこそ、私たちは「止まらず」「俯かず」「前を向いて」歩み続けなければなりません。私は、皆さんと共に、このまちの未来に責任を持って進み続け"},
  {vol:89,date:"2025年05月19日(月)",title:"憧れの人はいますか？",content:"今日は、特に若い職員の皆さんに向けて、お伝えしたいことがあります。皆さんには「憧れの人」がいますか？心から、あの人のようになりたい、あの人の生き方に魅力を感じる――そんな存在を思い描けるでしょうか。職場の中でも外でも。先週、東京で国会議員の方々や、かつてから尊敬している数人と久しぶりに顔を合わせる機会がありました。改めて、「やっぱり素敵だな。自分もこんなふうにありたいな」と心から思いました。年齢を重ねてもなお、人に憧れるということは、決して幼い感情ではありません。それは、自分の中の理想を見つめ直し、未来へ歩む推進力になります。「憧れの人」は、時に人生の道標となります。迷ったとき、「あの人だったらどう考えるだろうか」「どんな言葉を選ぶだろう」「どんな振る舞いをするだろう」と思い浮かべることで、迷いや不安の霧が少し晴れるような気がします。人間は、生きていれば問題だらけです。１つ問題がなくなると、すぐにまた次の問題が起こる。仕事や人間関係、健康やお金など。懸命に生きることは、問題を生み続けるようなものです。そんなときに、「憧れの人」を想うことが力や道標となります。私自身、これまでの人生の中で、折々に「憧れの人」がいました。振り返ると、およそ3年に1人くらいのペースで、そうした存在に出会ってきたように思います。たとえば、厚生労働省に入って間もない頃に出会ったK課長。体格も声も大きく、よく笑い、快活で豪放磊落という言葉がぴったりの方でした。部屋には次から次へと人が訪れ、好奇心旺盛にあちこちの現場を飛び回っていました。信念の人でもあり、「罪を憎んで人を憎まず」を地で行くような姿勢を貫いておられました。キリスト教徒ということもあり、どんな人にも分け隔てなく接し、心から人を受け入れていました。その一方で、妥協を許さない厳しさもあり、各方面とぶつかることも少なくありませんでしたが、誰よりも人を大切にする姿が今も心に残っています。また、あるビジネスマンの先輩も忘れられません。義理堅く、人を裏切らず、決して嘘をつかない。周囲の仲間を心から大切にし、「いつも応援してるよ」と励まし続けてくれる方でした。８０歳を超え、年齢を重ねてもエネルギーに満ちていて、会えば皆が笑顔になるような存在。こうした人たちに出会い、私は何度も勇気をもらい、前に進む力を得てきました。今、市長という立場になっても、私には「憧れの人」がいます。難しい局面に立ったとき、その人ならどう考えるか、どんな言葉を使うか、どうやって困難を乗り越えるかを思い描くことで、不思議と気持ちが明るくなり、前向きな力が湧いてくるのです。そうした方々のレベルと自分とは、まだまだ遠いかもしれませんが、「少しでも近づきたい」と思うこと自体が、自分を高める原動力になっています。人は、人によって感化されます。本や情報も大切ですが、やはり「人」その"},
  {vol:90,date:"2025年05月26日(月)",title:"年金改革と「持続可能なやさしさ",content:"』いま、政府が進める年金改革の議論では、基礎年金の底上げを目的として厚生年金の積立金を活用する案をめぐり、与野党間で調整が進みつつあります。当初は「流用」との批判を恐れ、与党案からは外された構想が、結果として野党から逆提案されるという、まさに政治の逆説ともいえる展開を見せています。私は、年金行政に長年関わってきた者の一人として、こうした政策論が政争の具になることを、何よりも避けたいと思います。そうした意味で今回、与野党が同じテーブルで議論し、一定の方向性が見え始めたことは、制度の信頼性を守るうえでも評価すべき前進です。もっとも、この案は制度設計としては「ギリギリ」のラインにあるものです。本来、厚生年金の積立金は、その制度内で将来の給付に備えて積み上げてきたもの。それを基礎年金に充てることは、制度そのものの設計思想には明示されていなかった措置です。しかし同時に、年金財政は厚生・基礎の縦割りを超えて、柔軟かつ一体的に運営されるべきであるという視点も必要です。したがって、この対応は「例外的な知恵」として一定の合理性をもって受け入れることはできると考えます。ただし、注意すべきは、これを前例として、安易にもっぱら手取りの増加や給付の拡大を繰り返すようになれば、制度の信頼性を中長期的に損なうという点です。給付と負担のバランスが崩れ、「持続可能なやさしさ」が失われれば、それは将来世代への無責任にほかなりません。年金制度を語る際に、制度自体の仕組みだけに注目するのでは不十分です。年金は、経済と人口動態すなわち少子化と密接に連動しています。少子化は経済政策の影響を受ける側面もあり、年金制度もまた、その国の経済の「写し鏡」として設計・運営されるものです。マクロ経済スライドが導入されたのも、そうした発想に基づいています。私が厚生省に就職した1994年当時と2024年とを比較すると、日本のGDPは約480兆円から600兆円へと緩やかに増加した一方で、高齢化率は14%から30%へと倍増、出生数は124万人から73万人にまで減少し、社会保障給付費は60兆円から140兆円に、いずれも急激に膨れ上がっています。これは、制度そのものの持続可能性に対する警鐘であり、構造的課題への対応が急務であることを示しています。私は改めて痛感します。社会保障を守るには、経済を強くするしかない。「強くなければやさしくなれない」という言葉に込められた重みを、私はこの30年で身をもって理解しました。だからこそ、「くらし」を守るには、「稼げるまち」をつくることが王道であるのです。まさに経世済民——経をもって世をおさめ、民をすくう——の本義が問われています。他方、現実には、長年の円安誘導やそれに伴う物価高、賃金が生産性の向上に見合って伸びないという状況の中で、構造的な再分配政策が必要となる側面があります。しかし、その"},
  {vol:91,date:"2025年06月09日(月)",title:"インドを訪問して",content:"先週、一泊三日というまさに弾丸行程で、インドを訪問してきました。北九州市の底力が、いま世界に求められている――私はその事実を、現地の空気、熱気、喝采の中で、はっきりと体感しました。今回の訪印は、いわば「国境をまたぐトップセールス」。インドという13億人を抱える巨大市場に対し、北九州市が何を提供できるのかを、自らの言葉で、姿勢で、強く訴える場でもありました。その舞台で私たちは、たいへんな歓迎と称賛を受けました。現地の経済人、技術者、政府関係者から次々に寄せられる関心と期待。日系企業も10社以上が集結し、まさに官民一体の形での展開でもありました。加えて、インド国内の報道機関も20社近く詰めかけ、我々の動きに注目しました。新聞、テレビ、ネット、それぞれの媒体で「北九州モデル」が紹介され、強いインパクトを与えたことは間違いありません。そして、目に見える成果として、北九州市の誇るエコタウンモデルが、インドへの正式に輸出されるプロセスに向かって動き出し、協定締結も実現しました。これは単なるビジネスの成功ではなく、日本の都市が「世界の課題解決のパートナー」として選ばれたという、意義ある一歩でもあります。特筆すべきは、この動きの中で、「北九州」という都市の「名前」そのものが高く評価された点です。つまり、私たちの積み上げてきた経験、実績、技術の深みと真摯さが、しっかりと伝わったということです。これは、これまで現場で地道に仕事を積み重ねてきた先人の皆さん、地元企業、そして皆さん一人ひとりの努力の賜物です。今回の訪問で、私は改めて思いました。インドという国は、「数は力」の国です。人口、需要、成長力、そのすべてが桁違い。そしてもうひとつ――あの国には、何かが成功すれば一気に10倍に広がる、圧倒的なスケールのダイナミズムがあります。いわば“レバレッジの国”です。しかし同時に、そこには確かな「支点」が必要です。その支点とは、地に足がついた本物の技術と運用力。すなわち、北九州市の企業が長年にわたり築き上げてきた、オペレーションとメンテナンスの現場力だと感じました。私たちの強みは、決して派手ではありません。ですが、確実であり、堅牢であり、信頼される力です。現場を知り、仕組みを整え、長く支える。これは簡単に真似できるものではありません。我が日本の強み、中小企業含めた現場の力だと思います。そして、廃棄物処理、衛生管理、サーキュラーエコノミー。これらは、北九州市が世界に先駆けて取り組み、評価を受けてきた分野です。公害都市という過去を、技術と市民協力で乗り越えたこのまちの歩みが、今やグローバルな価値となり、インドの「次のステージ」に欠かせぬピースとなろうとしているのです。そして何よりも大きな意義は、「北九州が答える」という構図です。世界の大国が直面する課題に、私たちが挑み、応える。これは都市の誇り"},
  {vol:92,date:"2025年06月16日(月)",title:"すしの都と富山県",content:"先週、富山県で、“世界初”のすし会談をしました。お会いしたのは富山県の新田八朗知事。県庁内の会場には大勢のテレビカメラがずらりと並びました。私たちは、富山県のお寿司と、北九州市から「出前」したお寿司を一緒に食べながら、自治体どうしの連携を約束しました。その席で「すしのゴールデンルート構想」も発表しました。「北九州＝すし」というイメージが、いまや全国に広がりつつあります。テレビでも大きく取り上げていただき、広告換算で数億、あるいは数十億円分の価値があったと言われるほどです。ここまでの成功は、富山県の皆さんの素晴らしい準備と、関係者みんなの力があってこそでした。振り返ってみると、いくつかの“ターニングポイント”がありました。ひとつは、スピード。4月に「すしの都課」を立ち上げたばかりだったのですが、新田知事がそのことに触れてくださった記者会見を見て、私はすぐにSNSで「すし会談やりませんか」と呼びかけました。すると、新田知事からもすぐに「やりましょう」との返事。これが、すべてのはじまりでした。「北九州のすしを富山へ“出前”する」という発想にも、少し勇気が要りました。でも、照寿司さんの全面協力をいただき、ネタも職人も連れて、ほんものの北九州市の味を届けることができました。会談の中では、富山県を“兄貴分”としてリスペクトしていることも、まっすぐに伝えました。そのことで、むしろ北九州市のすしブランドも一気に格上げされたように思います。感謝です。北九州市と富山県。直通の交通もなく、移動時間も5時間半。でも、あえてそこを越えてつながったことが、多くの人に驚きを与えました。地方都市どうしが、能動的に動き、自分たちの魅力を自分たちで発信する。そういう文脈も、きっと届いたのではないでしょうか。そして、いちばん大切にしたのは「巻き込むこと」でした。すし文化を世界へと届ける。民間企業も他都市も巻き込む。実際、8月にはJR西日本さんとのコラボイベントも発表しています。「すしのゴールデンルート構想」については、実を言うと、富山に向かう電車の中でふと思いついたものでした。長い道のりを体感しながら、ふと「この移動そのものが、ルートとしてすしでつながったら面白いな」と思ったのです。思い、考え、やってみる。話をつくる。仲間を誘う。実際に会いに行く。この一連の流れを、一気に走り抜けたことは、私たちチームにとっての貴重な財産になりました。こうした積み重ねが、やがて「北九州＝Action」というブランドにつながっていくのだと思っています。関係部局の皆さんに感謝。やり切る。突き詰める。その姿勢も、今回とても大きかったです。「すしのPRで、富山まで行くの？」という声もありました。でも、行く。資料の色やフォントまで、移動中の電車の中で最後までこだわりました。すしネタ柄のネクタイを手に入れるために、高岡の工場"},
  {vol:93,date:"2025年06月23日(月)",title:"世界に響く都市を目指して──ボンでの国際会議を経て",content:"ドイツ・ボンで開催された気候変動に関する国際会議に、北九州市が日本の自治体として唯一、公式に招待されました。この機会は、世界の環境政策とサステナビリティの最前線において、「北九州」という都市名を再び力強く印象づける貴重な場となりました。初日は、国連気候変動枠組条約（UNFCCC）および各国の都市リーダーが集うハイレベル会合に登壇し、公害を乗り越えた北九州の歴史、市民による環境保全への取り組み、そして私たちが描く未来ビジョンについて熱く語りました。二日目には、「Daring Cities（気候変動に本気で取り組む都市）」を代表する立場として登壇し、市民・企業・行政が一体となって進めてきた挑戦を世界に向けて発信しました。ボン市長やICLEI（持続可能性のための自治体協議会）の世界事務局長とも対話を重ね、都市間ネットワークの連携も一層強化されました。都市が国家を超えて連携する時代において、北九州市の存在感は確かに世界に響いています。いま、世界の都市は「気候変動への対応」「都市機能の再編」「市民の幸福」という難題を同時に抱えています。国家の枠組みに頼るだけでは、もはや対応しきれない時代です。だからこそ、「都市から地球規模の課題に挑む」ことが、これまで以上に求められています。今回の出張には、令和7年度の予算の重点項目の柱に掲げた「世界をリードするサステナブルシティへのキックオフ」という強い意志があります。ボンでの登壇は、その決意を世界に示す第一歩でもありました。私はそこで、世界に向けて北九州市発の新たな都市モデル、「マンダラモデル」を初めて提案しました。これは、出国直前にスタッフと協議する中で浮かんだ構想です。複雑に絡み合う都市課題を、バランスよく俯瞰的に捉え、国、都市、地域コミュニティ、市民などといった要素を円環的に繋ぐ概念であり、今後の都市計画や国際発信において一つの示唆を与え得るものとして提案し、たいへん興味深く受け止められました。現在、世界を先導すると言われるサステナブルシティを見ていると、成功の鍵は大きく3つに整理できると感じています。第一に、戦略（Strategy）。理論的裏付けに基づく構造化された道筋と明確な目標があること。第二に、物語（Narrative）。都市のプロジェクトに感情や共感を呼び起こすストーリーが宿っていること。そして第三に、試行（Prototyping）。失敗を恐れず、まずはやってみる姿勢と柔軟性です。北九州市は、公害克服の歴史や紫川の再生といった、世界に誇れるナラティブを持っています。さらに、空き家活用や竹あかり、干潟はじめ企業と市民による美化活動といった市民主導の多彩な実践が、街の至るところにあります。それら一つ一つを丁寧に掘り起こし、磨き、発信していくことが、共感を広げる力となると考えます。そして、北九州の強みは“試すこと”を恐れ"},
  {vol:94,date:"2025年06月30日(月)",title:"日本人について",content:"ここ数週間、インドやヨーロッパ、そしてタイといった国々を訪れ、政府要人や経済人などと語らう機会を得ました。それぞれの地で、北九州市の代表として我が街の魅力を語ってきました。そして同時に、そこで得た信頼と関係を、必ず北九州市民の皆様に還元しようと、決意を新たにしているところです。海外で人と向き合い、文化や経済の本質に触れるたびに、私は改めて思います。日本人として生まれたことを誇りに思うと同時に、その精神性と国柄を、このまま静かに衰退させてはならないと。誠実で、慎ましく、それでいて毅然としている。それが日本人という存在です。日本人は元来、静かで謙虚でありながら、芯には猛々しさを宿しています。私は過去にアメリカやイギリスに赴任した時も日本人という存在を外から見つめ、逆にその特質に気づかされました。手先が器用で清潔を好み、仲間を大切にし、卑怯を憎む。そんな姿勢が、製品になり、空気になり、たたずまいとして世界を惹きつけてきたのです。北九州市もまた、先進的な環境技術をもって、アジア諸国に貢献してきました。その背後にあるのは、私利私欲に走らず、公益に尽くそうとする「利他」の精神です。この利他こそ、日本人の美徳であり、世界において希有な価値観だと、私は確信しています。しかし、そうした誇るべき精神性は、今や風前の灯火となってはいないでしょうか。世界を歩く中で、「今の日本人は果たしてこれでいいのか」と自問する機会も増えました。効率と損得を最優先し、互いの欠点をあげつらう風潮。「みっともない」ことを恥じる心はどこへ行ったのか。品格や節度は、国民の間でいまだ保たれているでしょうか。日本人は本来、新しい知恵を柔軟に取り入れる力を持ち、自然や社会と調和する術を知っていました。いま、SNSや浅薄な情報の洪水の中で、かつての「内省する文化」はかき消されてはいないか。私は、日本人が持っていた精神の深み――それこそが世界に誇れる資産であると考えます。李登輝やマハティール、そしてかつての連合国の指導者でさえ、日本人の精神性の高さに深い敬意を示しました。それは一過性の礼儀ではなく、文明としての尊重だったと思います。アメリカの政治学者サミュエル・ハンチントンは、日本を中国文明や西欧文明、イスラム文明などとは異なる「独立した文明」として分類しました。これは、どこかの属国や派生文化ではなく、日本が歴史的にも精神的にも、唯一無二の文明であることを意味しています。私はこのことに、深い誇りと使命感を覚えます。この固有の文明を、我々が担う世代で潰してしまってはならない。世界に尊敬される日本人の姿とは何か。品位を保ち、自立し、良心に基づいて判断する姿です。私は、日本人がもう一度その姿を取り戻し、次代に伝えていける国であってほしいと、心から願います。そして、それを体現する北九州市を、市民の皆さんと作っていきたいと、"},
  {vol:95,date:"2025年07月07日(月)",title:"スピードこそ命",content:"「スピード感」。この言葉、日常でもよく耳にしますが、その本質について、私たちはどれだけ深く考えたことがあるでしょうか。私は先日、アジアやヨーロッパの各都市を訪問する中で、ある言葉に衝撃を受けました。それは——「アセアン諸国の中で、日本は最もスピードが遅い国だ」というものでした。同様の指摘を複数の方から受けました。その背景には、次のような見方があります。一つは、日本人が世界の動向や国際情勢に対する感度が低く、外国語、特に英語での発信力や対応力に乏しいこと。二つ目は、合意形成にこだわるあまり、規制や前例に縛られ、イノベーションや挑戦に対して慎重すぎる姿勢。そして三つ目は、本質ではない事柄に時間をかけ、枝葉末節な議論に没頭しがちであるということです。どれも耳に痛い指摘ですが、私たちはそこから学ばなければなりません。私は強く思います。スピードは「価値」であると。そして、スピードとは、単なる「速さ」ではなく、意思の表明であり、覚悟の証明でもあります。行政においてスピードがあるということは、まず第一に、住民の皆さまに対して「必要なサービスを、必要な時に」届けられるということです。これこそが行政の使命であり、信頼の土台です。第二に、スピードは人を巻き込みます。物事が進むテンポが遅いと、関係者の温度が下がり、意欲も関心も薄れていきます。逆にテンポよく展開することで、「一緒にやろう」「応援したい」という気持ちが高まります。スピードには、人の心を動かす力があるのです。第三に、スピードは相手の期待値をコントロールする力でもあります。時間がかかるほど、受け取る側の期待は上がり、「それだけ待たせたのに、これだけ？」という失望を招きかねません。完璧でなくても、素早く形にし、提示する。そこにこそ、行政の信頼と機動力が宿ると考えます。もちろん、財源を伴うものなどはスピードだけで語れません。丁寧な検討と裏付けが必要です。「早ければ何でも良い」というわけではありません。丁寧さや慎重さも必要です。しかし、丁寧さの名のもとに、動かぬことが常態化していないか。私たちは今一度、見つめ直す必要があります。スピードとは、想いの表れです。プロとしての覚悟です。私は、「いつかやる」「検討します」という言葉は危険だと思います。今やらなければ、いつまでも「やらない」という結果になるだけです。「今決める」「すぐ動く」。それが、私たち行政に求められている姿勢であり、信頼される都市であるための条件です。これからの都市は、「慎重であること」よりも、「動けること」が問われます。スピードこそが、都市間競争において最も重要な資源です。時間をかければ良いものができる——そんな考えは幻想に近いものです。できる限り、「前例がないから」「調整が必要だから」と動けないのではなく、前例をつくり、調整しながら前に進む。その勇気を、北九州市が"},
  {vol:96,date:"2025年07月14日(月)",title:"支え合い、守り、そして時には闘おう",content:"市政の第一線に立つ皆さん、窓口に立つ皆さん、日々の丁寧な応対、本当にありがとうございます。市民の暮らしに寄り添う最前線で、皆さんが向き合っているのは、制度や文書ではなく、「生身の声」です。その声に耳を傾け、解決の道を共に探る。それが行政の原点であり、皆さんの日々の姿勢に、私は深い敬意を抱いています。けれども今、ひとつの課題が顕在化しています。いわゆる「カスタマーハラスメント（カスハラ）」です。東京都では条例化され、北九州市でもガイドラインを設けました。これは、皆さんを守るための「小さな盾」です。言うまでもなく、市民からの苦情やご意見は、行政にとって大切なフィードバックであり、改善・変革の源です。しかし、内容や態度が度を超え、怒声や威圧、人格を否定するような言葉に変わったとき、それはもはや対話ではなく暴力に近いものです。しかも、そのような圧力は、窓口だけでなく、職務のさまざまな場面に姿を変えて現れます。「声が大きい者の要求こそが優先されるべきだ」というような空気が、どこからかにじみ出ることもある。そうした場面に立たされながらも、皆さんが節度と責任感をもって職務に臨んでいることを、私は決して見落としていません。今、あえて言いたい。理不尽な要求や態度に、ひとりで向き合う必要はありません。消耗を感じたとき、心が疲弊したとき、自分を責めるのではなく、まず共有してください。私は、皆さんを守りたい。少なくとも、支える側でありたいと思っています。そして、時には、闘ってもいいのです。必要以上に下手に出ることが「誠実」なのではありません。大義があるなら、信念があるなら、毅然とした態度を取ってください。私たちは、ただ言われるがままの存在ではありません。市民の暮らしを支える責任ある専門職集団なのです。ただし、決して感情的な応酬になってはいけません。かつて、ギリシアの哲人セネカはこう言いました。「怒りとは、最も短い狂気である。」私たちは、節度と理性を手放さず、静かに、しかし確かに対峙していきましょう。でも、誤解しないでください。すべての声を拒むのではありません。情報も時間も発言力も限られた方々が、必死に訴えてくる声があります。不器用な言葉の裏に、本当の困りごとが隠れていることもあります。だからこそ、行政は”共感”する力を忘れてはなりません。「伴走者」として、ともに課題に向き合う姿勢が、根本にあるべきです。北九州市役所の私たちは、チームであり、仲間です。「市民のため」という共通の目標に向かって、共に支え合い、共に守り合い、そして、必要とあらば共に闘う。そのすべての過程において、品位と節度を大切にしたい。それがやがて、北九州市という街全体が、品位のある街、「互いをリスペクトし合える街」へと育っていくきっかけになることを強く願います。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:97,date:"2025年07月22日(火)",title:"示された民意 ── 参議院選挙の結果から",content:"まず、選挙業務に関わられた職員の皆さんに心より感謝申し上げます。今回の参議院選挙の結果について、さまざまな評価や分析がなされています。私は、市政を進める上での重要なメッセージを読み取ってみたいと思います。 まず注目すべきは、投票率が、若い世代含め、前回より5ポイント以上も上昇したことです。長く「若者の政治離れ」と言われてきましたが、私はずっと、「政治そのものからの離反」ではなく、（自戒も込めて）「政治家離れ」「政党離れ」ではないかと言ってきました。信じられるものが見えず、参加する価値を感じられなかった──だから彼らは静かに黙っていたのではないか。その沈黙の奥には、不信、諦め、怒り、そしてほんのわずかな期待が潜んでいた。今回、少しだけそれが表に出たのだとすれば、投票率の上昇は“声なき声”のうねりではないでしょうか。結果を見ても、「自民 対 旧民主」というかつての構造は明らかに変質し、多党化が進みました。SNSやYouTubeといった情報空間の変化により、これまで届かなかった声が政治空間に入り込むようになりました。こうした時代の中で、私たち地方行政の担い手が持つべきと思う視点を、共有しておきたいと思います。第一に、「私たちを見てくれ」という市民の声に、正面から向き合うことです。市民は今、生活に直結しない政局や”裏金”といった話題に強い嫌気を感じています。「誰が得をするか」ではなく、「自分たちの暮らしに、何が変わるのか」を見ています。政局に明け暮れる政治家を、単なる「遠い存在」としてではなく、「自分の暮らしを踏みにじる存在」として見始めている人すらいます。これは深刻なことです。だから私たちは、もっと現場に出ていかなければなりません。たとえば、疲れ果てた表情で子どもを迎えに来るシングルマザー。物価高に不安を感じ、頼る人もなく暮らしている高齢夫婦。文化や言葉の違いの中で、摩擦と孤独を感じながら働く外国人労働者。こうした「水面下の痛み」は、役所のデスクでは見えてきません。だからこそ、私たちは生活に寄り添う行政を“言葉”と“政策”で示さなければならないのです。血の通った言葉で、血の通った政策を進めるしか道はありません。第二に、マクロではなく「ミクロ」を見るという視点です。GDPや企業の業績がどれだけ伸びても、家庭の冷蔵庫が空っぽであれば、市民は豊かさを感じられません。自治体が目指すべきは、“数字の上の経済”だけではなく、「暮らしの実感」としての経済政策です。それが「稼げるまち」と堂々と言えることだと思います。たとえば、空き家を改修して若者向けの賃貸住宅として再生する。給食費の負担を軽減する。賃上げと雇用の安定を図る。こうした一つひとつの政策が、暮らしに届く“実感”を持っているかどうか。それが、施策の本質を決めます。給付か減税かという手法の違いよりも、「私たちのことを本気で"},
  {vol:98,date:"2025年07月28日(月)",title:"言葉は武器であり、誠意であり、行政の魂である",content:"市政を預かって２年半、最近では職員の皆さんが、施策やプロジェクトに取り組む中で、伝え方、見せ方、言葉の選び方を工夫してくれていることに、私は感謝しています。ですが——。ここで、あえて皆さんに問いたい。その“言葉”は、本気で人を動かすつもりで紡いだものですか？「それって結局、言い方や見せ方の話でしょ？」「中身さえしっかりしていれば、伝え方なんて”飾り”でしょ？」——そう思っていませんか？違います。私は断言します。言葉は飾りではない、本質です。見せ方や言い方は、戦略です。戦うための道具です。思いを届ける、唯一の手段です。私たちの仕事は、美辞麗句を並べることでも、資料を美しく見せることでもない。私たちの使命は、市民の心を動かし、共感を得て、信頼を勝ち取ることです。そしてその全ての原点にあるのが、「言葉」なのです。先週発表した「まちごと職業体験」という事業名。これは単なる企画のラベルではありません。官民一体となって“まち全体で子どもを育てる”という意志の結晶です。「キッザニアがないなら、北九州の街全体でやってやろうじゃないか」その覚悟を、このひと言に込めました。言葉には、意思と戦略、そして魂がなければならない。耳ざわりの良いコピーや、流行語を切り貼りしただけでは、市民の心には届きません。そんな甘いもんじゃない。市民の会話の中にふと出てきて、喧々諤々、”自分ごと”と思って語ってもらえる言葉でなければ意味がないのです。言葉の力には、三つの側面があります。まず一つ目。言葉とは、「凝縮された思考であり、戦略そのものである」こと。例えば「稼げるまち」。——これは単なる願望ではありません。民間の力を引き出し、福岡市などに追いつき追い越す、北九州市としての覚悟です。「北九州アクション！」——これは、リスクを恐れず、議論で止まらず、まずやってみる行政を意味します。一言に宿る意味を突き詰める。これこそがコンセプトであり、行政の勝負どころなのです。二つ目。言葉とは、「謙虚さであり、思いやりの実践である」こと。市民の皆さまは忙しい。育児、介護、仕事に追われる毎日。そんな中、伝えたい意図が一言で伝わらなければ、それは“ない”のと同じです。だから「すしの都」。魚がうまい、食が豊か、暮らしやすい。それが一言で伝わるように。この大胆な表現には、何千万円かけて作る膨大なパンフレットや広告費にも勝る、戦略と配慮が詰まっています。「大作戦」という言葉にも理由があります。少しユーモラスで親しみやすく、でもどこか頼もしい。「これから一緒にやりましょう」と市民に巻き込む。そこに“行政の本気”があるのです。そして三つ目。言葉とは、「マネジメントである」こと。人に動いていただくのに、ルールや予算では限界があります。本当に組織を動かし、街を動かすのは、言葉で引き出す共感と意思の共有です。「Z世代課」には、若者と未"},
  {vol:99,date:"2025年08月04日(月)",title:"全員参加型経済を創る",content:"私たちは「稼げるまち」という市政のビジョンを掲げています。街に人やお金を集めること、そして住まう人々を豊かにすること、それは私たちの使命の中心にあります。ただし、それは一部の人だけが利益を得るようなまちを意味するものではありません。年齢、性別、障害の有無にかかわらず、すべての人が能力や意欲を活かし、価値を生み出しながら経済に参加できる。そんな、包摂的で誰もが役割を持てるまちを「稼げるまち」と私は考えています。その考えのもと、今回新たに「NUKUMORI PLUSプロジェクト」を始動し、先週発表しました。市内の”障害のあるクリエイター”の方々に焦点を当て、彼らの持つ才能や感性を、社会としっかり結びつけていこうという取り組みです。障害があることで、その価値が見えにくくなるような社会ではいけません。大切な一人ひとりに光を当てられる社会をつくること。これは、私自身、厚生労働省時代から一貫して持っている信念でもあります。現在、北九州市には就労継続支援B型事業所が190か所あり、約3,700人の方が利用しています。平均工賃は月額24,000円余り。全国平均をわずかに上回ってはいますが、経済的な自立を考えたとき、まったく十分とは言えません。生活の質を高め、社会の中でしっかりと活動していただくためにも、収入の向上は大きな課題です。これまで北九州市では、共同受注センターの設置や販売会の開催など、工賃向上に向けた取り組みを続けてきましたが、マッチング件数や売上には限界が見えています。「もっと売れる商品を作りたい」「ニーズがわからない」「安定した仕事がない」といった現場の声に、今こそ応える必要があります。そんな中で、私が学ぶべきモデルとして注目しているのが、スウェーデンの国営企業「サムハル（Samhall）」です。サムハルは約2万6千人の障害者を雇用し、清掃、物流、ITなど多様な業務に携わらせています。特筆すべきは、障害者が「守られる」存在ではなく、「活躍する」存在として職業訓練やマッチングを通じて社会での自立を支援している点です。実際、年間1,500人以上が一般企業へ移行しており、社会における包摂と挑戦の両立を実現しています。私たちも、北九州なりの形で“日本版サムハルモデル”を育てたい。今回の「障害福祉×観光」というチャレンジはその第一歩でもあります。小倉城のお土産処「しろテラス」と連携し、障害のあるクリエイターが、小倉城をテーマに商品開発を行いました。試作品を含め128点を制作し、商談会でバイヤーに直接提案。その中から選ばれた商品が、8月1日から「しろテラス」で販売されています。虎のモチーフを使ったコースターやクッキー、浮世絵を取り入れた行燈、忍者グッズ、水引アートなど、どれも個性豊かで高い芸術性を持ち、観光客の目にも留まる逸品です。これは単なる福祉の取組みにとどまらず、クリ"},
  {vol:100,date:"2025年08月14日(木)",title:"逆転の序章を共に創ろう――人口論",content:"皆さんへ。このメッセージも今回で100通目を迎えます。これまで、私の考えや、市政の進むべき方向性をお伝えしてきました。このやりとりは、私と皆さんとの大切なコミュニケーションの場です。今後も共に育て、共有の知恵と力にしていきたいと思います。さて、先日、北九州市の人口減少数が全国で最大になったというニュースがありました。このことについて、率直に私の考えをお話しします。まず、私は人口という指標を非常に大切にしています。なぜなら、それは単なる数字ではなく、都市としての総合力と可能性を映す鏡だからです。経済成長が手段であって幸福が目的であるように、人口もまた、市民の幸福を実現するための手段です。ですが、リーダーとして、この指標を重視するのは当然の責務です。江戸時代の藩主が石高を高める努力をし、人と富を集めたように、地方自治体の長の最大の仕事は「人口と資源を集め、地域を豊かにする」ことに他なりません。人口は、私がトッププライオリティにしている民間投資を呼び込みます。北九州市には道路や港湾、建物など豊かなインフラが揃っていますが、それを動かすのは人と企業です。人が集まれば企業が来る。企業が来れば雇用が生まれ、人が暮らしやすくなる。その循環を回すためには、人口の維持・増加が不可欠です。また、人口は内需を支えます。北九州市はものづくりの街ですが、関税や為替など外的要因に左右されない経済構造を作るには、地域内での消費とサービスの循環を強化することが必要です。教育や職業訓練、質の高いインフラ整備といった人的・物的投資は、その基盤を作ります。人口を確保することで内需を生み出し、製造業だけでなく、ITなど景気変動に強い産業の幅、その他サービス産業のすそ野もより一層広げられます。そして何よりも重要なのが担い手の確保です。高齢化率が全国トップの北九州市では、介護や医療、製造現場、地域活動に至るまで、次の時代の担い手を確保することがまちの存続に直結します。人口減少はこの担い手を減らし、コミュニティの持続性を脅かします。こうした状況の中、近い将来、まず人口が90万人を割る可能性は高いと見ています。北九州市は合計特殊出生率が政令市ナンバーワンでも、高齢化率トップの政令市（大都市）ですから、亡くなる方の増大は「自然な」人口動態として表れる宿命にあります。しかし、これは衰退の象徴ではなく、成長のために一時的にかがむ時期――経営学で言う「Crouch to jump（跳ぶためにかがむ）」だと捉えています。飛躍の前にはいったん後退や縮小の時期が必要という考え方です。実際に、北九州市の”潮目”は変わりました。昨年、60年ぶりに人口転入超過を記録しました。過去最高額を更新する企業進出投資額や大型プロジェクトも次々と始まり、成長エンジンに再び火がつきました。私は今の北九州市を「成長エンジンに火がついた成熟都"},
  {vol:101,date:"2025年08月18日(月)",title:"８０回目の終戦記念日に",content:"皆さん、お盆はいかがお過ごしだったでしょうか。今年、私たちは八十回目の終戦記念日を迎えました。三百十万余の命を奪い、国土を廃墟と化したあの大戦から八十年。あの惨禍を直接体験された方々の声を伺える機会が、静かに、しかし確実に減っていることを実感します。私事ではありますが、今年二月に母を見送り、この夏は初盆を迎えました。母は短くも鮮明に、空襲の恐怖や竹槍訓練のことを語ってくれました。父は敗戦後満州から引き揚げましたが、戦中戦後の体験を一切語らぬままでした。それでも父の遺書には「周囲に感謝せよ」「生涯努力せよ」「世界平和を築け」と三つの言葉がありました。あの世代の多くを語らなかった”沈黙”の重みを胸に、そして、尊い命を捧げた方々、戦後を支え日本を建て直してくれた先人たちに思いを馳せる時を大切にしたいと思います。得てして歴史というものは、「記憶」から「記録」、そして「解釈」へと移ろいます。その過程で人はしばしば、自らに都合のよいものだけを見ようとします。だからこそ、”肉声”を”語り継ぐ”努力を怠ってはなりません。同時に、記憶を振り返るだけでは、現代と未来を生き抜く力にはなりません。戦後秩序と価値観が根底から揺らぎつつあるいま、私たちには新たな視座もまた必要です。現実に、国際秩序は大きく変動しています。ロシアの侵攻、米国の経済ナショナリズム、中国の台頭と台湾海峡の緊張。サプライチェーンの分断は現実の課題です。これは国家だけでなく、グローバル製造業に関わる地方都市に直結する問題です。北九州市もその例外ではありません。では、私たちはどのような政策を描くべきか。第一に、レジリエンスある経済基盤の確立です。特定地域や特定資源に依存しない産業構造を整え、危機に強い都市経済を築くことが不可欠です。そのために、中小企業の技術力強化、海外市場の多元化、スタートアップの育成をさらに後押しする必要があります。第二に、エネルギーと環境などサステナビリティで世界を先導する都市としての戦略です。水素や再エネの利活用、循環型社会の形成は、平和国家としての矜持を示すだけでなく、地政学的リスクを超えて持続可能な都市をつくるための現実的な施策です。世界が分断へと傾く中だからこそ、持続可能な都市像が求められています。第三に、国際的な人材・技術の結節点となることです。都市の持続性を支えるのは人です。外国人材との共生、多文化の受容、デジタル技術を駆使した教育と研究の場づくりが、北九州市の新しい強みを形成します。八十年を迎え、次の戦後九十年を漫然と迎えられる訳ではありません。平和を祈念するだけではなく、国際経済と政治の荒波を見据え、都市の政策を変革していく勇気が必要です。北九州市は、世界に繋がる産業都市として培った経験を武器に、変化を恐れず、国際的な課題に正面から向き合う役割を果たしていかねばなりません。職員"},
  {vol:102,date:"2025年08月25日(月)",title:"”忘れられた人々”と呼ばせない",content:"先週、北九州市はNPO法人「抱樸」と連携協定を結びました。抱樸は、孤立や孤独を抱えた人々に寄り添い、地域の中で生きる力を取り戻す活動を続けてきた団体です。今回の協定には、今の時代において特に大きな意味があります。いま世界では、「忘れられた人々」「見捨てられた人々」と表現されることが増えています。グローバル化とデジタル化の進展は、確かに便利さや豊かさをもたらしました。しかしその恩恵を受けるのは一部であり、多くの人々は職を奪われ、収入も増えず、置き去りにされているという指摘。努力して働いても報われない（と感じる）現実が、人々の心に深い影を落としています。アメリカの”ラストベルト”（使われなくなった工場などを抱える米中西部や北東部の重工業地帯）に象徴されるように、こうした人々が現状の政治や行政への不満や社会の分断を顕在化させつつあります。この不満は、二つの形で表れているように、私には感じられます。ひとつは「昔に戻してほしい」という声。あの頃の安定と共同体を取り戻したいという気持ちです。しかしそれは時に移民や外国人排斥、外の世界を拒む考えにつながる危うさも持っています。もうひとつは「もっと自由にしてほしい」という声です。政府やエリートは信用できず、税金ばかり取られる。だから減税してくれ、自分たちを縛らないでくれという思いです。日本でも最近の選挙で、この二つの潮流が既存の政治を揺さぶる形で現れたのではないでしょうか。本来、このような社会の分断や孤立を防ぐのは社会政策の役割です。医療や福祉、教育、子育てを通じて誰もが支えられる仕組みを整えること。これが人々の安心を守ります。しかしアメリカでは社会政策が弱く、格差や孤独は政治的怒りとして噴き出しています。日本は比較的強固な社会保障を持っていますが、それも昔の「標準家庭」と厚い中間層を前提に設計されてきたため、現代の多様な家庭や働き方には十分に対応できなくなっています。その結果、減税や給付といった即効性がありそうな経済政策の提案ばかりが目立ち、本質的な社会政策の再構築が置き去りにされているのです。だからこそ、北九州市が立ち上がらなければなりません。抱樸との連携は、まさに縦割りの制度の隙間で苦しむ人々に光を届ける挑戦を更に一歩進めるものです。心理学者エーリッヒ・フロムは「孤独や孤立こそが人間の根源的な課題である」と語りました。人は誰かとつながり、共に生きることで安心を得ます。いや、それがすべての行動の根っこにあると考えてもいい程です。消費やモノだけでは満たされず、人との絆の中にこそ幸福を見出す存在です。孤独を放置することは、社会を壊すことにつながります。経済も回らなくなります。だから私たちは、人と人がつながり、互いに支え合う仕組みを新たに築いていかねばならないのです。北九州市は、公害を克服し、産業構造の変化を乗り越えてきた歴史"},
  {vol:103,date:"2025年09月01日(月)",title:"思いを馳せる――ただ1人の暮らしに",content:"行政の仕事をしていると、どうしても数字や予算に追われてしまいますよね。「今年は予算枠がこれだけだから」「全国の平均値はこうだから」――もちろんそれは必要な視点です。でも、私はあえて言いたい。そういう大きな数字ばかりを追っていると、「目の前の一人の市民の暮らし」が、すうっと霞んで見えなくなってしまうおそれがあるのです。行政は「虫の目・鳥の目・魚の目」が大事だと言われます。確かに全体を俯瞰する鳥の目や、流れを読む魚の目は欠かせません。でも、どうしても忘れやすいのが虫の目です。地面に這うように、一人ひとりの顔や生活を見つめる視点です。私も20年以上行政の世界に身を置いてきましたが、気を抜くと簡単に「人の暮らしを想像する力」を置き去りにしてしまう。その怖さを何度も感じてきました。皆さん、ちょっと想像してみてください。「この施策が、あの一人の市民のどんな小さな声に応えるものなのか？」「これで誰のどんな暮らしが、どんなふうに少しでも楽になるのか？」その問いを胸に置いてみるだけで、事業の輪郭はまるで違って見えてくるはずです。マーケティングの世界には「ペルソナ」という方法があります。例えば「30代、二人の子どもを持つ母親」という架空の人物を細かく設定して、その人の目で商品を考えるのです。統計の「平均値」を追うよりも、「N=1」、つまり一人の声に徹底的に寄り添うほうが、結果として多くの人の心に届く。これはプロの世界で当たり前に語られていることです。人間は数字やグラフに感動しません。私たちの心を動かすのは、必ず「一人の物語」なのです。行政は公平を重んじます。「誰一人取り残さない」という理念はもちろん大切です。けれど、全員を一度に満足させる政策なんて存在しません。逆に、抽象的でぼんやりとしたものでは、市民の心には届かない。だから私は「誰か一人のために」というイメージから出発してほしいのです。福祉や介護の現場では、それが自然としやすいでしょう。困っている人の顔が目の前にあり、その暮らしを守るというイメージが持ちやすいかもしれません。他方、都市計画や経済政策のようなマクロの領域になると、顔が見えにくくなるかもしれません。だからこそ、そこでも意識的に「一人の市民の姿」を描いてほしい。そこから政策に血が通い始めるのです。今年、私は「心を動かす」という市政のテーマを掲げました。政策も事業も、結局は人間のためにあります。人の顔を、声を、物語を思い浮かべるときに、数字の羅列では生まれなかった熱が宿ります。皆さん、どうか「想像力のスイッチ」を入れてください。市民の平均像ではなく、一人の暮らし、一人の人生を具体的に描いてください。その積み重ねが、きっとこの街を温かく、力強く未来へと押し出してくれます。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:104,date:"2025年09月08日(月)",title:"コスパとタイパの悪い経験を共有した時ほど、人と人の絆は深まる",content:"今は「生産性」「コスパ」「タイパ」と「正解」の時代です。それらも勿論大切なこと。でも、過度に「完全性」や「正確性」を求めるが故に、「不完全」で「不正確」であるはずの本来の”人間性”というものが否定されてしまわないか。逆説的な息苦しさを生むことはないか。そんな問題意識を常々持っています。そこで。先週、タイトルの言葉をある人から聞いて、思わず膝を打ちました。たしかに、今の時代、コストパフォーマンスもタイムパフォーマンスも悪いときほど、私たちは苦しさを感じます。面倒だったり、迂遠だったり、思うに任せぬ事情があったり、はたまた人間関係や感情が絡むと、世の中の不条理に直面し、やるせなくなることも少なくありません。しかし同時に、そうした時間や経験は、自分のものの見方の「引き出し」を増やしてくれる面もあります。思い通りにならない時間を通じて、自分と向き合い、自分の可能性や隠れた力に気づかされることがあると思います。さらに、そんな「効率の悪い時間」を共に過ごす仲間の存在はかけがえがありません。一緒に耐えてくれる人、一緒に悩んでくれる人、一緒に戦ってくれる人。そういう存在こそは「宝」であり、その関係はどんな効率的な成果よりも深く、強い絆を生み出します。考えてみれば、どんな人の人生も、すうっと順調に歩んできたわけではありません。どんな会社も、最初から平坦な道を歩んできたところはありません。紆余曲折や非効率に見える出来事の積み重ねこそが、その人や組織を強くし、人生や仕事の「味わい」を深めてきたのだと思います。だからこそ、コスパもタイパも悪いことを「味わう」くらいの余裕を持ちたいものです。いまの世の中は、ますます効率性に流れています。AIの時代だからこそ、ますます早く、正確に、無駄なく進むことが当たり前になっていくでしょう。しかし、それだけでは人間の営みは面白くなくなってしまいます。むしろ、手間がかかり、時間がかかり、回り道をした経験にこそ、人生の豊かさと人との絆の源泉があるのではないでしょうか。皆さんも、同僚や友人と、「あの時は巻き込まれ事故だったけど、本当に苦労したねえ」「当時は苦しかったけど、何度も協議して何とか乗り越えたよね」。そんな思い出や記憶が一つや二つはあると思います。お酒を酌み交わしながら、よき思い出話として語ることもあるでしょう。また、時にぶつかり、時に励まし合いながら乗り越えた仲間たちの尊さを、改めて感じることもあるでしょう。共に経験した事柄が、ややこしく、難しいものであったときほど、絆が深まることがあると思います。まさに、「コスパとタイパの悪い経験を共有した時ほど、人と人の絆は深まる」のです。時に「すべての苦労は、その人のレベル以上の苦労は起こらない」という言い方もされます。つまり、自分に降りかかる出来事は、自分が成長できる範囲で与えられたものだ、という考え方"},
  {vol:105,date:"2025年09月16日(火)",title:"未来へ――ソフトの力でハードを呼び込む",content:"クロサキスイッチ、小倉BEAT、クリスマスマーケット、北九州昭和夏祭り、うたのまち北九州、すしの都…新顔のイベント、ソフト事業が北九州市には次々と生まれています。多くの皆さんのご尽力、企業の皆さま、地域の皆さまのご協力で、明るい動き、新しいムーブメントが街のそこかしこに生まれています。その狙いと戦略を理解いただくためには、皆さんと、「官民のハード投資を呼び込むために、まずソフト面でのイベントや発信を先行させる必要がある」という視点を共有したいと思います。新しい企業や商業施設、インフラ整備といったハード投資は街の成長に不可欠です。ホテルや学校といったものも視野に入れれば、北九州市には「投資」こそが大事であり、それも民主動の「投資」がこの街の未来が描けるかどうかの試金石。だから私は、「稼げるまち」のキモとして「投資」をいつも挙げていますよね。しかし、それは巨額で長期的な意思決定であり、外部から見ればリスクの大きい挑戦でもあります。そのリスクを下げる鍵こそが「ソフト」の力なのです。経済学にシグナリング理論というものがあり、未来性や本気度を示すには分かりやすい合図が必要だと説きます。都市にとっての合図は国際会議や展示会、文化イベントといったソフトの活動です。これらが「この街には可能性がある」という強いサインとなり、投資家の判断を後押しします。また、人が集まるところにさらに人が集まる「ネットワーク外部性」も重要です。イベントを通じて人材や企業を呼び込めば、その交流そのものが「投資に値する都市」の証明になります。世界の成功例も示しています。バルセロナはオリンピック前に文化イベントで都市ブランドを高め、大規模投資につなげました。シンガポールも国際会議を重ね、存在感を確立した後に港湾や空港を拡張しました。北九州自身も、エコタウン構想でまず国際会議を開催し、その信頼が後に工場や研究拠点の整備へとつながった経験があると思います。ソフト事業の効用は三つあると思います。第一に、市民へ未来像を示し、共感を育てること。第二に、地域経済を動かし「活気ある街」の雰囲気を生むこと。第三に、社会的合意を形成しやすくすることです。大規模投資も、市民の期待が育てば実現しやすくなります。また、各種イベントを成功させることは、官民の調整力の高さ、一体感の強さの”証”となるのです。また、どれだけの集客がありうるのか、人の流れが見込めるのか、そうした実証実験にもなります。そこで集められたイベントは、貴重な未来の来るべき投資の”根拠”になり得るのです。ですから、皆さん、イベントなどのソフト事業を、ソフト事業そのものの着実な成功のみでメデタシメデタシ、と考えないでください。それはステップです。戦略のプロセスです。その先に「投資」そして、新時代の街づくりの道筋を描くのです。私は「ハードは器、ソフトは物語」と考え"},
  {vol:106,date:"2025年09月22日(月)",title:"改めて、考えることについて",content:"改めて。みなさん、最近「考える」ということを、どれだけ出来ている手ごたえがありますか？私たちの仕事の核心は、「考える」こと。私も毎日、自分に問いかけます――本当に「考える」が出来ているのか。無思考にパターンで動いていないか、反射で動いていないか、と。もちろん、物事を進めるには、考える、感じる、動く、すべての要素が不可欠で、頭デッカチになってもいけない。でも、だからこそ、改めて「考える」ことの大切さを振り返ってみたいと思います。私たちの業務は、どうしても既存の要素やフレーズをパズルのように組み合わせる作業になりがちです。ロジを組んだり、スケジュールを設定したり、過去の方針やセリフを組み合わせたり。特に議会答弁や記者会見の場面では、その場で新しいことを自由に言えないという制約もあります。だからこそ、普段の業務、特に企画立案の局面では、意識して”スイッチ”を切り替える必要があります。鳥の目で全体を俯瞰し、魚の目で社会や時代の流れを読み、虫の目で現場の細部を見つめる。これらの視点を自在に行き来しながら、物事を前に進めるドライブ（推進力）とパワーを生み出していく。そのときに必要となる“ガソリン”こそが、皆さん一人ひとりの「考える」ことなのです。人間というものは、本質的に怠惰です。「考える」ことは面倒くさい、頭を使うのは疲れる、そう感じるのは自然なことです。だからこそ、意識的に立ち止まり、「考える」時間を確保しないと、すぐに「無思考」の状態になり、頭を怠けさせてしまいます。かつて私も、かつて企業にいたとき、メンターからこう言われたことがあります。「悩むな、考えろ。Think, think, think」。悩むことは足を止めますが、考えることは前に進むための力になります。今の時代、世界では「反知性主義」という言葉も聞かれます。難しいことを避け、単純な図式に飛びつき、感情だけで物事を決めてしまう風潮です。しかし、私たちはその逆を行かねばなりません。市役所には工場も製品もありません。起点となるのは、皆さん一人ひとりの頭脳と、そこから生まれる思考だけです。それが私たちの最大の資産であり、北九州市の未来を形づくる唯一の「製品」です。だからこそ、日々の仕事の中で意識的に問いかけてほしいのです。「今日、私は考えたか？　本当に頭を使ったか？」と。何も考えないで、いつもやり方、お決まりのパターンで仕事をすることでやり過ごしていないか、と。もし考え方の幅を広げたいと感じたら、ぜひ様々な思考法の本を手に取ってみるのも一手です。論理的思考、デザイン思考、システム思考……世の中には本当に多彩な“考え方”があります。人によってこんな風に頭を使っているのか、という発見があり、実際に試してみると、自分の引き出しや可能性が広がるのを感じるはずです。それは新しい自分を見つける楽しいチャレンジにもなります。"},
  {vol:107,date:"2025年09月29日(月)",title:"事実ー解釈ー評価の構造",content:"先週は、学校給食に関するSNSでの情報拡散について、大きなニュースになりました。北九州市がこうした形で全国に知られるのは残念ですが、改めて考えさせられることもあります。それは、「事実―解釈―評価」という構造です。私たちが日々の業務や生活で直面する出来事は、単純に「事実そのもの」として目の前にあるように見えます。しかし、実際にはその受け止め方には層があります。それが「事実」「解釈」「評価」という三つの段階なのです。まず「事実」について。「事実」とは、実際に起こった出来事そのものです。これは観測可能で、客観的であることが特徴です。次に「解釈」について。「解釈」とは、「事実」に意味や因果を与える段階です。たとえば、ある新しい事業を市が始めるという「事実」に対して、極端な例を言えば、市民の一部から「この事業を始めるということは、きっと別の事業がうまくいってないからだ」といった見方が出る場合があるとします。あるいは「この地域の人口が減ったのは、その地域の予算が減らされたことの影響に違いない」と受け止められることがあるとします。これらはすべて「事実」そのものではなく、事実に他者が意味づけをした「解釈」です。この段階では、その時々の時流や社会の空気、さらに個人の価値観や感情、利害得失が強く影響する可能性があります。そして「評価」について。「評価」とは、解釈を踏まえて「良い・悪い」「望ましい・望ましくない」と判断する段階です。「この事業もきっとうまくいかないから、進めるべきではない」「人口が減った地域の予算を減らすのは、けしからんことだ」といった評価に結びつき、市政への信頼に影響を及ぼすことがあります。「評価」には、個人や組織の利害、社会の雰囲気、政策的な潮流が色濃く反映されます。そのため、客観的な「事実」とは異なり、「評価」は相対的で移ろいやすい性質を持っています。さらに重要なのは、複数の事実を組み合わせることで「解釈」や「評価」が増幅的に変わり得る、という点です。「売上が前年より5％減少した」という事実だけを見れば否定的な解釈になりやすいですが、「同業他社は10％減だった」という別の事実を合わせれば「むしろ健闘している」という評価に変わります。「高齢者人口が増えている」という事実も、一部の高齢者の方の医療費が高いという情報と組み合わされて「社会保障費が膨らむ」というネガティブな解釈が拡がる可能性があります。行政の現場では、こうした「事実・解釈・評価」が混同されることで、市民の認識や説明に混乱を招くことがあります。ですから、私たちは次の順序を意識することが重要です。まず「事実」を丁寧に確認すること。次にあり得る「解釈」を予測し、複数の見方を認識すること。最後に、行政の立場としてのフェアな「評価」を示すこと、が大切です。とりわけSNSの空間では、事実・解釈・評価が渾然一体と"},
  {vol:108,date:"2025年10月06日(月)",title:"「温かく断る",content:"技術』市民の皆さまから日々寄せられる要望や陳情は、私たち行政にとって最も大切な“市民の声”そのものです。しかし現実には、すべての要望に応じることはできません。限られた予算や人員の制約、他の市民との公平性の観点から、「断らざるを得ない」局面が必ず生じます。ここが辛いところでもあります。個別の利益や大きな声だけに振り回されることなく、市全体の“最適解”を見い出すこと、それが私たち行政マンの使命でもあります。このときに問われるのは、いかに温かく、かつ論理的に、納得を得るかという技術です。心理学者ダニエル・カーネマンは「人は論理より感情で納得する」と説きました。最新の脳科学研究でも、意思決定において扁桃体（感情の中枢）が先に反応し、前頭前野（論理の中枢）がその後に理由付けを行うことが明らかになっています。つまり、市民に「納得」していただくためには、まず感情を受け止め、次に論理を示すという順序が不可欠です。具体的には、以下のような観点が有効と考えます。①　共感を持つ行政で働いている以上、私たちは、（私利私益と見做せる場合を除き、）多くの場合は「できることなら要望に応えたい」と思うことの方が多いのではないでしょうか。そのように思える場合であれば、「○○についてのお気持ちはよく分かります」「この点でご苦労されているのですね」と、まず相手の思いや状況を言葉にすることです。冷たく線引きするのではなく、人間どうしの信頼関係の基盤をつくることによって、無用な摩擦や誤解を避けることが大切です。②　誰かのせいにしない「予算カットされたので無理です」「他部局の責任です」といった他責の姿勢は、市民に不信感を抱かせます。断らざるを得ないときこそ、誰かのせいにせず、担当者として、行政としての立場を正面から説明する誠実さが求められます。制度の限界や公平性の理由を、あくまで自らの言葉で語ることが重要です。この点、往々にして、「実は自分も困っている」「自分も本当はそうしたいんだ」などと述べることで、その場を丸く収めようとすることがあるかもしれません。しかし、国の法律の縛りなど権限が全く異なる場合を除き、そのようなコミュニケーションに頼ることは、かえって市政全体の信頼を毀損します。③　制約を論理的に説明する断る際には必ず理由を示す必要があります。ただし「できない理由の羅列」にならないよう注意が必要です。論理の裏付けとして数字や法令があるならお示ししつつも、必ず「市民全体の公平性」や「将来世代への責任」といった前向きな大義がなければなりません。④　前向きな解決策を示すそれでも、断りの場面で最も大切なのは、「ここで終わり」にしないことです。「今回はご要望通りにはできませんが、△△の制度ならお役立ていただけます」「□□の見直しの際には必ず検討対象とします」といった知恵をひねってみて、代替案や今後の展望を示"},
  {vol:109,date:"2025年10月14日(火)",title:"読書する人",content:"読書の秋がやってきました。皆さんは最近、本を読んでいますか？私は、この北九州市で「読書の文化」を根づかせたいと願っています。本を読むことは、子どもたちの学力を育てるだけでなく、人生そのものを豊かにし、心を整える営みでもあります。AIが普及する時代だからこそ、言葉を深く理解し、自分の頭で考える力、つまり読解力や表現力が、これまで以上に重要にもなっています。そもそも「本を読む」とは、どんな意味があるのでしょうか。私なりに提案します。第一に、“情報”ではなく“知識”と”思考”が手に入ります。インターネットやSNSでは、いくらでも情報が手に入ります。しかし、それは断片的で、文脈や責任のない言葉も多い。だからこそ、本という形で編集者や著者が責任をもって発する知識に触れることは、確かな知の土台を築く行為なのです。第二に、読書は「人生のコスパ」が抜群に良いということです。私たちは、短い人生のなかで、何百人もの優れた人物と直接会うことはできません。けれど本を通じれば、彼らの経験や思想を、まるで対話するように学ぶことができます。血のにじむような思いで書かれた一冊が、私たちの心に新しい視点を与えてくれる。これほど贅沢で、豊かな時間はありません。第三に、読書は人を謙虚にしてくれます。「自分は何も知らない」「世の中に色んなものの見方がある」と気づくことは、最大の知恵です。本を読むほど、自分の知らない世界がどれほど広いかを思い知る。それが、人の考えを柔らかくし、他者を寛容に理解する力を育ててくれます。第四に、本は感動をくれます。感動とは、人間が持つ最高のギフトだと言われます。人生には喜びも悲しみも、怒りや嫉妬もあります。そのあらゆる感情を知り、人間とは何かを理解するために、読書ほどの道はありません。人を知らずして、良い仕事はできない。だからこそ本は、私たちの人間力を磨いてくれるのです。読書は「心の栄養」です。この栄養が欠けると、人はすぐに怒りや嫉妬に流されてしまう。けれど、多くの本を読み、多くの経験を重ねて「心にしわ」を刻んだ人は、深い人生を生きられます。心を耕すこと。それが読書の本質と考えます。そして、本を読む目的は「得をするため」ではありません。「この本を読めば儲かる」「かっこよくなる」といった打算ではなく、心を潤し、知的・精神的な充実を求める無意識の営みであってほしい。一見、時間と労力のかかる“非効率”な読書という行為こそ、人生に最も深い恵みをもたらしてくれるのだと信じています。最近は、読書に関するYouTube番組やSNSの発信も増えています。どんな形であっても構いません。もう一度、本を手に取ってみませんか。そして、北九州の街に「本を愛する文化」「言葉を大切にする風土」を取り戻していきましょう。本を読む人の多い街は、きっと、心の豊かな街です。北九州市なら、必ず、できる。皆さん"},
  {vol:110,date:"2025年10月20日(月)",title:"「学力向上",content:"を北九州市の原動力に』「学力向上」を北九州市の原動力に――これを先週の定例記者会見で発表しました。人口が90万人を下回ることを目前とした北九州市。私たちは更に都市のポテンシャルを引き出すチャレンジの真っ只中です。次のステージへと街が進むには「人の力」を育てることが大切です。その根幹をなすのが、「学力向上」であると表明しました。私たちはこれまで、雇用や医療の充実に着実に力を注いできました。これらは暮らしの安心を支える大切な柱です。しかし、これからの北九州市の発展を支える最大の基盤のひとつは、「教育」です。なぜなら、学力の向上は、まちの魅力を高め、人を呼び込み、人口の自然増・社会増を生み出す力になるからです。教育水準の高いまちは、「ここで子どもを育てたい」「このまちで学ばせたい」という声を生み、若い世代が定着します。そして、子どもたちが伸び伸びと学び、自信を持って成長していく姿こそが、人を惹きつける最大の財産になるのです。北九州市の学力は、全国平均を下回る状況が続いています。これは、まち全体で正面から受け止めるべき課題です。私たちは、教育委員会と緊密に協議を重ね、現場の先生方と力を合わせながら、「一人ひとりを大切にする学力向上」を進めていきます。日々子どもたちと向き合い、心を込めて教育にあたっておられる教職員の皆さんに、心から敬意を申し上げます。その努力があってこそ、次の一歩を踏み出すことができます。北九州市は三つのアプローチで学びの改革を進めます。一つ目は「AI＋読書」。AI学習アプリを活用して、子ども一人ひとりの理解度に合わせた学びを実現し、誰も取り残さない教育を目指します。そしてAI時代だからこそ、言葉の力を育てます。「学校まるごと図書館」構想により、校内のあらゆる場所に本がある環境をつくり、子どもたちが自然に本と出会う仕組みを広げていきます。読書が言語力・思考力を育て、その力がAIを使いこなす基礎になる。これが、未来の学びの形です。二つ目は「体験機会」の拡充です。子どもたちは、体験の中でこそ成長します。北九州市では、今年度から、60を超える施設から体験プログラムを自由に選べる「アラカルト方式」を導入しました。社会や自然に触れる学びが、子どもたちの自尊感情や非認知能力を高め、結果として学力の向上につながります。三つ目は「脱・暗記重視」。正解を覚えるだけではなく、自ら考え、発想し、挑戦する教育へ。北九州市立高校で始まった改革では、生徒が主体となり、自分の未来を描く学びが広がり、かつてより応募倍率が倍増しています。こうした成功事例を全市に広げていきます。学力向上は、一朝一夕には実を結びません。しかし、5年、10年の先を見据えて取り組むことで、まちは確実に変わります。学力が上がれば、子どもたちの将来の所得が高まり、地域経済が豊かになります。そして、教育に信頼が生"},
  {vol:111,date:"2025年10月27日(月)",title:"Woman’s リアル Voice ラジオ",content:"先週「Woman’s リアル Voice ラジオ」という新しい取り組みに参加しました。女性たちが自分の思いを率直に語り合うラジオ番組で、北九州市としても「女性にコンフォート（居心地のよい）なまちづくり」を進める第一歩となるものです。カフェ形式もあり、行政として、とてもユニークなアイデアだと感じました。番組で印象的だったのは、女性の「声を出しても変わらないと思っていた」という言葉でした。出す場がなかった、出す余裕もなかった。それでも勇気を出して語ってくださる一つひとつの声が、どれほど切実で、どれほど未来を変える力を持っているか。私はこの1時間で深く感じました。「寄り添う」とは、ただ優しくすることではありません。相手の声を“聴き”、一緒に悩み、考え、動くことです。そして、その積み重ねこそが信頼であり、行政が本来持つべき「公共の力」だと思います。日本では今、初めて女性の総理大臣が誕生しました。それは単なる政治の変化ではなく、社会の意識の転換を促す可能性があります。日本が長く抱えてきたジェンダーギャップを乗り越えようとする新しい時代の幕開けとなる可能性もあり、私たち自治体もその先頭に立たなければなりません。北九州市では、今年度から「WomanWill推進室」を設け、女性が暮らしやすく、働きやすく、そして声を上げやすいまちを目指す取組を本格化しています。それは単なる“女性支援”ではなく、「誰にとっても居心地のよいまち」をつくる挑戦です。女性の声を聴くことは、市民一人ひとりの声を聴くことにもつながるからです。私たちの組織もまた、「声を聴く行政」でなければなりません。上司から部下へ、同僚同士で、現場の声を聴き合う。「こうしたらもっと良くなる」という小さな意見が、「ここがモヤモヤする」という気づきが、未来を動かす原動力です。政策をつくる前に、制度を変える前に、まず“声”を聴く。その姿勢が、北九州市役所の文化となることを願っています。今、北九州市では若い女性の転入が回帰してきています。60年ぶりに人口が転入超過となった昨年、改善傾向が現れてきたのは若い世代の女性でもありました。これは偶然ではありません。まちの空気が少しずつ変わり、「ここで生きたい」と思ってもらえる場所に近づいている証です。この流れを確かなものにするために、私たち職員一人ひとりが「聴く力」を磨き、立場を越えて寄り添う姿勢を持つことが大切です。縦割りではなく、横断的に発想し、協働して動いていくことが必要です。行政の本当の力は、“制度”よりも“関係”に宿る。そのことを、ラジオでの対話を通じて改めて実感しました。もちろんできることできないことはあっても、声に耳を澄ませる、市役所でありたい、と思います。これからも皆さんと一緒に、市民の一人ひとりの「声なき声」に耳を澄ませながら、北九州市を誰にとっても居心地のよいまちへと"},
  {vol:112,date:"2025年11月04日(火)",title:"カンボジアに咲く技術の力",content:"今週末はドジャースのワールドシリーズで「日本人」の凄さ、底力に改めて嬉しく感嘆していましたが、先週、１泊３日の弾丸で訪れたカンボジア・プノンペンの地でも「日本人」「北九州人」の凄さを体感しました。カンボジア・プノンペンの現地を訪れると、関連施設のあちこちに象られた日本の国旗、そして「KITAKYUSHU」の文字が目に飛び込んできます。それを見た瞬間、胸の奥が熱くなりました。先人たちが積み上げてきた努力と信頼の重さを、静かに、しかし確かに感じました。北九州市の職員が、長い年月をかけて現地に根を下ろし、水という“命のインフラ”を支えてきた。その姿を、現地の人々はずっと見てくれています。今回の訪問では、カンボジア王国の閣僚が二人も会談に応じてくださり、国家としても北九州市を高く評価していることが伝わってきました。さらに、駐カンボジア大使公邸で開催されたランチョン会には、自治体の首長である私とともに、閣僚らが正式に招かれました。これは、北九州市が一地方都市の枠を超えて、この国の発展に欠かせない存在になっていることの証です。私たちの市ほど、カンボジアでこれほどまでに存在感を持つ自治体は他にありません。北九州市は、一つの国家の“水”を支えています。それは、単なる技術協力ではなく、命をつなぐ仕事です。現場で感じたのは、技術だけではない「人の力」でした。誠実に、丁寧に、責任を持って相手と向き合う。何年も、何十年も継続して寄り添う。そこにあったのは、日本人らしい責任感と北九州人らしい情熱でした。こうした国際協力は、すぐに北九州市の経済的な利益に結びつくものではないかもしれません。しかし、それは確かに未来への種まきです。いつかこの種が芽を出し、花を咲かせるとき、北九州市と市民の皆さんへの信頼と尊敬はさらに広がっていく。それは、市の外交力となり、産業のチャンスとなり、そして何より、市民の誇りへとつながります。北九州市の蛇口から流れる一滴の水が、アジアのどこかで命を支える技術と繋がっている。この事実こそが、私たちが築いてきた技術と人の絆の証です。職員の皆さん、一人ひとりの積み重ねが、こうして世界を動かしています。この誇りを胸に、これからも共に、世界に誇れる北九州市をつくっていきましょう。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:113,date:"2025年11月10日(月)",title:"リーダーシップに悩む人へ",content:"春の人事異動から新たなポストに就いた方も少なくないでしょう。半年以上経っていかがですか？中にはリーダーシップについて悩んでいる方もいるかもしれません。今回は、そのヒントになればと思い、筆を執ります。リーダーとは特別な人のことではありません。肩書きや地位ではなく、日々の仕事の中で「どう考え、どう行動するか」という生き方そのものです。リーダーシップは、生まれつきの才能ではなく、学びと経験を通じて誰もが後天的に身につけられる“スキル”だと思うのです。私が感じるのは、リーダーシップとは「他人を動かす力」ではなく、「自分から動く勇気」だということ。周囲を責める前に、自ら一歩を踏み出す。その背中が、チーム全体を前に進ませます。リーダーに最も大切なのは、まずWHY（大義）を定め、語れることです。自分の仕事が、組織や市民、そして世界にどんな価値を生み出すのかを語れる人。全体を見渡す広い視野を持ち、人との交流や読書を通じて、自らの考えを深め続ける努力が求められます。次に大切なのが、インテグリティ。つまり誠実さです。どんな小さな約束も守り、嘘をつかない。人を公平に扱い、正しいことを地道に積み重ねる。この姿勢こそが、信頼を生み、真のリーダーを形づけます。信頼を得るには時間がかかりますが、失うのは一瞬。誠実さは、最も強いリーダーシップの土台です。リーダーは常に「舞台の上に立っている」。片言隻句、一挙手一投足が見られています。なので繕うことはできません。そして、ユーモアを忘れないことも大切です。ユーモアは人を前に進ませる潤滑油です。完璧な人間などいません。時には失敗を笑い飛ばしながらも、仲間を思い、共に乗り越える。笑顔とユーモアは、チームに安心感と前向きな空気を生み出す、大切なリーダーシップの一部です。リーダーシップに“正解”や“型”はありません。静かに支える人もいれば、情熱で引っ張る人もいていい。大切なのは「自分らしい形」で発揮することです。そして、今の役職から“二つ上”のポジションの視点で物事を見てください。職員なら係長、係長なら部長、課長なら局長の視野で考える。その一段高い視座で考える姿勢が成長を加速させます。究極的には、組織の「全員」が自分の持ち場で「リーダーシップ」を発揮することが理想です。全員が「自分がこの組織を動かしている」と感じたとき、チームは最も強くなり、成果は飛躍的に高まります。リーダーシップに悩むときこそ、成長のチャンスです。焦らず、誠実に、そして笑顔で、自分らしく。まずは今日、半歩でも前へ。その一歩が、北九州の未来を確実に動かしていきます。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:114,date:"2025年11月17日(月)",title:"ドライバーを感じていますか",content:"皆さんは最近、「自分のドライバー」を感じていますか。ドライバーとは、人を突き動かし、前へ進ませる“内側からの力”です。誰かに言われてではなく、自分の心の奥底から湧きあがる動機。それがあると、人生も仕事も豊かになると考えています。これは少し悲しい現実ですが、人間のドライバーには、時にルサンチマン（うまくいかないことへの恨み）や嫉妬、孤独といった負の感情がひそんでいることもあります。無意識のうちに、そうした思いが背中を押してしまうことも、人間である以上避けられません。しかし、私たちはなるべくそこに操られたくない。できる限り、自分の価値観と希望から生まれるドライバーを育てたいと思うのです。私たちの行動には、「MUST（やらねば）」「CAN（できる）」「WANT（やりたい）」という3つの動機があると考えます。MUSTは、やらなければならないからやること。行政の仕事には数多くあります。前年どおり、先例どおり、も入るでしょう。CANは、できる範囲でやること。与えられた法律や予算の枠組みに従い、決められた条件の中でこなす仕事です。そしてWANTは、「やりたいからやる」。自分の価値観を形にし、人生で成し遂げたいことへ向かって働く姿勢です。私は、皆さんには少しでも、この「WANT」を増やしていただきたいのです。市民の切実な声に触れたとき、「何とかしたい」と心が動く瞬間があります。子ども、介護、地域の課題、様々な社会課題…。また、自分が大好きなこのまちをもっと良くしたいという気持ちもあるでしょう。これらこそが、皆さん自身のドライバーであり、内発的な力であってほしいと願います。このドライバーは、周りの誰かが与えてくれるものではありません。自分で見つけ、育て、守り続けるものです。心の焚き火に薪をくべるように、自分の思いや価値観を大切にし続けること。それが、課題解決をある意味楽しみ、ものごとを力強く前へ進めてくれます。私たちは、ただ指示に従う道具でも、社会の歯車でもありません。ひとりひとりが、自分の価値観を持ち、この人生で何かを成し遂げたいと願う存在です。だからこそ、自分のドライバーが動き出した時、仕事の質は劇的に変わります。WANTを自ら見つけ、周囲を巻き込み、意味のある成果へとつなげる動力になると信じています。私は、少しでも多く、職員の皆さんが自分のWANTを軸に働ける組織、市民のために自走し、挑戦できる市役所をつくりたいと思っています。あなたの心のドライバーを大切にし、その火を絶やさず進んでください。その積み重ねが、まちを変え、そして皆さん自身の人生を豊かにすると信じています。いつか人生を振り返ったとき、互いに、「本当にやりきった」と胸を張れる日が来るよう、ドライバーを意識し、育んでいきましょう。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:115,date:"2025年11月25日(火)",title:"今年私がハマったエンタメ動画",content:"今回は、私がこの一年で強く心を動かされた「二つのオーディション番組」から学んだことを、皆さんにお伝えしたいと思います。どちらも一見エンタメですが、私には“プロとして働くとは何か”“人と向き合うとは何か”を深く考えさせる、大きな教材でした。一つ目は「timelesz project」(Netflix)です。timelesz の新メンバーを既存メンバー自らが選ぶ、極めてシビアな男性オーディション。そこで感じたのは、プロの世界では「目的の明確さ」と「徹底した鍛錬」がどれだけ人を魅了し、信頼を勝ち取るのかということです。観客に希望と笑顔を届けるために、自らを律し、弱さを直視し、自分の限界と闘い続ける姿。甘さがあれば厳しく指摘し、努力が見えれば心から称える。そのストイックな姿勢に、私自身も強く刺激を受けました。“相手の心を動かすために、自分はどこまで本気になれるか”。これは行政の仕事にも、そのまま問いかけられていると感じます。もう一つは「NoNoGirls」(Hulu)。オーディションや人生でNoを突きつけられ続けた女性たちが、自分の人生と徹底的に向き合い、新たな自分をつくり上げていく物語です。圧巻だったのは、審査員のちゃんみなさん（オーディション18回落選した経験を持つ）とSKI-HIさんが、一人ひとりに向き合い、時間をかけ、相手の人生ごと受け止めながらフィードバックする姿です。合否を告げる言葉には、相手の強さも弱さも、未来も覚悟もすべて見抜いたうえでの重みがありました。そして「感性」や「センス」と言われるものを構造的、論理的に言語化するところは驚きでした。「誰かの人生に本気で寄り添うとは、こういうことなのか」と心を震わせました。私は、この二つの番組から「プロフェッショナリズム」と「人に寄り添う勇気」の大切さを改めて学びました。私たちの仕事も、制度や書類の向こう側には必ず“誰かの人生”があります。だからこそ、私たちは市民一人ひとりに本気で向き合い、本質を見抜き、必要なら厳しく、しかし最後は必ず温かく背中を押せる存在でなければならないと思います。北九州市は今、変革の大きな入口に立っています。この街を前へ進める力は、皆さん一人ひとりの“本気さ”と“優しさ”です。ぜひ、機会があればこの二つの番組を観てみてください。きっと仕事への向き合い方が、前向きに、そして深くなるはずです。これからも、共にこの街をつくっていきましょう。私も本気で皆さんと向き合い続けます。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:116,date:"2025年12月01日(月)",title:"イマジネーションの力を取り戻そう",content:"皆さん、最近「イマジネーション」していますか。先日、スケードボードの世界大会を見ていて、選手たちがジャンプの瞬間を、何度も何度も頭の中でイメージする姿が心に残りました。成功の形、助走の角度、着地の衝撃――すべてを脳内で先回りし、繰り返し描いているのです。ふと、「自分はどうだろう」と思いました。そして皆さんにも問いたいのです。AIがあらゆる答えを瞬時に示してくれる時代に、私たちは“想像する力”を失っていないだろうか、と。AIは便利です。検索ではなく、思考そのものを高速で返してくれます。しかしその便利さは、ときに私たち自身の創造性を弱らせます。だからこそ今、意識してイマジネーションを鍛える必要があると強く感じています。私たちの仕事も同じです。新しい事業を始めるとき、その成果はどんな形で市民に届くのか。イベントを企画するとき、当日の流れ、参加者の気持ち、メディアの扱いはどうか。その一つひとつを事前にイメージできているでしょうか。イマジネーションには大きな効用があります。第一に、達成感が増します。事前に想像を重ねていると、「狙いどおりにいった」と感じられる瞬間が増えますし、想定外にも柔軟に対応できます。第二に、未来が見えるようになります。この仕事の先にある展開、起こりうるリスク、市民の反応。それらを先読みできるようになります。そして第三に、共感力が高まります。市民の立場に立ち、相手の気持ちや反応を想像することで、より的確で温かなサービスにつながります。では、どうやってイマジネーションを鍛えるのか。私は3つの方法を提案したいと思います。① 小説を読むこと。文字だけを手がかりに、登場人物の姿、街の匂い、空気の色を自分の頭の中で描く。これは最高の訓練です。② 同僚とブレストすること。「ああでもない、こうでもない」と想像を交わす中で、視野が一気に広がります。③ 妄想タイムをつくること。お風呂、寝床、移動中。情報から少し離れ、ぼんやりと未来を思い浮かべてみる。私自身、飛行機の中でよく妄想にふけります。これが実はとても大事です。今の私たちは、一日中あらゆる情報にさらされています。だからこそ、イマジネーションの余白を意識的につくることが必要です。想像するのは、人間だけに与えられた特権です。ジョン・レノンは《Imagine》で、世界の平和を「想像すること」から始めました。イマジネーションは、未来を動かす力です。AIに頼りすぎるのではなく、自分で“思い描く力”を手放さないでほしい。そして、イマジネーションがあふれる街・北九州市を、私たち自身の手でつくっていきましょう。皆さん、一緒に「Imagine」していきましょう。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:117,date:"2025年12月08日(月)",title:"作業と仕事",content:"最近読んだ一冊の本が深く響きました。それは、北九州市役所という組織、また人生で「働く」ということを見つめ直すきっかけをくれました。それは、「作業」と「仕事」の違いについて。ひたすら決まったやり方のルーチン（作業）に追われる日々は、どれほど真面目に働いていても、いつの間にか心の火を小さくし、成長の実感を奪い去ってしまうものです。私自身の長年の公務員経験に照らしても、この問題は切実です。皆さんが心の奥に抱える、「この作業に意味はあるのだろうか」という疲弊感があるとすれば、私も心から寄り添いたいと思っています。私たちが市民のために注ぐべきエネルギーを、無意味な「作業」で錆びつかせてはいけない。この思いが、私のメッセージの原点です。私たちが目指す「仕事（ジョブ）」とは、市民の未解決の問題を発見し、解決策を生み出し、社会全体に新しい価値を創造することでありたいと思います。一方、「作業（タスク）」は、その手段の一つに過ぎません。真に成長し続ける組織は、全体の8割を「作業」に、残りの20％をこの創造的な「仕事」に充てていると言われます。この20％の時間こそが、皆さんのキャリアと人生を輝かせ、北九州市を未来へと動かします。ここで、一つ大切なこと。市民の皆様の生命や生活の基盤を、正確さと責任感をもって守り続けている部署の皆さん、その地道で、忍耐のいるルーチン作業に、心から感謝します。皆さんのその努力が、私たちの全ての挑戦を可能にしているのです。ルーチン作業そのものが価値が低いわけでは、決してありません。私たちが問うべきは、市民のためになっているか定かでない、自己満足や慣例となっている無駄な作業がないか、ということです。食品業界のカルビーが、不要な作業を徹底的に棚卸しし、業績を劇的に伸ばしたように、私たちも変われます。北九州市役所にも、誰も読まない資料、形骸化した会議、過剰な確認や押印といった「聖域」が残っているかもしれません。私たちは、街と組織の未来のために「鬼のような覚悟」でこれらと闘わねばなりません。この変革には、上司だけでなく、現場を知る若手職員の皆さんの勇気ある一言が不可欠です。「これ、本当に必要ですか？」と問いかける皆さんの声こそが、組織を救う光です。AI時代がすぐそこに来ています。AIは作業の多くを代行し、その結果、「考える職員」の価値は加速度的に高まります。私たちに必要なのは、高度な知識を学ぶ「リスキリング」の前に、「市民のために何をすべきか」を問い続ける、意識と行動の変革です。皆さんの成長と情熱が、この街の未来を決めます。共に、「作業」という安住の地を脱し、創造的で、心身共に幸せな「仕事」の最前線に立ち、市民の誇りとなる北九州市を創りましょう。私は、皆さんの無限の可能性を信じています。北九州市なら、必ず、できる。皆さんの奮闘に感謝します。"},
  {vol:118,date:"2025年12月15日(月)",title:"内省のススメ",content:"早くも、今年も年の瀬を迎える時期。気忙しい毎日を過ごされている方も多いと思います。私自身も「あっという間の１年だったなあ」と感じます。全力で走りながらも、ゆっくり物を考える時間や、思考を深める余裕がどれだけあっただろうかと思うと、心許ない限りです。だから今回は「内省」について考えてみます。 私たちは日々、市民生活に直結する重要な職務に携わっています。だからこそ、その真価を発揮するために、「内省」の大切さを知り、実践する必要があると思います。「内省」とは、単なる出来事の反省に留まらず、自らの思考、行動、判断の背後にある動機（WHY）や無意識の前提を深く見つめ直すプロセスと言ってもいい。古代ギリシャの哲学者ソクラテスが説いた「汝自身を知れ」は、この内省の営みが、人間としての真の教養と洞察の源であることを教えてくれます。私たちが日々積み重ねる「経験」は、それ自体では次へ活かせる財産とはなりません。先人が言うように、「人々は経験から学ぶのではなく、経験を内省することから学ぶ」。内省こそ、経験を確固たる「知識」や「知恵」に昇華させ、未来の行動を変える力となります。私自身、これまでの人生でも、そして市長職の重責を果たす中でも、ときに予期せぬ困難や理不尽な状況に直面し、心が揺らぐことがあります。そのような時、私に心の平穏と揺るぎない行動指針をいつも与えてくれるのは、ストア派の哲学（おススメ！）です。古代ローマ皇帝マルクス・アウレリウスが書き遺した『自省録』（未読の方はぜひ）を読むたび、私は「自分自身でコントロールできること」と「できないこと」を分けるという考え方、知恵を学びました。また、激務の中でも常に自身の内面に立ち返り、公僕としての義務と品位を常に問い直したい、ということを教えてくれます。皆さんも、ぜひ古典や哲学に触れる読書を通じて、心の軸を支えることをお勧めします。堅苦しそうな書物の中に、ものすごい知恵や心の支えが眠っています。私たち行政マンが「内省」を習慣化することは、個人を超え、組織としての行政運営に本質的な効果をもたらすと思います。第一に、内省は既成概念や無意識のバイアスを問い直す機会をくれ、問題の本質を捉えることに役立ち、意思決定の質が向上します。第二に、個人の内省の結果を組織内で共有し議論することで、成功・失敗の要因が構造化され、組織として絶えず進化し続ける「学習する組織」へと変わる一歩となります。第三に、市民への奉仕を誓う公務員にとって不可欠な、信頼と共感力に関わります。内省を通じて自己理解を深めることは、他者の立場や感情への共感力（エンパシー）を高め、より温かく、信頼される質の高い行政サービスに繋がります。「内省」は特別な訓練を必要としません。例えば、業務の終わりに成功要因と課題を整理し、次の具体的な行動計画を立てるのでもいし、問題発生時に「なぜ」を数"},
  {vol:119,date:"2025年12月26日(金)",title:"令和７年を振り返って",content:"早いもので、もう御用納めの日を迎えますね。皆さん、今年一年、お疲れ様でした。今回は、今年一年を振り返ります。今年は、私自身、「世界と真正面から向き合う北九州市」を強く体感した一年でした。 北九州市は、これまでもグローバル企業が集積し、世界とつながるポテンシャルを持った都市でした。しかし今年は、その「世界との距離の近さ」を、良い意味でも、そして厳しい意味でも、はっきりと突きつけられた年だったと感じています。 象徴的だったのが、2月のアメリカ・トランプ前大統領による関税を巡る動きです。地元経済にどのような影響が及ぶのか、これまで誘致してきた企業、そしてこれから誘致しようとする世界的企業にどんな影響が出るのか。世界経済や地政学リスクの荒波を、北九州市が真正面から受ける街であるという現実に、私自身、強い緊張感を覚えました。 同時に、グローバルな変化は市民生活にも直結しました。世界的なインフレと円安の進行による物価高の中で、市民の暮らしをどう守るのか。生活防衛の観点から、皆さんとともに知恵を絞り、対策に全力を尽くしてきました。また、資材費やエネルギー価格の高騰が、公共・民間を問わずプロジェクトのコストを直撃し、そのやりくりに苦心した場面も少なくありませんでした。 一方で、4月・6月にはフランス、ドイツを訪問しました。北九州市の環境先進都市、そしてサステナブルシティとしての取り組み、課題先進地としての経験と解決力を現地で発信し、講演にも登壇しました。その反応は想像以上に大きく、「北九州市は世界をリードする都市の一つだ」という評価を、肌で感じる機会となりました。皆さんの日々の積み重ねが、確実に世界に届いていることを実感しました。 同時に、グローバル化の難しさも痛感しました。ムスリム給食をめぐり、事実とは異なる情報が拡散し、北九州市の名前が残念な形で国内外に広がったことは、非常に悔しい出来事でした。しかしこれは裏を返せば、北九州市が世界から注目され、グローバルと結び付けて「見られる街」になっている証でもあります。注目される都市になればなるほど、正確な情報発信と情報リスクマネジメントの重要性を、改めて胸に刻む一年でもありました。 これからも北九州市は、グローバル経済と直結し、その荒波を受け続ける街です。いま世界では、競争至上主義、いわば行き過ぎた「新自由主義」に対する大きな修正が起きていると感じています。だからこそ、日本のように中間層を厚く持ち、社会政策と経済政策のバランスを取ってきた社会、そしてその縮図である地方都市に、新たな出番が来ていると私は考えています。 その中で一つ、はっきりしていることがあります。グローバルと戦う街であるためには、地域の力が不可欠だということです。どれだけ世界的企業が立地しても、それを支え、そこで働く人の生活を支えるのは、地域であり、コミュニティで"},
  {vol:120,date:"2026年01月05日(月)",title:"令和８年を迎えるに当たって",content:"（今回は新年の年頭訓辞を転載します）職員の皆さん、新年おめでとうございます。令和8年、2026年という新しい年の幕開けを、皆さんと共に清々しい気持ちで迎えられたことを心から嬉しく思います。私が市政をお預かりして、3回目の新年を迎えました。この間、最前線の現場で市民の暮らしを支え、一歩ずつこの街の未来を切り拓いてきた皆さんの献身的な努力に、市長として心からの敬意と感謝を申し上げます。今、私たちは歴史の大きな転換点に立っています。皆さんは、この2026年という年を、どのような決意で見つめておられるでしょうか。私たちの取り巻く現実は、決して穏やかではありません。物価高、不安定な国際情勢、そして加速する人口減少。これらは、製造業の街、そして世界とつながる港や空港を持つこの北九州市の工場やオフィス、商店街、そして市民お一人おひとりの食卓にまで、じわじわと、時に激しく押し寄せています。また、世界は今、新たなテクノロジーを実装し、社会や経済の仕組みを再編していく「再編と実装」のフェーズにあります。AIは単なるブームを超え、社会のインフラとして実装される段階に入りました。グローバルな供給網（サプライチェーン）も、単なる「安さ」ではなく、環境への配慮や「信頼」を基軸に再定義されています。日本という国全体に目を向ければ、2026年は「デフレ脱却」の真価が問われる年です。およそ30年ぶりのインフレ、賃上げ、そして金利のある世界。ともすればこの重圧に縮こまり、現状維持という名の「後退」を選びがちになりそうな中、北九州市はどうあるべきか。私は確信を持って申し上げたい。「日本はまだまだ、強く優しくなれる。なぜなら、北九州市がその『逆転の解』を出し始めているからだ」と。昨年、令和7年の北九州市を振り返ってください。私たちのポテンシャルは目に見える形で花開き、「街の潮目」は確実に変わりました。60年ぶりの人口転入超過という歴史的なニュースに続き、2年連続の転入超過も目前に迫っています。企業誘致、貨物量、観光客数、ふるさと納税額の各分野で、多くの指標が「市政史上最高」を塗り替えています。過去最高水準、市民の84％が「住み続けたい」と答え、かつて「鉄冷え」と呼ばれたこの街は今、日本を牽引する「成長エンジンに火がついた成熟都市」として再生しています。門司港レトロへの星野リゾート進出決定、旦過市場の再生、デジタル企業の集積。これらはすべて、皆さんが民間投資を呼び込むために汗をかき、「稼げる街」へと変革を続けた成果です。なぜ、北九州市なのか。なぜ私たちが日本を変えられるのか。そこには三つの根拠があります。第一に、私たちは「逆境を希望に変えた歴史」を持っているからです。公害の空と海を取り戻したあの奇跡。世界がGXの答えを探す今、その原点は間違いなくこの街にあります。第二に、私たちは「課題を価値に変える"},
  {vol:121,date:"2026年01月13日(火)",title:"２年連続の人口転入超過！",content:"先週発表しました。嬉しい「2年連続の人口転入超過」という歴史的な成果。官民を越えた、市民の皆様の努力の賜物です。この数字、その内実を見ると更に嬉しい内容です。女性と若者の大きな改善。確実に街のトレンド（潮流）が変わってきています。メディア報道が「転入超過といっても、結局は外国人が増えただけ」と感じられるケースがあるのは、そうした扱い方の方がニュースとして成立しやすいからです。複雑な構造とデータを丁寧に伝えるよりも、「でも、課題はあるよね」と一石を投じた形にする方が視聴者や読者に伝えやすい。要はニュースになりやすいからです。メディアが「光」ではなく「影」にスポットを当てるのは、報道特有のデザインであり、大切な役割の一つとも言えます。しかし、私たちはその「先」にある本質を、市民の皆さんに届ける必要があります。皆さん、北九州市を一つのスポーツチームだと考えてみてください。長年、このチームは負けが込んでいました。なぜなら、自分たちの手で育てた日本人のエース（若者や女性）が、毎年何千人も、東京や大阪といった強豪チーム（大都市圏）に引き抜かれていたからです。その穴を埋めるために、これまでは地域産業・社会を支える人材に『外国人』に頼らざるを得ない状況が高まっていました。外国人がいなければ、試合（街の機能）を維持することが危ぶまれていたのが、これまでの北九州市です。ところが今、歴史的な逆転現象が起きています。最近のニュースを見て、『どうせ外国人が増えただけでしょ？』と言う人もいます。でも、よく見てください。実は今、外国人の数は以前よりも落ち着いている（鈍化している）んです。それなのに2年連続で勝利（転入超過）できた。その最大の理由は、『一度は都会のチームへ行った日本人のエースたちが、北九州チームに続々と戻ってきているから』なんです。バケツに例えるなら、外から注ぐ水の量（外国人）に頼るのではなく、『底に開いていた大きな穴（日本人の流出）』が小さくなりつつある。 これこそが、６０年ぶりに私たちが手に入れた本当の真価です。メディアは『外国人の数』という分かりやすい数字だけを切り取りがちです（でも、市政記者の皆さんは本質をよく理解されています）が、私たちの本当の快挙は、日本人の若者や女性に『戻りたい、住み続けたい』と思わせるだけの魅力と仕事を、この街が取り戻しつつあることにあります。職員の皆さん、現場で汗をかいている皆さんは、数字の「中身」がどれほど劇的に良くなっているかを知っています。* 外国人の増加ペースは落ちているのに、転入超過は維持されている。* 20代・30代女性の改善が、昨年比でさらに加速している。この事実は、私たちが進めてきた施策が、一過性のブームではなく「市民の選択」を変え始めた証拠です。「ニュースではそう言いますが、実は中身はもっと良いんですよ」と、余裕を持って笑"},
  {vol:122,date:"2026年01月19日(月)",title:"ずっとやりたかったことをやりなさい。",content:"こんなタイトルの本がありますね。今回はその本の紹介をしたいのではありません。この言葉を、私は何度も自分に投げかけています。そして皆さん一人ひとりにも、今日はこの言葉を、そのまま、まっすぐ投げてみたいと思います。行政の仕事とは何でしょうか。決められたレールの上を、決められたルールに従って、一寸の狂いもなく歩くこと。もちろん、それは大前提で、とても大切な仕事です。でも、それだけだったら……正直、ちょっと、息が詰まる。日々の仕事の中で感じる違和感。ずっと前から「こうしたらいいのに」と思っていたアイデア。この街を、こんなふうにしたい。この場所に、こんな景色をつくりたい。そういう想いを、もっと出していい。いや、出してほしいのです。考えて、語って、提案できる場所に、北九州市役所をしたい。これはきれいごとではなく、私の本音です。皆さんには、それだけの力がある。私は本気でそう信じています。何かを始めようとすると、つい最初に財源や利害調整、規制の壁を思い浮かべてしまいますよね。その考え方ばかりでは、心はどんどん窮屈になってしまいます。まるで真っ黒に塗りつぶされたキャンバスの隅に、無難な花を描かされているようなものです。……正直、あまりワクワクしませんよね。「課題」から考え始めるか。「理想」から考え始めるか。この違いは、想像以上に大きいです。目の前のトラブルを片付けることは大切です。逃げてはいけない。でも、それだけを永遠にやっていると、仕事は「作業」になりがちです。「こうなったらいいな」「無理かもしれないけど、ここを目指したい」まずは、そこからでいいのです。イマジネーションを広げ、そこから逆算する。そのためには、何が必要か。誰を巻き込むか。その方が、仕事が人生が、ずっと面白くなると想います。自分の創造性を引き出すのに、遅すぎることはありません。それは、利己的でも、わがままでもない。むしろ、その逆だと私は思っています。私たちは、苦悩するために働いているのではありません。自分の想いや才能を、檻の中から解き放つために働いている。私は、仕事というものを、そう定義しています。皆さんにも、その解放感を少しでも味わってほしいと考えます。そのための環境を、私も、泥臭く、少しずつでも広げていくつもりです。教育や学びに力を入れるのも同じ理由です。学力は点数のためじゃない。人生で役に立つ、ものの見方や感じ方・考え方の「引き出し」と「武器」を増やすためです。学ぶことは、自由になること。それが、人を強く、しなやかにしてくれます。仕事の中で、自分の価値観や想いが、ほんの少しでも形になる瞬間。そのときの表情は、はっきり言って、キラキラしています。制約だらけだからこそ、そんな瞬間を一つでも多く、この市役所の中につくりたい。みんなで、目指しましょう。人間は、そもそも、とてつもなく創造的な生き物なのですから。その"},
  {vol:123,date:"2026年01月26日(月)",title:"古い秩序の終焉",content:"先週、今年のダボス会議が終わりました。話題を集めたカナダのカーニー首相がダボス会議で行った演説は、私たちに重い問いを突きつけました。彼は「古い秩序は戻らない」と断言し、大国間の対立が深まる中で、中堅国家がいかに自立して生き残るべきかを説きました。▼カーニー首相演説https://youtu.be/flsgJe8mN-A?si=sfmSSbocJs1jgX5cこの「国家の危機感」は、そのまま「地方自治体の危機感」でもあります。国が指針を示し、地方がそれに従っていれば安泰だった時代は、もう終わりました。これからは、現場を持つ私たち自治体こそが、世界の不確実性に対して「解」を提示し、市民の暮らしと誇りを守り抜かなければなりません。こうした文脈の中で、北九州市が今、日本と世界のために、そして市民のためにできることとは何か。その一例として、私は以下の3点を、皆さんと目指したいと考えています。1. 現場から「エネルギーの自律」を証明するカーニー首相はエネルギーの重要性を強調しました。私たちは、日本最大規模の本格的な洋上風力発電の拠点化や水素エネルギーの実装を、単なる「環境政策」としてではなく、激動する世界における「都市の生存戦略」として進める必要があります。エネルギーを自給し、安定した産業基盤を作る。この現場を動かしているのは、北九州市という地の利と技術の担当の皆さんの知恵と汗です。2. 「都市外交」で新たな活路を開く国家間の関係が冷え込んでも、都市同士の信頼関係は維持できます。公害克服の歴史を通じて私たちが築いてきたアジア諸国との絆は、今や戦略的な資産です。事務的な交流を超え、北九州市の技術や仕組みを世界に売る、あるいは共に課題を解決する「攻めの姿勢」を、全庁挙げて意識してください。3. 「現実主義」による産業の強化私たちは、ものづくりの街です。半導体や次世代産業の誘致、既存産業のDX化において、理想論だけではなく、企業が真に活動しやすい「実利」を提供しなければなりません。規制緩和や迅速な意思決定など、役所の常識に囚われない柔軟な発想で、産業の供給網を支える強靭な街を創りましょう。皆さん、これからの時代、「これまでがこうだったから」という前例踏襲は、もはやリスクになりつつあります。カーニー首相が説いたように、古いルールが崩壊している今、私たちが新しいルールを作る主体になるべきです。北九州市には、公害を克服した際に見せた「現場の底力」があります。中央の指示を待つのではなく、自ら考え、動き、世界にインパクトを与える。そんな「自立したプロフェッショナル」として、挑戦していきましょう。この変化の激しい時代を、北九州市が再び輝くチャンスに変えていきましょう。 【ホンの気持ち】『ポケット名言集』（藤尾秀昭）言葉にはすごい力があります。辛かったあの時に先輩が掛けてくれた言葉。なんと"},
  {vol:124,date:"2026年02月02日(月)",title:"生活保護―福祉の最前線に立つあなたへ",content:"区役所の窓口でケースワークに当たってくれている職員の皆さん、日々の業務に心から敬意を表します。市民の切実な声と人生に向き合う皆さんの苦労、私自身の過去の経験から痛いほど分かります。私も24歳のとき、厚生労働省の保護課という部署で、山のようなケース記録を読み込み、その背景にあるあまりに複雑な事情や人生に、頭を抱える毎日を過ごした時期があります。自分自身の価値観や「こうあるべき」という規範は打ち砕かれ、人生の複雑さ、社会の多様さを目の当たりにしました。また、「何とかして差し上げられないか」「あの人に給付できて、この人に給付できないのは納得いなかい」「基準自体が時代に合ってない」という葛藤もたくさん抱えていました。当時は中央省庁の建物にも被保護者の方が自由に出入りできた時代です。机の前で何時間も怒りの声を聞き、自分の無力さに打ちひしがれたことも一度や二度ではありません。そんな時、ある先輩からこう告げられました。「武内くん、誰かを支える行政官として生きていくなら、まず、原点である生活保護を学べ」。その言葉に背中を押されるように、膨大な通達と格闘しながら、一人ひとりの人生に必死に食らいつきました。そこで学んだのは、「人間社会の底知れぬ深さ」「制度というものの難しさ」でした。四苦八苦した経験は、今では私の人生の引き出しを広げ、市長として政策を導く背骨の一つとなっていると、つくづく感じます。医師で作家の鎌田實さんは、効率と自己責任を求める社会に対し「がんばらない」という言葉で、弱さを抱えたまま生きる尊さを教えてくれました。福祉とは、完璧ではない私たちが、お互いの不完全さを認め合い、歩幅を合わせることです。人生も完璧ではないし、制度も完璧ではない。皆さんが窓口で行っているのは、単なる事務作業ではありません。人生の過程で色んな理由で壁にぶつかり立ち止まっている方、誇りを失いかけている方の心に明かりを灯し直す仕事です。ときに窓口で受ける厳しい言葉は、その方がそれまで社会で受けてきた痛みの裏返しなのかもしれません。あなたが真摯に耳を傾け、制度という枠組みに「温かな血」を通わせるとき、相談者は失いかけた尊厳を取り戻すと思います。かつての私がそうであったように、今皆さんが持つ苦悩や、流している汗や涙、そして必死に学んでいる経験は、決してあなたを裏切りません。それは将来、どんな困難に直面しても揺るがない「人間への深い洞察力」という宝に変わります。私たちは、生産性や効率だけを追うのではなく、誰もが「生きていていいんだ」と心から思える街でありたいと思います。その最前線で踏ん張っている皆さんは、街の誇りであり、希望でもあります。課題が解けないことや納得いかないとき、一人で抱え込まないでください。制度に限界があるなら、共に考え、変えていきましょう。皆さんと共に、一人ひとりの命を守り、支え抜ける"},
  {vol:125,date:"2026年02月10日(火)",title:"Action！への想い",content:"衆議院選挙に従事された皆さん、大変お疲れさまでした。今月は「北九州市誕生マンス」として、様々なイベントやプロジェクトが進行中です。先週末には、衆議院選挙と同日に、JAM広場で、初めての『Action Fes 2026』が開催されましたね。こちらも関係者の皆さん、お疲れさまでした。さて今回は、私たちが取り組む行政の本質について、私の考えを共有させてください。先の選挙演説を聞いていて感じたことがあります。言葉は流暢でも響かない人がいる一方で、不器用でも深く心に届く人がいます。この違いは、相手の「心」を動かしているかどうかです。五輪選手のひたむきな姿に私たちが涙するのも、その裏側にある「誠実な心」に共鳴するからではないでしょうか。東洋哲学には「知行合一（ちこうごういつ）」という言葉があります。本当の意味で「知る」ということは、心が動き、具体的な「行動」が伴って初めて完成する、という意味に私は捉えています。私たちは、マニュアル通りに動くマシンではありません。部下や上司の心が動き、熱意が伝わってこそ、仕事に命が宿り、組織は前進します。市民の皆さんも同じです。正しいだけの「理屈」や「データ」では、人はなかなか動いてくれません。私たちが市民の皆さんの心に寄り添い、その心を動かしたとき、初めて「Action」が生まれるのです。私が北九州市政のスローガンとして「Action!」を掲げている本当の意図は、ここにあります。単に素早く動くということだけではありません。動けばいい、ということでもありません。誰かの心を震わせ、共感を呼び起こし、それが大きなうねりとなって街を動かしていく。その起点となる情熱こそが、私の求める「Action」です。現代はAIが進化し、検索すればすぐに「正解」が見つかる時代です。しかし、その一方でSNSには批判や妬みが溢れ、人々の心が乾き、ささくれ立っているようにも感じます。そんな時代だからこそ、前向きで清々しい「心の響き合い」が必要です。他人の目を気にして縮こまるのではなく、自分の内なる正しい声に従って動く。そんな明るいエネルギーこそが、街を動かすエンジンになります。でも、誰かの心を震わせるためには、まず自分自身の心が動いていなければなりませんよね。映画を観る、旅に出る、誰かと語らう。あるいは、本屋大賞などを参考に、話題の小説を手に取るのも良いでしょう。何かに感動し、自分の心を震わせる時間をぜひ大切にしてください。一人の心が動き、それが同僚に伝わり、やがて街全体の心を動かしていく。事務的な処理だけで終わらせるのではなく、心の底から震えるような、血の通った行政を共に創っていきましょう。皆さんの「Action」が、この街を必ずもっと良くしてくれます。"},
  {vol:126,date:"2026年02月24日(火)",title:"哲学",content:"今、私たちの働き方は大転換期にあります。生成AIをはじめとするテクノロジーの進化は、事務作業の効率を劇的に高め、膨大なデータから一瞬で「正解らしきもの」を導き出してくれるようになりました。でも、効率化が進むほど、行政に突きつけられるのは「あなた自身はどう判断するのか」という、極めて人間的な問いだろうと思います。AIは過去のデータを整理統合してくれます。でも人としての「価値判断」までは代行してくれません。採り得る「正解らしきもの」の中から決めるには、自分なりの“哲学”を持つことが不可欠と考えます。私も20年くらい前から哲学に類する本を手に取り意識し始めました。ちょうど中間管理職として判断を求められ始めた頃。組織を持ち始めた頃。今も、日々の中で自分を支える指針として「ストア派哲学」を取り入れています。「ストア派哲学」の核心は、自分の力で「コントロールできること」と「できないこと」を峻別することにあります。例えば、SNSでの予期せぬ炎上や、思い込みや悪意による理不尽な批判。これら「他人の反応」は、私たちの力ではコントロールできません。「過去と他人は変えられない」なんて言い方もありますね。そこに心を乱され、思考を混乱させられるのは、市民のための貴重なリソースを浪費することと同じ。一方で、その状況をどう解釈し、次にどんな最善の手を打つかという「自分の意志と判断」は、100パーセント自分のコントロール下にあります。だからそこに集中する。かつて市の大規模事業が大変な話題と批判の的になりました。中には不本意な憶測や歪曲された言説もありました。頭を抱えたくなることもある。でもその時、私は自分に問いかけました。「こうなっているという事実自体は変えられない。では、この状況から市民のために引き出せる最善のプランは何か？」と。感情的な執着を手放し、冷静に状況を分析する。この「戦略的思考」こそが、ストア派の言う不動心です。AIがどれほど優れた回答を出しても、窓口で市民の苦しみに寄り添い、複雑な利害関係の間で苦渋の決断を下すのは、血の通った私たち人間。ストア派は、些細なノイズに一喜一憂しなくなる分、本当に守るべき価値や、市民の喜びといった本質的なものに対して、より深い感動と情熱を注ぐことを可能にしてくれます。AIを使いこなしつつも、最後は自分の哲学に基づいて「善きこと」を選択する。周囲の喧騒に振り回されない静かなる強さと、目の前の課題に誰よりも緻密に情熱的に取り組む熱い意志。この二つは、これからの行政に最も必要な力です。今回、何もストア派哲学を押し売りしようというのではありません。お伝えしたいのは皆さんが、自分自身の内なる理性を羅針盤として仕事に向かうことの心強さ。「トラブルが起きた時ほど冷静になる。」「皆が慌てている時こそ、周囲をじっくり見回す。」「怒りが湧いた時こそ、冷めた目で俯瞰す"},
  {vol:127,date:"2026年03月02日(月)",title:"世界の動揺に、足元を固める",content:"職員の皆さん。日曜日の朝、飛び込んできたニュースに強い衝撃を覚えたことと思います。アメリカとイスラエルによるイランへの大規模攻撃、作戦名「壮烈な憤怒」。2026年3月の今、世界経済を根底から揺るがしかねない重大な局面が立ち現れようとしています。私自身、かつてアメリカに赴任していた時期、あの2001年の対米同時多発テロ、そしてその後のアフガニスタン戦争を現地で経験しました。平和な日常が一瞬にして断絶し、世界が憎しみと不安に覆われる瞬間の、あの言葉にできない肌寒さ。今でも鮮明に覚えています。当時の経験から私が学んだ教訓は一つです。それは「世界が激動し、予測不能な事態に陥るときほど、私たちは自らの足元を凝視し、なすべき職務を淡々と、かつ誠実に遂行しなければならない」ということ。北九州市は、日本の近代化を支えてきた製造業の街です。何と言おうとグローバル都市です。エネルギー消費の多寡が市民生活や地域経済にも直結する構造を持っています。原油やLNG価格の上昇、円安、サプライチェーンの混乱、そして地政学リスクによる企業投資マインドの低下。これまでの累次の物価高対策など吹き飛んでしまうほどのマグニチュードを感じるのも無理はありません。ですが、行政に携わる私たちが動揺しては、市民の不安を煽るだけです。私たちは「強い懸念を持って注視する」とともに、「国の動向を踏まえ、市民生活への影響を冷静に見極める」姿勢を貫きましょう。SNSなどで流れる不確かな情報に振り回されることなく、事実に基づいた判断を行うことが、今、最も大切です。世界が揺れるときこそ、地方都市は足元を固める。北九州市がこれまで腰を溜めて進めてきた「エネルギー自立」や「産業構造の多様化」は、単なる未来への投資ではなく、こうした時代を生き抜くための盾となります。国際的な対立が深まる今だからこそ、公害克服の歴史の中で私たちが培ってきた「国際協調」の経験も、地域の安定のために活かしていくべきです。現場で何が起きているのか、生の声を吸い上げていく。経済団体との緊密な情報共有を進めましょう。エネルギー価格上昇時の中小企業への影響の把握、今後必要な場合には支援策の準備も必要になるかもしれません。物流の停滞は都市の毛細血管を詰まらせます。港湾・物流への影響を精査していきましょう。市としての危機管理体制の再点検も常に怠らずにしていきましょう。「最悪を想定し、最善を尽くす。」この姿勢で、どのような変化にも柔軟に、強靱に対応していく。私たちは、この変化と混乱の時代において、公務員という職業にあります。私たちの真価はどんな時も市民生活の「変わらぬ日常を維持する力」にあります。皆さんが職場において冷静に、そして確実に行動することは市民にとって最大の安心感となります。20数年前、私がアメリカで見た光景。それは、悲劇の中でも自らの仕事を全うしようと"},
